較低的事物是為了較高的而存在，而它們又是為了彼此而存在。\n第二，想想他們在餐桌上、在床上等等是什麼樣的人；尤其是在意見上，他們受著什麼樣的強迫；至於他們的行為，想想他們是帶著怎樣的驕傲，去做他們做的事。\n第三，如果他們做得正確，我們不該不高興；如果做得不正確，顯然是不自願、也是無知。因為每個靈魂都是不情願地被剝奪真理，同樣也不情願地被剝奪「按每個人應得的去對待他」的能力。所以，當人被說成不公正、忘恩負義、貪婪，總之是對鄰人作惡的人，他們會痛苦。\n第四，想想你自己也做過許多錯事，你跟別人是一樣的人；就算你沒犯某些過錯，你還是有犯這些過錯的傾向，只是因為怯懦，或顧慮名聲，或類似的卑下動機，才沒有犯。\n第五，想想你甚至不明白人是不是做錯了，因為許多事的做法，跟某些處境有關。總之，一個人要學許多東西，才能對別人的行為做出正確的判斷。\n第六，當你非常惱怒或悲傷時，想想人的生命只是一瞬，不久之後我們都會被安放成死者。\n第七，擾亂我們的不是人的行為，因為那些行為的根源在人的主宰之心；擾亂我們的是自己的意見。所以，去掉這些意見，決心放下你把某個行為判斷為嚴重之事的判斷，你的怒氣就消失了。要怎樣去掉這些意見？想到：別人任何不當的行為，都不會給你帶來羞恥；因為除非只有可恥的事才是壞的，否則你也必然會做許多錯事，成為強盜，以及一切別的。\n第八，想想這些行為所引起的憤怒和煩惱，給我們帶來的痛苦，比我們為之憤怒煩惱的那些行為本身多得多。\n第九，想想良善的性情若是真誠的，而不是假笑、演戲，就是不可戰勝的。因為，如果你一直對最暴力的人保持友善的性情，有機會時，就在他正想傷害你的那一刻，溫和地勸他，平靜地糾正他的錯誤，說：「不是這樣的，孩子；我們的本性是被造來做別的事的；我當然不會受傷，但你是在傷害你自己，孩子。」並且用溫和的機智和普遍的原則向他表明事情就是這樣，連蜜蜂也不這樣做，凡是本性上被造成群居的動物也不這樣做。你做這件事，不要帶雙重意思，也不要帶責備，而要親切，靈魂裡不帶任何怨恨；不要像是在給他上課，也不是為了讓旁觀者佩服，而要在他獨自一人的時候；如果還有別人在場……\n要記住這九條規則，就像是從繆斯那裡得到的禮物，並且趁你還活著，終於開始做一個人。但同樣要避免奉承人，也要避免對他們惱怒，因為這兩者都是不合群的，都會造成傷害。發怒激動的時候，要讓這個真理留在心裡：被激情推著走不是男子氣概，溫和與柔順反而更合乎人的本性，所以也更有男子氣概；有這些品質的人，才有力量、筋骨和勇氣，而不是那個受制於一陣陣激情和不滿的人。因為一個人的心越接近不受一切激情影響，就越接近力量；痛苦的感受是軟弱的特徵，憤怒也是。向痛苦屈服的人和向憤怒屈服的人，兩者都受了傷，兩者都屈服了。\n但如果你願意，也從繆斯的領導者（阿波羅）那裡領受第十份禮物，就是：期待壞人不做壞事是瘋狂，因為這樣期待的人是在渴望不可能的事。而允許人這樣對待別人，卻又期待他們不對你做任何錯事，是不合理又專橫的。","對主宰能力，有四種主要的偏差，要時時提防；一察覺，就把它們擦掉，每次都這樣說：這個念頭是不必要的；這個傾向會破壞社會的聯合；你要說的這句話不是出自真實的想法，因為不從真實的想法說話，是最荒謬的事之一。\n第四種是當你為任何事責備自己，因為這證明你內在比較神聖的部分被壓倒，向較不光彩、會消亡的部分，也就是身體和它粗俗的快樂屈服了。","你身上的氣和混在你身上的火，雖然本性往上，仍順從宇宙的安排，被壓在這個複合的團塊（身體）裡。你身上的土和水，雖然趨勢往下，卻被抬高，占著不是它們自然的位置。元素的部分就是這樣順從宇宙；因為一旦被固定在某處，就被迫留在那裡，直到宇宙再發出解散的信號。\n那麼，只有你的智性部分不順從，還對自己的位置不滿，不是很奇怪嗎？沒有任何力量強加在它身上，要求它的只是合乎它本性的事；它卻不肯順服，朝相反的方向走。因為趨向不義、放縱，以及憤怒、悲傷和恐懼，不過是偏離本性的人的行為。\n當主宰之心對任何發生的事不滿時，它也就擅離了崗位；因為它被造成，既是為了公正，也同樣是為了對眾神的虔敬與崇敬。這些品質也包含在「對事物的構造感到滿足」這個通稱之下，而且實際上先於公正的行為。","一個人如果生活中沒有一個始終相同的目標，就不可能一生都是同一個人。但光這樣說還不夠，還要加上：這個目標應當是什麼。因為，對大多數人以某種方式視為善的一切事物，意見並不都相同，只有對某些事物才相同，也就是關乎共同利益的事物；所以我們也該替自己設定一個屬於共同的（合群的）、政治性的目標。把自己一切努力都導向這個目標的人，行為會彼此一致，這樣他就始終是同一個人。","想想鄉下老鼠和城裡老鼠，想想城裡老鼠的驚慌和發抖。","蘇格拉底常把大多數人的意見稱為拉彌亞，也就是用來嚇小孩的妖怪。","斯巴達人在公共表演場合，把陰涼處的座位留給外邦人，自己則隨便坐在哪裡。","蘇格拉底婉拒佩迪卡斯，不去他那裡，說：這樣我才不會死得最糟；意思是，我不願接受恩惠，卻無法回報。","在以弗所人的著作中有這樣一條箴言：要時常想起古時某一位實踐德性的人。","畢達哥拉斯學派的人囑咐我們早晨仰望天空，想起那些永遠做著同樣的事、用同樣的方式完成工作的天體，也想起它們的純潔與赤裸。因為星星沒有任何遮蔽。","想想蘇格拉底是什麼樣的人：贊西佩拿走他的外袍出了門，他就披著一張獸皮；還有，朋友看見他這樣穿而感到羞恥、往後退縮，蘇格拉底對他們說了什麼。","不管是寫還是讀，你都不可能替別人立規則，除非自己先學會遵守規則。生活中更是如此。","你是個奴隸：自由言論不屬於你。","我的心在裡面笑了。","他們會咒罵德性，說出尖刻的話。","冬天去找無花果，是瘋子的行為；孩子已經不再被允許擁有時，還去找孩子的人也一樣。","愛比克泰德說，一個人親吻孩子時，應當對自己低聲說：「明天你或許就會死。」可是那些是不吉利的話。「凡是表達自然運作的話，」愛比克泰德說，「都不是不吉利的話；要是的話，那麼說麥穗被收割，也是不吉利的話了。」","未熟的葡萄、成熟的一串串、葡萄乾，這些都是變化，不是變成無，而是變成還不存在的東西。","沒有人能奪走我們的自由意志。","愛比克泰德還說：關於給予同意，一個人必須找到一門技藝（或規則）；至於行動，必須小心，讓它們配合處境，合乎社會的利益，也顧及對象的價值；至於感官的欲望，要完全遠離；至於迴避（厭惡），不要對任何不在我們能力之內的事物表現出來。","他說，所以，爭論的不是一件尋常的事，而是關乎是否瘋狂。","蘇格拉底常說：你們要什麼？是有理性的人的靈魂，還是無理性的人的靈魂？「有理性的人的靈魂。」是哪種有理性的人，健全的還是不健全的？「健全的。」那為什麼不去找？「因為我們已經有了。」那你們為什麼還要爭鬥吵鬧？"],["你繞一大圈才想到達的一切，現在就能擁有，只要你不拒絕給自己。意思是：過去的一切別理會，把未來交給天意，只讓當下照著虔敬與公正來安排。照著虔敬，就是滿足於分派給你的命運，因為自然為你設計了它，也為它設計了你。照著公正，就是始終自由、不掩飾地說真話，做合乎法則、也符合每件事價值的事。別讓別人的惡行阻礙你，也別讓意見、旁人的話，或長在你身上的可憐肉體的感覺阻礙你；因為會受苦的那一部分，自己會去處理。\n所以，不管離去的時刻什麼時候逼近，只要你撇下其他一切，只敬重你的主宰之心和你內在的神性；只要你怕的不是有一天必須停止生活，而是怕自己從未開始照著本性生活，你就會成為配得上生養你的宇宙的人；你不再是故鄉裡的陌生人，不再對每天發生的事驚訝，好像那是意料之外，也不再依賴這個或那個。","神看見所有人的心（主宰之心）都脫去了物質的外衣、外殼與雜質。因為他單用他智性的部分，只碰觸那從他自己流出、衍生到這些身體裡的智性。如果你也習慣這樣做，就能擺脫許多煩惱。不去看包裹著他的可憐肉體的人，當然不會為了照料衣服、住處、名聲，和諸如此類的外在事物與排場，自找麻煩。","你由三樣東西組成：一點身體、一點氣息（生命）、智性。前兩樣是你的，因為你有責任照顧它們；只有第三樣才真正是你的。\n所以，如果你把這些從你自己，也就是從你的理解力裡分離出去：別人所做所說的一切，你自己已經做過、說過的一切，因為可能發生而困擾你的未來的一切，包著你的身體、和與身體本性相連的氣息（生命）中，不由你的意志而附在你身上的一切，以及外面周流的漩渦所捲起的一切，讓免於命運之事的智性能力，能夠純淨、自由地獨自生活，做公正的事，接受所發生的事，說出真話；如果你把感官印象附在這個主宰之心上的東西，和將來、過去的事，都從它分離出去，讓你自己像恩培多克勒的球體：\n「圓圓的，在喜悅的靜息中安歇」；\n並且努力只活真正屬於你生命的那一部分，也就是當下，那麼，你就能不受擾亂、高貴地度過剩下的生命，直到死亡的時刻，服從你自己的內在神靈（那在你之內的神）。","我常常納悶：每個人愛自己勝過愛所有別人，卻把自己對自己的意見，看得比別人對他的意見還輕。如果有一位神或一位智慧的老師出現在人面前，吩咐他不要想任何事、不要籌劃任何事，除非一想到就能立刻說出口，他連一天也受不了。我們對鄰人怎麼想我們，比對我們自己怎麼想自己，看重多少啊。","怎麼可能：眾神既然把一切安排得這麼好，又對人類懷著善意，卻唯獨忽略了這一點：有些人，而且是很好的人，可以說跟神性往來最多、藉著虔敬的行為和宗教的儀式跟神性最親近的人，一旦死去，就永遠不再存在，徹底熄滅？\n但如果事情是這樣，你要確信：如果本來不該這樣，眾神就會讓它不是這樣。因為如果那是公正的，就是可能的；如果那是合乎自然的，自然就會這樣安排。既然不是這樣，如果事實上不是這樣，你就要相信：它本來就不該這樣；因為你自己也看得出，在這項探究裡，你是在跟神爭辯；而我們不會這樣跟眾神爭辯，除非他們是最優秀、最公正的；既然如此，他們就不會容許宇宙的安排中，有任何事被不公正、不合理地忽略。","即使在你對能不能做成感到絕望的事上，也要練習。因為即使是左手，雖然缺乏練習，在其他事上都無能，卻比右手更有力地握住韁繩，因為它在這件事上練習過。","想想一個人被死亡追上時，身體和靈魂該是什麼狀態；想想生命的短暫，過去與未來無邊的時間深淵，以及一切物質的脆弱。","默想事物的形成原則（形式），讓它們脫去外衣；默想行為的目的；想想痛苦是什麼，快樂是什麼，死亡是什麼，名聲是什麼；誰是自己不安的原因；沒有人被別人阻礙；一切都是意見。","運用你的原則時，要像搏擊手，不要像角鬥士；因為角鬥士掉了所用的劍就會被殺；搏擊手始終有他的手，只要用它，不需要別的。","要看事物本身是什麼，把它們分成質料、形式和目的。","人的能力有多大：不做任何神不認可的事，並且接受神可能給他的一切。","對依著自然發生的事，我們不該責怪眾神，因為他們不論自願或不自願，都不做錯事；也不該責怪人，因為他們除了不自願之外，也不做錯事。所以我們不該責怪任何人。","一個人對生活中發生的任何事感到驚訝，多麼可笑，多麼像個陌生人。","不是有命定的必然和不可戰勝的秩序，就是有仁慈的天意，或是沒有目的、沒有主持者的混亂。\n如果有不可戰勝的必然，你為什麼抗拒？如果有能被祈求、能息怒的天意，就讓自己配得上神性的幫助。如果是沒有主宰者的混亂，那麼在這樣的風暴裡，你該慶幸自己擁有某種主宰的智性。就算風暴把你捲走，就讓它捲走那可憐的肉體、可憐的氣息，和其他一切；至少它帶不走智性。","燈的光在熄滅之前，不是一直閃耀、不失光輝嗎？那麼，你身上的真理、公正和節制，要在你死之前就熄滅嗎？","當有人露出做了錯事的樣子，就（說）：那我怎麼知道這是不是錯誤的行為？就算他做錯了，我怎麼知道他沒有自己定自己的罪？這就像抓傷自己的臉。\n要想到：希望壞人不做壞事的人，就像希望無花果樹的果實裡不要有汁，希望嬰兒不要哭，希望馬不要嘶鳴，以及其他一切必然如此的事。有這種性情的人，還能怎麼做？所以，如果你易怒，就去醫治這個人的性情。","不正當就不要做；不真實就不要說。","每件事上，始終要觀察那使你產生一個表象的東西是什麼，把它分解，分成形式的部分、質料的部分、目的，以及它必須結束的時限。","終於要明白：你身上有某種東西，比那些引起各種情緒、像拉線一樣牽著你的東西，更好、更神聖。我心裡現在有什麼？是恐懼，是猜疑，是欲望，還是別的類似的東西？","第一，不要不加考慮、沒有目的地做任何事。第二，讓你的行為只指向合群的目的。","想想不久之後你什麼也不是、哪裡也不在，你現在看到的一切，和現在活著的人，也都不存在了。因為萬物生來就要改變、轉化、消亡，好讓別的事物能接續不斷地存在。","想到一切都是意見，而意見在你的能力之內。所以，只要你願意，就拿掉你的意見，像繞過岬角的水手，你會發現一片平靜，一切穩定，是個沒有波浪的海灣。","任何一種活動，不論是什麼，在適當的時候停止，並不因為停止而遭受任何惡；做這件事的人，也不因為這件事停止而遭受任何惡。同樣，由所有行動組成的整體，也就是我們的生命，如果在適當的時候停止，也不因為停止而遭受惡；在適當的時候結束這一系列的人，也沒有受到不好的對待。\n適當的時機和界限，是自然定的：有時是像老年那樣，由人特有的本性來定，但始終是由宇宙的本性來定，藉著它各部分的變化，整個宇宙永遠保持年輕而完美。凡是對整體有益的，始終是好的，也是合時的。\n所以，對每個人來說，生命的終結不是惡，因為它不可恥（既不依賴意志，也不違背共同的利益），反而是好的，因為它合時，對整體有益，並與整體一致。這樣，一個人跟神用同樣的方式被推動，心智朝向同一件事，他也就是被神推動的人。","這三條原則你必須隨時準備好：\n第一，在你做的事上，不要不加考慮，也不要做公正本身不會做的事；至於從外面發生在你身上的事，要想到它不是出於偶然，就是依著天意發生，你不可責怪偶然，也不可指控天意。\n第二，想想每個存在者從種子到接受靈魂的時候是什麼，從接受靈魂到歸還靈魂是什麼，每個存在者由什麼組成，又將分解成什麼。\n第三，如果你忽然被抬到地面之上，俯視人間的事，看它們多麼繁多，同時一眼看到周圍空氣和以太中居住的存在者多麼眾多，要想到：不論你被抬起多少次，看到的都是同樣的事物，形式相同，存續短暫。這些事值得驕傲嗎？","拋開意見：你就得救了。那麼，誰阻止你拋開它？","你為任何事煩惱時，是忘了這一點：一切事都依著宇宙的本性發生；忘了：別人的不當行為與你無關；還忘了：凡是發生的一切，過去總是這樣發生，將來也會這樣發生，現在各處也是這樣發生；也忘了：人跟全人類的親緣關係多麼密切，因為那是一個共同體，不是由一點血緣或種子構成，而是由智性構成。\n你還忘了：每個人的智性都是一位神，是神性的流出；忘了：沒有什麼是一個人自己的，他的孩子、他的身體，乃至他的靈魂，都來自神性；忘了：一切都是意見；最後，你忘了：每個人只活當下這一刻，也只失去這一刻。","要不斷回想那些對任何事大加抱怨的人，那些因極大的名聲、不幸、仇恨，或任何一種際遇而最為顯赫的人；然後想想：他們現在都在哪裡？煙、灰燼和一個故事，或是連故事都不是。也讓這一類的每件事都留在心裡：法比烏斯．卡提利努斯如何住在鄉間，盧基烏斯．盧普斯如何住在他的花園裡，斯特提尼烏斯如何住在布里埃，提比略如何住在卡布里島，維利烏斯．魯弗斯（或魯弗斯在維利亞）；總之，想想那種夾帶著傲氣的熱切追求；想想人拚命爭取的一切多麼不值錢。\n想想一個人在眼前的機會裡表現出公正、節制、順從眾神，並且全然單純地去做，是多麼更合乎哲學：因為為自己沒有傲氣而驕傲的那種傲氣，最難忍受。","有人問「你在哪裡見過眾神，或者你怎麼領悟他們存在，才這樣敬拜他們」，我的回答是：首先，他們甚至可以用眼睛看見；其次，我連自己的靈魂也沒見過，可是我敬重它。所以對眾神也是這樣：從我不斷經驗到的他們的力量，我領悟到他們存在，並且尊崇他們。","生活的安穩就在這裡：徹底檢視每一件事，它本身是什麼，也就是它的質料是什麼，形式的部分是什麼；用你全部的靈魂去行公正、說真話。此外還剩什麼？只剩下享受生活，把一件好事接在另一件好事後面，連最小的間隔也不留。","太陽的光只有一道，雖然被牆、山和其他無數的東西隔開。共同的實體只有一個，雖然被分配在無數有各自性質的身體裡。靈魂只有一個，雖然被分配在無數的本性和個別的限定（或個體）裡。有智性的靈魂只有一個，雖然看起來被分割了。\n上面提到的這些事物中，其他部分，比如屬於空氣和物質的那些，都沒有感覺，也沒有相互的交往；不過，即使是這些部分，智性的原則也把它們聯繫在一起，使它們朝向同一處的引力。但智性以特殊的方式傾向同類，與之結合，而共同體的感覺並不中斷。","你想要什麼：繼續存在嗎？那麼，你想要有感覺、運動、成長，然後又停止成長，使用你的言語，思考嗎？這一切裡，哪一樣在你看來值得渴望？但如果輕易就不太看重這一切，就轉向剩下的，也就是跟隨理性和神。可是，若因為死亡會剝奪一個人的其他東西而困擾，就跟敬重理性和神不一致。","在無邊無際、深不可測的時間中，分給每個人的部分多麼小，因為它很快就被永恆吞沒了！在整個實體中占的部分多麼小；在宇宙的靈魂中占的部分多麼小；而你在整個大地上，是在多麼小的一塊土上爬行！\n思索這一切，就不要把任何事看作偉大，除了照著你的本性所引導的去行動，以及承受共同的本性帶來的一切。","主宰之心怎麼運用它自己？一切都在這裡。其他的一切，不論是否在你意志的能力之內，都不過是沒有生命的灰燼和煙。","這個想法最能讓我們輕視死亡：就連那些認為快樂是善、痛苦是惡的人，也輕視過它。","對一個人來說，只有合時而來的才是善，他做了多些或少些合乎正確理性的行為都一樣，他沉思世界的時間較長或較短也沒有差別，對這樣的人，死亡也不是可怕的事。","人啊，你曾是這個大城邦（世界）的公民；在其中是五年（或三年）有什麼分別？合乎法律的，對所有人都是公正的。如果不是暴君，也不是不公正的法官把你從城邦送走，而是把你帶進城邦的自然，那有什麼好苦的？這就像法務官僱了一個演員，又把他從舞臺上打發走。\n「可是我還沒演完五幕，只演了三幕。」\n你說得對，但在生命裡，三幕就是整部戲；因為什麼才算一部完整的戲，是由那位曾是它編排之因、現在又是它解散之因的人決定的；而你不是這兩者之因。所以，滿意地離去吧，因為釋放你的那一位也是滿意的。"]];
const NOTES={"2.1":["出門前先做好心理準備：今天一定會遇到難相處的人。他們不是壞，是不明白什麼才是好。他們和我是同類，所以傷不了我，我也沒有理由生他們的氣。","這是斯多噶學派的晨間練習：先在心裡把麻煩走過一遍，真的遇到時就不會被激怒。「像上下兩排牙齒」是他最有名的比喻之一，人和人是互相配合的器官，彼此對立等於自己咬自己。","今天最可能惹你生氣的人是誰？他是故意的，還是只是不明白？"],"2.2":["人只有三樣東西：身體、呼吸、做判斷的心。前兩樣不值得看重；第三樣，別再讓它被情緒牽著走。","「丟開你的書」不是反對讀書。他寫這段時已經上了年紀，人在前線，是在提醒自己別再拿讀書當藉口，躲開眼前該面對的事。","你最近的哪個決定，其實是被情緒拉著繩子做的？"],"2.3":["發生的一切都在一個有秩序的安排裡，你是其中的一部分；對整體好的事，對你就不是壞事。記住這幾條就夠了，不必再多讀。","斯多噶把宇宙看成一個活的整體，不斷變化正是它維持自己的方式。接受變化不是認命，而是弄清楚自己站在哪個位置。","最近哪件讓你不滿的事，換成從整體的角度看會不一樣？"],"2.4":["你已經拖太久了。時間有盡頭，不拿來把心弄清楚，它就過去了，你也過去了。","整本書是他寫給自己看的，所以口氣常常像在訓自己。這一則很典型：不講道理，只催自己動手。","你一直說「之後再處理」的那件事是什麼？"],"2.5":["每件事都當成這輩子的最後一件來做：專心、不敷衍、不演戲、不抱怨。要守的就這幾條，守住了，日子就平順。","「像羅馬人」說的是盡責任。他是皇帝，這裡是在提醒自己把分內的事做好，不是要追求什麼高深的境界。","如果手上這件事是你做的最後一件，你會改掉哪個做法？"],"2.6":["再這樣糟蹋自己，就沒有機會尊重自己了。人生只有一次，你卻還在把快不快樂交給別人怎麼看你。","開頭那句是反話，他在罵自己。斯多噶認為幸福只能放在自己能決定的事情上，而別人的評價不在其中。","你的心情，有多少是別人的看法決定的？"],"2.7":["被外面的事弄得團團轉時，停下來學點好的東西。但也別掉進另一種瞎忙：很拚，卻沒有方向。","他分出兩種分心：被事情拉著跑，和自己沒有目標地跑。兩種都讓人很累，卻哪裡也沒到。","你現在的忙，是朝著哪個目標？說得出來嗎？"],"2.8":["不知道別人在想什麼，沒什麼損失；不知道自己在想什麼，一定不快樂。","斯多噶的功課是向內看的。能檢查、能改的，只有自己的念頭。","今天你花在猜別人心思的時間，和看自己心思的時間，哪個多？"],"2.9":["隨時記得兩件事：宇宙是怎麼運作的，我在其中是什麼角色。照這個角色去說、去做，沒有人攔得住你。","「沒有人能阻止你」是斯多噶對自由的看法：處境可以由別人決定，要不要照自己的本性行事，只在自己手上。","你覺得被誰擋住了？他擋住的是事情，還是你的選擇？"],"2.10":["因為貪圖快樂而犯錯，比因為生氣而犯錯更該受責備。生氣的人是先被刺痛，貪圖的人是自己湊上去的。","他引的泰奧弗拉斯托斯是亞里斯多德的學生。嚴格的斯多噶認為錯就是錯，沒有輕重之分，這裡他採用了比較貼近常識的看法。文中拿女性比喻軟弱，是那個時代的偏見。","你最近一次明知故犯，是因為被惹毛，還是因為想要？"],"2.11":["你隨時可能離開人世，所以照這個前提安排每個念頭和行動。生死、榮辱、苦樂，好人壞人都會遇到，可見它們本身不算好，也不算壞。","這是斯多噶的關鍵推論：真正的好壞只有品格，其餘都是「無關緊要的事」。能讓人變壞的才算壞事，而會不會變壞只取決於自己。","你現在最怕失去的東西，失去了會讓你變成更差的人嗎？"],"2.12":["一切都消失得很快，連記得它們的人也是。把死亡拆開來看，它只是自然的一個過程；怕它，就像小孩怕黑。","「拆開來看」是他常用的方法：把嚇人的東西分成一個個部分，逐一看清楚，恐懼多半就散了。","你怕的那件事，拆開來每一部分各是什麼？"],"2.13":["到處打聽、猜測別人的人最可憐。該顧好的只有自己心裡那份理性，讓它保持乾淨。對做錯事的人，同情比生氣合適。","他把不懂善惡比作分不清黑白：那是一種缺陷，不是惡意，所以值得同情。文中的「詩人」指的是古希臘詩人品達。","你最近打聽過誰的事？知道了以後，你有變得比較好嗎？"],"2.14":["活三千年和活三天，失去的都一樣，只有現在這一刻。過去已經不在你手上，未來還沒到，誰也拿不走你沒有的東西。","這是全書最有名的論證之一。他不是說壽命不重要，而是說人真正擁有的只有當下，所以把這一刻過好就是全部。","這一刻你人在這裡，心在哪裡？"],"2.15":["一切都取決於你怎麼看。這句話聽起來簡單，用得上的部分就拿去用。","莫尼莫斯是犬儒學派的人，主張人的看法都是虛妄。奧理略只取他要的那一半：困擾來自判斷，而判斷可以改。","今天哪件事，換個看法就不成問題？"],"2.16":["心會用五種方式傷害自己：怨恨發生的事、對人懷著敵意、被苦樂壓倒、虛偽、做事沒有目的。","「最古老的城邦」指的是宇宙本身。斯多噶認為所有有理性的生命同屬一個城邦，它的法律就是理性。","這五種裡面，你今天犯了哪一種？"],"2.17":["人生很短，身體會壞，名聲會被忘記。能帶路的只有哲學：守住內心不被苦樂左右，接受發生的事，平靜地等死亡來，因為那只是元素重新分開。","末尾的「寫於卡爾農圖姆」是他留下的地點，那是多瑙河邊的軍營，他在那裡指揮對日耳曼部族的戰事。這些話是在打仗的夜裡寫的。","你靠什麼帶路？"],"1.1":["祖父教他的是兩件事：行為端正，還有情緒上來時壓得住自己。這是整份感謝清單的開頭，他先記下的是性格，不是學問或權位。","卷一是他一一回想從誰身上學到什麼，寫給自己看，不是為了發表。從最近的長輩謝起，也等於提醒自己：好品格多半是看身邊的人學來的。","你認識的人裡，誰最能在氣頭上把話收住？你學得到他哪一招？"],"1.2":["父親那邊，他學到謙遜和男子氣概，而且是透過父親留下的名聲與旁人的記憶學來的，不是朝夕相處得來的。","他說的是「名聲與記憶」，可見這份認識多半來自旁人轉述。「男子漢的氣概」是羅馬人心目中的陽剛，指堅毅、有擔當，帶有那個時代的性別眼光。","別人提起你時，你希望他們記得你的哪一點？"],"1.3":["母親給他的是敬畏神明、樂於施予，還有簡單的生活。要求一路推到心裡：不只不做壞事，連壞念頭也不讓它成形。","斯多噶認為善惡的根在內心，所以「連壞念頭也不動」比不做壞事更進一步。他身為皇帝，特地記下「不沾有錢人的習氣」，是提醒自己別被富貴養壞。","這幾天你有沒有哪個壞念頭，在變成行動之前就被你放掉了？"],"1.4":["曾祖父教他的是：不上公立學校，在家請好老師；在教育這件事上，錢要花得大方，不要省。","這則其實在說他的出身條件，請得起家教是有錢人才有的選擇。他沒有把這當成理所當然，而是當作一份幸運記下來。這位曾祖父的生平，今天已不清楚。","你最近花得最值得的一筆錢，是花在學什麼、或誰身上？"],"1.5":["導師教他幾件事：看比賽不替哪一隊加油，能吃苦，需要的東西少，自己的事自己做，不管閒事，也不輕易信人說的壞話。","賽車的綠隊藍隊、角鬥的兩種盾，是當時羅馬大眾熱中的陣營之爭，有點像今天的球迷。不選邊，是不讓外面的輸贏牽動自己的情緒。這位導師是誰，文中沒有說。","你有沒有哪個陣營，是不問理由就站過去的？"],"1.6":["第歐格內圖斯教他不為瑣事忙，不信術士和驅鬼那一套，聽得進直話，也把他帶到哲學門口。他年輕時還學過希臘式的苦修，睡木板床、蓋獸皮。","巴基烏斯、坦達西斯、馬爾奇亞努斯是他早年聽過課的人，這幾位的生平今天所知不多，不必細究。這則看得出年輕的他對哲學有多認真，認真到想睡木板床。","你今天有沒有為一件其實不重要的事，忙了半天？"],"1.7":["魯斯提庫斯讓他明白自己的品格需要磨練，也教他別愛逞口舌之勝、別擺架子、別為了炫耀去行善，讀書要細，不隨口附和。最後還借給他愛比克泰德的筆記。","愛比克泰德是當過奴隸的斯多噶哲學家，奧理略的想法有很多來自他。這則提到筆記的借閱，等於說明了這本書和斯多噶學派是怎麼接上的。","你上一次做了好事，有沒有順便想讓人知道？"],"1.8":["阿波羅尼烏斯給他的是自由的意志和不動搖的決心，劇痛、喪子、久病時都一樣。他也看到一個人可以既堅決又隨和，並學會怎麼接受朋友的好意。","「除了理性，不把目光放在任何事上」是斯多噶的核心：能掌握的只有自己的判斷。道理人人會講，難的是在痛苦中還站得住，所以他特別記下這個活例子。","別人幫了你的忙，你通常是過意不去，還是裝作沒什麼？"],"1.9":["塞克斯圖斯給他的印象是仁厚、有條理，像父親一樣照顧家人，不動怒也不被情緒牽著走，卻很有感情。他稱讚人不喧嚷，學問好卻不炫耀。","這則最值得看的是「完全不受情緒左右，卻又極為深情」。斯多噶要的不是冷漠，而是情緒不奪走主導權。這位塞克斯圖斯的生平，今天已不清楚。","你認識誰是不發脾氣，卻讓人覺得他很在乎的？"],"1.10":["別人說了不合文法或聽來怪的字，他不用責備的口氣去糾正，而是自然地把對的說法帶進回話裡，或乾脆談事情本身，不管那個字眼。","這是一種不傷人的糾正方式。文法學家本來就是專門挑語言毛病的人，卻選擇不挑，可見他重視的是事情本身與對方的面子，而不是證明自己比較懂。","你最近一次糾正別人，是為了幫他，還是為了證明你對？"],"1.11":["他從弗朗托學到兩個觀察：暴君身上總有嫉妒、虛偽和做作；而所謂的貴族，大多缺少對親人那種像父親般的感情。","弗朗托是當時有名的修辭學者，也是他的老師，這裡取的卻是對權力與人情的觀察。身為皇帝，他把暴君的毛病寫下來，是提醒自己別走上那條路。","你身邊有沒有人擺出一副樣子，其實是怕被看輕？"],"1.12":["不要動不動就說「我沒有空」，沒必要時更不要說。也不要老拿急事當藉口，推掉對身邊的人該盡的責任。","皇帝什麼事都急，所以這一條對他特別難。斯多噶講責任，是對具體的人，不是對抽象的大事業。他把這句話記給自己，因為最容易被忙碌犧牲的就是身邊的人。","這禮拜你對誰說過「我沒有空」？那是真的沒空嗎？"],"1.13":["朋友挑你毛病時不能漠不關心，就算挑得沒道理，也要設法讓他平靜下來。他還學到樂於稱讚老師，以及真心愛自己的孩子。","多米提烏斯和阿特諾多圖斯，文中只說是「傳說中」的例子，他們的事跡今天不清楚。這則的重點是不把朋友的批評冷處理：關係比誰對誰錯要緊。","上次朋友說你哪裡不好，你的第一反應是辯解，還是聽進去？"],"1.14":["兄弟塞維魯斯讓他愛親人、愛真理、愛正義，認識了幾位堅持原則的人物，也讓他形成一種想法：人人適用同一部法律，施政最重視被治理者的自由。","特拉塞亞、赫爾維狄烏斯、加圖、狄翁、布魯圖斯，多半是以抗拒暴政、重視自由著稱的人物。他是皇帝，卻寫下要把被治理者的自由放第一，是對自己的要求。","在你說了算的地方，規矩是不是對每個人都一樣？"],"1.15":["馬克西穆斯示範了自我克制：不被任何事牽著走，生病也愉快，溫厚與莊嚴調和得好，不抱怨，說的就是心裡想的，不慌不拖，也不用笑掩飾不快。","這則是一幅理想人物的畫像。最高的讚美是「天生就不會走偏，而不是被改造出來的」。這位馬克西穆斯的生平，今天所知有限，這裡只看他在文中的樣子。","你不舒服或心情差的時候，身邊的人會被你影響嗎？"],"1.16":["這是卷一最長的一則，寫的是他的父親：溫和，想清楚就不動搖，不愛虛榮，肯聽建議，不輕易厭倦朋友，不迷信也不討好群眾，並把自己看作與其他公民平等的一員。","文中的父親，應指收他為養子、先他當皇帝的安敦寧·比烏斯。他記的多是日常細節，如衣服從哪裡來、怎麼對待求饒的收稅人，而不是功績。他想學的是：權力在手，仍能像平常人一樣自處。","你身邊有沒有人手上有點權力，卻不擺架子？他在小事上怎麼做？"],"1.17":["結尾他轉向感謝眾神：有好家人、好老師、好朋友，沒做過冒犯神的事。他也坦白說，自己性情裡也許有那種可能，只是沒遇到考驗的機會。","他把好運歸給神，把做不到的部分歸給自己。文末記著「在誇迪人之中，於格拉努阿河畔」，是在前線寫的。文中說妻子「順從」，有那個時代的眼光；中間有「……」，原文有缺。","你生活裡有哪三件事是運氣或別人給的，你卻很少想到？"],"3.1":["時間不只是一天天變少。就算活得久，腦筋還能不能好好用也不一定。人老了，身體機能照常運作，分辨輕重、盡責任這些靠理性的事卻會先退，所以要趁現在做。","他在講理解力比壽命更早到期。斯多噶重視理性運作，因此這則的急迫感不全是怕死，而是怕沒能在頭腦清楚的時候好好活。文中提到判斷何時離開人世，是斯多噶討論過的題目。","有什麼事，是你現在頭腦清楚、想做好，卻一直拖著的？"],"3.2":["順著自然長成的東西，後來出現的小瑕疵，也有它的美：烤裂的麵包、裂開的無花果、熟透的橄欖。懂得看自然的人，連野獸的大口、老人的樣子都能欣賞。","他在練習換一種眼光：不問東西完不完美，而是把它當成自然運作的結果。這是把順著自然的想法延伸到審美。文中稱老婦老人有成熟與端莊，也是同樣的用意：不嫌老。","今天有什麼你平常嫌舊、嫌醜的東西，換個角度其實有它好看的地方？"],"3.3":["名醫、占星師、征服者、哲學家，沒有一個逃過死亡，有的死法還很不體面。所以不必把離開看得太悲壯。去哪裡都不壞：另一種生命有眾神，沒有感覺就不再受苦。","他列的人有希波克拉底（古希臘名醫）、亞歷山大、龐培、凱撒（大征服者與統帥）、赫拉克利特、德謨克利特、蘇格拉底（哲人）。有些死法應是古代傳聞，真假不必深究。重點是再大的人物也一樣，這是斯多噶面對死亡的常用練習。","如果今天就得「下船」，有哪件事你會想先收尾？"],"3.4":["別把剩下的日子花在猜別人做什麼、想什麼，除非是為了共同的益處。思緒進來時要篩掉沒用的，尤其是好奇和惡意的念頭，要讓自己的心思隨時說得出口。","他給了一個很具體的測試：有人突然問你在想什麼，你能不能坦率回答而不臉紅。後半段描繪一種理想的人，不在乎沒讓自己滿意的人的讚美，因為「他們連自己都不滿意」。","如果現在有人突然問你在想什麼，你說得出口嗎？"],"3.5":["做事不勉強、不草率、不分心，也不用漂亮的修飾包裝思想。要像站崗等信號的人，隨時準備離去；要自己站直，不靠別人扶。","他把自己該守住的樣子描述成是羅馬人，是統治者，是在提醒自己的位置。「像等候信號的人」是軍人站崗的意象：把人生當崗位。這一則最後講的是，平靜不能向外借。","你的平靜，有多少是靠別人的認可或幫忙撐著的？"],"3.6":["他說，如果你找到比正義、真理、節制、堅忍更好的，就全心去追；找不到，就別為了讚美、權力或享受讓位，因為讓一小步，就會被一路帶走。","這是個思想實驗：他逼自己認真找找有沒有更好的東西，找不到才堅持。「植於你內心的神」指理性的部分。有人反駁「有用的才是更好的」，他的回答是：要看是對你這個有理性的存在有用，還是只對動物有用。","最近有哪件事，你為了被稱讚或圖方便，讓了一小步？"],"3.7":["不要把違背諾言、失去自尊、恨人、猜疑、咒罵、演戲、見不得人的事，當成對自己有利。把理智看得最重的人，不呻吟，不求死也不躲死，隨時能體面地啟程。","他有一個簡單的檢驗：一件事若得靠牆壁與帷幕遮著才能做，就不是好事。「不演悲劇角色」是說不把自己的處境演成悲情戲。「既不去求死，也不躲死」是斯多噶對生死的態度。","你有沒有做過什麼事，只因為覺得別人看不到？"],"3.8":["一個被磨練過、純淨的人，心裡沒有潰爛的角落，也沒有奴性和做作。就算命運提早到來，他的人生也不算殘缺，不像演員戲沒演完就被叫下台。","「表面長了皮、底下潰爛的傷口」是比喻：外表平靜，裡面有放不下的東西。他用演員來說人生：完整不在於長短，而在於把該做的做了。文中括號是譯者補的語意。","有沒有哪件事你表面放下了，一想到還是不舒服？"],"3.9":["要尊重自己形成意見的能力，因為你的主宰之心裡會不會有違背自然的意見，就看它。它保證三件事：不倉促下判斷、對人友善、接受發生的事。","斯多噶的關鍵是：困擾我們的往往不是事情，而是我們對事情的判斷。所以他要尊重的是「那個產生意見的能力」，那是唯一真正由自己掌握的地方。「順從眾神」可理解為接受分給你的處境。","今天下判斷之前，你有沒有先停一下？"],"3.10":["把雜念都丟開，只記住幾件事：人只活在當下這一點，其餘不是過去就是未知；活的時間短，住的地方小，連名聲也短，還要靠一群自己也會死的人傳下去。","這是縮小視角的方法：把時間和空間拉遠，名聲與野心就顯得很小。斯多噶常用這招來鬆開執著。他說身後名聲靠「可憐的人」延續，這些人連自己都不認識，更別說多年前的那一位。","你今天最在意的那件事，十年後還會有人記得嗎？"],"3.11":["面對眼前的事，給它下個定義或描述，看清它赤裸、完整的樣子，說出它的名稱、由什麼構成、將分解成什麼，再想想它在整體裡有什麼用、我該用什麼德性對待它。","這是他很常用的方法：把事物的印象與情緒剝掉，只看它是什麼做的。文中「至高之城的公民」是說人是宇宙這座大城邦的一員。最後他提醒：對待人要善意與正義，對無關緊要的事要定好價值。","今天讓你煩的那件事，剝掉情緒後，它到底是什麼？"],"3.12":["做眼前的事時，依理性、認真、平靜，不被別的事分心，把內在神聖的部分保持純淨，不期待、不害怕，你就會幸福，而且沒有人能阻止。","重點是幸福的條件全在自己手上，所以他才敢說「沒有人能阻止這一點」。「好像必須立刻把它交還一樣」，是用隨時可能離世的心情過日子；「英雄般的真誠」是說話不虛飾。","此刻你在做的事，有沒有一部分心思飄到別處去了？"],"3.13":["醫生總備著器械和手術刀，你也要隨時備好原則，用來看神聖與人間的事。做任何事，即使最小的，都要記得兩者是連在一起的。","比喻很具體：原則要像手術刀放在手邊，臨時拿得出來，不是等需要時才去翻書。斯多噶認為宇宙是一個整體，所以他說「做不好任何與人有關的事」若不同時參照神聖的一面。","你有沒有一句原則，是情緒上來時真的拿得出來用的？"],"3.14":["別再漫無目的地過日子了。你已經沒機會把備忘錄和前人事蹟慢慢讀完，趕快走向眼前的目標，丟開空洞的希望。要救自己，就趁還有能力的時候。","這是他催自己的話，口氣很不客氣。「為晚年留下的那些書中選段」顯示他一直在準備，卻可能用不上。這本筆記也許就是那種備忘錄，但文中沒有明說。","你有沒有一直在準備，卻遲遲沒開始的事？"],"3.15":["一般人不知道「偷、播種、買、保持安靜、看出該做什麼」這些詞背後包含多少事，因為這要靠另一種視覺，而不是眼睛。","這則很短，語意隱晦，以下只是推測：同一個動作，從外表看不出它好不好，要靠內在的判斷去分辨。他把「偷」和「看出該做什麼」放在同一串，似乎是說行為的意義不在表面。","你最近有沒有誤會過誰的行為，後來才發現不是你看到的那樣？"],"3.16":["感覺、欲望、原則，各屬身體、靈魂、理智。但接收印象、被欲望拉扯、甚至用理智做事，壞人都做得到。好人獨有的是對命運滿足，守住內心的神性，說話不違背真理，平靜地走完。","法拉里斯是古代著名的暴君，尼祿是羅馬皇帝，這裡拿來當壞人的代表。他的意思是：光有理智不夠，要看拿它去做什麼。文中「把自己變成女人的男人」帶有那個時代的偏見。","今天遇到不如意時，你能不生氣、也不說違心的話嗎？"],"4.1":["主宰之心合乎本性時，遇到什麼都能順勢處理。碰到阻礙，就把阻礙當成材料，像火把落進來的東西吞掉，反而燒得更旺。","火的比喻是重點：一盞小燈會被壓熄，旺火卻靠堆上來的東西燒得更高。阻礙會不會變成障礙，要看內在夠不夠強，斯多噶的練習就是把這個內在養強。","最近有件擋住你的事，能不能當成練習的材料？"],"4.2":["什麼事都不要漫無目的地做，而且做法要合乎把事情做好的規矩。也就是先想清楚為什麼做，再用對的方式去做。","原文只有一句，意思要補：「技藝完善的原則」大概是說做事要有章法，像工匠講究做法。他在提醒自己，忙碌不等於有目的。","你今天排的事裡，哪一件其實說不出為什麼要做？"],"4.3":["人總想找鄉下、海邊、山裡去清靜，他說這是最平庸的念頭，因為隨時都能退回自己心裡。備幾條簡短的原則，不滿時回去洗一洗，再回到原本的事。","這一則替幾種煩惱各開一帖藥：人的惡、命運、身體、名聲。他說的平靜，不過是「心裡井然有序」。文中的方括號是譯者補的語意，不是原文殘缺。","你上次想逃去清靜的地方，是在煩什麼？"],"4.4":["我們共有理性，所以共有「該做什麼」的法，所以是同胞公民，同屬一個城邦，世界就像一個國家。他一步一步往下推，推到人與人是一體的。","這是斯多噶的世界城邦觀念，用一串「既然如此」把前提推到結論。最後他補一句：理性不會憑空來，一定有來源，就像身體的土與水也有來源。","你有沒有把某個陌生人，當成和你同一個共同體裡的人看過？"],"4.5":["死和出生一樣，是自然的奧祕：元素組合起來，又分解回元素。這不是該覺得羞恥的事，因為它不違背理性生物的本性。","斯多噶把人看作元素的組合，死亡只是回到元素。他要做的是把死亡從可怕的事改看成自然的過程。文中方括號是譯者補的語意。","想到死，你最怕的是疼痛、遺憾，還是別的？"],"4.6":["某人做出某件事，是自然的，也是必然的。不肯接受，就像不讓無花果樹有汁液。何況很快你和他都會死，名字也不剩。","這是他給自己降火的方法。無花果樹的比喻是說：有些人本來就會那樣做，要他別這樣，等於要樹別有汁。再把死亡的視角放進來，氣就消了一半。","今天最讓你生氣的人，你本來就料到他會這樣嗎？"],"4.7":["把你對事情的意見拿掉，「我受到傷害了」這句抱怨就沒了；抱怨一沒，傷害也跟著不存在。重點在抱怨，不在事情。","這是斯多噶的基本技巧。他不是說事情沒發生，而是說覺得受傷來自我們對事情的判斷。判斷可以檢查，所以受傷的感覺有機會減輕。","最近讓你覺得受傷的一句話，拿掉你的解讀之後還剩下什麼？"],"4.8":["不會讓人變得更壞的東西，也不會讓他的生活變壞。不管從外面來，還是從裡面來，都傷不了他。","斯多噶認為真正的好壞只有品格。外在遭遇不會讓人變壞，所以也毀不了生活。這個前提很強，不是每個人都同意，他卻把它當成原則來練習。","這件事會讓你變成更壞的人，還是只是讓你不舒服？"],"4.9":["對整體有益的事，自然會逼著它非這樣發生不可。你覺得不順的事，從整體來看可能是需要的。","原文只有一句，意思只能推測：自然的運作為的是整體，個別的不愉快也屬於整體的安排。這是斯多噶的信念，不是證明，讀的時候當作一種看法就好。","你最近的一件不順，放到更大的脈絡裡看，有什麼用處？"],"4.10":["凡是發生的事，都發生得公正，仔細看就會發現，好像有人按價值在分派。無論如何，做每件事都要守住良善。","這是斯多噶對整體安排的信念，不容易接受。注意他只說「好像有一個人」在分派，並沒有說確定。真正要抓的是後半：不管怎麼看，行動都要同時是良善的。","有沒有哪件當時覺得不公平的事，後來看出了它的道理？"],"4.11":["別照那個對你不義的人看事情的方式去看，也別照他希望你看的方式去看，要照事情本來的樣子看。","對方的角度、情緒和說法，都會悄悄左右你的判斷。這一則是在提醒他：要把看事情的主導權拿回自己手上，這是意見那套練習的應用。","上次被人冒犯，你是怎麼看那件事的？那是他的說法，還是事實？"],"4.12":["要備好兩條規則：只做理性為了人的益處所建議的事；有人糾正你，就改變意見，但必須是因為信服，不是因為愉快或名聲。","這是他對自己的聽勸標準：改變看法要出於道理，不出於討好或面子。改變和不改變，都要有理由。這一則的重點是，理由要夠好，而不是夠好聽。","你上次改變看法，是因為被說服，還是因為不想吵？"],"4.13":["你有理性，卻不拿來用，那還缺什麼？只要理性把它自己的工作做好，你就沒有什麼好抱怨或再要求的。","他在質問自己：缺的往往不是條件，而是肯不肯用。斯多噶認為理性是人最特別的能力，把它用好，人的本分就算完成了。","你正在煩惱的那件事，有沒有先認真想過？"],"4.14":["你曾是整體的一部分，將消失在生出你的那個東西裡。說得更準確些，你只是被轉化，收回它那種子般的原理之中。","他在修正自己的說法：不說「消失」，而說「轉化」，因為斯多噶認為萬物最終回到宇宙的理性。「種子般的原理」是他們的術語，大意是萬物生成的根源。","把自己看成大整體的一部分，今天哪件煩惱會變小？"],"4.15":["同一座祭壇上燒著許多粒乳香，有的先落下，有的後落下，沒有差別。他的意思大概是：早一點或晚一點，並不重要。","乳香是祭神時焚燒的香料。原文只有一句，以下是推測：他在說早死晚死，就像香粒先後落入火裡，結果一樣。這個想法在後面幾則還會回來。","你有沒有在計較誰先誰後，其實結果一樣的事？"],"4.16":["只要回到你的原則，敬重理性，不出十天，現在把你當野獸、當猿猴的人，會把你當神看。","這是鼓勵自己：品格穩定下來，別人的看法也會跟著變。「不出十天」是誇張的講法，並不是預測，大概是寫給正被人看輕的自己。","你有沒有因為別人看輕你，就想放棄原則？"],"4.17":["別做得好像還有一萬年可活。死亡就懸在頭上，趁還活著、還做得到，好好做個良善的人。","「死亡就懸在頭上」是斯多噶的老提醒。把死亡放在眼前，不是為了嚇自己，而是為了決定現在該先做什麼。","如果只剩一年，你會立刻改變哪一件事？"],"4.18":["不去看鄰人說什麼、做什麼、想什麼，只看自己做得是否公正純潔，能省掉很多麻煩。像阿伽通說的，別東張西望，順著直線往前跑。","阿伽通是古希臘的悲劇詩人，這裡引他的話。這則和卷三第四則呼應：把注意力收回到自己能管的事。別人的品行，不是你的功課。","今天有哪件事，你其實只要管好自己，不用管別人？"],"4.19":["想死後留名的人，沒想到記得他的人很快也會死，一代代傳下去終於熄滅。就算記憶不滅，對你有什麼用？","他在拆解虛名，問的是稱讚的實際用處。這一則結尾有「……」，原文有缺，後半句的意思只能推測：大概是說你放著自然賜予的，卻抓著別的東西。","你做一件事時，有多少成分是為了被人記得？"],"4.20":["真正美的東西，本身就美，稱讚不是它的一部分。法律、真理、仁愛、謙遜，不會因為被稱讚變好，也不會因為被責備變壞。","他用翡翠、黃金、紫袍、七弦琴等例子，說價值在東西本身，不在別人的評價。再把這個道理反過來用在自己身上：好品格不需要掌聲。","你做的哪件事，就算沒人稱讚，你還是會繼續做？"],"4.21":["如果靈魂死後還在，空氣怎麼容得下？他的回答是：靈魂存續一陣子後也會轉化、擴散，給新來的騰位置，就像大地容得下埋進去的身體。","這是在「假設靈魂繼續存在」的前提下作答，不代表他確定。他的重點是：自然有辦法容納一切。文末「見第七卷第二十九則」是譯者的註，不是這則本身的內容。","想到死後會怎樣，你覺得需要答案，還是可以先放著？"],"4.22":["別被各種事牽著團團轉。每個動作都要顧到正義，每個印象一出現，都要守住自己的理解能力，不輕易跟著走。","「印象」是事物在心裡留下的第一個畫面。斯多噶要求在它變成判斷之前先檢查一下，也就是別急著同意。這是他們最基本的功課之一。","今天有哪個第一印象，值得你多看一眼再相信？"],"4.23":["他對宇宙說：與你和諧的，也與我和諧；你的時機對我不早不晚；你的季節帶來的一切都是果實。萬物出自你，在你之中，歸於你。","這是一段對自然的禱詞，表示完全接受。詩人用「刻克洛普斯之城」指雅典，他改成「宙斯之城」，指整個宇宙：我們住的是更大的城。","此刻有件事來得不是時候？把它換成正是時候，你怎麼看？"],"4.24":["有人說想平靜就少做事。他說更好的是只做必要的事，照合群動物的理性要求去做。我們說的做的大部分都不必要，拿掉就更有空閒、更少不安。","他把「少做事」改成「做必要的事」。重點是不只去掉多餘的行為，也要去掉多餘的念頭，因為念頭一多，行為就跟著來。","你今天排的事裡，哪一件拿掉也沒關係？"],"4.25":["試試看良善之人的生活適不適合你：滿足於自己在整體裡分到的那一份，滿足於自己公正的行為和仁善的心意。","他用「試試看」的口氣，把德性當成可以親自驗證的生活方式，而不是要人照單全收的教條。這是他對自己說的，也是一種邀請。","今天試著只管自己做得公不公正，一天下來會怎樣？"],"4.26":["別擾亂自己，讓自己單純。有人做錯事，錯待的是他自己；落在你身上的事，從一開始就分配好了。生命很短，把現在用在有益的地方。","斯多噶認為做錯事的人，傷的是自己的品格，所以不必替他生氣。「紡織好了」是命運三女神紡線的意象。最後一句連休息也要清醒節制。","今天有哪件別人的錯，你可以放下，不必替他生氣？"],"4.27":["不是井然有序的宇宙，就是一團混沌，但無論如何仍是一個宇宙。你裡面能有秩序，整體卻是無序嗎？","他在處理一個老問題：宇宙到底有沒有安排。他用類比推論：你心裡能有秩序，整體不該更差。這是他的信念，不是證明。","在混亂的日子裡，你自己能守住哪一小塊秩序？"],"4.28":["他列了一串不好的性格：陰沉、軟弱、頑固、野獸般、孩子氣、愚蠢、虛偽、粗俗、詐欺、暴虐。","這像是列給自己檢查的清單，不是在罵人。「軟弱像婦人的性格」帶有那個時代對女性的偏見。這則沒有說明用途，以上是推測。","這一串裡，哪一個最近在你身上出現過？"],"4.29":["不知道宇宙裡有什麼、在發生什麼的人是陌生人；逃避合群理性的人是逃亡者；因不滿而退出的人，是宇宙上的膿瘡。","他連用一串很重的比喻：陌生人、逃亡者、瞎子、窮人、膿瘡、碎片。意思是，不肯接受發生的事、不肯合群，就是把自己從整體切下來。這是對自己說的重話。","你最近有沒有對發生的事太不滿，把自己關起來？"],"4.30":["三個哲人各缺一樣東西：沒外袍、沒書、沒麵包，卻都守住理性。他說自己也不靠學問謀生，但守住理性。","文中沒說這三位是誰，今天已無從確認，只當作例子看。重點是：人缺了外在的東西，只要理性還在，哲學的本分就沒丟。","如果少了你最倚賴的那樣東西，你還剩什麼？"],"4.31":["愛你學的那門技藝，即使微小，也以它為滿足。其餘的人生，像把一切託付給眾神的人那樣過，不做任何人的暴君，也不做任何人的奴隸。","他是皇帝，卻要自己愛一門小技藝，做好手邊的事就夠了。不做暴君，也不做奴隸是對權力兩端的警戒：不壓人，也不被人壓。","你手上有沒有一件小事，是你願意慢慢做到好的？"],"4.32":["看看維斯帕先的時代：人們結婚、做買賣、爭權、奉承、猜疑，如今一點不剩；到圖拉真的時代也一樣。最該想的，是你認識的那些為空虛的事煩亂的人。","維斯帕先與圖拉真都是羅馬皇帝，距離他的年代各有一段時間。他把過去的忙碌攤開看：當年的人再用力，也都成了灰。對每件事的投入，要有分寸。","你現在最忙的事，放到一百年後，還剩什麼？"],"4.33":["過去的詞會過時，有名的人也是：從卡米盧斯到奧古斯都、哈德良，都漸漸變成傳說。連永恆的記憶都不算什麼，值得費心的只有公正的思想、合群的行為、不說謊的話。","他列出一串從羅馬早期到不久前的名人，說明名氣會褪色。結尾列的四樣，是他給自己的答案：公正的思想、合群的行為、真話，加上欣然接受發生的事。","如果名氣都會淡，你最想把時間花在哪一件事上？"],"4.34":["自願把自己交給克洛托，讓她把你的生命之線紡進她喜歡的任何事物裡。意思是：不拗著命運，主動同意它。","克洛托是命運三女神之一，負責紡生命之線。他說「自願」，因為斯多噶的接受不是被動認命，而是自己同意。方括號是譯者補的說明。","有什麼事你硬要它照你的方式走，其實可以放手？"],"4.35":["一切都只是一天的事，記得的人和被記得的人都是。連名聲和記憶，也不過存在一天那麼短。","他把時間尺度縮成一天，和前幾則談名聲、談死亡一脈相承。原文很短，意思是：無論想被記住還是想去記住，都只是一天。","今天結束時，你希望自己留下了什麼？"],"4.36":["萬物都靠變化而生。自然最喜歡改變現有的事物，造出相似的新事物。凡存在的，都是將來之物的種子，而且不只是土裡的那種。","變化在他眼中是自然工作的方式。「種子」是比喻：現在的東西裡，已經孕育著將來的樣子。他提醒我們別把眼光縮得太小，只想到播種的種子。","最近有件事的結束，是否正在孕育另一件事？"],"4.37":["你快要死了，卻還不單純，還在猜疑外界的事會傷害你，對所有人還沒有善意，也還沒把智慧放在公正行事上。","他對自己說重話，是自我鞭策。「快要死了」不是預言，是每個人的處境。四個「還沒」就是他給自己列的待辦。","這四個「還沒」，哪一個你今天就能動手？"],"4.38":["去看人們的主宰之心，連有智慧的人也不放過，看他們避開什麼、追求什麼，從這裡看出他們到底怎麼判斷。","他在教自己一種觀察人的方法：人躲什麼、追什麼，反映他們的判斷。連智者也要看，因為再聰明的人也有所求。這也是對照自己的辦法。","你自己最常避開的是什麼？最常追求的是什麼？"],"4.39":["你所謂的惡，不在別人心裡，也不在肉身的變化，而在你形成「關於惡的意見」的能力。即使身體受苦，也讓這部分保持安靜，判斷這些事既不好也不壞。","這是無關緊要的運用：疾病、疼痛這類好人壞人都會碰到的事，真正的好壞只看品格。他不是說不會痛，而是說痛不該讓你判斷成「惡」。","最近讓你痛苦的事，是事情本身，還是你對它的判斷？"],"4.40":["把宇宙看作一個活的生命，有一個實體、一個靈魂，萬物都歸於它那唯一的知覺，以同一個運動行動。","斯多噶把宇宙看成有生命、有理性的整體。你不必同意，也能體會他要的效果：把自己放進更大的整體，個別的得失就變小了。","你今天在哪個團體裡，是其中的一個部分？"],"4.41":["你只是一個小小的靈魂，扛著一具屍體。愛比克泰德常這樣說，意思是別把背著的身體，當成真正的自己。","愛比克泰德是當過奴隸的斯多噶哲學家。這句話把身體看成靈魂背著的重物，提醒你什麼才是真正的自己。括號裡的出處是譯者的註記。","今天你為身體操的心，和為品格操的心，哪個多？"],"4.42":["事物經歷變化不是壞事，事物靠變化才得以存續也不是好事。變化本身只是變化，不必替它貼好壞標籤。","這句話的意思是：變化本身是中性的，不好也不壞。這和斯多噶的無關緊要一致，該管的是我們怎麼判斷它。原文很短，意思是推測。","你最近抗拒的一個變化，如果它只是中性的，你還會那麼反對嗎？"],"4.43":["時間像一條由事件構成的急流：才剛看見，下一刻就被沖走，另一樣補上來，不久也被沖走。沒有什麼停得住。","河流的比喻讓人想起赫拉克利特的萬物流動，他在第四卷第四十六則也引了他。意思是：沒有哪個當下留得住，所以要好好看它。","今天有什麼你想留住的時刻？你有好好看它嗎？"],"4.44":["發生的一切，都像春天有玫瑰、夏天有果實那樣尋常，疾病、死亡、誹謗、背叛也一樣，是常有的事。","他把壞事放在季節旁邊：不特別，就是常有。這是斯多噶的預演：先承認壞事是正常的，遇到時才不會覺得世界對你不公平。","有什麼壞事，你一直覺得不應該發生？"],"4.45":["事物的先後不只是一件接一件，而是有道理的聯繫：後來的總與先前的契合，一切被和諧地安排在一起。","他是說因果不是偶然堆疊，而是有關聯的。括號裡的參照是譯者列的相關則數。這是他的信念，不是證明，可以當成一種看世界的方式。","回頭看你人生的某個轉折，現在看有連起來的道理嗎？"],"4.46":["要記得赫拉克利特的話：土、水、氣、火互相轉化。也別像睡著那樣行事說話，別只是照別人教的，人家怎麼教就怎麼說。","赫拉克利特是古希臘哲學家，主張萬物不斷變化。這一則有三個提醒：知道路通向哪，別與治理宇宙的理性吵架，別在半夢半醒中過日子。","今天有哪件事，你是照習慣做，並沒有真的想過？"],"4.47":["如果有神告訴你明天會死，你不會太在意是明天還是後天。同樣地，多少年之後才死，也不是大事。","他用假想把差距縮小：對整段時間來說，一天和幾年差別很小。這是斯多噶常見的死亡演練，不是要人消極，是要人看清楚什麼才重要。","如果明天就沒有機會，你今天想先說的那句話是什麼？"],"4.48":["多少醫生、占星家、哲學家、英雄、暴君，做完他們的事都死了，連城市也整座消失。所以照本性過完短短一段，像橄欖成熟時落下，感謝生出它的自然。","赫利刻、龐貝、赫庫蘭尼姆是已經毀滅的城市。他用一長串例子累積分量，最後以橄欖結尾，把死亡說成成熟的事，不是被奪走。","你希望自己是怎樣走完這一段的？"],"4.49":["要像海岬，海浪不停拍打，它卻屹立不動。事情落在你身上，你可以說：我仍是幸福的，因為我沒被壓垮。不是事情不幸，而是高貴地承受它才是幸運。","他把「不幸」換成「幸運」，標準是這件事有沒有妨礙你守住正義、節制等品格。只要沒有，它就算不上不幸。這和無關緊要是同一條線。","最近的一件倒楣事，有沒有妨礙你做你想成為的人？"],"4.50":["要看輕死亡，有個粗淺卻有用的辦法：看那些死命抓著生命不放的人，他們比早死的多得到了什麼？終究也躺進墳墓。活三天和活三代，在無限裡沒有差別。","文中的卡狄基阿努斯、法比烏斯、尤利阿努斯、雷必達，今天的生平已不清楚，只能當作他認識或聽說的長壽者。他只取一點：最後都被抬去埋了。","你把多少力氣花在再多拿一點上？"],"4.51":["永遠走捷徑，捷徑就是合乎本性的。所以言行都要合乎最健全的理性，這樣能免於麻煩、紛爭，也免於矯飾與炫耀。","「捷徑」不是偷懶，而是最直接的路：照本性、照理性做事，不繞圈子，也不演給別人看。這是卷四的結尾，又回到單純。","你手上有沒有一件事，有條更直接的做法被你繞開了？"],"5.1":["早上不想起床，就對自己說：我起床是去做一個人該做的事，不是為了縮在被窩裡取暖。連螞蟻和蜜蜂都在工作，你卻總在還做得到的地方先停下。","這是他給自己的晨間質問，逼得很緊：你是為什麼被帶到世上、連小生物都在工作、人對自己的本性還不如工匠對技藝用心。文中「可是這樣比較舒服」是他自己的反駁。","今天早上你賴了多久？賴床是為了休息，還是為了躲什麼？"],"5.2":["讓人困擾或不合宜的印象，要擊退、抹掉，立刻回到平靜，其實很容易。意思是：念頭只是一閃而過的畫面，你不必配合它。","原文很短，意思要補：印象是事物先在心裡留下的第一個畫面，要不要同意，由你決定。他說「很容易」，是在鼓勵自己：難的不是做不到，而是記得去做。","剛才有哪個念頭讓你不舒服？你現在可以不理它嗎？"],"5.3":["凡是合乎本性的話和行為，都要認定適合你，別被別人的責備或閒話帶偏。人家照他們的方式動，你只管順著自己的本性往前走。","他說自己的本性和共同的本性是同一條路，因為人的本性本來就是合群的。「配不上你」這句像是對皇帝身分說的，不過文中沒有明講。","最近有件該做的事，你是不是因為怕被說閒話而沒做？"],"5.4":["他想像自己依本性走到最後倒下：把氣息吐回每天呼吸的元素，倒在土地上。這片土地養了他的父母、乳母，供他吃喝一輩子，也承載著他。","這是對死亡的感恩式想像：不是被奪走，而是回到來源。他把自然寫成一直在供養他的母親，即使他踩它、糟蹋它，它仍然承載他。","今天你吃的、喝的，有哪一樣你想過它是從哪裡來的？"],"5.5":["別人看不出你聰明，也沒關係，因為許多品質完全在你能力內：真誠、莊重、能吃苦、知足、仁善。這些不能推說天生不行。若真遲鈍，就在這點上下功夫。","他點破一個常見的藉口：天生不是這塊料。能力有限是一回事，品格是另一回事。「憑眾神起誓」是很重的語氣，等於他在對自己發誓：這些毛病你早就可以甩掉了。","你最常說的我就是這樣，是在替哪個習慣找藉口？"],"5.6":["幫人做了好事，有三種人：記上帳當作恩惠的，不記帳卻心裡覺得對方欠他的，還有像葡萄藤，結了果就不再多求。他要學的是第三種。","葡萄藤、馬、狗、蜜蜂的例子，都是做完就接著做下一件。後面有人反問：不是該察覺自己在做什麼嗎？他的回答很簡略：察覺不是要你像前兩種人那樣算帳。","你上次幫了人，心裡有沒有悄悄記了一筆？"],"5.7":["雅典人有句祈禱：降雨吧，降雨吧。他欣賞它的單純，沒有討價還價，只是向神說出事情自然該有的樣子。祈禱要嘛不做，要做就該這樣。","原文很短，意思只能推測。宙斯是希臘的天神，掌管降雨。他在意的是祈禱要「單純而高貴」，不是為了自己的得失去求神。","你上次向運氣或向神許願，是在求什麼？你自己能做什麼？"],"5.8":["就像醫神開處方，宇宙的本性也給每個人開處方：疾病、殘缺、損失。這些是依你的命運恰當為你定下的，要像接受醫生的苦藥那樣接受。","阿斯克勒庇俄斯是希臘的醫神。比喻的重點：處方雖然令人不快，為了健康我們還是接受；所以發生的事也要接受，因為它通向整體的健康。這是斯多噶天意的說法，需要慢慢讀。","最近有件讓你不舒服的事，換成這是給我開的藥，你還想拒絕嗎？"],"5.9":["沒能事事合乎原則，別厭惡、別氣餒，失敗了就再回來。別把回到哲學當成回到主人那裡，哲學要的，不過是你的本性要的。","他用眼睛痛的人敷海綿、蛋白做比喻：哲學是照顧自己的方法，不是壓迫。他也回應常見的反駁：快樂不也在欺騙我們嗎？平靜與自由不是更愉快嗎？","你上次沒做到自己訂的原則，後來是怎麼回來的？"],"5.10":["事物被層層包裹，連哲學家都難懂，我們的判斷也總在變。回頭看事物本身多短暫，連最可親的人也難忍受。能安慰他的只剩兩條：宇宙的事不會越過我，沒人能強迫我違背內在的神。","這一則情緒很低，像是疲憊時寫的：「在這樣的黑暗與污穢裡」。他沒有因此絕望，而是退到兩條自己做得到的原則。文中的「斯多亞」就是斯多噶。","累的時候，你有沒有兩三句可以退回去的話？"],"5.11":["他要隨時問自己：我現在把靈魂用在什麼上？主宰之心裡現在是什麼：孩子的、年輕人的、軟弱婦人的、暴君的、家畜的，還是野獸的？","這是查看當下心態的問法，列的是幾種心態，不是在分人。其中「軟弱婦人」帶有那個時代對女性的偏見。重點是每次都問，而不是問一次。","此刻你心裡主導的是哪一種：孩子氣、暴君，還是別的？"],"5.12":["看一個人怎麼聽某些話，就知道他把什麼當成善。把審慎、節制、公正當善的人，聽不進和它不合的話；把財富名聲當善的人，反而聽得進去。","他拿一位喜劇作家的話做測試，下一段說那句話是譏諷富得連解手的地方都找不到。這位作家是誰，文中沒說。方法是：用你聽得進什麼來照出自己的價值觀。","你最近聽到哪句話特別順耳？它順著你重視的什麼？"],"5.13":["他是由形式與質料組成，兩者都不會化為不存在，也不是從不存在來的。所以他的每一部分都會變成宇宙的別的部分，如此永遠變化下去，他與生他的人才得以存在。","質料指構成身體的東西，形式指它被塑成的樣子。重點是：沒有東西從無而來，也沒有東西歸於無，所以死亡是轉化，不是消失。","想到自己是由會變化的東西組成，今天哪件事你比較放得下？"],"5.14":["理性和哲學這門推理的技藝，對自己及自己的作為就足夠了。它們從自己的第一原理出發，朝目標前進，所以這種行為叫「卡托爾托塞斯」，意思是走對了路。","「卡托爾托塞斯」是斯多噶的術語，指完全正確的行為。他在這裡強調理性自給自足，不必靠外在條件。方括號中的「哲學」是譯者補的。","有哪件事，你做對了即使沒人知道，也覺得夠了？"],"5.15":["不屬於人的東西，都不該稱為人的。它們不是人的要求，也不是人達成目的的手段。所以越能耐心忍受失去這些的人，反而越是更好的人。","這是用反證法：如果財富、健康真的是人的善，那放棄它們的人就不會是好人；可事實剛好相反。他的論證是要把外在的東西從「善」的名單上拿下來。","你最近因為失去什麼，覺得自己少了一塊？它真的屬於你嗎？"],"5.16":["靈魂被思想染色，習慣怎麼想，性格就會是什麼樣。所以要用好的思想去染它，比方：人在哪裡能活，就在哪裡能活得好，宮殿裡也一樣。","「靈魂是被思想染色的」是他的重要比喻：反覆的念頭會長成性格。「宮殿」是指他自己的處境。後半說人是為群體而生、低等為高等而存在，是當時的層級觀，今天未必都同意。","你最近反覆想的一句話是什麼？它在把你染成什麼顏色？"],"5.17":["追求不可能的事是瘋狂，而壞人不做這類事是不可能的。意思是：要壞人不做壞事，就是在要求不可能。","原文很短，意思是推測：他在給自己降火，提醒自己別去期待壞人不壞。這和他的晨間練習同一路：先想到會遇到，遇到時就不會被激怒。","今天你對誰的期待，其實是在要求不可能？"],"5.18":["落在任何人身上的事，都是他天生承受得了的。同樣的事落在別人身上，他可能沒看出來，或硬撐著毫髮無傷。無知和自負竟比智慧更強，實在可恥。","他說的是你承受得了，不是事情不痛。他拿無知的人和自負的人做對比：連他們都撐得住，有智慧的人更沒理由說撐不住。","你說我受不了的時候，別人在同樣的事上撐住了嗎？"],"5.19":["事物本身碰不到靈魂，也進不了靈魂。只有靈魂自己轉動自己，依它認為該有的判斷，把眼前的事物作成那個樣子。","這是斯多噶最核心的主張：事情在外面，判斷在裡面，困擾來自判斷。所以他把力氣放在檢查判斷上，而不是改變事物。","今天讓你煩的那件事，是事情本身在煩你，還是你的判斷？"],"5.20":["人是離我最近的，我必須對人行善，也必須忍受他們。但如果有人阻礙我該做的事，他就成了無關緊要的事物，像太陽、風、野獸。阻礙可以被心智轉成助力。","他分兩層：待人要善意，但從阻礙的角度看，人和天氣一樣只擋得住行動，擋不住意向。這和卷四第一則火的想法是同一件事。","今天有人擋了你的路，你能不能把它當成練習耐心的材料？"],"5.21":["要敬重宇宙裡最好的東西，它運用並指引萬物。也要敬重你自己身上最好的東西，因為它和那一個是同類，運用你其他的一切，指引你的生命。","他說的「最好的東西」，在人身上就是理性（主宰之心）。他把人的理性和宇宙的理性看作同一類，所以敬重自己的理性，也是敬重宇宙。","在你身上，有沒有一個部分，是你最該好好對待的？"],"5.22":["不傷害國家的，也不會傷害公民。遇到任何傷害的樣子，就想：國家沒受傷，我也沒受傷。就算國家受傷，也別對傷害的人發怒，要告訴他錯在哪裡。","這裡的國家指你所屬的共同體，也可以是整個世界城邦。邏輯有點抽象：個人受的傷若沒傷到共同體，就不算真的傷害。他是在教自己，不是要人逆來順受。","最近讓你受傷的事，有沒有真的影響你在乎的人或事？"],"5.23":["要常想到事物消逝得多快：實體像不停流動的河，成因無窮，幾乎沒有一樣東西是靜止的。看看過去與未來那片深淵，為這些事自負或悲慘，實在愚蠢。","河的比喻，卷四也出現過。這裡用來減輕為事物受苦的重量：它們困擾你，也只是很短的一時。重點是尺度，不是要你不在乎。","現在讓你痛苦的事，一年後你會怎麼看它？"],"5.24":["宇宙的實體，你只分到極小一份；宇宙的時間，只分到短短一段；命運所定的一切，你只是其中多麼小的一部分。","他用空間、時間、因果三個尺度把自己縮小。縮小不是貶低自己，而是讓壓力變輕：你只負責你那一份，其他不是你的事。","把今天的難題放進我只占一小份，它還有那麼大嗎？"],"5.25":["別人對我不義嗎？讓他自己去看著辦。他有他的心境和行為；我現在有的，是自然要我有的；我現在做的，是我的本性要我做的。","他把責任分開：別人的不義是別人的事，我只負責自己的反應。這和第二十二則一脈相承，都在把注意力從別人的錯拉回自己能做的事。","這件別人的錯，你有沒有因為去管它，而沒做自己的事？"],"5.26":["讓靈魂裡領導的部分，不被肉身的快樂或痛苦擾動，把自己圈起來，把感受限制在各自的部位。感覺傳上來時不必抵抗，只是別再加一個「它是好的」或「它是壞的」的意見。","他不是要你感覺不到，他明說不可以努力抵抗，因為那是自然的。他要守住的是下判斷的那一步：身體的感覺是一回事，加上去的評價是另一回事。","下次身體不舒服時，你能只覺得痛，不再加一句糟了嗎？"],"5.27":["與眾神一起生活：時時表明你滿足於分派給你的，做著內在神靈要你做的事，你就是與眾神同住。這位神靈就是每個人的理解與理性。","內在的神靈這裡被說成宙斯給每個人的守護者與引導者，也就是自己的理解與理性。意思是不必另外找神，自己的理性就是那個部分。","今天有一刻，你是照理性做事，而不是照情緒嗎？"],"5.28":["對腋下發臭、口臭的人生氣有什麼用？他本來就這樣。他若有理性，你也有，就用你的去喚起他的，指出他的錯，勸他。他肯聽，你就治好了他，不必發怒。","句尾〔不要像悲劇演員，也不要像娼妓。〕被括在〔 〕裡，表示原文此處有缺或可疑，意思只能推測；「娼妓」一詞也帶有那個時代的偏見。他的邏輯：發怒沒幫助，勸告才可能有效。","你上次對人發脾氣前，有沒有試過直接好好說？"],"5.29":["你打算離開之後怎麼生活，現在就有能力那樣生活。如果人們不容許，就離開，像屋裡有煙我就出去。只要沒被趕出去，我就留下，做合乎本性的事。","這一則開頭有「……」，原文有缺，前半意思只能推測。「屋裡有煙，我就出去」是說：人若被逼得無法照本性生活，離開是可以的，但在這之前，他選擇留下並做該做的事。","你說換個環境我就會好好做的事，今天能先做一點嗎？"],"5.30":["宇宙的智性是合群的，所以它為了高等的事物造出低等的，並讓高等的彼此契合。它讓事物各有從屬、各有並列，給每樣東西應得的份。","這是他的世界觀：宇宙有秩序、有層級，人是其中合群的一員。低等為高等是當時的說法，今天不一定同意。重點是：每個東西都有它被分派的位置。","在你參與的團體裡，你現在負責的那一份是什麼？"],"5.31":["他回頭檢查：對眾神、父母、兄弟、子女、老師、朋友、僕人，我是怎麼對待的？能不能讓人說我「從未在行為或言語上冤枉過任何人」？","這是一份對自己一生的盤點，從眾神列到奴僕，後面提到他經歷、承受、拒絕過的事，看得出他覺得生命已接近完整。「奴僕」的說法反映了那個時代的社會結構。","如果要用一句話評你過去一年對身邊人的態度，你會寫什麼？"],"5.32":["沒有技藝、沒有知識的靈魂，為什麼要來擾亂有知識的人？有知識的靈魂，是知道起點與終點，知道貫穿一切的理性，也知道它如何依週期治理宇宙的靈魂。","他在提醒自己：別被不懂的人擾亂，真正的智慧是看見整體。這一則像是在反問自己，語氣略帶責備。文中方括號是譯者補的說明。","最近有誰的話讓你亂了方寸？他真的懂你正在做的事嗎？"],"5.33":["很快你就成了灰燼或骸骨，名字只是聲音和回響。生命裡被高度重視的東西都空洞瑣碎。所以平靜地等終點，這期間只做：敬神、行善、忍耐、克制。","他引赫西奧德《工作與時日》第一百九十七行的詩：忠實、謙遜、公正與真理已經離開大地。赫西奧德是希臘早期的詩人。小狗撕咬、小孩吵架，是他對人間紛爭的看法。","今天你重視的事裡，哪一件其實像小孩吵架？"],"5.34":["只要走在正確的路上，用正確的方式思想、行動，一生就能在平穩流動的幸福中度過。理性存在者共有兩件事：不被別人阻礙，以及把善放在公正的心境和實踐上。","他說的「不被別人阻礙」是內在的自由：你的判斷沒人能替你下。文中的「上帝」是譯者的譯法，指神明，不是特定宗教的神。這一則在說：幸福的條件在自己手上。","今天有一刻你覺得被阻礙，那是外面的阻礙，還是內心的？"],"5.35":["如果這不是我自己的壞，也不是我自己的壞造成的結果，共同的福祉也沒有受損，我為什麼要為它煩惱？","這是兩道檢查：有沒有傷到我的品格？有沒有傷到共同的福祉？兩個都沒有，就不是真的傷害。這是斯多噶用來過濾煩惱的篩子。","最近讓你煩的事，有沒有傷到你的品格，或傷到大家？"],"5.36":["別被事物的外觀帶著走，依你的能力給人幫助。別人在無關緊要的事上受損失，別當成傷害；像老人向養子討回陀螺，要記得那只是個陀螺。","後半有一段對話：有人說我曾經幸運，但我失去了，他答：好運是靈魂良好的心境與行為，不是外在的東西。陀螺的故事，文中沒有交代出處，意思是小東西對孩子很重要，但你要記得它只是陀螺。","今天有哪個「陀螺」，是你正在替它難過或煩惱的？"],"6.1":["統治宇宙的理性沒有理由做壞事：它沒有惡意，也不傷害任何東西。萬物都是照這個理性造出來、完成的，所以整體並不針對誰。","斯多噶學派相信宇宙由一個理性在安排，而這個理性是善的。奧理略先把這個前提立好，後面許多則要你接受發生的事，都是從這裡出發。","最近有一件讓你覺得老天跟你過不去的事，換成它沒有針對你，感覺會不一樣嗎？"],"6.2":["只要你在做該做的事，天冷天熱、睏了還是睡飽、被罵還是被誇，甚至正在死去，都不改變這件事的價值。死也是生命裡要完成的一件事，手上的事做好就夠了。","他把「本分」放在感受之上：身體舒不舒服、別人怎麼說，都是外在條件。連死亡也算一個行為，這是斯多噶看待生死的一貫方式。","今天有哪件該做的事，你是在等心情或天氣好一點才肯動手？"],"6.3":["往自己裡面看。別讓任何東西獨有的性質、它真正的價值，從你眼前滑過去而沒被看見，要看得清楚。","這一則只有兩句，意思要靠推敲。大致是提醒自己：看事情要看它本身是什麼、值多少，別被外表帶走。這和後面幾則把事物剝開來看的練習相通。","今天有哪一樣東西，你其實沒有認真看過它真正的樣子？"],"6.4":["現在存在的一切很快都會變。要嘛全部化成同一種蒸氣般的東西，要嘛被打散成零件，不論哪一種，都不會維持原樣。","「如果一切實體確實為一」是他留的括號：當時斯多噶學派和伊比鳩魯學派對宇宙是一整體還是原子，看法不同。他兩種都先接受，因為結論一樣：一切會變，不必抓緊。","你現在最想抓緊不放的東西，十年後還會是原樣嗎？"],"6.5":["主宰之心清楚三件事：自己此刻是什麼心境，自己正在做什麼，還有手上處理的是什麼材料。這是他對自己做的一個簡單檢查。","這像一張自我檢查的清單。他常提醒自己，能掌握的只有自己的判斷與行動，所以先確認自己此刻的狀態，比急著處理外面的事更根本。","此刻你的心境是什麼？你手上正在做的事，材料又是什麼？"],"6.6":["最好的報復，就是不要變得和那個傷害你的人一樣。你若也用他的方式回應，就等於讓他的壞影響了你。","斯多噶認為，作惡的人先傷到的是自己的品格。所以不照著學，才是真正不輸。原文此處有殘缺，譯文用括號補了「那個作惡的人」，意思大致明確。","最近誰讓你很不舒服？你有沒有不知不覺學起他的語氣或做法？"],"6.7":["只要在一件事上找快樂就好：從一個對人有益的行為，接著做下一個，過程裡心中想著上帝。","他說的快樂不來自享受或成就，而來自連續做合乎「合群」的事。斯多噶認為人天生為了彼此而存在，把日子過成一串這樣的行動，就已足夠。","今天你能做哪一件對別人有幫助的小事？做完以後再接下一件。"],"6.8":["主宰之心能喚醒自己、推動自己，把自己造成想要的樣子，也能讓發生的一切，在它看來都成了它願意的樣子。","重點在最後一句：事情本身改不了，但心怎麼看它，是心自己的事。這是斯多噶把接受說成一種主動的選擇，而不是無可奈何地認命。","今天有一件改不了的事，你能試著把它看成你願意的嗎？"],"6.9":["每件事都是依宇宙的本性完成的，因為不可能依別的本性。不論是包住它的、被它包住的，還是在它之外的，都一樣。","他在論證：沒有任何一個外面，可以讓事情脫離宇宙的安排。譯文括號裡的是同書其他則的互相參照，他想強調的是萬事都在同一個整體裡。","你覺得本來不該發生的事，是否其實也是這個整體的一部分？"],"6.10":["宇宙只有兩種可能：一團混亂，或有秩序、有天意。若是混亂，我何必煩惱，反正都會散掉；若有秩序，我就敬畏、安穩，信靠那位統治者。","這是他常用的二選一思考法：不確定哪個為真時，就看兩種情況下自己該怎麼做。結果是兩邊都不該焦慮，只是理由不同。","你現在的煩惱，在宇宙混亂和有安排這兩種假設下，各該怎麼對待？"],"6.11":["被環境逼得心亂時，要快點回到自己，別比被逼的時間更久地失去調和。回得越多次，就越能掌握那份和諧。","他不要求完全不被擾動，這不切實際。他要的是練習回到平靜的速度，就像練肌肉一樣，每練一次就更順手。","今天你被打亂以後，花了多久才回到平靜？能不能再快一點？"],"6.12":["他把宮廷比作繼母，把哲學比作母親。宮廷裡的事要應付，但要常回到哲學身邊休息；有了哲學，他才忍得住宮廷，也才不讓人覺得難相處。","他是皇帝，天天在宮廷政治裡。這一則說明，他寫下這些筆記就是在回到「母親」那裡。有趣的是他也提到哲學讓他自己「讓人能忍受」，是對自己脾氣的清醒。","你的「宮廷」是哪裡？你有一個可以回去喘口氣的「母親」嗎？"],"6.13":["看到美食美酒華服時，用最直白的話描述：這是魚的屍體，這是葡萄汁，這是貝類的血染過的羊毛。這樣看出它們真正是什麼。一生都要這樣，把被抬高的東西剝開來看。","這是他的「剝開」練習，用最樸素的描述拆掉虛飾。文末提到的克拉特斯與色諾克拉底，這裡沒有說明，詳情不清楚，只能看出是用來說明連受人敬重的人也經不起這樣看。","你最近很想買或很想得到的東西，若用最樸素的話描述，會怎麼說？"],"6.14":["人們讚嘆的東西有層次：多數人讚嘆石頭、樹木，稍高的讚嘆牛羊，有教養的讚嘆有技藝的靈魂。真正看重的人只看重理性、合群的靈魂，並與同類合作。","他把值得讚嘆的東西排成階梯，最低是無生命，最高是理性與合群。順帶一提，原文把「擁有許多奴隸」也當成可炫耀的資格，反映當時奴隸制度是常態。","你平常最佩服的人，佩服的是他的技藝、財富，還是待人處事的品格？"],"6.15":["一切都在匆匆來去，像一條沒有地方能停的河。把飛過的麻雀當寶貝去愛，是沒有意義的。人的一生也是這樣，像呼吸，吸進去又還回去。","這是赫拉克利特式的萬物流動想法，斯多噶也接受。他用麻雀和呼吸做比喻：不是說生命沒用，而是不要把會消失的東西當成能永遠抓住的。","你正想抓牢的東西裡，哪一樣其實本來就會過去？"],"6.16":["這些都不值得看重：像植物一樣活著、像動物一樣呼吸、被外觀牽動、像木偶被欲望拉著、靠吃喝維生，也包括掌聲。值得的是照自己適當的構造去行動、約束自己。","他的標準是讓東西適合它被造出來要做的工作，就像馴馬的人讓馬發揮馬的本分。人的本分是理性與合群，所以名聲與欲望都排在後面。","如果把名聲、掌聲拿掉，你今天做的事還有哪些是你仍願意做的？"],"6.17":["元素在上下四周運動，但德性的運動不一樣：它更神聖，走在幾乎看不見的路上，走得很快樂。","斯多噶把德性看成宇宙中最高貴的東西，不像物質運動那樣顯眼。這一則很短，是他提醒自己，真正重要的事常常是安靜的，不引人注意。","你最近做過哪件好事，是沒有人注意到的？"],"6.18":["很怪：和自己同時代的人不肯稱讚，卻很在意從沒見過的後世人怎麼看。這就像因為前人沒稱讚你而難過一樣。","他用一個荒謬的對比來戳破對後世名聲的渴望。他身為皇帝，也很清楚名聲這件事在自己身上有多強的誘惑。","你在意的那個評價，是來自會認識你的人，還是根本不認識你的人？"],"6.19":["自己做起來困難的事，不要就認定人類做不到。只要是人做得到、又合乎人的本性，就相信自己也做得到。","這是給自己打氣的方式：用人類整體做得到的事，來校正自己一時覺得難的感覺。難是你當下的感覺，不一定是事實。","有一件你覺得自己大概做不到的事，別人是不是已經做到了？"],"6.20":["在體育訓練場上被對手抓傷、撞傷，我們不生氣，也不懷疑他心術不正，只是平靜地避開。生活裡也這樣看那些像對手的人，多寬容些：避開、不猜疑、不憎恨，我們做得到。","他用運動場的規矩作比喻：粗魯是這種場合的常態，不必當成對你個人的惡意。重點是把「提防」和「恨」分開。","最近有人冒犯你，你能做到只避開他、而不恨他嗎？"],"6.21":["如果有人能證明我想錯或做錯，我會高興地改，因為我追求的是真理，真理從不傷人，傷人的是死守錯誤和無知。","這是他對自己的要求：願意被糾正。他身為皇帝，旁人未必敢直說，所以更需要先在心裡定下這個態度。","上一次有人指出你錯了，你是接受還是先辯解？"],"6.22":["我做我的本分，其他事不讓我煩惱，因為它們只是沒生命的、沒理性的，或是迷了路不認識路的。","他把世上的事分成三類來降低它們對自己的影響：物、動物，和不明白的人。最後一類是斯多噶的看法：人作惡是因為不懂，不是故意。","現在讓你煩的事，屬於這三類的哪一類？"],"6.23":["對動物和事物，因為你有理性，就大方、寬厚地運用；對人，因為他們有理性，就用合群的態度。任何場合都可以向眾神祈求，也不必擔心能做多久，三個小時也夠了。","他把人和萬物的相處方式分開講：對物慷慨，對人合群。最後一句是給自己減壓：不必想著一輩子，這一刻做到就算數。","今天你對身邊的人和物，有沒有哪一邊比較不寬厚？"],"6.24":["亞歷山大大帝和他的馬夫，死後落到同樣的地步：要嘛被宇宙的種子原理收回去，要嘛被分散成原子。","「馬其頓的亞歷山大」是眾所周知的征服者。他拿最有名的人和最普通的人並列，是要說明死亡面前身分無差別，這也是他常用來壓下野心的方法。","你在乎的那個頭銜或地位，在死後還有差別嗎？"],"6.25":["想想同一小段時間裡，我們每個人身上同時發生多少事，身體的、靈魂的。這樣你就不會驚訝，宇宙這個又是一又是全的東西裡，同時發生更多事。","他用一個人身上的複雜，說明宇宙裡事情同時發生是正常的。這是在處理事情這麼多、這麼亂的困惑：多不代表亂，只是各自有各自的進行。","今天一天裡，你身上同時進行著哪些事，你能列出幾件嗎？"],"6.26":["有人問安東尼努斯這個名字怎麼寫，你會用力喊出每個字母，還是平靜地一個一個說？人生的責任也一樣，是由一些小步驟構成的，別被別人的怒氣帶動，繼續做擺在面前的事。","「安東尼努斯」是他自己的名字之一，也是他養父的名字，他拿來當例子。重點是把大任務拆成一個個小動作，面對別人發怒時不跟著起舞。","你現在面對的大事，下一個小步驟是什麼？"],"6.27":["不讓人去追求他們認為對自己有益的東西，很殘忍。你因為別人做錯事而煩惱，就等於在不讓他們這樣做。他們是因為以為有益才去做的，只是想錯了。那就教他們，不要發怒。","這是蘇格拉底傳下來、斯多噶接受的想法：沒有人故意作惡，作惡是因為誤把壞當作好。所以應對的方式是教導，而不是怒氣。","最近惹你的那個人，他是不是真心覺得自己那樣做是對的？"],"6.28":["死亡，就是印象停止、牽動欲望的線停止、思想推演停止，以及不再服侍肉身。他把死亡拆成一件件功能的停下來。","這樣拆開，死亡看起來就是自然過程，沒有什麼神祕可怕之處，也是斯多噶面對死亡的典型方式。括號指向第二卷談同一主題的一則。","你最怕的是死亡本身，還是它停掉的某一件具體的事？"],"6.29":["在這一生裡，身體還撐得住，靈魂卻先認輸了，這是可恥的。意思是心不該比身體先放棄。","他常年在前線，身體的辛苦是日常。這一則是對自己的提醒：意志的放棄，不該比體力的耗盡更早。原文很短，意思不難懂。","今天你是不是在身體還撐得住的時候，心裡就先喊累了？"],"6.30":["小心別被造成一個凱撒，別被這種顏色染上。要保持單純、善良、嚴肅，做正義的朋友，一直做哲學希望你成為的樣子。接著他列出養父的種種品格當作榜樣。","這是在提醒自己：權力會把人染色。他的養父是前任皇帝安東尼努斯，他在這裡逐項回想養父的品格。第一卷第十六則也有類似的回憶。","你身邊有沒有一個人，你想在待人處事上學他的某一點？是哪一點？"],"6.31":["回到清醒的神智，把自己叫回來。從夢中醒來發現困擾你的只是夢，現在也用同樣的眼光看周圍的事物。","他把煩惱比成夢，不是說事情不存在，而是說它們造成的驚慌，在清醒的判斷下會縮小。文中的［ ］是譯者補上的指稱。","有一件事此刻讓你很焦慮，等醒來再看，它還有多大？"],"6.32":["我由小小的身體和靈魂組成。對身體來說，什麼都無關緊要，因為它感覺不出差別。對理解力來說，只有不是它自己活動做出來的事才無關緊要；自己做的都在能力之內，而且只有和現在相關的才算。","這一則較難，原文語意也有些繞。核心是：真正屬於你的只有此刻你自己的思考和行為，過去與未來的心思，對現在來說也不重要。","此刻你能真正決定的，只有哪一件事？"],"6.33":["腳做腳的事、手做手的事，勞動就不違反自然。人做人的事，勞動也不違反本性，既然不違反本性，就不算是惡。","他在處理勞苦是不是壞事這個疑問。答案是：只要符合自己的本性，辛苦就不是惡。人的本性是理性與合群，所以為他人效力的辛苦，不算違反自然。","今天你做的哪件辛苦事，其實是在做一個人該做的事？"],"6.34":["強盜、弒父的人、暴君，也享受過許多快樂。這一則只丟下一個事實，沒有再往下說他的結論。","沒有結論，意思只能推測：大概是說快樂不能證明一個人的行為是好的，所以快樂並不是判斷善惡的標準，這是斯多噶一貫的立場。","你有沒有曾因為這樣做很爽，就覺得自己做得對？"],"6.35":["手藝人會遷就不懂行的人，但自己手藝的原則一步不讓。建築師和醫生尊重自己的原則，竟勝過人尊重自己的理性（人與眾神共有的東西），不是很奇怪嗎？","他拿專業的堅持對比人對理性的鬆懈。理性是人最基本的專業，卻常常最先被讓步，這是他自省的一個例子。","你在工作上有堅持的原則，那在生活裡有沒有對應的原則？"],"6.36":["亞洲、歐洲只是宇宙的角落，整個大海是一滴水，整個現在是永恆中的一個點。連獅子的大口、毒物，也是美好事物的後續產物，不是另一種東西。","這是他把鏡頭拉遠的練習，把煩惱放到宇宙尺度上看。阿陀斯山是希臘北部的名山。後半段是說，看似可怕的東西也出於同一個根源。","把你現在的煩惱拉遠到一百年後，它還剩下多大？"],"6.37":["看過現在的事物，就看過一切，因為萬物同族、同一形式：從永恆以來發生的、以後會發生的，都是一樣的樣子。","這是他常見的看法：歷史是重複的，所以不必期待有什麼前所未見的事。這樣想有兩面：讓人對重複感到疲倦，也讓人少一點對未知的恐懼。","你覺得這次不一樣的那件事，真的前所未見嗎？"],"6.38":["常想宇宙中萬物是怎麼連結的、彼此什麼關係。萬物彼此纏繞，也彼此友善，一物接著一物，靠運動、共鳴和實體的統一。","斯多噶認為宇宙是一個活的整體，各部分互相感應。這是他反覆提醒自己不是孤立一個人的依據，也是合群這個想法的哲學基礎。","你今天做的一件事，會影響到哪些你平常沒想到的人？"],"6.39":["適應命運安置你的處境，愛命運把你放在身邊的那些人，而且要真誠地愛，不是做做樣子而已。","這是斯多噶所說的愛命運：你的處境不是偶然，所以不如接受，並把它化為對人的真心。他特別強調真誠，是說不能只是客氣。","身邊有哪個人，你一直在敷衍他，而不是真心待他？"],"6.40":["器具只要做它被造出來要做的事就是好的，即使製造者不在場。但自然維繫的事物，造它們的力量就在裡面，所以更該敬重。順著它生活，你身上一切就都合乎智性。","他用工具作比喻：工具需要外面的製造者，而自然的事物，這個力量本來就在自己裡面。順著它走，就是順著智性，宇宙也是這樣。","你今天的做法，是順著自己的本性，還是在勉強自己變成別的樣子？"],"6.41":["如果你把不在你能力之內的東西視為好或壞，一遇到壞事就會怪眾神、恨人。我們許多不義就是這樣來的。只把能力之內的事看作好壞，就沒理由怪神或對人敵視。","斯多噶的核心區分：外在事物（財富、名聲、健康）既非善也非惡，只有自己的選擇才是。一旦把外物當好壞，就會把責任推給別人。括號是譯者的補充。","你現在在怪誰？他影響的是你能控制的事，還是不能控制的事？"],"6.42":["我們都在為同一個目的工作，有的人自覺，有的人像睡著的人。連挑剔、反對的人也在合作，因為宇宙需要。所以你要想清楚，自己是哪一類工人，別成為那種可笑的角色。","赫拉克利特說睡著的人也是宇宙的工人，奧理略加上自己的想法：反對者也有用。克律西波斯是斯多噶的重要人物，他用的戲劇詩句典故，這裡沒有說明，具體是哪一句今天已不清楚。","在你的團體裡，你更像是自覺的合作者，還是只顧著挑剔的那一個？"],"6.43":["太陽會去做雨的工作嗎？阿斯克勒庇俄斯會去做大地的工作嗎？每一顆星呢？它們各不相同，卻為同一個目的一起工作。","這是上一則的延續：分工不同不代表衝突。阿斯克勒庇俄斯是希臘的醫藥之神，他在這裡代表一種專長。","你的角色跟別人不同，這是衝突，還是剛好互補？"],"6.44":["如果眾神對我有決定，那決定得很好；如果只對整體有決定，我就欣然接受；如果全無決定，我仍能自己判斷什麼有益。我是羅馬人，也是世界的人，對兩個城邦有益的才對我有益。","這是三種假設的論證，每一種都導向同一件事：該做的事沒變。他說的雙重身分是安東尼努斯與人，也是斯多噶所說的世界公民想法。","你的選擇對你所屬的圈子，也就是家人、公司或社區，有益嗎？"],"6.45":["每個人身上發生的事，都是為了整體的利益，這一點就夠了。進一步看，對一個人有益的，對別人也有益，不過這裡的「有益」要用一般的意思，用在既非善也非惡的事物上。","他在小心地使用「有益」這個詞：斯多噶嚴格地說只有德性是善，所以這裡提醒自己，說外在事物「有益」只是通俗的講法。","最近一件讓你吃虧的事，對別人是不是有好處？你願意這樣看嗎？"],"6.46":["在圓形競技場那類地方，不斷看到同樣東西，千篇一律就令人厭倦。整個生活也是，上面下面都一樣。他問：要到什麼時候呢？","他自己也有厭倦的時刻，這一則很誠實。結尾沒有答案，只是一個問句，是寫給自己的疲憊記錄，不必硬讀出結論。","你最近覺得又是這一套的事是什麼？你想怎麼處理這種厭倦？"],"6.47":["想想各種人、各個民族都已死去，包括偉大的演說家、哲學家、英雄、將領和暴君，連嘲笑人生短暫的人也一樣。這對他們沒有傷害，所以值得的是在真理與公正中生活，對說謊的人也懷著善意。","名單裡有赫拉克利特、畢達哥拉斯、蘇格拉底、歐多克索斯、喜帕恰斯、阿基米德、梅尼普斯等古代名人。菲利斯提翁、福玻斯、奧里加尼翁是誰，今天已不清楚。","你現在最在意的事，那些名人也都在意過，對他們還剩什麼？"],"6.48":["想讓自己快樂的時候，想想和你同住的人的德性：這個人的勤奮、那個人的謙遜、另一個人的慷慨。德性的榜樣最令人快樂，尤其是在身邊人的行為裡，所以要把它們擺在眼前。","這是一個很具體的練習：不從自己找快樂，而從身邊人的優點找。他同時也在提醒自己，別只看他們的缺點。","你身邊最近的三個人，各有哪一項你欣賞的品質？"],"6.49":["你不會因為只有幾磅重、不是三百磅而不滿，那也別因為只能活那麼多年、而不是更多而不滿。對分給你的量，就要滿足。","他用體重做比喻：我們不會埋怨自己的重量有限，卻會埋怨壽命。兩者同樣是被分配的，抱怨並沒有意義。","你對自己的哪一個不夠，最不甘心：時間、體力，還是別的？"],"6.50":["先試著說服人，但若公正的原則指向那邊，就算違背他們的意願也要做。有人用武力擋路，就轉向知足平靜，把阻礙拿來練習另一種德性。你的嘗試是有保留的，並不想做不可能的事。","這是斯多噶的保留條款：做事時心裡加一句如果情況允許。這樣即使受阻，你也沒有失去什麼，因為你要的本來就是努力，而不是結果一定成。","你現在有件事想做，若做不成，你還能從中得到什麼？"],"6.51":["愛名聲的人，把別人的活動當作自己的善；愛快樂的人，把自己的感覺當作自己的善；有理解力的人，把自己的行為當作自己的善。","三種人，三個善的所在：別人的眼光、自己的感覺、自己的行為。只有最後一個是自己能掌握的，所以他選它。","你今天最看重的，是別人的反應、自己的感受，還是自己做了什麼？"],"6.52":["對一件事不抱意見、心不被擾動，是我們能做到的，因為事物本身沒有力量去形成我們的判斷。","斯多噶的基本招式：刺激是一回事，你加上去的看法是另一回事。判斷是你自己下的，所以也是你自己可以收回的。","今天有一件事，你可以試著只看事實、不加評價嗎？是哪一件？"],"6.53":["養成習慣，仔細聽別人說的話，並且盡可能走進說話者的心裡，去理解他真正想說的是什麼。","他在提醒自己，溝通要先聽懂。身為皇帝，他有許多聽人報告和申訴的場合，這對他是很實用的聽人原則，對一般人也一樣。","下次有人跟你說話，你能先不打斷，聽完他真正想說什麼嗎？"],"6.54":["對蜂群不好的，對蜜蜂也不好。意思是個體和所屬群體利害相連，不可能只顧自己而不顧整體。","這一則只有一句，是斯多噶合群概念的最簡版本：人和蜜蜂一樣，離開群體就不能好好生活，所以損害群體的事，最終也傷到自己。","你最近做的一件只對自己有利的事，對你所屬的群體有什麼影響？"],"6.55":["水手若辱罵舵手，病人若辱罵醫生，他們還會聽別人的嗎？那舵手怎麼保護船上的人，醫生怎麼讓病人健康？","他在說：人與人互相需要，互相攻擊就破壞了合作。這一則沒有明說他想到的是誰，只能看出是在談信任與合作的基礎。","你最近是不是在對一個本來能幫你的人發脾氣？"],"6.56":["和我一同來到世上的人，已經有多少離開了世界。這是一句不加評論的感嘆，提醒自己時間正在走。","這一則沒有結論，只是一個事實。意思大概是用身邊人的離去，提醒自己別把時間當成用不完的東西。","你的同學或同輩裡，有哪位很久沒聯絡了？今天能傳個訊息嗎？"],"6.57":["黃疸病人覺得蜂蜜苦，被瘋狗咬傷的人怕水，小孩覺得皮球是好東西。那我為什麼生氣？錯誤的看法，力量難道比病人的膽汁、瘋狗的毒更小嗎？","他把人的錯誤看法當成一種病況：有病的人看到的是病，不是事實。這樣想，就能對那個人少一些怒氣，多一些同情。","最近惹你的人，你能不能把他當成生病的人來看？"],"6.58":["沒有人能阻止你依自己本性的道理生活，也不會有違背宇宙本性之道理的事發生在你身上。","這是兩個保證：外人阻止不了你的內在方向；發生的事也都符合整體。斯多噶要說的是，你的處境不會真正違反你的本性。","目前有什麼是別人阻止不了你做的？"],"6.59":["人們想討好的是什麼人，為了什麼目的，靠什麼行為？時間多快就會把一切蓋住，而它已經蓋住了多少。","這一則是他對名聲和討好的反思：問清楚對象、目的、方式。最後用時間的遺忘作結，是他一貫的方法。","你想討好的那個人，他的看法真的值得你這樣付出嗎？"],"7.1":["所謂的惡，其實就是你一再看到的那些事。每次碰到事情，提醒自己：這我見過。古往今來的史書寫的都是這些，沒有什麼新鮮，也沒有什麼持久。","他在拆掉這次特別糟的錯覺。把眼前的事放進歷史裡看，就會發現它是重複的老戲，不必大驚小怪，這也是斯多噶常用的拉遠視角的練習。","你現在覺得史無前例的那件事，換個時代的人，是不是早就遇過了？"],"7.2":["我們信的道理不會自己死掉，只會因為相應的想法熄滅才死，而重新搧旺它們是你做得到的。要讓生活重新活起來，就像從前那樣，再看一次事物。","他說的道理，是前面一再提醒自己的那些原則。原則會變淡，通常不是被駁倒，而是沒有再想起。所以這本筆記的用處，就是一次次把火搧回來。","有哪一條你早就認同、卻最近沒再想起的原則？"],"7.3":["熱鬧的場面、牲畜、操練、狗搶骨頭、螞蟻搬運、木偶，全都是同一類事。身在其中，你要好脾氣，不擺驕傲的姿態，並記得一個人值多少，看他忙的事值多少。","他把人間的忙碌比成動物和玩具，口氣有點尖，但目的不是看輕人，而是提醒自己：被眼前的熱鬧吸住時，先問這件事到底值不值得這樣投入。","你這星期花最多力氣的那件事，值得嗎？"],"7.4":["別人說話，你要專心聽；做每件事前，先看清楚自己在做什麼，並弄明白它指向什麼目的，以及別人的話指的是什麼。","這是兩個很實際的提醒：聽人說話要聽懂，做事要知道目的。他每天要處理大量公務，這種注意力對皇帝來說是日常功課。","下一次聊天或開會，你能不能只專心聽，不先想自己要說什麼？"],"7.5":["我的理解力夠不夠做這件事？夠就用它，不夠就讓給更合適的人，除非另有理由，那就盡力做，再找人幫忙。不論怎麼做，目標只有一個：對社會有益。","他把自己的能力看成自然給的工具，不夠也不丟臉。重點是事情做成、對大家有益，而不是由誰來做。這對一個要管全局的皇帝，是很實際的態度。","手上有件事超出你的能力，你會找人幫忙，還是硬撐？"],"7.6":["有多少人名聲響亮，後來還是被遺忘；連替別人傳名的人，也早就死了。名聲要靠人傳，傳的人也不會長久。","名聲是這本筆記裡反覆出現的題目。這一則的力道在後半：連替人傳名的人自己都走了，所以靠別人記住來證明自己，是一條不穩的路。","你最近想得到的那個肯定，會被人記得多久？"],"7.7":["接受別人幫忙，不必不好意思。你的本分是像攻城的士兵那樣盡力；若自己爬不上城垛，有人拉一把就上得去，那就接受。","接著上一則讓給別人的想法，這一則講的是接受幫助。他是皇帝，要承認自己需要人不容易，所以這像是寫給自己的提醒。","最近有人想幫你，你是接受了，還是婉拒？"],"7.8":["別讓以後的事擾亂你。真要走到那一步，你用的還是現在處理眼前事的同一種理性，不會多出別的東西。","他在處理對未來的焦慮：以後你用來應付事情的能力，和現在這個沒有兩樣。所以把當下的事想好就夠了，不必提前害怕。","你現在擔心的那件還沒發生的事，到時候你打算用什麼辦法處理？"],"7.9":["萬物彼此交織，這份連結是神聖的。宇宙只有一個，神、實體、法則、理性、真理也都只有一個。最後一句語意不完整，意思只能推測。","他在列舉斯多噶的一：整個宇宙是互相連結的整體，所以人和人之間也有連結。譯文用〔 〕補了字，結尾那句最後那個如果的句子讀起來有缺，不能確定他要說什麼。","今天你注意到你和哪一個人之間，其實有連結？"],"7.10":["物質的東西，很快消失在整體的實體裡；形式的東西，也很快被收回宇宙的理性；所有事物的記憶，更快被時間淹沒。","斯多噶把事物分成物質和形式（成因）兩部分，兩部分最後都回到整體裡。他的重點在最後一句：連記憶也留不住，名聲就更談不上。〔 〕裡是譯者的補充。","你想被記住的事裡，有多少是別人真的會記得的？"],"7.11":["對有理性的生物來說，同一個行為，既合乎自然，也合乎理性。意思是人只要照理性行事，就是順著本性在走。","這是斯多噶的基本等式：自然就是理性。對人來說，合理的事就是自然的事，所以不必在順著本性和用理性之間選一個。這一則很短，意思不難。","你今天做的哪件事，是你認為合理、也讓你覺得自在的？"],"7.12":["要自己站直，不然就讓人扶直。意思是不要半倒不倒：能靠自己就靠自己，不行就接受別人的幫助。","這一則很短，意思要靠推測，大概呼應前面接受幫助的那一則。在斯多噶的想法裡，自立和受助並不衝突，只是不能一直軟下去。","你現在算是站得直，還是需要有人拉一把？"],"7.13":["他用兩個希臘字的差別說：把自己當成整體的一個「肢體」，才會真心愛人；只當成一個「部分」，做好事就只是出於禮數。","兩個字是 melos（肢體）和 meros（部分），只差一個字母 r。肢體是有機的，和全身相連；部分只是被分出來的一塊。這個文字遊戲，中文讀者要看譯者的括號才懂。","你做的善事，是出於我是這群人的一份子，還是只是禮貌？"],"7.14":["外在的事要落下來，就讓它落在能感覺到的部分，願意抱怨就讓它抱怨。我只要不認為發生的事是壞事，就沒有受傷，而不這樣想是我做得到的。","他把人分成會痛的身體，和下判斷的心。身體的痛是事實，但說這是壞事的是心。斯多噶的關鍵就在把這兩件分開。","最近一件讓你受傷的事，是事情本身，還是你對它的判斷？"],"7.15":["不管別人做什麼、說什麼，我都得做個好人，就像黃金、翡翠、紫袍一直在說：我要保住我的本色。","他用寶石作比喻：寶石的價值不受旁人的評價影響。這是把品格當成自己內在的東西，不隨環境改變。紫袍是皇室的象徵，他也許是在對自己說。","今天別人的言行，有沒有讓你偏離了本來的樣子？"],"7.16":["主宰之心不會自己擾亂自己。別人若有辦法讓它害怕或痛苦就讓他們試，但它不會憑自己的意見走上那條路。身體痛了就讓它說，靈魂不必跟著痛。","他再次劃線：身體可以痛、可以說，心靈卻不必附和。主宰之心本身什麼都不缺，除非自己造出一種缺。這是斯多噶最倚重的內在堡壘。","有件事讓你不安，是它真的在傷你，還是你讓自己害怕了？"],"7.17":["他對幸福說：你是照著老習慣來的，我不需要你，請你走開。意思似乎是不要被熟悉的念頭或情緒反覆帶走。","這一則有點難懂，原文的文字遊戲在中文裡不太顯。希臘文的幸福（eudaimonia）字面是好的神靈（daimon），他像是在對一個老習慣般的念頭說話。意思只能推測。","有一個老是來找你的念頭，你能不能直接請它走開？"],"7.18":["有人怕改變，可是沒有改變，什麼事能發生？木柴不變，洗不成熱水澡；食物不變，吃了沒有養分。你自己要改變，對整體也同樣必要。","他用生活小事證明：改變是一切有益事物的前提。接著把這道理用在自己身上，意思是連你的老去與死亡，也是整體需要的一部分。","你現在抗拒的那個改變，換個角度看，有沒有帶來什麼好處？"],"7.19":["萬物被宇宙的實體像急流一樣帶走。克律西波斯、蘇格拉底、愛比克泰德這樣的人，也都被時間吞沒了。對每個人、每件事，你都要這樣想。","三個人都是哲學的代表：克律西波斯是斯多噶學派的重要人物，蘇格拉底是哲學的典範，愛比克泰德是他最敬重的哲學家之一。連他們也被吞沒，名聲就更不可靠。","你最佩服的人，一百年後還有人記得他的名字嗎？"],"7.20":["我只擔心一件事：怕我做出人的構造不允許的事，或用不允許的方式去做，或在不允許的時候去做。其餘都不是擔心的事。","他把擔憂縮到只剩一個：自己是否做了不合人性的事。這是斯多噶的收斂法，把一堆憂慮換成一個自己能負責的問題。","你今天有沒有一件事，明知不合你的本性，卻打算去做？"],"7.21":["很快你就會忘掉一切，很快一切也會忘掉你。意思是你不會一直記得這些，這些也不會一直記得你。","這是他最簡潔的無常提醒，兩個很快對稱。它的作用不是讓人悲觀，而是讓人把眼前的爭執放輕一點。","今天讓你很在意的那件事，一年後你還記得嗎？"],"7.22":["連對做錯事的人也懷著愛，是人才有的能力。你可以這樣想：他們是同類，是出於無知；不久你們都會死；他沒有讓你的主宰之心變壞，所以沒有傷到你。","這一則列了好幾個理由，最重要的是最後一個：別人做錯，傷不到你真正的部分。這是斯多噶區分外在與內在的實際用法。","最近冒犯你的人，這幾個理由裡哪一個最能幫你放下？"],"7.23":["宇宙的自然像取蠟一樣，這會兒捏成馬，拆掉再做成樹、做成人。每樣都只存在很短的時間。容器被拆開不是苦事，就像它被拼起來也不是苦事。","蠟的比喻讓他把個體的生滅看成同一種材料的重新塑形。拼起與拆開同樣自然，所以死亡不必比出生更令人難過。","有哪件結束的事，其實只是變成了別的樣子？"],"7.24":["怒容完全違反自然。常擺出這種臉色，端莊的神情會一點點消失，最後再也點不亮。從這點可以推想，生氣是違反理性的。","他從臉色看憤怒：常生氣會把自然的神情磨掉。最後一句推論有點跳，大意是怒氣久了，連知道自己做錯的感覺也會失去，原文簡短，意思有些推測。","你這幾天有沒有常常皺著眉頭？是為了什麼？"],"7.25":["統治整體的自然，很快就會改變你看到的一切，用它們的實體造出別的東西，讓世界永遠常新。","這是前面變化主題的延伸：變化不是損失，而是世界保持新鮮的方式。他把一直在壞掉、換掉的東西，看成世界的更新。","你身邊正在被更新換掉的東西，有哪些是你可以歡迎的？"],"7.26":["有人對你做錯事，立刻想：他是依著什麼對善惡的意見做的。看清這一點，你就會可憐他，不驚訝也不生氣，因為你自己也可能把同樣的東西當成善。","他用同理拆掉怒氣：別人的錯從他的判斷而來，而你也有同樣的判斷弱點。最後補一句：若你不把這些東西看成善惡，更容易對犯錯的人懷著善意。","那個讓你生氣的人，他心裡認為什麼才是好的？"],"7.27":["別老想你沒有的，多想你已有的，從中挑出最好的，想想若沒有它們你會多急著去找。但也別因為太喜歡而高估它們，失去時就心神不寧。","這是兩面的提醒：感恩可以平衡匱乏感，但別走到另一頭，把擁有的東西看得太重，那就成了新的依賴。","你現在擁有的東西裡，哪一樣是你曾經很想要的？"],"7.28":["退回你自己裡面。掌管一切的理性原則，本性就是這樣：做正義的事時，它就滿足於自己，因此得到安寧。","他不是叫人逃避，而是說安定可以回到做對的事上去找：安寧不來自外面的稱讚，而來自自己做了正義的事。","今天有哪件事，你做完以後心裡是踏實的？"],"7.29":["他列出一串短指令：抹掉想像、別再讓線牽著走、把自己限在當下、把事物看清楚、拆成成因和質料、想最後一刻、別人的錯留在原處。","這一則像一張便條，每一句都是前面出現過的練習。最後一句尤其實用：別人犯的錯，留在錯發生的地方，不要帶回自己心裡。","這幾句裡，今天哪一句你最用得上？"],"7.30":["注意力放在別人說的話上。讓你的理解力走進正在發生的事，也走進造成這些事的那些力量，不只停在表面。","這一則是第四則的延伸：不只聽人說話，也要看事情的來龍去脈。意思是既看見表面，也看見背後的原因，才算真的理解。","眼前的一件事，造成它的原因是什麼？"],"7.31":["用純樸和謙遜裝飾自己，對德性與惡行之間的事保持平常心。愛人類，跟隨神。詩人說法則統御一切，記得這一點就夠了。","他把一生的要點濃縮成一串短句。「詩人說」引的是哪位詩人、哪一句詩，今天已不清楚。無關緊要的事，指的是既不算德性也不算惡行的外在事物。","今天遇到的那些無關緊要的事，你能不能不為它們費力？"],"7.32":["說到死亡：不論是離散、分解成原子，還是歸於虛無，要嘛是消滅，要嘛是轉變。不管哪一種，都不是需要害怕的事。","他又用二選一的方式處理死亡。當時各學派對死後怎樣的看法不同，他不選邊，只說兩種可能都不可怕。","對死亡，你最想弄清楚的一個問題是什麼？"],"7.33":["說到痛苦：受不了的痛苦會把我們帶走，拖得久的就受得了。心退回自己裡面，就保住自己的安寧，主宰之心也不會變壞。","他把痛苦分成兩種：太劇烈的很快就結束，長期的就能習慣。重點是心可以不被痛苦帶壞。他不否認身體會痛，所以最後讓受傷的部分自己說。","你最近的疲累或不舒服，哪一部分是身體的，哪一部分是心加上去的？"],"7.34":["說到名聲：看看那些追求名聲的人，他們是什麼樣的人，躲什麼、追什麼。再想想沙子一層層疊上去，把先前的蓋住，人生也一樣。","他叫你先檢視那些人，再看他們給的評價值多少。沙堆的比喻說明後來的事不斷蓋過先前的。譯文用〔 〕補了那些追求名聲的人，原文省略之處只能推測。","你想要的那份肯定，是來自你真正尊敬的人嗎？"],"7.35":["這是柏拉圖的一段對話：心胸高遠、能縱觀所有時間與實體的人，不會把人生看成什麼了不起的事，所以也不會把死亡當成壞事。","這是他的摘抄，出自柏拉圖，可能是《理想國》，但不能確定。對話用一問一答把結論推出來：看得遠的人，不會怕死。","如果把時間拉長到一百年，今天哪件事會變得很小？"],"7.36":["這是從安提斯泰尼那裡抄來的話：做了好事，卻被人毀謗，這是王者的命。他把這種遭遇看成理所當然。","安提斯泰尼是蘇格拉底的追隨者，一般與犬儒學派連在一起。意思是好人被誤解是常有的事，像君王一樣只能承擔，不必抱怨。","你做了好事卻被誤解過嗎？當時你是怎麼回應的？"],"7.37":["臉可以順從心的指令，調整、安定自己；心卻不能自己調整、安定自己，這是可恥的。意思是心比臉更該聽自己的。","他用臉對比心：臉能裝出平靜，心卻不能真的平靜，這比表情失控更該羞愧。意思是在內在下功夫，比在外表裝樣子重要。","你的臉看起來鎮定時，心裡真的也安定了嗎？"],"7.38":["我們不該為事物煩惱，因為它們根本不在乎。這是一句抄來的詩，意思是為事物煩惱是白費力氣。","從這一則到第四十三則是他抄下的詩句，其中多半像是悲劇台詞。這一句的出處不確定。事物沒有感情，你的煩惱也改變不了它們。","你最近為哪一樣東西白白煩惱？它知道嗎？"],"7.39":["願不朽的眾神，與我們一同歡喜。這是一句抄來的詩，意思是希望好事由人和神一起分享。","這一行是他的摘抄，出處不確定。單獨一句，上下文不完整，意思只能推測，大概是在一批詩句裡挑出來的。","你今天有什麼值得高興的事？想跟誰分享？"],"7.40":["生命必須像熟了的穗子一樣收割，一個人出生，另一個人死去。這是抄來的詩，說生死是自然的循環。","這兩行是他的摘抄，出處不確定。穗子熟了就收割，是他常用的比喻：死亡是自然的成熟，而不是意外。","你會用什麼比喻，來看待自己的老去？"],"7.41":["如果眾神不關心我和我的孩子，那也必定有它的道理。這是一句抄來的悲劇詩句，意思是即使得不到神的照顧，也要相信事出有因。","這是詩句摘抄，出處不確定。語氣是對神的信任，哪怕自己不被照顧。這一則沒有說他是想到了誰，所以不要往他的家事上推。","你有沒有曾在一件自己沒被照顧到的事裡，後來才看出道理？"],"7.42":["因為善與我同在，公義也與我同在。這是抄來的一行詩，意思是只要我站在善與公義這一邊，就不孤單。","這是他的摘抄，出處不確定。和前一則連著看：即使神不照顧，我仍有善與公義可以倚靠，這是斯多噶很重要的內在倚靠。","覺得孤立無援時，你手上還有什麼是不會被拿走的？"],"7.43":["不跟著別人一起哀號，也不起激烈的情緒。這是一句抄來的詩，意思是在別人悲嘆時，自己保持穩定。","這兩行同樣是他的摘抄，出處不確定。這接近斯多噶的理想：能體諒別人，但不被別人的情緒捲走。","別人在抱怨的時候，你能不能不跟著加碼？"],"7.44":["他抄下柏拉圖的一段：有點用處的人，不該盤算生死的風險，只該看自己做的是正義還是不義，是好人還是壞人的作為。","這一段是柏拉圖寫蘇格拉底的話，可能是他在法庭上的申辯，是他的摘抄。蘇格拉底是斯多噶學派很敬重的典範，因為他面對死亡也不改原則。","遇到難的決定，你先問的是安不安全，還是對不對？"],"7.45":["一個人把自己安置在某處，認為那是最好的位置，或被長官安置在那裡，就該留在那裡承擔危險，不拿死亡或別的事，放在恥辱之前計較。","仍是柏拉圖記載的蘇格拉底之言，用軍人守崗位的比喻：做人也有崗位，不能因為怕死就丟下它。〔 〕裡的「拋棄崗位的」是譯者補上的，原文省略處只能推測。","你現在有一個不想放棄的崗位嗎？是什麼？"],"7.46":["高貴與善，和保全性命是兩回事。一個人活多久，不必過於放在心上，也不該貪戀生命。這些交給神，接下來要想的是怎樣把剩下的時間過得最好。","這一則仍是摘抄，語氣屬蘇格拉底一路。文中說「女人們常說的」，是把命運的說法歸給女人的口吻，帶有那個年代對女性的偏見。","如果剩下的日子有限，你今天最想怎麼過？"],"7.47":["環顧群星的運行，好像你和它們一起走；也常想元素怎樣彼此轉化。這樣的想法能洗掉塵世生活的汙垢。","這是他另一種拉遠的練習：把視線從日常瑣事抬到星空。星星不吵架，元素只是轉化，他用這個辦法清掉心裡的雜質。","今晚你能不能花一分鐘，看看天空？"],"7.48":["柏拉圖有句好話：談論人類時，也該像從高處往下看地上的事物：集會、軍隊、農事、婚姻、出生、死亡，一切混雜，卻又讓對立的事物井然結合。","這一則是他的摘抄，並稱讚了這句話。重點是俯視：從高處看人間的熱鬧，就能看見秩序，而不只看到混亂。","把你一天的行程從高處看一遍，哪一部分顯得很小？"],"7.49":["想想過去那些政權的大變動，你就能預見將來。將來一定是同樣的形式，所以看人生四十年，和看一萬年是一樣的。","他的意思是歷史有重複的形式，所以不必活很久才看得懂。這是重複觀的延伸：看過一段，就看過全部。","從自己過去的經歷，你是不是已經能預見自己下一次會怎麼反應？"],"7.50":["從大地生出的，歸於大地；從天上的種子生出的，回到天上。這或是原子的解散，或是無知覺的元素散開。","前三行是抄來的詩，出處不確定。最後一句像是他自己補的解釋，列出兩種可能：不論原子還是元素，都是自然的分解。","你對自己最後回到哪裡，有什麼想法？不必有答案。"],"7.51":["這幾行詩說：用飲食和魔法想改變水道、逃過死亡，沒有用；天上送來的風，我們必須忍受，不抱怨地勞作。","這是詩的摘抄，出處不確定。意思是人想用手段躲開死亡，但那是徒勞，唯一的辦法是接受，繼續做自己的事。","有沒有一件事，你試了很多辦法，其實該學著接受？"],"7.52":["另一個人也許更會把對手摔倒，但他不比你更合群、更謙遜、更能面對發生的事、更體諒鄰人的過失。","他在比較兩種強：技能上的強，和品格上的強。技能可以輸給別人，品格才是真正的優勢。這大概是提醒自己，別為輸給別人的技藝難過。","你最近覺得比不上別人的那一點，是技能還是品格？"],"7.53":["凡是能依著諸神與人類共有的理性完成的工作，我們沒什麼好怕的。只要靠順利、合乎本性的活動得到益處，就不必懷疑那裡會有傷害。","理性是人和神共有的，所以順著理性做事，就等於站在宇宙這一邊。他的推論是：做合乎本性的事，不會真正傷到自己。","現在有件讓你有點怕的事，它合不合乎你的理性？"],"7.54":["無論何處何時，你都做得到：虔敬地安於眼前的處境，公正地對待身邊的人，並在當下的想法上下功夫，讓念頭沒經檢查就不能溜進來。","這是三件事的清單：接受處境、公正待人、檢查念頭。他強調無論何時何地都做得到，意思是不必等環境變好再開始。","今天有哪一個念頭，你沒檢查就接受了？"],"7.55":["別四處打探別人的主宰之心，要看自然帶你去哪裡：宇宙的自然透過發生的事，你的本性透過你該做的事。人的構造第一是合群，第二是不向身體低頭，第三是不犯錯、不受騙。","這一則提出人的本性的三個原則，是斯多噶對人是什麼的簡明說明。其中說低的為高的而造，反映他們把世界看成有高低秩序的看法。","合群、不被身體牽著走、不被騙，這三件裡你今天最缺哪一件？"],"7.56":["把自己當成已經死了，已經活完了到此刻為止的生命；然後照著本性，過被允許的剩下的日子。","這是他的提前結算練習：把過去收起來，剩下的都是額外多出來的。這讓人用比較輕、比較清楚的方式面對今天。","如果今天算是你多出來的一天，你想怎麼用？"],"7.57":["只愛發生在你身上的事，只愛你命運之線紡出來的事。因為還有什麼，比這更適合你？他把接受推到愛的程度。","命運之線是古希臘人的比喻，命運像線被紡出來。他的意思是你的處境像是為你量身安排的，所以愛它是最合理的選擇。","發生在你身上的哪一件事，你還沒有真的接受過它？"],"7.58":["每件事發生時，想想那些碰過同樣事情的人：他們怎樣煩惱、挑剔，而現在他們在哪裡？哪裡都找不到。那你為什麼也這樣？這一則結尾有缺。","他用前人的下場提醒自己：煩惱沒有留下痕跡。原文最後「還要記住……」之後沒有寫下去，所以他原本想補的是什麼，無法確定。","上一次你為某件事煩惱，現在回頭看，它結果怎麼了？"],"7.59":["向內看。裡面有善的泉源，只要你肯不斷往下挖，它就不斷湧出來。善不必向外面去求，在你自己裡面。","這是這本書最常被引用的句子之一。泉水的比喻是說：善不必從外面找，本來就在裡面，需要的只是持續挖掘的努力，不是天賦。","今天你願意為內在的善，再往下挖多深一點？"],"7.60":["身體要端整，動作和姿態不要雜亂。心靈保持智慧與得體，會表現在臉上，對整個身體也該要求同樣的樣子。但這一切都不要裝腔作勢。","他把內在的整齊和外在的整齊連起來，但立刻加一句不要裝腔。意思是外表應該是自然流露，不是做給別人看。","你今天的坐姿和表情，是自然的，還是緊繃的？"],"7.61":["生活的藝術比較像摔角手的功夫，不像舞者的：它要隨時站穩，準備迎接突然、意料之外的攻擊。","舞者練的是照編好的步子走，摔角手要應付對方突然的動作。他的意思是人生不是照劇本演，所以要練的是應變，不是背譜。","最近有什麼突發狀況打亂了你？你當時像舞者，還是像摔角手？"],"7.62":["時常看看那些你想得到他們讚許的人是誰，有什麼樣的主宰之心。看看他們的意見與欲望從哪裡來，你就不會責怪無心冒犯你的人，也不會再渴望他們的讚許。","這是他處理渴望被認同的方法：先檢查那些人的內在。看清他們判斷的來源，就沒那麼值得追求，也沒那麼值得生氣。","你最想得到誰的讚許？你真的了解他怎麼想嗎？"],"7.63":["那位哲學家說，每個靈魂都是不由自主地失去真理，也不由自主地失去正義、節制、仁慈。時常記住這一點，你對所有人都會更溫和。","那位哲學家是誰，譯文沒寫明。這個想法一般連到蘇格拉底傳下來的看法：人不是有意作惡，而是不知道。這一點我只有大致把握。","下次有人讓你不舒服，你能把他當成不知道，而不是故意嗎？"],"7.64":["每種痛苦來時，提醒自己：痛苦中沒有恥辱，也不會讓主宰之心變壞。大多數痛苦，記得它有限度，也別在想像裡替它加料。許多不舒服其實也是痛苦的一種。","他借了伊比鳩魯的一句話：痛苦不是不能忍受，也不會沒完沒了。伊比鳩魯和斯多噶不同派，但他覺得這句話有用就拿來用，不分門戶。","你目前的不舒服，有沒有被你的想像放大了？"],"7.65":["小心，別對那些不講人性的人，懷著他們對待人的那種心態。意思是不要因為對方沒人性，自己也變得沒人性。","這和第六卷第六則最好的報復是不要變得像對方，是同一個想法。他在處理被不講人性的人傷害之後，怎麼避免被同化。這一則很短，意思不難。","最近被人無禮對待後，你有沒有也用同樣的方式回他？"],"7.66":["怎麼知道泰勞格斯的品格不比蘇格拉底高尚？光說蘇格拉底死得高貴、辯論巧妙、能耐寒夜、拒絕逮捕勒翁，這些還不夠。要看他的靈魂是什麼樣子。","他以蘇格拉底當標準，但指出看一個人，不能只看戲劇性的事蹟，要看內在：公正、虔敬、不為人的惡行白白煩惱。泰勞格斯是誰，今天已不清楚。","你欣賞的那個人，你欣賞的是他的事蹟，還是他的內在？"],"7.67":["自然並沒有把智性和身體混得那麼深，你仍可約束自己。一個人可以是神聖的人，卻沒人認得出來。幸福的生活要的很少，就算成不了辯證家，也可以成為自由、謙遜、合群的人。","他在安慰自己：即使沒成為大學者，仍能成為好人。這或許和他對哲學學問的看法有關，但這一則沒有明說。〔 〕裡的「智性」是譯者補的，原文省略處只能推測。","如果沒有人看到，你今天哪件事做得跟有人看到時一樣好？"],"7.68":["你有能力在最大的心靈安寧中生活，就算全世界對你叫罵，就算野獸撕裂你的身體。因為什麼都阻止不了心靈保持安寧、做出公正的判斷、運用眼前的對象。","他把最壞的情境放進來，證明內在的安寧不依賴處境。後半說，眼前發生的一切，都是施展理性和社會德性的材料。","你最近遇到的一件麻煩，能當成練習哪一種品格的材料？"],"7.69":["品格的完善，在於把每一天都當成最後一天來過，不激動亢奮，不麻木遲鈍，也不裝模作樣。","他給了一個具體的標準：最後一天的態度。重點不是悲壯，而是三個不要：不亢奮、不麻木、不裝。","如果今天是最後一天，你會把哪件事放慢一點？"],"7.70":["眾神已經長久容忍人類這個樣子，其中壞人那麼多，還用各種方式照顧他們。而你很快就要結束，卻已厭倦忍受壞人，何況你自己也是其中之一？","他拿神對人的耐心，對比自己的不耐。最後一句有點刺：自己也是別人眼中的壞人，不要只指責別人。這是他對自己很誠實的一句話。","你最近對誰失去耐心？有沒有人也曾對你這樣？"],"7.71":["一個人不逃離自己的惡，那是做得到的，卻去逃離別人的惡，那是做不到的。他說這樣的做法很可笑。","這是一句短而直接的諷刺：別人的壞，你躲不掉；自己的壞，你能改。所以努力該放在自己身上，而不是別人身上。","你有哪個毛病，是自己早就知道、卻一直沒處理的？"],"7.72":["理性、合群的能力，發現某樣東西既沒有智性、也不合群，就會正確地判斷那樣東西比自己低一等。","這一則有點抽象：有理性、能合群的能力，有資格判斷沒有這些的東西位階較低，所以不必被它們牽制。〔 〕是譯者補的說明，意思大致如此，但有推測。","現在有件事在牽制你，它值得你這樣讓步嗎？"],"7.73":["你做了一件好事，另一個人接受了，為什麼還像傻子一樣，在這兩樣之外再找第三樣，不是想得到做好事的名聲，就是想得到回報？","他在說善行本身就完整了：施與受已經夠了，不用再加名聲或回報。這是斯多噶為行為本身而做的態度。","你最近幫了誰？你有沒有期待回報或讚美？"],"7.74":["沒有人會厭倦接受有益的東西，而依照本性行事是有益的。所以別厭倦接受有益的東西：把它施予別人，就是接受它。","他的意思是：做好事就是在給自己有益的東西。因為合群的行為是順著本性，所以施予也是一種收穫。和上一則連著看更容易懂。","你今天為別人做的哪件事，其實也讓你自己好過了一點？"],"7.75":["整體的自然動起來，造出宇宙。接著只有兩種可能：一切依後果連續而來；或是連最主要的事物，也沒有理性原則。記住這個，你在許多事上會更安寧。","這是整卷的結尾，又回到卷首的二選一：宇宙要嘛有連貫的因果，要嘛沒有。他用這個思考法替自己找安寧。原文有些句子難解，譯文也補了〔 〕，意思有推測。","你今天遇到的混亂，如果換成有因果連著的角度，會怎麼看？"],"8.1":["他提醒自己：別再惦記哲學家的名聲了，那個樣子離他還遠，自己和旁人都看得出來。與其在乎名聲，不如把剩下的日子用在人的本性要求的事上，幸福在那裡。","這則對自己很不客氣，沒有客套。斯多噶認為好與壞只看品格：能讓人「正義、節制、勇敢、自由」的才是好，名聲、財富、享樂都不是幸福的來源。","你今天做的事裡，哪一件是為了讓人覺得你不錯，而不是因為該做？"],"8.2":["做每件事之前先問：這對我算什麼，我會後悔嗎？人很快就死，所以只要這件事是講理、顧到別人、合乎神所定規則的人該做的，就夠了，不必再多求。","「再過一會兒我就死了」不是悲觀，是拿來過濾的：死亡近在眼前時，許多多餘的要求自然站不住腳。「與神服從同一條法則」指斯多噶相信宇宙有理性的秩序，人的理性與它同源。","你今天正想做的事裡，有哪一件做完八成會後悔？"],"8.3":["他把征服者和哲學家放在一起比：亞歷山大、凱撒、龐培要操心那麼多事，反而成了許多事的奴隸；第歐根尼、赫拉克利特、蘇格拉底看懂事物，心也一致。","前三位是權力與名聲的代表，後三位是哲學家。這一則譯文有〔 〕標出的另一種讀法，「主宰之心是一致的」到底指什麼，意思略有不確定，只能大致這樣讀。","你羨慕的那個人，要操心的事比你多還是少？"],"8.4":["你氣得再厲害，別人還是照樣做他們會做的事。生氣改變不了他們，只會讓你自己更難受。","這則極短，開頭的〔想想〕是譯者補的，語氣像他對自己說的一句提醒。斯多噶把能掌握和不能掌握的事分開，別人的行為不在你手裡，生氣就是把力氣花在改變不了的地方。","最近誰讓你氣得不行？你氣完之後，他有因此改變嗎？"],"8.5":["最要緊的是不慌，因為一切都合乎宇宙的自然，連前任皇帝也終將被遺忘。接著把眼前的事看清楚，記得本分是做好人，說話要公正，但帶著善意與謙遜，不虛偽。","哈德良和奧古斯都都是前任皇帝，他拿他們提醒自己：再大的權位也會成為「無名無處」。這則像一張隨身清單：不慌、看清、做該做的、說話得體。","你現在最讓你慌的事，眼前該做的一步是什麼？"],"8.6":["宇宙的自然有一項工作，就是把東西從這裡搬到那裡、改變它們。一切都是變化，所以不必怕新鮮事，因為這些東西你都熟悉，分配的方式也一向如此。","斯多噶把世界看成不斷循環變化的整體，變化是常態，不是意外。他一再用這些你早就見過來化解對變動的恐懼。譯文裡的〔我們〕是譯者補的字。","最近哪個變化讓你不安？它其實有多新？"],"8.7":["理性的本性走得順時是這樣：不認同虛假或不確定的事，行為對大家有益，只在自己能掌握的事上有欲求和厭惡，對分到的一切滿足。人是整體的一部分，像葉子之於植物。","這是他對順著本性活的完整說法。葉子是植物的一部分，人是自然整體的一部分，差別在人所屬的整體有理性又公正。最後一段提醒：要比較，得看整體對整體，不要一件一件單獨比。","你今天的欲求和厭惡，有哪一個是放在你根本控制不了的事上？"],"8.8":["你說沒空讀書，但有空去做更要緊的事：壓下傲慢，超越快樂與痛苦、對名聲的愛好，不對愚蠢又忘恩的人生氣，甚至還去關心他們。","身為皇帝，他事務繁重，讀書的時間有限。這則既是安慰也是督促：讀書不是目的，品格才是。譯文的〔或能力〕表示原文的「閒暇」可以有兩種讀法。","你最近說沒時間的那件事，是真的沒時間，還是不想做？"],"8.9":["別再讓人聽到你抱怨宮廷生活，也別抱怨自己的生活。換句話說：抱怨改變不了處境，只會讓你更難受。","宮廷是他的處境，一般人覺得風光，他卻得提醒自己別發牢騷。斯多噶的看法是處境本身無所謂好壞，壞的是我們對它的判斷。「別再」兩個字，像是對自己的警告。","你這幾天最常抱怨的是什麼？抱怨之後有改變什麼嗎？"],"8.10":["後悔是在責備自己漏掉了有益的事，而善一定是有益的。可是沒有人會因為拒絕了一次感官享樂而後悔，所以快樂不是善，也不是有益。","這是一個簡短的論證，用來支持斯多噶的主張：快樂不算真正的善。你可以拿自己的經驗檢驗它：拒絕誘惑之後，你通常是後悔，還是鬆了一口氣？","你上次拒絕一個誘惑，事後是後悔還是鬆一口氣？"],"8.11":["看一樣東西時，把它拆開問五件事：它本身是什麼構成的、用什麼材料、有什麼性質、在世界上起什麼作用、能存在多久。","這是他剝掉外衣的方法：把東西還原成最基本的樣子，就不會被表面的光彩嚇到或迷住。「質料」與「成因」是當時哲學的用語，大致是材料與形式或性質。","你今天特別迷上或特別怕的一樣東西，剝掉外表後到底是什麼？"],"8.12":["早上不想起床時，提醒自己：起來做對人有益的事，才合乎人的本性；賴床連沒有理性的動物也做得到。合乎本性的事，其實也更讓人愉快。","這是他寫給自己的起床理由。他不是說睡覺不好，而是說人比動物多了理性與合群，起床去做事才算用上這一點。","你今天起床後第一件要做的事，對別人有沒有幫助？"],"8.13":["隨時隨地，只要心裡冒出一個印象，就拿物理學、倫理學、辯證學的原則去檢查它：世界怎麼運作、該怎麼做、怎麼想才不出錯。","斯多噶把哲學分成三門：物理學講宇宙怎麼運作，倫理學講該怎麼行動，辯證學講怎麼正確推理與判斷。這則把它們當成隨身工具，遇到每個念頭就用，而不是只在書上讀。","今天有個念頭讓你不舒服，它是事實，還是你加上去的？"],"8.14":["遇到任何人，先想他對好與壞是怎麼看的。他對快樂、名聲、死亡有那樣的看法，才會做那樣的事，所以不必驚訝，他是不得不這樣。","斯多噶認為人是照自己的判斷行事，做錯多半是判斷錯了。這樣想，對方就從敵人變成想法有問題的人，比較容易解釋，也比較容易寬容。「不得不」是說在他那樣的想法下，他只會那樣做。","今天讓你不解的那個人，他大概把什麼看得很重？"],"8.15":["無花果樹結無花果，沒人會驚訝；世界生出它能生的事，也不該驚訝。醫生見到人發燒、舵手遇到逆風，也不會覺得奇怪。","他拿專業的人做例子：他們每天面對的麻煩，在他們眼裡是工作的一部分。驚訝與氣憤多半來自以為世界應該不一樣。「可恥」是很重的字，是他對自己說的。","最近哪件壞事讓你特別意外？同樣的事以前發生過嗎？"],"8.16":["肯改變想法、聽人糾正，和堅持自己的錯一樣，都算自由，因為決定仍是出自你自己的判斷。改口並不丟臉。","一般人覺得被糾正就是輸，他看重的是：這個判斷是不是你自己想通的。他說的自由不是想怎樣就怎樣，而是由自己的理解來決定，所以改口不等於屈服。","你上次被人糾正後改口，覺得丟臉還是鬆了口氣？"],"8.17":["事情在你能力內，就去做；在別人能力內，怪誰都沒用，不論是偶然還是眾神。能糾正原因就糾正，不能就糾正事情本身，再不行，挑剔也沒有用。","這是一個處理問題的順序，目標是直接動手，而不是抱怨。「原子」指主張世界由原子偶然組成的看法，「眾神」是另一種解釋，兩邊他都不讓你拿來當責怪的對象。","你正在抱怨的事，你能糾正原因、糾正事情本身，還是都不行？"],"8.18":["死去的東西不會掉出宇宙之外，它留在這裡，分解成元素，而那些元素也是你的元素。這些元素也在變化，卻不抱怨。","斯多噶把宇宙看成一個封閉的整體，沒有東西真正消失，只有轉化。他用這個角度看死亡：不是被丟出去，而是回到整體。最後一句言下之意是：元素都不抱怨，你也不必。","你失去過的人或東西，現在還以什麼形式留在你生活裡？"],"8.19":["每樣東西存在都有目的，馬、葡萄藤，連太陽也會這麼說。那你是為了什麼存在？不會是為了享樂吧，常識不會答應這樣說。","斯多噶相信世界有目的的秩序，每樣東西各有功能，人的功能是運用理性、與人合群。他用享樂來反證：快樂不夠格當人的目的。","你今天做的事裡，哪一件是為了別人，而不只是讓自己舒服？"],"8.20":["自然關心結束，不亞於關心開始和延續，像拋球一樣。球飛起、落下、落地，本身都沒有好壞；水泡聚合、破掉，燈火亮起、熄滅，也是。","他用拋球、水泡、燈火三個比喻，說結束是整個過程的一部分，不是事故。斯多噶把衰老與死亡也看成自然的一環，不是失敗。","有什麼結束了讓你難過？它結束前，有沒有做完該做的？"],"8.21":["把身體翻過來看看，老了會怎樣，生病時又是什麼樣。稱讚的人與被稱讚的人都活不久，記得的人與被記得的人也是，整個大地不過是一個點。","這是他慣用的拉遠鏡頭練習：把身體、名聲、地球放回真實的比例，虛榮就站不住了。譯文的〔身體〕是譯者補的，原文只是「它」。","你今天特別想得到誰的稱讚？拉遠到一百年後，這還重要嗎？"],"8.22":["要留意眼前的事，不論是一個意見、一個行為，還是一句話。後半句對自己說得很重：你受這個苦是應該的，因為你寧可明天才變好，不願今天就好。","前半是專注當下的提醒，後半是對自己拖延的責備。他沒有安慰自己，直接把問題講出來，這是私人筆記才有的口氣。","你一直想著明天再開始的事，今天能先做哪一小步？"],"8.23":["我做的事，是為了人類的益處；發生在我身上的事，我接受，把它歸給眾神、歸給一切的源頭。","這是他給自己的兩句簡短原則：能做的事，用在對人有益的地方；不能改的事，就接受。斯多噶一直把能做的和不能做的分開。","你今天做的事裡，有哪一件是真的對別人有益？"],"8.24":["洗澡在你看來是油、汗、污垢、髒水，令人作嘔。生活的每個部分、每件事物，剝開來看也是這樣。","這又是一次剝開外表的練習（見這一卷第 11 則），讓人看清事物只是材料與過程，不再敬畏或貪愛。重點是降低欲望，不是說生活本身噁心。","你最想要的東西，只看它的材料與過程，還會那麼想要嗎？"],"8.25":["一個接一個，看著別人死去的人，自己也死了。那些機敏、自視甚高的人如今在哪？有的沒人記得，有的成了傳說，有的連傳說也沒了。所以你這個小小的組合體，也終會分解。","這串人名多半是他認識或聽過的已故之人，其中許多人今天已不清楚是誰，不需要逐一查。他的重點正在這裡：再有名、再聰明的人，名字也會消失。","你想被怎樣記得？這個想法有沒有影響你今天的選擇？"],"8.26":["做人該做的事，對人就是一種滿足。那就是：對同類懷著善意、輕視感官的衝動、對似是而非的表象作公正的判斷、看清宇宙的自然和其中發生的事。","這是他對人的本分列出的四項清單，用起來像檢查表。「似是而非的表象」指第一眼看起來像真的東西，斯多噶要人先審查，再相信。","善意、不被衝動牽著走、不輕信表象、看大局，哪一項你今天最容易漏掉？"],"8.27":["你和三樣東西有關係：包著你的身體、一切由它而來的神聖成因，以及和你一起生活的人。","這是他給自己的一張關係地圖：煩惱來時，先分辨它屬於身體、整體的安排，還是與人相處，就知道該用哪一種態度去面對。「神聖的成因」指斯多噶說的宇宙理性。","你現在最煩的事，是跟身體、天意，還是跟某個人有關？"],"8.28":["痛苦若是身體的惡，就讓身體自己去說；若是靈魂的惡，靈魂有能力保持平靜，不把痛苦當成惡。因為判斷、衝動、欲求都在靈魂裡，惡升不到那麼高。","斯多噶把痛苦和傷害分開：身體可以痛，但只有品格受損才算真正的惡。這不是叫人別感覺痛，而是說痛不必再變成我完了這種判斷。","上次身體不舒服，除了痛，你心裡還多加了什麼想法？"],"8.29":["常對自己說：此刻我有能力，不讓靈魂裡有邪惡、欲望或紛擾；我看清事物的本性，依它的價值去用。用這個抹掉你的想像，記得這份能力是從自然得來的。","這是一句可以隨口默念的口訣。「抹掉你的想像」指放掉那些誇大的畫面與臆測。他強調這份能力是現在就有的，不必等修養夠了才有。","現在有哪個擔心，其實只是你在腦中擴寫出來的畫面？"],"8.30":["在元老院裡，不論面對誰，說話都要恰當、不做作，用平實的話就好，不必裝腔作勢，也不必靠辭藻撐場面。","元老院是羅馬的議事機構，他身為皇帝要在那裡發言。他要求自己對任何身分的人都用同一種平實的口氣，不靠華麗的修辭撐場面。","你今天要開口的場合，有哪句話是為了聽起來厲害才加的？"],"8.31":["奧古斯都宮廷裡的妻子、女兒、後代、親信、朋友，全都死了。看別的家族也一樣，墓碑上刻著「他是他家族的最後一人」。先人費盡心思留繼承人，總要有一個人當最後一個。","奧古斯都是羅馬第一位皇帝，他的宮廷是權力與人群最盛的象徵，這裡列的人名，他只是用來代表顯赫的一整群人，細節今天已不重要。再大的家族也會有最後一人。","你家裡有哪位長輩的故事，現在只剩你記得？"],"8.32":["你的本分是把生活一個行為接一個行為安排好，每個行為盡了本分就該滿足，沒人能阻止。外在的事會擋路，但擋不住你公正、節制、深思地行事；一個行動被擋，另一個機會就會補上。","斯多噶的想法是：事情做不成不算失敗，只要轉去做被允許的事。他在這裡替自己設了一個反對的聲音，說「可是外在的東西會擋在前面」，再一一回答，像在跟自己辯論。","你今天被什麼擋住了？擋住之後，還有哪件事你做得到？"],"8.33":["順境來的時候，不要因此傲慢；它要走的時候，也隨時準備好放手。財富、好運都是這樣看。","原文很短，意思要補出來：順境是暫時借到的。斯多噶把財富與順境看成無關緊要的東西，可以接受，但不該依附。他身為皇帝，手上的好處比一般人多，所以這句對他有切身的意義。","你手上有什麼好東西，明天若失去，你放得下嗎？"],"8.34":["被砍下的手、腳、頭躺在一旁。人若對發生的事不滿、和別人分開、做出不合群的事，就是把自己弄成那個樣子。可是人比手腳幸運：離開之後，還能重新接回整體。","這是斯多噶「合群」觀最強烈的畫面：人是整體的肢體，疏離別人等於自我切斷。最後是好消息：神允許人回來，取回自己的位置。","你最近跟誰鬧僵了？能先踏出一步把關係接回來嗎？"],"8.35":["自然會把擋路的東西轉成自己的一部分；理性的生物也有同樣的能力：把每個阻礙變成材料，用在自己要做的事上。","他把這個能力說成人和自然共有的天賦：自然怎麼處理擋路的東西，人的理性也能怎麼處理。和上一則的轉到被允許的事上是同一個想法。","眼前的一個阻礙，能不能換個角度當成練習的材料？"],"8.36":["不要因為想到整個一生而不安。每遇到一個場合，就問：這裡有什麼是我承受不了的？你會羞於承認。而且讓你痛苦的只有現在，把它框住，心就縮小了。","他的方法是把痛苦切成此刻那麼大：一次只面對眼前這一刻。斯多噶認為過去與未來都不在手上，只有現在能行動，所以不必提前承擔整個人生。","此刻，這一分鐘裡，真正讓你難受的是什麼？"],"8.37":["他想像死者身邊的人還守在墓旁，一路追問：死者會知道嗎？會高興嗎？高興就能不死嗎？這些人自己也一樣老去、死去。人終究是「一袋臭味與血」。","名字多半是他認識或聽過的已故之人，細節今天已不清楚。他用一連串追問拆掉死後被人懷念的分量，最後的「一袋臭味與血」是他習慣的冷處理，用來鬆開對身體和虛榮的執著。","你在意別人在你走後怎麼想你嗎？這對你今天的日子有幫助嗎？"],"8.38":["這是引用一位哲學家的話：能看得清楚就好好看，然後明智地判斷。重點是先看清，再判斷，兩步不要混在一起。","譯文只寫「哲學家說」，沒指明是誰，原文也很短，出處今天不確定，這裡只能照字面讀。意思大致是：看得見的事要仔細看，別憑第一印象下結論。","你這幾天下的哪個判斷，是還沒看清楚就下的？"],"8.39":["他在人的構造裡，找不到有哪一種德性和正義對立；只看到一種德性和貪愛快樂對立，就是節制。","意思是：正義與其他德性不會互相衝突，但追求快樂會和節制拉扯，所以真正的對手是貪愛快樂。這是他看人內在衝突的方式。","你今天最容易在哪一件事上，被快樂拉著走？"],"8.40":["拿掉你對那件事的意見，你就站在安全的地方。有人說：「可是我不是理性。」他讓步：那就讓理性別擾亂自己；身體其他部分痛，讓它自己有它的意見。","這是斯多噶把「自己」放在理性上的說法。他自己扮演反對者：我不只是理性啊。他退一步，也只要求理性不要自己添亂，不要求其他部分不痛。","你現在的不舒服，有多少是事情本身，多少是你的看法？"],"8.41":["每種本性被阻礙就是它的惡。但人的智性被阻礙，要看你是不是無條件地要求事情一定成。把事物通常的進程也算進去，你就沒受阻，因為火、鐵、暴君、辱罵都碰不到智性。","斯多噶教人做事要有保留：我要這樣做，但事情可能不順。這樣阻礙來時，就傷不到你。「始終是球體」是古代的比喻，指智性造好之後，完整而不會被外力改變。譯文有〔 〕，細節略有不確定。","你上次計畫被打亂，是因為事情難，還是因為你以為一定會成？"],"8.42":["他的意思大概是：我從沒故意讓別人痛苦，所以也沒有理由讓自己痛苦，因為折磨自己也是一種傷害。原文太短，這是推測的讀法。","這則很短，推理也有點跳，我對這個讀法沒有太大把握。可能的邏輯是：自責或自苦本身是一種傷人，既然我不傷別人，就不該這樣對自己。","你對自己說過的話，有沒有哪一句是你絕不會對別人說的？"],"8.43":["不同的事讓不同的人歡喜，他的歡喜是保持主宰之心健全，不對任何人、任何事轉過臉去，用歡迎的眼光接受，依價值去運用。","他在給自己的快樂下定義：不是得到什麼，而是心的狀態。不轉過臉去是說不排斥、不逃避人與事，遇到什麼就面對什麼。","你今天有沒有哪個人或哪件事，是你一直想避開的？"],"8.44":["要確保你擁有當下的時間。追求身後名聲的人沒想到：後世的人，和他們現在受不了的人一模一樣，而且也會死。後世怎麼說你，與你有什麼相干？","斯多噶把名聲看成無關緊要的外在事物。他的論證很簡單：未來的人和現在的人沒有本質的差別，你不把眼前這些人的意見當回事，為什麼要在乎未來那些人的？","你現在做的哪件事，是為了讓以後的人覺得你好？"],"8.45":["把我丟到哪裡都行，在那裡我仍能保持神聖的部分平靜，只要它能依自己的構造去感受、去行動。換個地方難道有理由讓我的靈魂變糟、沮喪、驚惶嗎？","「神聖的部分」就是他說的內在的神靈，也就是主宰之心。他的想法是：幸福不看地點，只看這個部分好不好。這對當時被調派、流放的人特別有用。","若明天被派去你最不想去的地方，你真正會失去什麼？"],"8.46":["人身上不會發生不屬於人的事，牛、葡萄藤、石頭也一樣。既然每樣事物遇到的都是平常而自然的事，你為什麼抱怨？共同的自然給的，沒有你承受不了的。","他靠「自然」來論證：事情都是這一類存在會遇到的，所以不是專門針對你。最後一句比較像信念，不是證明，他是拿來給自己打氣的。","你覺得這個苦只有我才有，真的嗎？別人有沒有經歷過？"],"8.47":["外在的事讓你痛苦，其實是你對它的判斷，而此刻你就能把這個判斷抹掉。是自己性情的問題，就糾正；是沒去做該做的事，就去做。若真被擋住，原因不在你；若連活著都不值得，就滿足地離開。","最後一句要小心讀：這是斯多噶的說法，意思是不論多糟，你都不必被困住，語氣是對自己打氣，不是鼓勵輕生。他想說的重點是：全力投入、不抱怨。","你說做不到的事，是真的做不到，還是還沒開始？"],"8.48":["主宰之心不可戰勝，只要它收攏自己、滿足於自己。沒有情欲的心靈是一座堡壘，沒有比這更安全的避難處。沒看見這點的人是無知，看見卻不躲進去的人是不幸。","斯多噶說的「情欲」，不是所有感覺，而是被衝動推著走的失控狀態。堡壘的比喻是說：安全不必向外找，退回自己的判斷裡就有。","今天壓力大的時候，你能退到哪個心裡的地方喘口氣？"],"8.49":["只接受第一個印象所報告的，不要自己添加。有人說某人罵你，這是報告；你受傷是你加的。我看到孩子病了，但他有危險，我並沒有看見。停在最初的印象，就沒有事會傷到你。","這則教人分清看到的事實和自己加上去的詮釋。孩子生病的例子有親情在裡面，但他仍提醒：不要提前推測最壞的結果。最後一句，是說你若真的全知，才有資格往上添。","你最近聽到的哪件事，你加了多少自己的猜測進去？"],"8.50":["黃瓜苦就扔掉，路上有荊棘就繞開，這樣就夠了，不要再問世界為什麼造出這些東西。懂自然的人會笑你，像木匠會笑那個挑剔刨花碎料的人。","木匠有地方丟碎料，宇宙沒有外面可丟，只能把腐朽的轉化再利用。這是斯多噶沒有浪費的看法：壞的東西也是循環的一部分，所以抱怨沒有意義。","有哪件你反覆抱怨的小事，其實繞開就解決了？"],"8.51":["做事不遲緩，說話有條理，思想不游移，心裡不內鬥。就算別人殺你、咒罵你，也阻止不了你的心保持清醒公正，就像泉水被人咒罵或丟泥土，也很快沖走汙物。","泉水的比喻是說：心的狀態從裡面湧出來，外面汙染不了。他還說要「每個小時都把自己養成自由」，這是日常的練習，不是一次下定決心就好。","今天有哪一刻你被人說的話影響了？那句話真的汙染到你嗎？"],"8.52":["不知道世界是什麼，就不知道自己在哪裡；不知道世界為什麼存在，就不知道自己是誰。那麼追求或躲避掌聲的人，既不知道在哪裡也不知道是誰，值得在意嗎？","他用一連串「不知道」往下推：在意掌聲的人，連自己的位置都沒搞清楚。斯多噶認為哲學的第一步，是先認識整體，也認識自己在整體裡的位置。","沒人鼓掌的時候，你還會做同一件事嗎？"],"8.53":["你想被一個每小時咒罵自己三次的人稱讚嗎？想取悅一個連自己都不滿意的人嗎？也就是說，不穩定的人的稱讚，不值得追求。","這是三句反問。他的論證是：稱讚的分量，要看稱讚的人值不值得。一個對自己做的事幾乎都後悔的人，他的肯定不算數。","你最想討好的那個人，他自己對生活滿意嗎？"],"8.54":["不要只讓呼吸跟周圍的空氣一起活動，也要讓你的智性，此刻就跟包含萬物的智性和諧一致。這智性到處都有，就像空氣之於能呼吸的人。","斯多噶相信宇宙裡充滿理性。他拿空氣來比：你不用特別努力就會呼吸，同樣，只要你願意，也能「呼吸」理性，與整體合拍。","今天你有沒有留一點時間，只是看看事情的整體是怎麼回事？"],"8.55":["一般說來，邪惡傷不了宇宙；個別說來，一個人的邪惡也傷不了另一個人。它只傷害那個一旦願意就能擺脫它的人。","斯多噶只把品格受損算作傷害，所以別人的邪惡不會直接讓你變壞，除非你自己也被拉了進去。這讓人在被惡待時，多一個不被拖下水的立足點。","最近有人對你很壞，你有沒有因此也變得有點壞？"],"8.56":["鄰人的自由意志，對我的自由意志來說，就和他的血肉一樣無關緊要。我們雖然是為彼此而造，但每個人的主宰之心有各自的職分，否則鄰人的邪惡就會變成我的傷害。","別誤會，他不是說別人不重要，前一句才說「為了彼此而造」。他在區分：我要關心別人，但別人的心不由我負責，也毀不了我的。「無關緊要」是斯多噶的用語。","你有沒有把別人的情緒或選擇，當成自己必須負責的事？"],"8.57":["太陽的光看起來像傾瀉，其實是伸展。光遇到障礙，不滑開也不掉落，只是停在那裡。理解力也該這樣：不猛撞障礙，而是穩穩停住，照亮接受它的東西。","這是個長比喻：面對障礙與不肯接受的人，要伸展，不要衝撞。結尾說不接納光的物體是自己剝奪了光照，意思是別人不接受你的好意，是他的損失，你不必硬塞。字源的文字遊戲在希臘文才成立。","你上次想說服別人，是一路衝過去，還是說完就穩穩停住？"],"8.58":["怕死的人，不是怕失去感覺，就是怕另一種感覺。沒有感覺，就不會受傷；有另一種感覺，就成為另一種生物，並沒有停止生存。","這是他常用的二選一論證：不論死後是哪一種，都沒什麼可怕。他把兩種可能並排列出，並沒有說確定是哪一種。","你怕的是死亡本身，還是死之前的某件事？"],"8.59":["人是為了彼此而存在的，所以對別人只有兩條路：要麼教導他們，要麼容忍他們，沒有第三條。","他只給兩個選項，沒有第三個叫怨恨。這是他對難相處的人的實用態度：能講得通就教，講不通就忍，不要把力氣花在氣憤上。","今天最難相處的那個人，你打算教他，還是容忍他？"],"8.60":["箭的運動是一種方式，心的運動是另一種。心即使在謹慎行事、或忙著探究時，也同樣筆直朝著它的目標。","這則的意思不太明講，他似乎是說：箭直直飛出去，心看起來會繞、會猶豫，但在謹慎和探究的過程中，仍然是朝著目標在走。","你現在謹慎、猶豫的那件事，其實是在朝哪個目標走？"],"8.61":["要進入每個人的主宰之心，弄懂別人真正在想什麼、看重什麼；也讓別人進入你的，讓人看到你真實的想法。理解要雙向，別隔著面具。","這是卷八的最後一則，極短。他常提醒自己看透別人的判斷，這裡反過來，也要求自己坦誠，不虛偽。「進入」是用心去理解，不是窺探。","今天你有沒有機會真正聽懂一個人，而不只是聽他說了什麼？"],"9.1":["他把不義、說謊、追快樂躲痛苦，都算成「不敬」：因為宇宙的自然要人互助、求真，又對快樂與痛苦、生與死一視同仁，違背這些，就是和她作對。","這裡的「不敬」是宗教語詞。斯多噶把宇宙的秩序當成神，所以違反秩序就是對神不敬。論證的關鍵在最後：快樂痛苦不分好人壞人，所以不該拿它們當善惡的標準。這則又長又密，抓住這點就夠了。","你最近有沒有在小事上說過不太實在的話？是為了什麼？"],"9.2":["最幸福的是離世時從沒嘗過謊言、虛偽、奢侈、驕傲；次好的是受夠了這些，才離開。你要決定與惡共處嗎？理解力的敗壞是一場瘟疫，比空氣的腐壞嚴重。","「次好的航程」是當時的俗話，指第一選擇不成時退而求其次。他把品格的敗壞比成傳染病，意思是它會傳染，更要提防。","你身邊有哪種風氣，你已經習慣到不覺得是問題了？"],"9.3":["不要輕視死亡，要欣然接受，因為它和長牙齒、長白髮一樣，是自然的作用。像等孩子出生那樣，準備好靈魂離開外殼的時刻。他還坦白說：看看將離開的人，你也許更容易與死亡和解。","他把成長、衰老、死亡排在同一排，是要拆掉死亡的特殊感。第二段他自己承認是「通俗」的安慰，是疲倦時說的真話，不是他全部的態度，因為他同時要求自己對人溫和。","你最近有沒有累到想逃？那是累了，還是真的和人不合？"],"9.4":["做錯事的人，其實是對自己做錯，行不義的人是對自己行不義，因為他讓自己變成了更壞的人。","斯多噶認為真正的傷害是品格的損壞，所以行不義的人，第一個傷到的是自己。這給被冒犯的人一個轉念：他已經吃了虧。","最近對你不公平的那個人，你想過他自己失去了什麼嗎？"],"9.5":["不去做某件事的人，也常常是在行不義，不是只有真的做了壞事的人才算；該做卻沒做，也是虧欠。","這是不作為的不義：該幫而不幫，也是對同類失職。斯多噶的合群觀要求人積極參與，不是只要不犯錯就好。這則沒說是哪件事，只能照一般意思讀。","最近有哪件你知道該做、卻一直沒做的事？"],"9.6":["你現在只要有三樣就夠了：建立在理解之上的意見、指向公益的行為、對一切發生的事都滿足的性情。","這是他的極簡清單，三項大致對應斯多噶的三種練習：判斷、行動、接受。他說「這就夠了」，意思是不必再多求，也不必先等什麼條件。","這三樣裡，哪一樣你今天最缺？先補哪一樣？"],"9.7":["四個動作：抹掉想像、遏制欲望、熄滅貪欲、讓主宰之心掌握在自己手裡。一句一個步驟，照著做。","像四句口令，一句一個步驟。「想像」指被放大的印象與臆測，「欲望」與「貪欲」是想要的衝動。他寫得這麼短，是要自己一看就能照做。","這四件裡，你今天先做哪一件？具體怎麼做？"],"9.8":["沒有理性的動物分到的是一種生命；有理性的動物分到的是有智性的靈魂。就像一切屬土的東西共有一片大地，我們共有同一道光、同一種空氣。","他用共有的東西來說明：人與人本來就連在一起，共用理性，像共用光與空氣。這是為下面兩則所做的鋪陳。","你今天跟誰共用同一個空間，你有沒有把他當成同伴？"],"9.9":["東西都會朝同類聚集：土歸土、水匯水，動物成群，人有城邦與友誼。越高等越容易合在一起。可是人有時忘了這點，努力避開別人，卻怎麼也逃不掉。","這是古代物理學式的比喻，不是現代科學。他用各種元素各自聚集，推論人也有合群的本性。最後說「完全與其他人隔絕的人」比孤立的土塊還難找。","你這星期有沒有刻意躲開哪個人？你在躲什麼？"],"9.10":["人、神與宇宙都結果實，各在適當的季節。理性為所有人、也為自己結果實，還能生出與自己同類的東西。","他說結果實這個詞不該只屬葡萄藤。理性的果實，就是對人有益的想法與行為，而且會再生出更多理性。這則短，主要是借結果實的語言說話。","你這陣子學到的東西，有哪一點可以分給別人？"],"9.11":["如果可以，就用教導糾正做錯事的人；不行的話，就記得寬容是為了這種時候才給你的。連眾神也寬容這些人，甚至幫他們得到健康、財富、名聲。你也做得到。","他拿神的做法要求自己：連神都對壞人寬容，你有什麼理由不行？結尾的「誰阻止你？」是他慣用的反問，把藉口一個個堵掉。","你最近對誰失去了耐心？是真的用完了，還是不想給？"],"9.12":["做事時不要像個可憐的人，也不要想被人憐憫或讚賞。只要把意志放在一件事：照合群的理性要求，該動就動，該停就停。","「發動自己，也約束自己」，是斯多噶對衝動的處理：該行動就行動，該節制就節制。他不要的是兩種表演：一種是訴苦，一種是炫耀。","你辛苦做事的時候，有沒有希望人家看見你的辛苦？"],"9.13":["今天我擺脫了所有煩惱，不，應該說，我把它們都拋了出去。因為煩惱不在外面，而在我自己的意見裡。","他在句子中途修正自己：不是「擺脫」，而是拋出，因為煩惱是自己的判斷造成的，丟不丟的權力也在自己手上。","今天的煩惱裡，有哪一個其實是你的意見，不是事實？"],"9.14":["一切事物都一樣：經驗上熟悉，時間上短暫，質料上沒有價值。現在的一切，跟我們埋葬的那些人的時代一樣。","這是他的看透三連：熟悉、短暫、廉價。過去的人也活過同樣的事，所以現在的事並不特別。「質料」就是材料。","你眼前這件覺得天大的事，十年前有類似的嗎？後來怎麼了？"],"9.15":["外面的事物各自獨立，它們既不知道自己，也不下判斷。那麼是誰在判斷？是主宰之心，也就是你自己。","這是全書的核心之一：事情本身沒有好壞的標籤，標籤是我們貼上去的。他用一問一答，讓答案自己浮現。","你現在不順心的那件事，是誰貼上糟糕這個標籤的？"],"9.16":["理性而合群的人，他的善與惡不在被動，而在主動。也就是說，好壞看你做了什麼，不看發生在你身上什麼。","斯多噶把被動的遭遇（受傷、失去）和主動的作為分開，只有後者能用來評價一個人。這把責任放回自己手上，同時也讓人不必為遭遇內疚。","最近遇到的那件糟事，你是怎麼回應的？"],"9.17":["石頭被拋向空中，落下來不是惡，被帶上去也不是什麼善；它只是照著被拋的方向動而已。","石頭沒有判斷，所以升降對它沒有善惡。他用石頭說：外在的起落只是起落，只有有理性的存在才會替它貼上好壞。接著上一則。","最近的一次升或降，你是當成石頭的升降看，還是當成自己的價值？"],"9.18":["向內深入看人們的主宰之心，你會看到：你怕的是什麼樣的評判者，以及他們對自己又是什麼樣的評判者。","這和第八卷談被自己咒罵的人來稱讚你，是同一個論證：評判你的人，自己也站不穩。他常用向內看來拆掉別人意見的分量。","你最怕被誰評價？你有多了解他是怎麼評價自己的？"],"9.19":["一切都在變化，你自己也不斷在變動，在某種意義上也不斷在毀壞，整個宇宙也是如此，沒有例外。","這是一句簡短的提醒，可以和前後幾則連著讀：變化是常態。「毀壞」是說人每天也在變舊，不是只有東西會。","跟五年前比，你有哪個看法已經不一樣了？"],"9.20":["你的本分，是把別人的不義行為留在它所在的地方。意思是：別人的錯留給做的人，不要替他背在自己身上。","「它所在的地方」就是做的人那裡。這和第 4 則的邏輯相同：不義傷的是做的人，你的責任只在自己的行為。","有哪件別人的錯，你一直在替他放在心上？"],"9.21":["活動、運動、意見的停止，是它們的死亡，並不可怕。想想你的童年、青年、壯年、老年，每次轉變都是一次死亡，你並不害怕；整個生命的終結也一樣。","他用小死來說：你已經死過很多次，每一階段的你都消失了，卻沒什麼可怕。祖父、母親、父親，是他自己生命裡一個一個過去的階段。","想想十歲的你：那個你已經不在了，你覺得失去了什麼？"],"9.22":["趕快去看三種主宰之心：自己的，為了讓它公正；宇宙的，為了記得你是什麼的一部分；鄰人的，為了知道他是無知還是明知而做。","這是三個方向的檢查。尤其鄰人那一項：判斷他是無知還是明知，同時也提醒你，他的主宰之心與你同類。「趕快」兩個字，像是在催自己。","今天惹你的人，是不知道，還是明知故犯？你憑什麼這樣判斷？"],"9.23":["你是合群體系的一部分，你的每個行為也要成為合群生活的一部分。任何與社會目的無關的行為，會撕裂你的生命，像在民眾大會上自己站到一邊。","「撕裂你的生命」是說：行為若只為自己，你自己的人生也會零散。民眾大會是古代城邦的集會，他把脫離眾人說成「帶有叛亂的性質」，用詞很重。","你今天做的事，有哪一件連間接對別人有用都談不上？"],"9.24":["這則文字破碎。他似乎是說：小孩的爭吵與遊戲，像「可憐的小靈魂扛著屍體」，一切都是如此；冥界場景的演出，把這點展示得更清楚。","譯文有〔 〕，原文有缺，意思只能推測。保守地讀：他可能是把人間的爭鬥看成孩子的遊戲，把人看成扛著肉身的小靈魂，所以許多爭吵不必太當真。","你最近的哪場爭執，一年後看大概像小孩吵架？"],"9.25":["考察一個對象的形式，把它完全跟物質部分分開來沉思；接著判定，這種形式的東西依本性所能存續的最長時間是多久。","這是他的分析方法，和第八卷第 11 則同類：把事物拆成形式與質料，再問它能存在多久。看清它短暫，就不會太當真。「形式」質料大致是樣子和材料。","你正珍惜的一樣東西，依它的本性大概能用多久？"],"9.26":["你因為不滿足於主宰之心去做它依本性要做的事，才忍受了無窮的煩惱。不過這件事說夠了。","主宰之心的本職是判斷與選擇。他點明煩惱的來源，是希望它做別的事。最後的「說夠了」像是對自己說：這話已經講過太多次。","你有沒有希望自己的心做它做不到的事，比如要它馬上不在乎？"],"9.27":["別人責備你、恨你時，走進他們可憐的靈魂裡看看，你會發現不值得在意他們的看法。但仍要懷著善意，因為他們依本性是朋友，眾神也用各種方式幫助他們。","這和前面看穿評判者的幾則是一組。但他不要你輕視他們，而是善意。「藉著夢、藉著徵兆」反映當時的信仰：人們相信神會以這些方式幫助人。","最近批評你的人，他說的是你，還是他自己的狀態？"],"9.28":["宇宙週期往復，世代起伏。至於背後是有智性在發動、只發動一次、還是原子偶然，他說都不必糾結：有神，一切都好；是偶然統治，你也別被它支配。","他列了三種世界觀，然後說不論哪一種，你的處理方式差不多。這是他的無論如何論證，不用先分出誰對。原子指主張世界由微小粒子偶然組成的學說。","你有沒有因為想先搞清楚一件不確定的事，遲遲不行動？"],"9.29":["宇宙的成因像冬天的洪流，把一切捲走。那些搞政治又自以為在扮演哲學家的人，多麼沒有價值。去做自然此刻要求的事，別東張西望，別指望《理想國》；小事順利就滿足，也別把它看成小事。","《理想國》是柏拉圖寫的理想城邦，他說別指望它實現。他問「誰能改變人們的意見」：沒有意見的改變，只剩被迫服從。亞歷山大等人在這裡只是大人物的代表，生平不必深究。","你想改變的那個人，你能改的是他的行為，還是他的意見？"],"9.30":["從高處往下看無數的人群與儀式，看出生、共同生活與死去的差異；再想想古人、後人、蠻族，有多少人不知道你的名字，稱讚你的人很快會責備你。所以身後的名聲沒有價值。","「從高處往下看」是他常用的鳥瞰練習。「蠻族」是羅馬人對帝國外部族群的稱呼，帶有偏見；他晚年正在多瑙河前線與日耳曼部族作戰，這個詞可能就是這樣來的。","把視野拉遠到一百年後，你今天最在乎的事還剩多少？"],"9.31":["外面來的事，要不被擾亂；憑自己內在的原因所做的事，要公正，也就是讓衝動與行動以合群的行為為終點，因為這合乎你的本性。","這是對兩種事的態度分工：外面來的，不被擾亂；自己發動的，要公正。「終點」的意思是：一切行動最後都指向對人有益。","今天哪件事是外面來的，不用被擾？哪件是你自己要做的？"],"9.32":["擾亂你的事裡，有許多無用的部分只存在你的意見裡，拿掉它們，你就能贏得廣闊的空間。方法是在心裡把握整個宇宙，沉思永恆，看每件事多快就變化。","他給的好處是「廣闊的空間」：視野一大，煩惱就縮小。這是前面幾則（還有第八卷第 21 則）同一招，每次換個說法。","你現在煩惱的事裡，哪一部分只是我覺得？"],"9.33":["你看見的一切很快就消逝，目睹它消逝的人也是。在極高齡時死去的人，和夭折的人，最後被帶到同樣的境地。","他把壽命的長短壓平：放進無限的時間裡，長與短差別很小。這可以安慰人，也可能讓人難受，這是他處理早逝的方式。","若人生長短差別不大，你今天想把時間花在哪件事上？"],"9.34":["看這些人的主宰之心：他們忙什麼，出於什麼理由去愛、去尊敬。想像看到他們赤裸的靈魂，他們以為自己的責備能傷人、稱讚能幫人，真是可笑。","和前面一樣，是在練習看穿評判者的內裡。「赤裸裸」是想像把偽裝拿掉的情景，讓你不再怕別人的責備，也不再貪別人的稱讚。","你在意的那個人的評語，他自己下判斷時有多謹慎？"],"9.35":["失去不過是改變，而自然喜歡改變，順服她時一切都做得很好。如果說過去與將來都是壞的，眾神之中沒有力量能矯正，世界註定被束縛在惡裡，這說得通嗎？","這是反問式的論證：既然有這麼多神，世界不該永遠糟。他的結論是：世界整體是好的，局部的失去看起來壞，其實是變化。這是一種信念，不是證明。","你最近失去的東西，換個說法，是什麼變了形式？"],"9.36":["多麼腐朽的物質：水、塵土、骨頭、汙物；大理石是大地的硬繭，金銀是沉澱物，衣服是毛髮，「紫色染料是血」。氣息的東西也一樣，由此變為彼。","又是剝掉外表的練習，把貴重的東西還原成原料。紫色在羅馬是尊貴的顏色，皇帝穿紫袍，他把它說成血，是在剝掉身分的光環，連自己的也不放過。","你最羨慕的東西，換成它的原料，你還想要嗎？"],"9.37":["這悲慘的生活、這怨言、這猴子般的把戲，夠了。你煩什麼？有什麼新鮮的？形式還是質料？除此之外沒有別的。看一百年或三年，結果一樣。","開頭像他對自己不耐煩的喝止。「猴子般的把戲」是對人類種種忙亂的自嘲，可能也包括自己。把事物拆成形式與質料，是他慣用的分析。","你這幾天重複在抱怨的事，有哪一句今天可以不再說？"],"9.38":["如果一個人做了錯事，傷害是他自己的。但他也許並沒有做錯，所以先別急著下結論，確認一下再說。","前半是第 4 則的主題；後半多了一個停頓：先確認他是不是真的錯了，也許是你看錯了。這和第八卷第 49 則的別多加呼應。","你覺得誰對你做錯了？你確定自己看到的是全部嗎？"],"9.39":["要麼萬物出自一個有智性的源頭，部分就不該挑剔整體；要麼只有原子，那就更沒什麼好煩惱。然後他對主宰之心質問：你死了嗎？你敗壞了嗎？你變成野獸了嗎？","和第 28 則一樣，兩種世界觀導向同一種態度。最後那串質問是他對自己的喝問：你是有理性的人，別活得像跟牲畜一起吃草。","你今天有哪一刻只憑慣性在過，沒有用到自己的判斷？"],"9.40":["若眾神沒力量，為何祈禱？若有，為何不求祂們給你不怕、不貪、不痛苦的能力？他舉例：不求得到那個女人，求自己不貪求她；不求不失去孩子，求自己不害怕失去。","這則把祈禱從改變外在，轉成改變自己的欲望。例子裡把女人當成欲望的對象，是那個時代男性視角的說法，現在讀看的是方法。孩子的例子最難：求的是不害怕失去。","你最近心裡反覆求的事，換成求自己不那麼執著，會怎麼說？"],"9.41":["伊比鳩魯說他生病時不談身體的痛苦，仍照常談事物的本性，談心靈如何在血肉的動盪中保持自己的善，也不讓醫生擺架子。他要你也這樣，任何情況下都不離開哲學。","伊比鳩魯屬於另一個學派，與斯多噶常有分歧，他卻引用對方的例子，可見好的做法不分學派。「工具」指你用來做事的身心。","你不舒服的時候，話題都是什麼？有哪件事仍想照常做？"],"9.42":["別人無恥，你生氣時，先想：世上可能沒有這種人嗎？不可能，那就別要求不可能的事。他們傷不到你的心。你若施了恩，做了就是回報，不必再索求。","這是卷九最長的一則，把三個辦法擺在一起：事先預期、反省自己、不求回報。他說「眼睛為了看而要求補償」是荒謬的，做合乎本性的事，本身就是獎勵。他也要你怪自己沒料到，而不只怪對方。","你上次幫人之後，有沒有暗地期待他回報？"],"10.1":["他在對自己的靈魂喊話：什麼時候才能不再向外討東西，不再為了享樂、時間、好地方或合得來的人而貪求，對眼前的一切就感到滿足，和眾神與世人相處也沒有怨言。","通篇是「什麼時候才能」，可見這是他還沒做到的事，他是在催自己。斯多噶把宇宙看成一個有秩序的整體，發生的事都在這個安排裡，所以滿足不是認命，而是看清楚之後的結論。","今天你在等什麼條件到齊，才肯覺得這樣就夠了？"],"10.2":["做事前先分層檢查：身體要的，只要不害你當個健全的生物，就照著給；生物的需要，只要不害你當個理性的人，就可以給自己。理性的人必然合群，守住這一層，其他的不必煩。","他把人分成身體、動物性的本能、理性與合群幾層，越高的越優先。欲望彼此衝突時，這是一個裁決的順序：先問會不會傷到上一層。","今天有哪個想要的東西，會讓你變得不理性或不合群？"],"10.3":["落在你身上的事，你承受得了就別抱怨，照本事扛下來；承受不了也別抱怨，因為它耗盡你之後自己也會結束。而能不能忍，要看你怎麼判斷：你若認為忍下來是本分、有益，就忍得住。","斯多噶認為痛苦的重量有一半來自我們對它的判斷。這一則的語氣很實際，不是叫人逞強，而是提醒：先看看自己手上有什麼力量，再決定怎麼說這件事。","你現在抱怨的那件事，其實不是已經在扛著了嗎？"],"10.4":["別人犯錯，就和氣地告訴他錯在哪裡。如果你做不到，就怪自己；或者乾脆連自己也別怪。","在斯多噶眼裡，人做錯多半是因為不明白，所以該教導而不是動怒。做不到的時候，先檢查自己的耐心與方法；至於「連自己也別怪」，是不要在怒氣之外再添一層自責。","最近誰做錯了事？你能不帶火氣地跟他說嗎？"],"10.5":["不管什麼事落在你身上，都是很久以前就跟你的存在一起備好的，是層層因果交織出來的結果，不是臨時冒出來針對你的。","「紡線」是古希臘人談命運的意象，命運像一條早已紡好的線。斯多噶相信萬物的因果環環相扣，所以事情的發生不是意外，抱怨它就像抱怨天氣，沒有對象。","今天哪件事讓你覺得怎麼偏偏是我？換成這本來就會來呢？"],"10.6":["不論宇宙是原子聚成還是有秩序的體系，有兩點都成立：我是整體的一部分，我也和同類有親近的關係。記住這兩點，就不會不滿整體的安排，也不會做不合群的事；像好公民那樣生活，日子自然順。","開頭的二選一是他常用的論證：兩種說法不必先分出誰對，結論都一樣。這樣即使哲學上有爭議，他的生活原則也站得住。","今天你做的哪件事只對自己有利，對身邊的人沒有好處？"],"10.7":["部分會消亡，其實是變化，不是惡。若變化是惡，整體就不可能運作良好；自然也不會故意讓自己的部分受害。你身體的物質也是這幾天才加上去的，本來就一直在換。","這是歸謬法：假設變化是惡，就會推出自然傷害自己這種難以置信的結論，所以變化不是惡。最後一段譯文有括弧補充，句子難讀，意思只能抓個大概。","你最近害怕的某個結束，換成變成別的樣子，還那麼可怕嗎？"],"10.8":["你已經領受了良善、謙遜、真實這些名稱，就別換掉，丟了就趕快回來。守住它們，不必等別人這樣叫你，你就成了另一個人。要是守不住，就退到角落守，或乾脆離開人生，但要不帶怒氣。","「幸福島」是希臘神話裡好人死後去的地方。這裡「離開人生」是他給自己留的最後底線，講的是不肯在敗壞中苟活，不是在鼓勵輕生。最後一句：人有人的工作，就是做一個有理性的人。","那幾個詞裡你最想守住哪一個？今天哪個場合最容易丟掉它？"],"10.9":["戲劇、戰爭、驚嚇、麻木與奴役，會一天天磨掉你原本的原則。你的本分是把應付環境的能力和沉思的能力都練好，並保持自信，不炫耀也不隱藏。","他的處境是在前線，戰爭是他親身經歷的消耗。最後一串問題是他的拆解法：看一件事物，就問它的本質、位置、壽命、組成與歸屬，不只看表面。","今天哪件事，最像在慢慢磨掉你原本的原則？"],"10.10":["蜘蛛捉到蒼蠅得意，獵人捕到野兔、野豬、熊得意，有人俘虜了薩爾瑪提亞人也得意。看他們的想法，不都是強盜嗎？","薩爾瑪提亞人是多瑙河一帶的部族，和他晚年的戰事有關。他把戰功和蜘蛛抓蒼蠅擺在一起，是在給自己降溫：得意的對象不同，心態是同一種。","你最近最得意的一件事，拿掉別人的掌聲還剩多少？"],"10.11":["常常練習看萬物怎麼互相轉化，這最能養出心胸寬大。這樣的人知道自己遲早要離開，所以只求此刻做的事公正、此刻分到的事都滿意，別人怎麼說他，他連想都不想。","萬物互相轉化是斯多噶的物理觀：身體、名聲、財物都不斷轉手。看久了，就不再把它們當作自己的。他把一天的目標縮到兩件事：做的事公正，得到的事接受。","今天這件事做完，你能對自己說這樣做是公正的嗎？"],"10.12":["不必猜疑害怕，你本來就有能力去問該做什麼。看清楚了就往前，不回頭；看不清就停下來，找最好的人商量；被擋住了就謹慎前進，守住看起來公正的那件事。就算失敗，也是敗在對的目標上。","這是個實用的決策流程：清楚就做，不清楚就停下商量，受阻就調整但不換方向。最後的重點是對失敗的定義：目標對了，失敗也不算白費。","你拖著沒決定的事，是看不清，還是看清了卻不敢？"],"10.13":["一醒來就問自己：別人做了公正的事，對你有什麼不同？沒有。那些傲慢地稱讚或指責別人的人，在床上、飯桌上也只是凡人，他們偷搶的是自己最寶貴的那個部分，也就是心智。","他要自己別被評論者的架勢嚇到。這一則前後的連接有點跳，後半說的「神靈（幸福）」，意思是人只要願意，用心智就能長出忠誠、謙遜這些東西，他們卻拿去做壞事。只能抓大意。","今天誰的批評最讓你在意？先想想他自己是怎麼過日子的。"],"10.14":["對給了一切又收回一切的自然，受過教導又謙遜的人會說：你想給就給，想收就收。他這樣說不是逞強，而是順服，心裡也真的滿意。","斯多噶常說，我們擁有的一切，包括生命，都是借來的。既然是借的，被收回時就沒有理由抱怨。他特別強調「不是逞強」，要的是真的放得下。","你手上有什麼東西，其實一直被你當成理所當然會在？"],"10.15":["你剩下的日子很短，像在山上那樣過：不被人群牽動，簡單清靜。住哪裡沒差別，只要在哪裡都把世界當成一個城邦。讓人看看一個真正依本性生活的人，要是他們容不下，就讓他們殺了他。","「像在山上」是隱居的想像，他說不必真的去，第二十二、二十三則也說地點都一樣。「城邦」是斯多噶的世界公民觀。最後一句是極端的假設，意思是寧可被殺，也不要活成他們那樣。","如果沒有人看，你今天的生活還會是同一個樣子嗎？"],"10.16":["別再停在討論好人該是什麼樣子，去做那樣的人就是了。談論和實踐是兩回事，只有後者算數。","這是他寫給自己的提醒。他的筆記裡有許多道理，他知道光是講得頭頭是道不算數，行動才算。這句短，卻像是在催自己別停在筆記本上。","這個月有哪個你早就懂的道理，還沒真的做過？"],"10.17":["常想整個時間和整個物質。放在整個物質裡，每一件個別的事物只是一粒無花果籽；放在整個時間裡，不過是鑽子轉一圈。","這是把鏡頭拉遠的練習。「實體」指構成萬物的全部材料。一件事放得夠遠，就縮得夠小，焦慮自然少一點。","今天讓你焦慮的那件事，一年後你還會記得嗎？"],"10.18":["看一切存在的東西，它們已經在消解、在變化，可以說正在腐壞、散開；或者說，依本性構成，一切都是會死的。","他故意用「腐壞」這種不好聽的字眼，當作對治執著的藥。注意他說了「或者說」，換了一種較平和的講法，可見他在挑自己最能接受的說法。","你身邊有什麼人或東西，今天值得你更用心對待，因為它不會一直在？"],"10.19":["想想人吃飯、睡覺、交合、排泄時的樣子，再想他們發號施令、傲慢發怒的樣子。不久前他們為多少事、對多少人當過奴隸；再過一會兒，也會落到某個地步。","這是他常用的剝去外衣的辦法，用來化解對權勢者的敬畏或怨恨，對象包括他自己，因為他就是皇帝。「當過奴隸」指被欲望與恐懼牽著走。","今天誰讓你壓力很大？試著把他想成一個也要吃飯睡覺的人。"],"10.20":["宇宙的本性帶給每件事物的，就是對它有益的；而且在帶來的那個時刻，對它就是有益的。","這是斯多噶對整體的信念：一切都出自一個好的安排。這是信念，不是能驗證的說法，他是拿來訓練自己接受，不是要說服別人。","最近一件不如意的事，事後有沒有看出一點好處？"],"10.21":["引了兩句詩說大地愛雨水，天空也愛；宇宙愛創造將要成為的一切。所以他對宇宙說：我愛，如你所愛。不只是忍受，而是跟著愛。","「以太」是古人想像天上最上層的空氣。這兩句出自希臘詩，不確定是哪位詩人。重點是從接受再往前一步：不只不抗拒，還跟宇宙站在同一邊。","有哪件事你只是在忍著？能不能先改成不抗拒？"],"10.22":["你要嘛已經住在這裡、習慣了；要嘛是自己要走；要嘛快死了，本分已盡。沒有第四種，所以放心吧。","他用窮盡可能性的方式把焦慮拆光：每種情況都不需要擔心。他自己常想離開宮廷與戰事的生活，這一則也許是在安撫那種心情。","你現在不想待的處境，屬於這三種情況裡的哪一種？"],"10.23":["要始終記得：這一小塊地和任何地方一樣，山頂、海邊、你想去的任何地方也一樣。就像柏拉圖說的，住在城牆裡，跟住在山上牧人的圍欄裡沒兩樣。","他引柏拉圖的說法，意思是地點不是關鍵。想逃去別處的衝動，可以先拿這句話試試：換了地方，你自己是不變的。","如果換個地方生活，你最想逃的那個問題會不會跟著去？"],"10.24":["對自己的主宰之心做一次盤點：它現在是什麼樣子？我把它造成什麼樣子、用在什麼目的上？它有沒有失去理解力？有沒有脫離社群、和肉體混在一起，被肉體牽著動？","這是一張自我檢查表，每一題都帶著「現在」，要檢查的是此刻，不是整個人生。四個問題剛好對應：狀態、用途、判斷力、與他人和身體的關係。","此刻你的心被什麼牽著走：身體的感覺、別人的反應，還是你選的目標？"],"10.25":["逃奴是逃離主人的人，法則就是主人，違背法則的就是逃奴。同樣，悲傷、憤怒、恐懼的人，是在對已發生、正發生或將發生的事不滿，而那些都是統治萬物的那一位分配的。","那個時代奴隸制度是日常，這個比喻是站在主人的角度，今天讀來有點刺耳。他的重點是：情緒背後是在跟已成定局的事爭吵，這樣吵，只是讓自己更累。","你這週的情緒裡，有多少是在跟已經發生的事吵架？"],"10.26":["一個人把種子放進去就走了，另一個原因接手，造出一個孩子；孩子吞下食物，又有別的原因造出知覺和運動。這些多麼奇妙。要學會看見隱密中運作的力量。","他在培養驚奇的能力。他說的「讓東西往下、往上動的力量」，指當時所理解的物體的自然傾向。重點是：真正的力量常常看不見，卻同樣清楚。","有哪個每天發生、你從沒想過的過程，今天值得停下來看一眼？"],"10.27":["現在發生的事，過去也發生過，將來還會一樣。把同類的整齣戲擺在眼前，不管是自己的經驗還是歷史：哈德良、安東尼努斯、腓力、亞歷山大、克羅伊索斯的宮廷，是同樣的戲，只是演員不同。","哈德良是他之前的皇帝，安東尼努斯是他的前任與養父。腓力與亞歷山大大概指馬其頓的父子，克羅伊索斯是傳說中極富有的呂底亞國王。他把宮廷看成劇場，也把自己放進去。","你遇到的難題，身邊或歷史上有沒有人也走過？他們怎麼熬過來的？"],"10.28":["把每個因為什麼事悲傷或不滿的人，想成一頭被獻祭的豬，又踢又叫。連在床上默默嘆息的人也一樣。只有理性的動物能自願順從，其他的存在則是不得不順從。","這個比喻很冷，目的是讓他看到抗拒的徒勞。重點在最後：順從無論如何都會發生，差別是你自願，還是被拖著走。這份自願，是人獨有的能力。","今天有哪件事，反正躲不掉，你卻還在踢叫？"],"10.29":["你做的每一件事，都停下來問自己：死亡會把這件事奪走，這是否讓它可怕？如果不會，就放心去做。","這是他常用的死亡檢驗。目的不是讓人消沉，而是看這件事值不值得做、經不經得起被打斷。若被打斷就覺得可惜得要命，也許要想想它是不是那麼重要。","今天的事若做到一半就被打斷，哪一件你會最不甘心？"],"10.30":["有人的過錯讓你生氣時，先轉向自己，想想你用類似的方式犯過什麼錯，比如把錢、快樂或一點名聲當成好東西。再想：他是被迫的，還能怎麼做？你有能力的話，就替他除去那個逼迫。","斯多噶認為人做錯，是因為誤把某些東西當成好東西，等於被錯誤的看法逼著走。他給了三步：先照自己、再體諒他，若能再幫忙。","最近讓你生氣的那個人，他的錯你有沒有在別處犯過？"],"10.31":["見到某些人，就想想已經不在的人，他們現在在哪裡？哪裡也沒有，或沒人知道。這樣就會把人間事看成煙。你的時間也短，何不好好過完？把這些想法消化成自己的，像胃消化食物。","譯文裡的人名，大多今天已不可考，只能說：這是他用名單證明連名字都留不住。「任何一位其他的凱撒」就是把自己也放進去。最後的比喻是說，道理要吸收，不是記著。","你今天煩惱的事，二十年後還有人記得嗎？"],"10.32":["別讓任何人能真實地說你不單純、不善良，誰這麼想，就讓他說謊。這完全在你能力之內，沒人能阻止你。決定：除非能成為這樣的人，就不再活下去。","最後一句語氣極端，應該理解為強調決心：把品格放在生命之上。他的重點是，品格是在自己手上的，不靠任何人給，也沒有人能擋你。","別人形容你時，你最希望他不能反駁的那個詞是什麼？"],"10.33":["不管眼前的處境是什麼，總有最合乎理性的做法與說法，而且你做得到，別拿阻礙當藉口。外在的阻礙只動得了身體，除非你自己認同它，否則傷不了你；理性能穿過障礙，像火往上、石頭往下。","「素材」是他常用的詞：處境是做事的材料。圓柱、水、火會被擋，理性不會。最後一段連鎖推論：不傷害法則，就不傷城邦，也不傷公民，而所謂不幸都不傷害法則。","今天卡住你的那個障礙，如果當成材料，你可以拿它做什麼？"],"10.34":["對把真實原則放在心裡的人，一句短短的箴言就能免於悲傷與恐懼。比如「樹葉，有的被風吹散在地上」：你的孩子、稱讚或咒罵你的人、將記得你的後人，都是樹葉。短暫是萬物共有的。","這句詩出自荷馬，說的是人類世代像樹葉一樣生滅。他把身邊所有讓他在乎的人都歸到「樹葉」，用來降低對評價的執著。最後說的是，你也是閉上眼睛的那一個。","你今天在乎的評價，是從誰那裡來的？值得為它花力氣嗎？"],"10.35":["健康的眼睛什麼都看，不挑顏色；健康的聽覺、嗅覺、胃也是一樣。同理，健康的理解力要準備好面對發生的一切。說「讓我親愛的孩子們活著」的人，就是在找綠色的眼睛。","比喻重點：健康是不挑，願望附加條件就是病。他不是說愛孩子不對，而是說把一切都要如我所願當作活下去的條件，等於一直在挑。","你對今天有沒有哪個附帶條件：要是……才好？"],"10.36":["沒有人臨終時身邊沒人鬆一口氣，連善良有智慧的人，也會被人暗地嫌嚴格。所以臨終時別貪戀多留一會兒；但也別因此少了善意，不被拖著走，也不抗拒，像離開親族一樣離開。","這一則像是他為自己的告別預演。他不是在怪身邊的人，而是從別人的角度看自己，替自己放下。「是自然把你與他們結合」這句說明離開也是自然的事。","你身邊有沒有人被你管得喘不過氣？今天能鬆一點手嗎？"],"10.37":["盡量養成習慣：每當看到有人做什麼事，就問自己他做這件事的目的是什麼？但要從自己開始，先檢查自己。","他把觀察別人的問題，先轉向自己：同樣的問題，你每天做的事，目的是什麼？這樣能避免只拿來批評別人。","你今天做的第一件事，目的是什麼？"],"10.38":["要記得牽動這些線的是藏在裡面的東西：說服的力量、生命，也可以說它就是人。想自己的時候，別把外殼和附在周圍的器具算進去，它們就像斧頭，只是長在身體上。","線與木偶的意象：身體的動作像被線牽著，真正在拉線的是內在那股力量。沒有它，身體就像沒人用的梭子、筆和鞭子。他把我定在決定與判斷上。","你介紹自己時，最先說的是身體、職稱，還是你怎麼做決定？"],"11.1":["理性的靈魂能看自己、分析自己、造就自己，成果由自己享用；不論在哪裡被打斷，都能讓眼前的事圓滿。它也能看遍宇宙與時間，所以一個四十歲的人，已經看過所有過去和未來的事。","他拿舞蹈、戲劇對比：那些中途被打斷就不完整，靈魂的活動每一刻都完整。「憑著事物的齊一」是他的老想法：事情不斷重演，看久了就沒有新東西。最後把正確的理性和正義畫上等號。","今天你做的哪件事，就算半途被打斷，也算做得完整？"],"11.2":["把歌聲拆成一個個單獨的音，每個音都問：我是被這個擺佈的嗎？你就不太看重悅耳的歌唱了。舞蹈、競技也一樣。除了德性，什麼都可以這樣拆開來看。","這是一種拆解練習：讓人著迷的整體，拆成零件後魔力就退了。他拆的都是吸引人卻無關緊要的東西，唯獨德性不拆，因為斯多噶認為只有德性才是真正的好。","今天讓你停不下來的東西是什麼？拆成最小的一塊看看。"],"11.3":["靈魂應該隨時準備好離開身體，不論之後是熄滅、四散還是繼續存在。這份準備要出自自己的判斷，經過考慮、帶著尊嚴、能說服別人，不做悲劇式的表演。","這是他少數提到基督徒的地方，他把他們面對死亡的態度看成固執，這是他個人的看法。他在意的是離開的方式：不誇張、不演戲、想清楚之後才平靜。","你面對一件不想面對的事，是想清楚了，還是在賭氣？"],"11.4":["我為公共利益做了什麼，這件事本身就是回報，不用再等別人的感謝。把這一點放在心裡，永遠不要停下來。","斯多噶認為做對的事就是它自己的報酬。他身為皇帝，工作都是公共的事，最容易因為沒人道謝、被誤解而洩氣，所以要提醒自己。括弧裡的字是譯者補的。","最近你做了哪件對別人有益的事，卻沒人道謝？它本身夠不夠算數？"],"11.5":["你的技藝就是成為良善的人。要做好這門手藝，只能靠原則：有些關於宇宙的本性，有些關於人的適當構造。","他把做人當成一門要學、要練的手藝。兩類原則大致對應斯多噶哲學的兩塊：理解宇宙怎麼運作，和理解人該怎麼活，兩者缺一不可。","如果做人是一門手藝，你這個禮拜練習了哪個部分？"],"11.6":["悲劇搬上舞臺，是要提醒人：這些事會發生，且合乎自然；你既然愛看舞臺上的苦難，就別被人生這個大舞臺困擾。他抄了幾句劇中好句，簡述喜劇的演變，最後問這一切的目的是什麼。","喀泰戎山是希臘悲劇裡常出現的地點，「啊，喀泰戎山」是悲劇人物的哀號。第歐根尼是犬儒學派的人，以直言著稱。這一則結尾沒有答案，像他在問自己。","你看過的戲或書裡，有哪句話現在用得上你的生活？"],"11.7":["很明顯，沒有哪種生活處境，比你現在所處的這一種更適合做哲學思考。原文只有一句，意思是別再等更好的條件。","他寫這句的時候，多半身在軍營與前線，環境絕不理想。這是在反駁等有空、有好環境再修養的想法：眼前的處境就是現成的材料。","你一直在等什麼條件，才肯開始好好做一件事？"],"11.8":["一根樹枝從旁邊被切斷，同時也從整棵樹被切斷。人跟人分離也一樣，只是樹枝是被別人切的，人卻是自己動手，在恨鄰人、避開鄰人的時候。不過人有能力重新長合。","他用樹枝比喻社群是活的整體。宙斯在這裡是社會的創建者。最後一段說，就算一起長大的樹枝，也可能「與它不同心」，可見重點不在外表連著，而在心有沒有在一起。","最近你疏遠了誰？現在還接得回去嗎？"],"11.9":["照正確的理性往前走時，有人擋路，既不能被他們逼得偏離該做的事，也不能因此失去對他們的善意。對他們發怒是軟弱，因為怕而讓步也是軟弱，兩種都是逃兵。","「擅離崗位」是士兵的比喻，他常把人生看成站崗。重點是兩頭都要顧：行動上堅定，態度上溫和。只做到一邊，另一邊就丟了。","最近有人擋你的路，你是氣他，還是為了避開他而讓步？"],"11.10":["沒有哪種自然低於技藝，因為技藝模仿的就是自然；既然技藝都為了較高的事物去做較低的事物，宇宙也是如此。正義由此而來，若在意無關緊要的事、容易受騙粗心善變，正義就守不住。","論證的路線是：連人的技藝都有目的，宇宙更不可能沒有。這一段推論跳得快，只能抓大意。最後一句才是實用的：在意小事，會讓你在該公正的地方失守。","你有沒有為了一件小事，讓步了本來該守住的公平？"],"11.11":["讓你想追求或躲避的事，如果沒有來找你，那就是你自己走向它們。讓你對它們的判斷平靜下來，它們就會保持安靜，你也不會被看到在追或躲。","外物本身是不動的，是我們的判斷讓它動起來。這是斯多噶最核心的分析：欲望與恐懼，都是自己加上去的，所以也能自己放下。","今天你一直想躲的那件事，換個判斷，它還那麼逼人嗎？"],"11.12":["靈魂像一個保持形狀的球：不向外伸出去，也不向內縮，不四散，也不下沉，而是被光照亮，藉著這光看見萬物的真理，也看見自己內在的真理。","球形在古人眼中是最圓滿、沒有偏向的形狀，他拿來形容心的穩定。四個「不」剛好是四種失衡：向外撲、向內縮、散亂、消沉。「光」指理性帶來的清明。","你現在比較像哪一種：向外撲、向內縮、散亂，還是消沉？"],"11.13":["有人輕視我，那是他的事；我只留意別做真正該被輕視的事。有人恨我也是他的事，我要對他溫和，必要時誠懇地指出他的錯。你做著合乎本性的事，並滿意此刻的一切，你沒有損失。","福基翁是古雅典的政治人物，傳統上以寬厚聞名。「除非他只是裝出來的」是在提醒：溫和不能是演的。這一則把注意力從別人的態度，收回到自己的崗位上。","今天有誰輕視或不喜歡你？你這邊真的有該改的地方嗎？"],"11.14":["人彼此輕視，又彼此奉承；人想要高過彼此，又在彼此面前卑躬屈膝。兩種姿態同時存在，看了只覺得荒謬。","他沒有下結論，只是寫出一種表裡不一的矛盾。這兩種態度其實出自同一件事：太在乎別人的眼光。他在宮廷裡看過許多這樣的場面。","你上一次口是心非地客氣，是為了什麼？"],"11.15":["有人說「我已經決定要公平地對你」，這很不真誠。真的公平，行動自然會顯出來，不必先宣布。品格寫在臉上、眼睛裡；誠實的人像氣味濃的人，一靠近就聞得出來。","豺狼式的友誼是表面親切、實則要吃掉你的那種。他要說的是：真誠不需要宣告，假裝單純，就像一根彎的棍子，想裝直也直不了。","你最近有沒有說過我是為你好這類要先聲明的話？"],"11.16":["要過最好的生活，能力就在靈魂裡，只要不把無關緊要的事放在心上。那些事物本身不動，是我們自己把判斷寫進心裡，而我們有能力不寫，也有能力擦掉。","他用寫字做比喻：判斷像寫在心上的字，可以不寫，也可以擦。他還說這只需要很短的時間，也就是不費力。若事合乎自然就歡喜，不合就去找合乎本性的目標。","你心裡有哪個寫上去的判斷，今天可以試著擦掉？"],"11.17":["想想每一件事物從哪裡來、由什麼組成、會變成什麼、變了之後又是什麼樣子，而且它不會因此受到傷害。把這四個問題用在讓你煩惱的事物上。","這是一組四步觀察：來源、構成、變化、結局。重點是最後一句：變化本身不傷事物。原文很短，用在哪裡由讀者決定，我這裡補上最常見的用法。","拿這四個問題，問問你現在手上的一件事。"],"11.18":["面對冒犯你的人，他列了十條想法化解怒氣：他無知、你也犯過錯、生氣的代價比事情大、溫和才有力量，還有別期待壞人不做壞事。","這是全書最長的一則，像一份清單。第九條「如果還有別人在場……」之後原文有缺，意思只能推測。繆斯是文藝女神，阿波羅領導她們，所以第十條是額外的禮物。他把溫和說成「更有男子氣概」，帶著當時的眼光。","最近誰惹你生氣？十條裡哪一條你現在最需要？"],"11.19":["主宰能力有幾種偏差要提防，一發現就擦掉：不必要的念頭、會破壞社會聯合的傾向、不是出自真實想法的話。第四種是為某事責備自己，他認為這是向身體的快樂屈服的證據。","譯文只明列了三種，第四種接在後面。前三條是他要對自己說的提醒句。第四種的意思我較不確定：他把自責看成較神聖的部分被壓倒，這是他的解讀，讀時不必照單全收。","今天你說過哪句話，其實不是自己真正的想法？"],"11.20":["氣、火本性往上，土、水本性往下，卻都順從宇宙的安排被固定在身體裡。只有你的智性不順從，還對位置不滿，不是很奇怪嗎？主宰之心對發生的事不滿，就是擅離崗位。","古人的元素觀：氣和火往上，土和水往下。他的論證是：連元素都肯順從，更何況有理性的人。最後一段提到的「通稱」，句子難讀，只能抓個大概。","此刻你的哪件不滿，是在跟一個已經固定的位置鬧彆扭？"],"11.21":["沒有一個始終相同的目標，就不可能一生都是同一個人。這個目標還要是對的：大多數事物，人們對它好不好的看法都不同，只有共同利益大家才同意，所以要設定合群、政治性的目標。","「政治性」指和公民社群有關，不是搞政治。他想找的是一個能讓行為前後一致的錨，而共同利益是人們看法最接近的地方，所以選它。","如果只能選一個目標，讓你這一週前後一致，你選什麼？"],"11.22":["想想鄉下老鼠和城裡老鼠，想想城裡老鼠的驚慌和發抖。原文只有這一句，沒有說明他要從中得到什麼。","這是流傳的伊索式寓言：城裡老鼠過得富足，卻常受驚；鄉下老鼠簡單，卻安心。他寫得極短，像備忘，意思是我的推測：富足常伴著不安，簡單常伴著安心。","你追求的哪一種舒適，同時讓你多了一點不安？"],"11.23":["蘇格拉底常把大多數人的意見稱為拉彌亞，也就是用來嚇小孩的妖怪。這則是他記下的蘇格拉底軼事。","拉彌亞是希臘民間傳說裡嚇唬小孩的怪物。把眾人的意見說成妖怪，是指被它嚇到，其實是自己嚇自己，因為真正決定你怎麼做的，是你的判斷。","你怕的別人會怎麼看，是真有人說了，還是你想像的？"],"11.24":["斯巴達人在公共表演場合，把陰涼的座位留給外邦人，自己則隨便坐。原文只是記下這個習慣，沒有加評論。","這是一則簡單的軼事，他沒有加評論。我的推測是：他欣賞這種不計較自己舒適、先讓客人的作風，這和他一再強調的合群與不求回報相通。","今天你能把哪個好位子讓給別人？"],"11.25":["蘇格拉底婉拒佩迪卡斯，不去他那裡，說這樣才不會死得最糟；意思是他不想接受恩惠，卻無法回報。","佩迪卡斯是邀請蘇格拉底的統治者，這是流傳的軼事，細節不確定。他想說的是：欠了人情，就少了一份自由，所以寧可不欠。","你現在有沒有欠誰一份人情，一直沒還？"],"11.26":["在以弗所人的著作裡有這樣一條箴言：要時常想起古時某一位實踐德性的人。他只抄了這一句。","「以弗所人的著作」是哪一部，他沒說，我也不確定。重點是用一個具體的好人當榜樣，比抽象的原則更好記，也更容易照著做。","你心裡有沒有一個榜樣？今天遇到難題時想想他會怎麼做。"],"11.27":["畢達哥拉斯學派的人囑咐我們早晨仰望天空，想起那些永遠做著同樣的事、用同樣方式完成工作的天體，也想起它們的純潔與赤裸。因為星星沒有任何遮蔽。","畢達哥拉斯學派是古希臘重視數與天體秩序的學派。星辰「赤裸」，意思是毫無遮掩、毫無虛假。這是他抄下的規勸：早晨先看一眼有秩序、不矯飾的東西。","今天早上你有沒有抬頭看過天空？"],"11.28":["想想蘇格拉底：贊西佩拿走他的外袍出了門，他就披著一張獸皮；朋友看了羞愧、往後退，蘇格拉底對他們說了什麼。他沒寫答案，要自己去想。","贊西佩是蘇格拉底的妻子，這是流傳的軼事。這一則只是提示：他自己腦中有完整的畫面，意思大概是，一個人不靠體面的衣服也能自在。","你今天為了體面，做了哪件其實不必要的事？"],"11.29":["不管是寫還是讀，你都不可能替別人立規則，除非自己先學會遵守規則。生活中更是如此。","他這本筆記就是在給自己立規則。這句是提醒自己：先做到，才有資格要求，也才有資格教人。對一個要管理整個帝國的人，這個警告格外有分量。","你最近要求別人的事，有哪一件自己沒做到？"],"11.30":["你是個奴隸，自由言論不屬於你。意思大概是：被欲望或恐懼綁住的人，說不出自由的話。","從這一則起，卷十一後面幾則多是他抄下的短句，出處譯文大多沒標。這句出處不確定，也不確定他怎麼用；「奴隸」在斯多噶常指被欲望支配的人，只能這樣推測。","有什麼話你明明想說，卻因為怕而沒說？"],"11.31":["我的心在裡面笑了。意思大概是：內心感到輕鬆、得意或自在，不必表現在臉上。原文沒有交代語境，所以只
