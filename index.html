<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="馬可・奧理略《沉思錄》十二卷，一次讀一則，每則附閱讀理解。">
<meta name="theme-color" content="#E2E0DA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F2022" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="沉思錄">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
.install{margin:0;font:400 13px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--muted);max-width:26em}</style>
<title>沉思錄</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
/* Layout: one carved passage per screen on a stone slab. Lettering is incised (dark upper edge, lit lower edge); only what can be pressed is filled with cinnabar, and pressable things have the slab's own thickness. */
:root{
  --stone:#E2E0DA; --stone-2:#D8D6CF; --raised:#ECEAE5;
  --ink:#25262A; --muted:#5C5D61; --mark:#CBC7BA;
  --accent:#A2371F; --on-accent:#F3F1EC; --a-edge:#6B2212;
  --carve:#8B8880; --edge:#B3B0A7; --hi:rgba(255,255,255,.62); --lo:rgba(0,0,0,.24);
  --mottle:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='m' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.01' numOctaves='3' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .12  0 0 0 0 .11  0 0 0 0 .1  .24 0 0 0 -.07'/></filter><rect width='100%' height='100%' filter='url(%23m)'/></svg>");
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .15  0 0 0 0 .15  0 0 0 0 .16  0 0 0 .13 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Cinzel","Trajan Pro","Times New Roman",serif;
  --fs:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stone:#1F2022; --stone-2:#27282B; --raised:#2B2C2F;
    --ink:#CFCAC0; --muted:#9B978F; --mark:#3D3E38;
    --accent:#E0705A; --on-accent:#1F2022; --a-edge:#8E3F30;
    --carve:#696A6E; --edge:#0D0E0F; --hi:rgba(255,255,255,.08); --lo:rgba(0,0,0,.7);
    --mottle:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='m' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.01' numOctaves='3' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .85  0 0 0 0 .85  0 0 0 0 .82  .14 0 0 0 -.04'/></filter><rect width='100%' height='100%' filter='url(%23m)'/></svg>");
    --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .8  0 0 0 0 .8  0 0 0 0 .78  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --stone:#1F2022; --stone-2:#27282B; --raised:#2B2C2F;
  --ink:#CFCAC0; --muted:#9B978F; --mark:#3D3E38;
  --accent:#E0705A; --on-accent:#1F2022; --a-edge:#8E3F30;
    --carve:#696A6E; --edge:#0D0E0F; --hi:rgba(255,255,255,.08); --lo:rgba(0,0,0,.7);
    --mottle:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='m' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.01' numOctaves='3' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .85  0 0 0 0 .85  0 0 0 0 .82  .14 0 0 0 -.04'/></filter><rect width='100%' height='100%' filter='url(%23m)'/></svg>");
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .8  0 0 0 0 .8  0 0 0 0 .78  0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--stone);background-image:var(--grain),var(--mottle);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-text-size-adjust:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;max-width:720px;margin-left:clamp(0px,9vw,150px)}
.gut{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.view{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

/* buttons: one language. outlined = secondary, filled = the single primary */
.btn{min-height:44px;padding:0 16px;border:1px solid var(--accent);color:var(--accent);background:var(--stone);font:500 14px var(--sans);letter-spacing:.06em;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;box-shadow:0 3px 0 var(--edge);transition:transform .1s ease-out,box-shadow .1s ease-out}
.btn.fill{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--a-edge)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.btn[disabled]{opacity:.32;cursor:default;transform:none;box-shadow:0 3px 0 var(--edge)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--a-edge)}

/* reading */
.tools{display:flex;justify-content:flex-end;gap:8px;padding-top:14px}
.tools .btn{min-height:44px;padding:0 12px;font-size:13px}
.page{padding-block:50px 28px}
.today{font:400 13px var(--sans);color:var(--muted);margin:0 0 10px;letter-spacing:.04em}
.cite{display:block;text-align:left;font:600 50px/1.05 var(--num);letter-spacing:.03em;color:var(--accent);text-shadow:0 -1px 0 var(--lo),0 1px 0 var(--hi);min-height:52px}
.cite small{display:block;font:400 13px/1.6 var(--sans);color:var(--muted);letter-spacing:.08em;text-shadow:none;margin-top:8px}
.text{margin-top:34px;max-width:31em;font:400 var(--fs)/1.95 var(--serif);line-break:strict;text-align:justify;text-justify:inter-character;overflow-wrap:anywhere;text-autospace:normal;hanging-punctuation:allow-end}
.text::after{content:"";display:block;width:30px;height:2px;margin-top:30px;background:var(--carve);box-shadow:0 1px 0 var(--hi)}
.text p{margin:0}
.text p+p{margin-top:1.1em}
.term{display:inline;font:inherit;color:inherit;border-bottom:1px dotted var(--accent);padding:0;line-height:inherit}
.term:active{background:var(--mark)}
.after{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px}
.page.in{animation:in .22s ease-out}
.page.in.back{animation-name:inb}
.page.in .cite{animation:fill .62s ease-out}
@keyframes fill{0%,25%{color:var(--carve)}}
@keyframes in{from{opacity:0;transform:translateX(10px)}}
@keyframes inb{from{opacity:0;transform:translateX(-10px)}}

/* bottom: step row + tabs, set on a darker band of the same stone */
.dock{background:var(--stone-2);border-top:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi);padding-bottom:env(safe-area-inset-bottom,0px)}
.step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:12px 8px}
.prog{display:grid;gap:6px;font:400 13px var(--sans);color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.prog i{display:block;height:9px;background:linear-gradient(90deg,var(--edge) 0 1.5px,transparent 1.5px) 0 0/calc(100%/var(--n,1)) 100% repeat-x}
.prog i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px) 0 0/calc(100%/var(--k,1)) 100% repeat-x}
.prog i.solid{height:2px;margin-block:3.5px;background:var(--edge)}
.prog i.solid b{background:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{min-height:48px;font:500 14px var(--sans);color:var(--accent);letter-spacing:.14em;border-top:2px solid transparent;transition:background-color .1s}
.tabs button:active{background:var(--mark)}
.tabs button[aria-current="page"]{border-top-color:var(--accent)}

/* contents + saved */
.head{padding-block:64px 22px}
.head h1{margin:0;font:400 32px/1.2 var(--serif);letter-spacing:-.02em;text-wrap:balance}
.head p{margin:10px 0 0;color:var(--muted);font-size:14px;max-width:30em}
.head .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.books{display:grid}
.book{display:grid}
.book:nth-child(even){background:var(--stone-2)}
.book>button{display:grid;grid-template-columns:3.6em minmax(0,1fr) auto;align-items:baseline;gap:8px;text-align:left;min-height:64px;padding-block:14px}
.book .r{font:600 22px/1 var(--num);color:var(--accent);text-shadow:0 -1px 0 var(--lo),0 1px 0 var(--hi)}
.book .n{font:400 17px var(--serif);display:grid;gap:3px;min-width:0}
.book .n small{font:400 13px/1.5 var(--serif);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .c{font:400 13px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;padding-bottom:18px}
.nums button{min-height:44px;font:400 14px var(--sans);color:var(--accent);border:1px solid var(--mark);font-variant-numeric:tabular-nums}
.nums button.seen{background:var(--mark);color:var(--ink)}
.nums button.here{border-color:var(--accent)}
.saved{display:grid;padding-bottom:24px}
.saved button{display:grid;gap:4px;text-align:left;padding-block:14px}
.saved button:nth-child(even){background:var(--stone-2)}
.saved .r{font:600 18px/1.2 var(--num);color:var(--accent);text-shadow:0 -1px 0 var(--lo),0 1px 0 var(--hi)}
.saved .x{font:400 15px/1.7 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--muted);max-width:26em;font:400 16px/1.9 var(--serif);padding-bottom:32px}

/* cover: the title is cut into the slab, set vertically from the right as on a stele */
.cover{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:28px;padding-block:44px calc(32px + env(safe-area-inset-bottom,0px));min-height:100%}
.stele{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:22px;min-height:0}
.stele h1{margin:0;writing-mode:vertical-rl;font:600 clamp(84px,24vw,128px)/1 var(--serif);letter-spacing:.06em;color:var(--carve);text-shadow:0 -2px 0 var(--lo),0 2px 0 var(--hi)}
.stele p{margin:8px 0 0;writing-mode:vertical-rl;font:400 16px/1 var(--serif);letter-spacing:.42em;color:var(--muted)}
.colophon{display:grid;gap:18px}
.colophon .who{display:grid;gap:6px}
.colophon .lat{font:500 13px/1.3 var(--num);letter-spacing:.22em;color:var(--muted)}
.colophon .zh{font:400 15px/1.6 var(--serif);color:var(--ink)}
.colophon .row{display:flex;flex-wrap:wrap;gap:10px}
.app.on-cover .dock{display:none}

/* sheet: framed panel with a nameplate straddling the top edge */
.veil{position:fixed;inset:0;background:color-mix(in srgb,var(--stone) 72%,transparent);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:720px;margin-left:clamp(0px,9vw,150px);padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.frame{position:relative;background:var(--raised);border:1.5px solid var(--ink);padding:30px 18px 16px;max-height:min(70vh,560px);overflow-y:auto}
.plate{position:absolute;top:-15px;left:16px;z-index:1;background:var(--ink);color:var(--stone);font:500 14px/30px var(--sans);padding:0 12px;letter-spacing:.08em}
.sheet-top{position:relative}
.frame h3{margin:0 0 4px;font:500 13px var(--sans);color:var(--muted);letter-spacing:.08em}
.frame p{margin:0 0 18px;font:400 17px/1.9 var(--serif);line-break:strict;max-width:31em}
.frame .close{display:flex;justify-content:flex-end}

@media (max-width:640px){.app,.sheet{margin-left:0}}

@media (prefers-reduced-motion: reduce){
  .page.in,.sheet,.page.in .cite{animation:none}
  .btn{transition:none}
  .btn:active{transform:none}
}
</style>

</head>
<body>
<div class="app" id="app">
  <main class="view gut" id="v-cover" hidden tabindex="-1">
    <div class="cover">
      <div class="stele">
        <h1>沉思錄</h1>
        <p>寫給自己的十二卷筆記</p>
      </div>
      <div class="colophon">
        <div class="who">
          <span class="lat">M · AVRELIVS · ANTONINVS</span>
          <span class="zh">馬可・奧理略　著　｜　全十二卷，四百八十七則</span>
        </div>
        <div class="row">
          <button class="btn fill" id="c-today" type="button">讀今日一則</button>
          <button class="btn" id="c-start" type="button">從卷一開始</button>
          <button class="btn" id="c-toc" type="button">目錄</button>
        </div>
      </div>
    </div>
  </main>

  <main class="view gut" id="v-read" tabindex="-1">
    <div class="tools">
      <button class="btn" id="size" type="button">字級　中</button>
      <button class="btn" id="save" type="button" aria-pressed="false">收藏</button>
    </div>
    <article class="page" id="page">
      <p class="today" id="today" hidden></p>
      <button class="cite" id="cite" type="button"></button>
      <div class="text" id="text"></div>
      <div class="after" id="after"></div>
    </article>
  </main>

  <main class="view" id="v-toc" hidden tabindex="-1">
    <div class="head gut">
      <h1>目錄。</h1>
      <p>全書十二卷，四百八十七則。每一則都是他寫給自己的一段提醒。</p>
      <div class="row"><button class="btn" id="go-today" type="button">讀今日一則</button><button class="btn" id="go-cover" type="button">封面</button></div>
    </div>
    <div class="books" id="books"></div>
  </main>

  <main class="view" id="v-saved" hidden tabindex="-1">
    <div class="head gut">
      <h1>收藏。</h1>
    </div>
    <div id="saved-list"></div>
  </main>

  <div class="dock">
    <div class="step gut" id="step">
      <button class="btn" id="prev" type="button">上一則</button>
      <div class="prog"><i id="ticks"><b id="bar"></b></i><span id="count"></span></div>
      <button class="btn fill" id="next" type="button">下一則</button>
    </div>
    <nav class="tabs" aria-label="主要分頁">
      <button type="button" data-tab="read" aria-current="page">閱讀</button>
      <button type="button" data-tab="toc">目錄</button>
      <button type="button" data-tab="saved">收藏</button>
    </nav>
  </div>
</div>

<div class="veil" id="veil" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="plate" hidden>
  <div class="sheet-top"><div class="plate" id="plate"></div></div>
  <div class="frame">
    <div id="sheet-body"></div>
    <div class="close"><button class="btn" id="close" type="button">關閉</button></div>
  </div>

<script>
const B=[["從祖父維魯斯，我學到品行端正，也學到壓住脾氣。","從父親留給人的名聲與記憶，我學到謙遜，和男子漢的氣概。","從母親，我學到敬畏神明、樂於施予。不只不做壞事，連壞念頭也不動。生活也要簡單，不沾有錢人的習氣。","從曾祖父，我學到不上公立學校，而是在家請好老師來教。也明白在這種事上，該大方花錢。","從我的導師，我學到看賽車不偏袒綠隊或藍隊，看角鬥也不偏袒持小圓盾或持長方盾的那一邊。也學到吃苦耐勞，需要的很少，事情自己動手做，不管別人的閒事，也不輕易聽信讒言。","從第歐格內圖斯，我學到不為瑣事忙碌，不信術士和江湖騙子說的念咒、驅鬼那一套；不養鵪鶉來鬥，也不迷這類玩意。學到聽得進直話，學到親近哲學：先後聽過巴基烏斯的課，再來是坦達西斯和馬爾奇亞努斯的。年輕時寫過對話錄，也曾想睡木板床、蓋獸皮，還有其他希臘式苦修的做法。","從魯斯提庫斯，我領悟到自己的品格需要改進、需要磨練。也從他那裡學到：不被詭辯的好勝心帶偏，不寫空談玄理的文章，不發表小小的勸世演說，不裝出一副刻苦自律的樣子，也不為了炫耀去做善事。學到遠離修辭、詩歌和華麗的文筆；不穿著外出的衣服在屋裡走動，也不做類似的事。\n寫信要樸實，就像他從西努埃薩寫給我母親的那封信。對曾經用話冒犯我、或對我做了錯事的人，只要他們肯和解，我就很快消氣，跟他們言歸於好。讀書要仔細，不滿足於讀個大概；也不匆忙附和那些誇誇其談的人。\n我還要謝謝他，讓我認識愛比克泰德的講論，他把自己收藏的筆記借給了我。","從阿波羅尼烏斯，我學到意志自由，和始終不動搖的決心。學到除了理性，不把目光放在任何事上，連片刻也不。劇痛時、喪子時、久病時，都始終如一。\n我也在他這個活生生的例子身上，清楚看到：一個人可以既極為堅決，又能隨和，教人時也不急躁。我眼前就有這樣一個人，他顯然把自己的經驗，和講解哲學原理的功夫，看作自己最不起眼的長處。\n我也從他那裡學到，朋友的好意被當成恩惠時該怎麼接受：不因此低聲下氣，也不裝作沒這回事。","從塞克斯圖斯，我學到心地仁厚，學到一個像父親那樣治家的榜樣，學到順著自然過日子的想法。學到莊重而不做作，用心照顧朋友的利益，容忍無知的人，和那些不加思考就形成意見的人。\n他很容易和每個人相處，所以跟他在一起，比任何奉承都讓人愉快，而與他往來的人，又對他極為敬重。他能用明智而有條理的方式，找出並整理生活所需的原則。他從不顯露憤怒或任何其他情緒，完全不受情緒左右，卻又極為深情。他稱讚人而不喧嚷，學識淵博而不炫耀。","從文法學家亞歷山大，我學到不挑毛病。別人說了不合文法、不合規矩或聽起來怪的詞，也不用責備的口氣去糾正，而是巧妙地把那個該用的說法帶進話裡。或是用回答、附和、一起談事情本身（而不是那個字眼）的方式，或其他合適的提示來做到。","從弗朗托，我學到看清暴君身上的嫉妒、虛偽和做作，也學到我們當中那些被稱作貴族的人，大多缺少一份父親般對親人的感情。","從柏拉圖學派的亞歷山大，我學到不要動不動就對人說、或在信裡寫「我沒有空」，沒有必要時更不要說。也不要總拿急事當藉口，推掉我們對身邊人該盡的責任。","從卡圖路斯，我學到朋友挑我毛病時，不能漠不關心，即使他挑得沒道理，也要設法讓他恢復平常的心情。學到樂於稱讚老師，就像傳說中多米提烏斯和阿特諾多圖斯那樣。也學到真心愛自己的孩子。","從兄弟塞維魯斯，我學到愛親人、愛真理、愛正義。透過他，我認識了特拉塞亞、赫爾維狄烏斯、加圖、狄翁、布魯圖斯。\n也從他那裡得到一種政體的觀念：所有人適用同一部法律，施政依據平等的權利與平等的言論自由；還有一種君主政治的觀念，最重視的是被治理者的自由。\n我也從他學到對哲學始終如一、堅定不移，樂於行善、慷慨給予，抱著美好的盼望，並相信朋友愛我。我還看到，他對自己所指責的人，從不藏著自己的看法；他的朋友也不必猜他要什麼、不要什麼，一切清清楚楚。","從馬克西穆斯，我學到自我克制，不被任何事牽著走。學到不論遇到什麼處境都保持愉快，生病時也一樣。學到在品格裡恰到好處地調和溫厚與莊嚴，學到不抱怨，把眼前的事做好。\n我看到人人都相信他說的就是心裡想的，也相信他做的事從無惡意。他從不顯得驚訝或詫異，從不匆忙，也從不拖延；不慌亂，不沮喪；不曾用笑來掩飾不快，另一方面，也從不動怒或多疑。他習慣行善，樂於寬恕，不帶一絲虛假。他給人的感覺是天生就不會走偏，而不是被改造出來的。\n我還注意到，沒有人覺得被馬克西穆斯看輕，也沒有人敢自認比他高明。他還有讓人愉快的幽默。","在我父親身上，我看到溫和的性情，和經過審慎考慮之後就堅定不移的決心。我看到他對人們所謂的榮譽毫無虛榮心，熱愛工作，持之以恆；肯聽任何對公共福祉有建議的人說話；依每個人的功績給他應得的，毫不動搖；憑經驗知道什麼時候該全力以赴，什麼時候該放鬆。\n我還看到他已克服對少年的一切情慾。他把自己看作與其他公民平等的一員，免除朋友一切得陪他吃飯、或出門得隨行的義務；那些因為有急事而沒能陪他的人，總是發現他待他們一如往常。\n在所有需要商議的事上，他習慣仔細探究，而且堅持不懈，從不因為滿足於最初浮現的表象就停下來。他珍惜朋友，不輕易厭倦他們，也不對他們的感情過度放縱。他在任何場合都知足而愉快。他看得遠，最細小的事也不動聲色地安排好。他立刻制止大眾的喝采和一切諂媚。他時時留意帝國行政所需的事務，善於管理開支，並耐心承受因此招來的責難。\n他對眾神既不迷信，也不靠施捨或討好來籠絡人，不向群眾獻媚。他在一切事情上顯出節制與堅定，從不有卑下的念頭或行為，也不愛新奇。生活舒適所需的東西，命運供給得很充裕，他用起來既不傲慢，也不找藉口：有的時候，他毫不做作地享受；沒有的時候，也不想要。沒有人能說他是詭辯家，是家裡油嘴滑舌的奴僕，或是學究；人人都承認他是個成熟、完備、不受奉承所動、能管理自己和別人事務的人。\n此外，他尊敬真正的哲學家，對那些假冒哲學家的人不加責難，卻也不容易被他們牽著走。他和人交談輕鬆自在，令人愉快，又不帶惹人厭的做作。他合理地照顧身體的健康，不是貪戀生命，也不是為了外貌，更不是漫不經心，而是靠自己留心，所以很少需要醫術、藥物或外敷之類。他最樂於毫不嫉妒地把機會讓給有專長的人，不論是口才、法律知識、風俗道德，或其他方面；他給他們幫助，好讓每個人都依其應得享有名聲。他總是依照祖國的制度行事，卻不顯出刻意如此的樣子。\n他不喜歡變動，也不反覆無常，而是喜歡待在同樣的地方，做同樣的事。頭痛發作過後，他立刻精神煥發、充滿活力地回到平日的工作。他的祕密不多，非常少，也非常罕見，而且只關乎公共事務。舉辦公共競技與演出、興建公共建築、賞賜民眾這些事上，他審慎而節約，因為他只看該做什麼，不在乎做了能換來什麼名聲。他不在不合時宜的時候洗澡；不喜歡蓋房子，不講究吃什麼，也不講究衣服的料子和顏色，不講究奴僕的長相。他的衣服來自他海邊的別墅洛里烏姆，一般則來自拉努維烏姆。我們知道他怎麼對待在圖斯庫魯姆向他求饒的收稅人；他的整個行事都是這樣。\n他身上沒有嚴酷，沒有不肯原諒，沒有暴烈，也沒有任何可以說做到「汗流浹背」的地步。他一件一件地審察事情，彷彿時間綽綽有餘，不慌不亂，井然有序，有力而前後一致。\n可以把記載在蘇格拉底身上的話用在他身上：許多人太軟弱而戒不掉、享受起來又無法節制的東西，他既能戒絕，也能享受。既有力量忍受前者，又能在後者面前保持清醒，正是擁有完美而不可戰勝的靈魂的人的標誌，就像他在馬克西穆斯生病時所表現的那樣。","我要感謝眾神，讓我有好祖父、好父母、好姊妹、好老師、好同伴、好親戚和朋友，幾乎一切都是好的。還要感謝眾神，讓我沒有倉促對祂們任何一位做出冒犯的事。我有那樣的性情，要是機會出現，也許會做出這種事來；但憑著祂們的恩惠，從沒出現過那樣的處境來考驗我。\n我還要感謝眾神，讓我沒有在祖父的妾室身邊待得更久，保全了青春的花朵，沒有在適當的時節之前試探自己的男子氣概，反而往後延。讓我受一位既是統治者又是父親的人管教，他除去了我所有的驕傲，讓我明白：人住在宮殿裡，可以不要衛兵、繡袍、火炬、雕像和類似的排場，能把自己拉到非常接近平民的樣子，卻不因此在思想上顯得卑下，也不會在為公共利益、以統治者該有的方式必須做的事上顯得鬆懈。\n感謝眾神給我這樣一位兄弟，他的品格能激勵我時時警醒自己，他的敬重與感情也讓我歡喜。感謝我的孩子不愚笨，身體也沒有殘缺。感謝我在修辭、詩歌和其他學問上沒有更進一步；如果我看到自己在那些事上有進步，也許就會完全投進去。感謝我趕緊把撫養我的人安置在他們似乎期望的尊榮位置上，沒有因為他們還年輕，就拿「將來某天再做」的希望搪塞他們。感謝我認識了阿波羅尼烏斯、魯斯提庫斯、馬克西穆斯。\n感謝我對於順著自然生活是怎樣的一種生活，得到清楚而頻繁的印象。就眾神、祂們的賜予、幫助和啟示而言，沒有任何事妨礙我立刻順著自然生活；我之所以還達不到那個標準，是因為自己的過失，因為沒有留意眾神的告誡，甚至可以說是祂們直接的指示。感謝我的身體在這樣的生活裡撐了這麼久。感謝我從沒碰過貝內迪克塔或狄奧多圖斯，也感謝我陷入情慾之後得以痊癒。感謝我雖然常常對魯斯提庫斯不高興，卻從沒做過讓自己事後後悔的事。感謝我的母親雖然命中註定早逝，最後幾年卻是與我一起度過的。\n感謝每當我想幫助某個需要幫助的人，或有其他情形時，從沒有人對我說我沒有能力這麼做；也感謝我自己從不必接受別人的施予。感謝我有這樣的妻子，這麼順從、這麼深情、這麼樸實。感謝我為孩子們找到許多好老師。感謝夢中指示了我一些療法，有其他的，也有針對吐血與眩暈的……。感謝我傾向哲學的時候，沒有落入任何詭辯家之手，沒有把時間浪費在歷史作家身上，沒有耗在解析三段論式上，也沒有忙著探究天象。因為這一切都需要眾神與命運的幫助。\n在誇迪人之中，於格拉努阿河畔。"],["一早起來，先跟自己說：今天我會碰到愛管閒事的人、不知感恩的人、自大的人、耍心機的人、愛嫉妒的人、不合群的人。他們會這樣，都是因為分不清什麼是善、什麼是惡。\n但我已經看清：善的本質是美，惡的本質是醜；也看清做錯事的人，本性與我同類。不只是同血緣、同種子，而是同樣分有理性，同樣分有那一份神性。所以他們誰都傷不了我，因為沒有人能把醜的東西加在我身上。我也不能對自己的同類發怒，或恨他。因為我們生來就是要彼此合作的，像腳、像手、像眼瞼、像上下兩排牙齒。所以彼此對立是違反自然的；而生氣、轉身不理，就是彼此對立。","不管我是什麼，不過是一點血肉、一口氣息，加上主宰之心。\n丟開你的書吧，別再讓自己分心，這是不允許的。要像個此刻就要死的人，看輕這副血肉之軀：它不過是血、骨頭，和一張網，是神經、靜脈、動脈交織成的組織。\n再看看這口氣息是什麼：是空氣，而且不總是同一份空氣，每一刻呼出去，又吸進來。\n那麼第三樣就是主宰之心。這樣想吧：你已經老了，別再讓它做奴隸，別再像傀儡一樣被繩線拉著，做出不合群的舉動；也別再對眼前的處境不滿，或對以後的事退縮。","凡是來自眾神的，都充滿天意。凡是來自命運的，也不離開自然，都和天意安排的事物交織在一起，並非毫不相干。一切都從那裡流出；此外還有必然，和對整個宇宙有益的事，而你是宇宙的一部分。整體的本性所帶來、又有助於維持這個本性的，對自然的每一部分都是善。宇宙靠元素的變化來維持，也靠元素所組成之物的變化來維持。\n這些原則對你就夠了，讓它們永遠是你堅定的意見。但要丟掉對書的渴求，好讓你死的時候不帶怨言，而是愉快、真誠、由衷地感謝眾神。","記得你把這些事拖了多久，眾神給過你多少次機會，你都沒有用上。現在你該明白了：你是哪一個宇宙的一部分，你是從哪一位宇宙的主宰流出來的。也要明白，你的時間有個界限；你若不趁這時候清掉心裡的烏雲，時間就會過去，你也會過去，再也不會回來。","每一刻都要像羅馬人，像男子漢那樣專心，帶著完整而純樸的莊重、親愛的情感、自由與正義，去做手上的事，把其他一切念頭放下。\n要是你把生命中每一件事都當作最後一件來做，放下一切輕忽，放下一切因情緒而違背理性命令的做法，放下虛偽、自私，和對分給你的命運的不滿，你就輕鬆了。你看，一個人只要把握這幾件事，就能過上平靜流淌的生活，像眾神那樣；因為對遵守這些的人，眾神也不會再要求更多。","糟蹋自己吧，糟蹋自己吧，我的靈魂。但你再也沒有機會尊重自己了。每個人的生命只有這麼一段，而你的已經快走完，你的靈魂卻還是不尊重自己，把自己的幸福放在別人的靈魂裡。","外面的事落在你身上，讓你分心嗎？那就給自己一點時間，學些新的、好的東西，別再被轉得團團轉。\n但也要避免被拉到另一頭去。因為有些人同樣是在瞎忙：他們在生活中奔忙到筋疲力盡，卻沒有一個目標，能讓他們的每個動作，總的來說每個念頭，都朝著它去。","不去留意別人心裡在想什麼，很少有人因此不幸；但不留意自己心靈活動的人，必然不幸。","你得永遠記住：整體的本性是什麼，我的本性是什麼，這個本性和那個本性有什麼關係，我是怎樣一個整體裡的怎樣一個部分。也要記住，沒有人能阻止你，始終去做、去說符合你所屬的那個本性的事。","泰奧弗拉斯托斯比較各種惡行時，是按一般人的共同看法來比的，他說得像個真正的哲學家：因欲望而犯的過錯，比因憤怒而犯的過錯更該責備。因為憤怒的人，看來是帶著痛苦、不由自主的緊縮，離開了理性；而因欲望犯錯的人，被快樂壓倒，看來在某種程度上更放縱、更軟弱，像個女人。\n所以他說得有道理，也配得上哲學：帶著快樂犯的錯，比帶著痛苦犯的錯更該責備。總的來說，後者比較像是先被人傷害，因痛苦才被逼著發怒；前者則是出於自己的衝動去做錯事，被欲望推著去做某件事。","你既然可能此刻就離開人世，就照這個來安排你每一個行為和念頭。離開人群，如果有眾神，並不可怕，因為眾神不會把你拖進惡裡。如果祂們不存在，或是不管人間的事，那麼活在一個沒有眾神、沒有天意的宇宙裡，對我又有什麼要緊？\n但事實上，祂們存在，也關心人間的事，而且把一切手段都放在人的能力之內，讓他不至於落入真正的惡。至於其餘的，就算其中有什麼是惡，祂們也預先安排好，讓人完全有能力不落進去。凡是不會讓人變壞的，怎麼會讓人的生活變壞？宇宙的本性不可能因為無知而忽略這些，也不可能明明知道卻沒力量防範或糾正；也不可能因為缺乏力量或技巧，就犯下這麼大的錯，讓善與惡不分好壞，一樣落到好人和壞人身上。\n然而，死與生、榮譽與恥辱、痛苦與快樂，這一切都同樣落在好人和壞人身上，它們既不讓我們更好，也不讓我們更壞。所以它們既不是善，也不是惡。","一切消失得多快：在宇宙裡，是事物的形體本身；在時間裡，是人們對它們的記憶。\n感官所感知的一切是什麼本性，尤其是那些以快樂當餌來誘人、以痛苦來嚇人、或靠虛浮的名聲到處喧嚷的東西：它們多麼沒價值、可鄙、低下、易朽、死寂，——觀察這一切，是理智的本分。也要觀察：那些人是誰，他們的意見和聲音造出了名聲；還有死亡是什麼。如果就死亡本身去看它，用抽象思考的力量，把出現在想像中的一切拆成各部分，就會認為死亡不過是自然的一種運作；如果有人怕自然的運作，那他就是個孩子。然而，死亡不只是自然的一種運作，還有助於自然的目的。\n也要觀察：人是怎樣接近神的，靠自己的哪一部分，而人的這一部分在什麼狀態之下……（參見六卷二十八則）。","再沒有比這更可憐的人了：他到處兜圈子，像詩人說的，連地底下的事也要探察，又靠揣測去猜鄰人心裡有什麼，卻不明白，只要留意自己內在的神靈，真誠地尊敬它就夠了。\n尊敬神靈，就是讓它保持純淨，不沾染激情和輕率，也不對來自眾神與人的事不滿。因為來自眾神的事，因為卓越而值得敬重；來自人的事，因為我們同族，應當對我們親切。有時，人們分不清善惡，甚至讓我們心生憐憫；這種缺陷，不比分不清黑與白的缺陷小。","即使你能活三千年，或三千年的一萬倍，也要記得：人能失去的，只有正在過的這一刻；人能活的，也只有正在流走的這一刻。\n這樣一來，最長的生命和最短的生命，就算是一樣了。因為當下對所有人都一樣，雖然消逝的東西不一樣，所以失去的，不過是一瞬間。人既不可能失去過去，也不可能失去未來：他沒有的東西，別人怎麼奪得走？\n所以你要記住兩件事。第一，自永恆以來，一切事物都是同樣的形式，循環往復，所以一個人看這些相同的事物看一百年、兩百年，或無限長的時間，都沒有差別。第二，活得最久的人和最快死去的人，所失去的完全相同。因為一個人唯一可能被剝奪的是當下，既然這確實是他唯一擁有的，而人不會失去自己沒有的東西。","記得，一切都是意見。犬儒學派的莫尼莫斯說的話很明白，這話的用處也很明白，只要人在它真實的範圍內，取其所能取。","人的靈魂對自己施暴，有五種情況。\n第一，它盡其所能，把自己變成宇宙上的一個膿瘡、一個腫瘤。因為對任何發生的事煩惱，就是和自然分離，而其他一切事物的本性，都包含在自然的某一部分之中。\n第二，靈魂背棄任何人，甚至懷著傷害他的意圖走向他，像憤怒的人那樣。\n第三，被快樂或痛苦壓倒的時候。\n第四，演戲，言行不誠懇、不真實。\n第五，讓自己的任何行為、任何活動沒有目的，不假思索、不明白自己在做什麼就去做。因為即使最小的事，也該和某個目的相連，而有理性的生物的目的，就是遵循理性，和那座最古老的城邦與政體的法律。","人的生命，時間只是一個點，實體在流變，感知遲鈍，整個身體的構成易於腐爛，靈魂是漩渦，命運難以預測，名聲是沒有判斷力的東西。總之，屬於身體的都是河流，屬於靈魂的都是夢與煙霧；生命是一場征戰，一次旅居異鄉，身後的名聲就是被遺忘。\n那麼，什麼能引導人？只有一樣：哲學。就是讓人內在的神靈不受暴力、不受傷害，超越痛苦與快樂，不做沒有目的的事，也不虛假偽善，不需要別人做或不做什麼。此外，接受一切發生的事、一切分派給他的事，認為那是來自那個地方的，不論它在哪裡，他自己也是從那裡來的。最後，愉快地等待死亡，把它看作不過是構成每個生物的元素的分解。\n如果元素本身不斷彼此轉變，對它們沒有任何傷害，那人為什麼要怕全部元素的變化與分解？因為這是合乎自然的，而合乎自然的，沒有一樣是惡。\n寫於卡爾農圖姆。"],["我們不只該想到：生命一天天在消耗，剩下的越來越少。還得想到另一件事：即使一個人活得更久，他的理解力還夠不夠用來理解事物，還能不能保有那種努力求取神聖與人間知識的沉思能力，是完全不確定的。\n因為人一旦開始老邁昏聵，排汗、消化、想像、食慾這些功能都不會衰退；但善用自己、盡到各項責任、清楚分辨各種表象、判斷一個人是不是該在此刻離開人世，以及其他一切絕對需要受過訓練的理性的事，——這一切已經熄滅了。\n所以我們得加緊，不只因為一天天接近死亡，也因為對事物的領會和理解，會最先停止。","也要留意，即使是依自然生成的事物，後來接著發生的變化，也帶有某種讓人愉快、吸引人的地方。\n例如烤麵包的時候，有些地方在表面裂開。這些裂開的部分，有點違背烘焙技藝本意的樣子，卻在某種意義上是美的，而且特別引人想吃。又如無花果完全成熟時會裂開；熟透的橄欖，正因為接近腐爛，果實更添一種特別的美。垂下的麥穗、獅子皺起的眉頭、野豬嘴角流下的泡沫，還有許多其他的事物，——一件一件去看，離美都還很遠，——卻因為是自然造物的後續結果，替那些事物添了點綴，讓心靈覺得愉悅。\n所以，要是有人對宇宙中產生的事物感受敏銳，看得深，他幾乎會覺得，所有這些隨之而來的事物，沒有一樣不是被安排來帶來愉悅的。這樣，他看真實野獸張開的大口，不會比看畫家與雕刻家模仿出來的少一分愉悅；他也能在老婦與老人身上，看到某種成熟與端莊；對年輕人那吸引人的可愛，他能用純潔的眼光去看。許多這類的事都會呈現在他面前，並不是人人都覺得愉悅，只有真正熟悉自然和自然作品的人才會。","希波克拉底治好了許多病，自己卻病倒死了。迦勒底人預言過許多人的死，後來命運也抓住了他們。亞歷山大、龐培和凱撒，多次徹底摧毀整座城市，在戰場上砍殺了數萬名騎兵和步兵，最後他們自己也離開了人世。赫拉克利特對宇宙大火思索了那麼多，自己卻是體內積水，滿身塗著泥而死。蝨子毀了德謨克利特；另一些蝨子殺了蘇格拉底。\n這一切說明什麼？你已上船，已經航行，已經靠岸；下船吧。\n如果是去另一種生命，那裡也不缺眾神。但如果是去一種沒有感覺的狀態，你就不再受痛苦與快樂拘束，不再做那容器的奴隸。那容器有多低劣，侍奉它的就有多高貴：因為後者是理智與神性，前者是泥土與腐朽。","不要把你剩下的生命，浪費在為別人操心上，除非那樣想是為了某個共同的益處。因為你這樣想的時候，就錯過了做別的事的機會：某某人在做什麼、為什麼、他在說什麼、在想什麼、在謀劃什麼，還有其他任何讓我們偏離、看不到自己主宰之心的事。\n所以，在思緒一個接一個的時候，要擋掉一切沒有目的、沒有用的東西，尤其是太過好奇和懷著惡意的念頭。要習慣只想這樣的事：如果有人突然問你，現在心裡在想什麼，你可以完全坦率地立刻回答：這個，或那個。從你的話裡就看得出，你心裡的一切都是純樸而善意的，適合一個合群的生物；沒有關於快樂或感官享受的念頭，也沒有競爭、嫉妒、猜疑，或其他一旦說出口，就會讓你臉紅的東西。\n這樣的人，不再拖延，已是最優秀的人之一，像眾神的祭司與僕人，也運用那植在他內心的神，讓他不被快樂玷污，不被任何痛苦傷害，不被任何侮辱觸動，感覺不到傷害；他是最高貴戰鬥裡的戰士，不會被任何激情壓倒，深深浸染著正義，以全部的靈魂接受發生的一切、分派給他作為本分的一切。除非有極大的必要、而且為了公共利益，他也不常去想別人說了什麼、做了什麼、想了什麼。因為他只把屬於自己的事當作活動的材料，時常思考從萬物的總和中分給他的那一份。他讓自己的行為美好，也相信自己得到的那一份是好的。因為分給每個人的命運，與他一同被帶著走，也帶著他走。\n他還記得，每一個有理性的生物都是他的親族，關心所有的人是合乎人的本性的。他所該堅持的意見，不是所有人的意見，只是那些公認依自然生活的人的意見。至於那些不這樣生活的人，他總記得他們是什麼樣的人，在家裡和在外面，在夜裡和在白天，是什麼樣子，和什麼人一起過著不潔的生活。所以，他一點也不看重這種人的讚美，因為他們連自己都不滿意。","做事時，不要勉強，不要不顧公共利益，不要不加考慮，也不要心不在焉。不要讓刻意的修飾來點綴你的思想，不要變成話多的人，也不要為太多的事忙。\n還有，要讓你內在的神，守護一個活生生的人：這個人有男子氣概，已經成年，投身公共事務，是羅馬人，是統治者。他像等候信號的人那樣，站穩自己的崗位，那信號是召他離開人生的；他隨時準備好離去，不需要誓言，也不需要任何人作證。\n也要保持愉快，不求外來的幫助，也不求別人給的安寧。所以一個人要自己站直，而不是被別人扶著站直。","如果你在人的生活裡，發現有什麼比正義、真理、節制、堅忍更好——總之，比你的心靈對於自己依正確的理性所做的事、以及對於未經你選擇就分派給你的處境所感到的自我滿足更好——如果，我說，你看到有什麼比這更好，就用全部的靈魂轉向它，享受你找到的那個最好的。\n但如果沒有任何東西顯得比那植於你內心的神更好；這個神已讓你所有的欲望服從它，仔細審察每一個印象，並且像蘇格拉底說的，已經脫離感官的誘惑，使自己服從眾神，又關懷人類；如果你發現其他一切都比這個更小、更不值錢，那就不要給別的東西讓位。因為一旦你偏過去、傾向它們，你就不能再毫不分心地偏愛那屬於你自己、真正是你的好東西。拿大眾的讚美、權力、或享受快樂這類東西，去和合乎理性、合乎公共利益（或者說，合乎實踐）的善競爭，是不對的。這一切，即使一開始似乎只在小範圍內遷就（那些更好的事物），也會一下子占上風，把我們帶走。\n所以，我說，你要單純而自由地選擇更好的，並且堅持它。——但有用的才是更好的。——那麼，如果它對你這個有理性的存在有用，就堅持它；如果只對你這個動物有用，就直說，並且不帶傲慢地守住你的判斷。只是要注意，你是用可靠的方法在做這個探究。","絕不要把這些事當作對你有利：逼你違背諾言、失去自尊、恨任何人、猜疑、咒罵、演戲，或渴望什麼需要牆壁與帷幕才能做的事。\n因為一個人若把自己的理智、內在的神靈，和對其卓越的崇敬，看得比一切都重，他就不演悲劇角色，不呻吟，既不需要孤獨，也不需要眾多的陪伴。而且，最重要的是，他活著時既不去求死，也不躲死；他的靈魂被封閉在身體裡的時間是長是短，他毫不在乎。因為即使必須立刻離去，他也會像要去做任何其他可以體面而有序完成的事那樣，隨時啟程。他一生只留心一件事：他的思想不要偏離任何屬於有理智的生物、屬於公民共同體一員所該有的東西。","在一個受過磨練、純淨的人心裡，你找不到污穢，找不到不潔，也找不到表面長了皮、底下潰爛的傷口。命運找上他的時候，他的人生也不會是殘缺的，不像人們說某位演員，戲還沒演完就離開了舞台。此外，他身上沒有奴性，沒有做作，沒有被（其他事物）綁得太緊，也沒有（與其他事物）割裂，沒有任何值得責備的地方，沒有任何尋找藏身處的東西。","尊重那個產生意見的能力。你的主宰之心裡，會不會有任何和自然、和有理性的生物的構造不一致的意見，完全看這個能力。它向你保證：不倉促下判斷，對人友善，順從眾神。","所以，把一切都丟開，只抓住這幾件事。還要記住：每個人只活在這個當下，它是不可分的一點，生命的其餘部分，不是已經過去，就是還不確定。所以每個人活的時間很短，他住的地球一角很小，最長久的身後名聲也很短，而且它只靠一代又一代可憐的人延續，他們很快就會死，連自己都不認識，更不用說很久以前死去的那個人。","在已經提到的這些幫助之外，再加上這一條：對眼前的事物，替它下個定義或描述，讓你清楚看到它的實質是什麼樣子，看到它赤裸、完整、全面的樣子，並且對自己說出它專屬的名稱，以及構成它的各種東西的名稱，和它將分解成的東西的名稱。\n因為沒有什麼比這更能提升心靈：能夠有條理地、如實地檢驗生活中呈現在你面前的每個對象，並且總是這樣去看事物：同時看到這是個怎樣的宇宙，每一事物在其中有怎樣的用處，每一事物相對於整體有什麼價值，相對於人又有什麼價值——人是至高之城的公民，其他所有城邦都像它的家庭。也看到每一事物是什麼，由什麼構成，現在給我留下印象的這個東西，它的本性能持續多久，我對它需要什麼德性，例如溫和、勇敢、真誠、忠實、純樸、知足，等等。\n所以，一個人在每個場合都該說：這來自神；這是依命運之線的分配與紡織，以及諸如此類的巧合與偶然；而這是來自同一族類的人，是親族與夥伴，只是他不知道什麼合乎他的本性。但我知道，所以我依合群的自然法則，以善意與正義待他。然而同時，在無關緊要的事上，我試著確定每一件的價值。","如果你做眼前的事，遵循正確的理性，認真、有力、平靜，不讓別的事使你分心，而是保持你那神聖的部分純淨，好像必須立刻把它交還一樣；如果你守住這一點，不期待什麼，不害怕什麼，只滿足於當下合乎自然的行動，你說的每一句話、發出的每一個聲音，都帶著英雄般的真誠，你就會活得幸福。沒有人能阻止這一點。","就像醫生總是備好器械和手術刀，應付隨時需要他們技術的情況，你也要隨時備好原則，用來理解神聖與人間的事。做每一件事，即使最小的，都記得把神聖與人間彼此聯結的那條紐帶。因為你若不同時參照神聖的事，就做不好任何與人有關的事；反過來也一樣。","不要再漫無目的地遊蕩了。因為你已經沒有機會讀自己的備忘錄、古羅馬人和希臘人的事蹟，以及你為晚年留下的那些書中選段。所以，趕快走向你眼前的目標，丟開空洞的希望。如果你還在乎自己，就趁還有能力，救自己一把。","他們不知道，偷、播種、買、保持安靜、看出該做什麼，這些詞所指的有多少事。因為這不是靠眼睛完成的，而是靠另一種視覺。","身體、靈魂、理智：感覺屬於身體，欲望屬於靈魂，原則屬於理智。透過表象接收事物形象的印象，連動物也有；被欲望的繩線拉扯，野獸有，把自己變成女人的男人有，法拉里斯與尼祿之流也有；而擁有引導人去做看起來合適之事的理智，連不信眾神的人、出賣祖國的人、關上門做不潔之事的人也有。\n那麼，如果我提到的這些人，其他一切都與你相同，剩下的就是好人才獨有的：對發生的事、對為他紡的那條線感到歡喜與滿足；不玷污植在他胸中的神性，也不用一大堆影像去擾亂它，而是保持它的平靜，像順從一位神那樣順從它，既不說違背真理的話，也不做違背正義的事。即使所有人都不肯相信他過著單純、謙遜、知足的生活，他也不對其中任何人生氣，也不偏離那條通向生命終點的路。一個人應當純潔、平靜、準備好離去，毫不勉強地與自己的命運完全和解，走到那個終點。"],["內在的主宰之心只要合乎本性，面對發生的事，總能輕易順著眼前可能的處境走。它不挑特定的材料，而是在條件允許下朝目標前進；碰到阻礙，就把阻礙變成自己的材料。\n就像火：東西一落進去，就被它抓住。一盞小燈也許會被這些東西壓熄，但火燒旺了，很快就把堆上來的全吞下、燒盡，還靠它們燒得更高。","什麼事都別漫無目的地做，也別違背技藝完善的原則。","人總想替自己找個清靜的地方：鄉下的房子、海邊、山裡。你也常常這樣想要。但這是最平庸的人才有的念頭，因為你隨時都能退回自己心裡，不必去別處。人去哪裡，都不如退進自己的靈魂來得安靜、不受打擾；尤其是心裡有幾條想法的人，只要看一眼，立刻全然平靜。我說的平靜，不過就是心裡井然有序。\n所以要常常給自己這樣一處退路，讓自己重新振作。備好幾條簡短而根本的原則，一回到它們身上，就足以把靈魂洗乾淨，讓你不帶一點不滿，回到你原本要回去的事物裡。你對什麼不滿？對人的惡嗎？想想這幾個結論：理性的生物是為了彼此而存在；忍耐是正義的一部分；人做錯事不是出於自願；再想想多少人彼此敵對、猜疑、憎恨、廝殺，最後都躺下死去，化成灰。然後，你終於可以安靜了。\n——也許你是對宇宙分給你的東西不滿。那就回想這個二選一：不是有天意，就是原子［事物偶然的聚合］；或者回想那些證明世界像一座城邦共同體的論證［然後終於可以安靜了］。\n——也許身體的事還是纏著你。那就想想：心智一旦抽身出來，認識了自己的力量，就不再和氣息混在一起，不論那氣息平順還是猛烈；也想想你聽過、也同意的，關於痛苦與快樂的那些道理［然後終於可以安靜了］。\n——也許是對名聲的欲望在折磨你。那就看看一切多快被遺忘，看看［現在］前後兩邊無限時間的混沌，看看喝采多空洞，稱讚你的人多反覆、多沒判斷，名聲能傳到的範圍多狹小［然後終於可以安靜了］。整個大地不過是一個點，你住的只是其中一個小角落；那裡有多少人，又是些什麼樣的人會稱讚你。\n所以，記得退回你自己這一小塊天地。最要緊的是不分心、不緊繃，保持自由，並且用一個人、一個人類、一個公民、一個終有一死的存在的眼光看事情。\n在你最順手可以回頭翻看的想法裡，要有這兩條。第一，事物碰不到靈魂：它們在外面，原地不動；我們的擾動只來自內在的意見。第二，你眼前這一切，轉眼就會改變，不再存在；時時記得，你已經親眼看過多少這樣的變化。宇宙就是變化，生活就是意見。","如果我們的心智是共有的，那讓我們成為理性生物的理性也是共有的。既然如此，指示我們該做什麼、不該做什麼的理性也是共有的；既然如此，就有共同的法；既然如此，我們就是同胞公民；既然如此，我們同屬一個城邦共同體；既然如此，世界就某種意義上是一個國家。\n除了這個，還有什麼共同體，能讓人說全人類都是它的成員？我們的心智能力、推理能力、守法的能力，也都從這個共同體來，不然從哪裡來？就像我身上屬土的部分來自某處的土，屬水的部分來自另一種元素，熱的、火的部分來自某個特定來源（因為無中不能生有，也沒有東西會歸於不存在），心智的部分也一定有它的來源。","死和出生一樣，是自然的奧祕：同樣的元素組合起來，又分解回同樣的元素。總之，這不是誰該覺得羞恥的事，因為它不違背理性生物［的本性］，也不違背我們身體構造的道理。","這樣的人做出這樣的事，是自然的，也是必然的。不肯接受，就像不讓無花果樹有汁液。無論如何要記得：很快你和他都會死，不久連名字也不剩。","拿掉你的意見，「我受到傷害了」這句抱怨就沒了；抱怨沒了，傷害也就沒了。","不會讓人變得更壞的東西，也不會讓他的生活變得更壞；不論從外面還是從裡面，都傷不了他。","對［全體］有益的事，本性逼著它非這樣做不可。","想想看，凡是發生的事，發生得都是公正的。仔細觀察，你會發現確實如此。我說的不只是事物環環相扣，而是就公正來說，好像有一個人按每樣東西的價值在分派。\n所以照你已經開始的那樣繼續觀察。做任何事，都要同時做到「良善」，也就是在人們正確理解的意義上的良善。每一個行動，都守住這一點。","別照那個對你不義的人看事情的方式去看，也別照他希望你看的方式去看，要照事情本來的樣子看。","要隨時備好兩條規則。第一，只做主宰與立法的理性為了人的益處所建議的事。第二，如果有人在旁邊糾正你，讓你放棄某個意見，就改變你的意見。但改變只能出於信服，例如因為那樣是公正的、對大家有益的，諸如此類；不能因為看起來愉快，或能換來名聲。","你有理性嗎？有。——那為什麼不用？只要它做好自己的工作，你還想要什麼？","你曾經是一個部分。你將消失在生出你的那個東西裡；更準確地說，你會經過轉化，被收回它那種子般的原理之中。","同一座祭壇上有許多粒乳香：有的先落，有的後落，沒有差別。","只要回到你的原則，回到對理性的敬重，不出十天，現在把你當野獸、當猿猴的人，就會把你當神看。","別做得好像還有一萬年可活。死亡就懸在頭上。趁還活著，趁還做得到，好好做個良善的人。","不去看鄰人說什麼、做什麼、想什麼，只看自己做的事是否公正純潔，能省掉多少麻煩。就像阿伽通說的：別東張西望別人敗壞的品行，只順著直線往前跑，不偏離。","一心渴望死後留名的人，沒想到每個記得他的人很快也會死，接著繼承他們的人也一樣，直到整份記憶在一群愚蠢地讚嘆、又隨即消逝的人之間一路傳下去，終於完全熄滅。\n就算記得你的人都不死，記憶也不滅，這對你有什麼用？我說的不是對死人，而是對活人。稱讚是什麼，除非它多少真有些用處？你現在不合時宜地拒絕了自然的賜予，卻抓著別的東西不放……","凡是以任何方式稱得上美的，本身就是美的，美到它自己為止，稱讚並不是它的一部分。東西不會因為被稱讚而變壞或變好。我也這樣看一般人所說的美的東西，例如器物和藝術作品。\n真正美的東西什麼也不缺，就像法律、真理、仁愛、謙遜。這些有哪一樣是因為被稱讚才變美，或因為被責備而毀壞的？一顆翡翠，會因為沒人稱讚就變差嗎？黃金、象牙、紫袍、七弦琴、小刀、一朵花、一叢灌木呢？","如果靈魂繼續存在，空氣怎麼從永恆以來一直容得下它們？——那大地又怎麼容得下從那麼久遠以來埋下去的人的身體？這些身體在這裡停留一陣子（不論多久）就變化、分解，為其他死去的身體騰出位置；同樣，被移到空氣中的靈魂，存續一陣子之後也被轉化、擴散，被宇宙那種子般的智性接納而具有火的性質，如此給新來的靈魂騰出位置。這是假設靈魂繼續存在時，人可以給的回答。\n但我們不只要想到這樣被埋葬的身體有多少，也要想到每天被我們和其他動物吃掉的動物有多少。多少被吃掉，在某種意義上埋進了吃牠們的身體裡！然而大地還是容得下，因為牠們［的身體］變成血，再變成氣或火的元素。\n這件事的真相該怎麼探究？把它分成質料的部分和形式之因［形式的部分］。（見第七卷第二十九則）","別被捲得團團轉。每個動作都顧到正義，每個印象出現時，都守住你的理解能力［或領會能力］。","宇宙啊，凡與你和諧的，也與我和諧。凡在你的時機到來的，對我不早也不晚。大自然啊，你的季節帶來的一切，對我都是果實：萬物出自你，在你之中，歸於你。詩人說：親愛的刻克洛普斯之城；你不也該說：親愛的宙斯之城嗎？","哲人說，想要平靜，就少做點事。——不如這樣說更好：做必要的事，做天生合群的動物的理性所要求的事，而且照它要求的方式做。這樣得到的，不只是做得好的平靜，也是少做事的平靜。\n我們說的、做的，大部分都不必要；把這些拿掉，就有更多空閒、更少不安。所以每一次都該問自己：這是不是不必要的事之一？而且不只要去掉不必要的行為，也要去掉不必要的念頭，這樣多餘的行為才不會跟著出現。","試試看良善之人的生活適不適合你：他滿足於自己在整體中分到的那一份，滿足於自己公正的行為和仁善的心意。","那些事你看過了嗎？也看看這些。別擾亂自己。讓自己全然單純。有人做錯事？他錯待的是他自己。有什麼事落在你身上？很好；從一開始，宇宙裡發生的一切就已經替你分配好、紡織好了。\n總之，你的生命很短。要靠理性和正義，把現在用在有益的地方。就連休息，也要清醒節制。","不是井然有序的宇宙，就是一團擠在一起的混沌，但無論如何仍是一個宇宙。難道你裡面能有某種秩序，整體裡面卻是無序？何況萬物這樣分離、擴散，卻仍彼此相感。","陰沉的性格，軟弱像婦人的性格，頑固的性格，野獸般的、孩子氣的、畜牲般的、愚蠢的、虛偽的、粗俗的、詐欺的、暴虐的性格。","不知道宇宙裡有什麼的人，是宇宙的陌生人；不知道宇宙裡正在發生什麼的人，同樣是陌生人。逃避合群的理性的人是逃亡者；閉上理解之眼的人是瞎子；自己不夠、要向別人討生活所需的人是窮人。\n因為不滿意所發生的事就退出，把自己從共同本性的理性分開的人，是宇宙上的一個膿瘡，因為產生這件事的是同一個自然，也是它產生了你。把自己的靈魂從理性生物那唯一的靈魂撕開的人，是從國家身上扯下來的一塊碎片。","一個哲人沒有外袍，另一個沒有書，還有一個半裸著說：我沒有麵包，但我守住理性。——我也不靠自己的學問謀生，但我守住［我的理性］。","愛你學的那門技藝，不論多微不足道，並且以它為滿足。其餘的人生，就像把自己的一切全心託付給眾神的人那樣過，不做任何人的暴君，也不做任何人的奴隸。","比方想想維斯帕先的時代。你會看到這一切：人們結婚、養兒育女、生病、死亡、打仗、宴飲、做買賣、種田、奉承、傲慢固執、猜疑、陰謀、盼某些人死、抱怨現況、談戀愛、囤積財富、渴望執政官的位子和王權。可是這些人的生活，如今一點也不剩了。再回到圖拉真的時代，一切又是一樣，他們的生活也消逝了。同樣地，也看看其他時代和整個民族，看有多少人用盡力氣之後很快倒下，分解成元素。\n但最該想的，是你自己認識的人：他們為空虛的事務煩亂，忽略了照自己本有的構造該做的事，沒有守住它、以它為滿足。這裡要記得，對每件事投入多少注意，各有其應有的價值與分寸。這樣，你對較小的事只投入適當的程度，就不會不滿。","過去常用的詞，如今已經過時；同樣，古時有名的人，名字也多少過時了：卡米盧斯、凱索、沃盧蘇斯、列奧納圖斯，稍後有西庇阿和加圖，接著是奧古斯都，再後來是哈德良和安東尼努斯。一切很快都會消逝，成為單純的傳說，徹底的遺忘很快把它們埋掉。我說的還是那些曾經光芒萬丈的人。至於其他人，一吐出最後一口氣就不見了，沒人再提起。\n說到底，就連永恆的記憶又是什麼？什麼也不是。那麼，什麼才值得我們認真費心？只有這幾件：公正的思想，合群的行為，從不說謊的話，以及一種欣然接受一切發生之事的心境，把它們看作必然、尋常，出自同一個原理與源頭。","自願把自己交給克洛托［命運三女神之一］，讓她把你的線紡進她喜歡的任何事物裡。","一切都只是一天的事，記得的和被記得的都是。","要時時觀察：萬物都藉著變化而生；也要習慣這樣想：宇宙的本性最喜歡的，莫過於改變現有的事物，再造出和它們相似的新事物。凡存在的，在某種意義上都是將來之物的種子。但你只想到播進土裡或子宮裡的種子：那想得太粗淺了。","你快要死了，卻還不單純，還沒擺脫擾動，還在猜疑「外界的事會傷害我」，對所有人也還沒有善意；也還沒有把智慧只放在公正行事上。","去看看人們的主宰之心，連智者的也要看，看他們避開什麼，追求什麼。","對你來說是惡的東西，不在別人的主宰之心裡，也不在你肉身外殼的任何轉變和變化裡。那它在哪？在你身上那個形成「關於惡的意見」的能力裡。只要這個能力不形成［那樣的］意見，一切就都好。\n即使離它最近的那個可憐身體被割、被燒、滿是膿血與腐爛，也讓形成這些意見的部分保持安靜；也就是讓它判斷：凡是壞人好人都可能碰到的事，既不是壞，也不是好。因為違反本性生活的人和順應本性生活的人都會碰到的事，既不合乎本性，也不違反本性。","要時時把宇宙看作一個活的生命，有一個實體、一個靈魂；看萬物如何都歸於這唯一的知覺，也就是這一個活的生命的知覺；看萬物如何以同一個運動行動；如何共同造成一切存在之物；也看那線不停地紡，那網一路織成。","你是一個小小的靈魂，扛著一具屍體，就像愛比克泰德常說的（卷一第十九章）。","事物經歷變化不是惡，事物因變化而得以存續也不是善。","時間像一條由發生的事件構成的河，而且是急流：一樣東西才剛看見，就被沖走，另一樣補上它的位置，而這一樣也會被沖走。","凡發生的一切，都像春天的玫瑰、夏天的果實一樣熟悉尋常；疾病、死亡、誹謗、背叛，以及一切讓愚人高興或煩惱的事，也都如此。","事物的序列裡，後來的總是和先前的恰好契合。這個序列不像只是把互不相連的東西一個個列出來，只有一種必然的先後，而是一種合乎理性的聯繫。就像一切存在之物被和諧地安排在一起，生成的事物呈現的也不只是接續，而是一種奇妙的關聯（見第六卷第三十八則；第七卷第九則；第七卷第七十五則註）。","要一直記得赫拉克利特的話：土之死是變成水，水之死是變成氣，氣之死是變成火，反過來也一樣。\n也要想到那個忘了這條路通向哪裡的人；想到人們和他們最常相處的東西吵架，也就是治理宇宙的理性，而他們天天碰到的事，在他們看來卻很陌生。\n也要想到，我們不該像睡著了那樣行事說話，因為即使在睡夢中，我們也彷彿在行動、在說話；還有，我們不該像向父母學習的孩子那樣，人家怎麼教就怎麼做、怎麼說。","如果有神告訴你，你明天會死，或者肯定後天會死，除非你極度怯懦，否則你不會太在意是第三天還是明天，這差別多小！所以也要想，在多少年之後才死，而不是明天死，也不是什麼大事。","要常常想：多少醫生，在無數次為病人皺眉之後死了；多少占星家，在大言不慚地預言別人的死之後死了；多少哲學家，在關於死亡或不朽的無盡討論之後死了；多少英雄，殺了成千上萬的人之後死了；多少暴君，曾以可怕的傲慢使用握在手裡的他人生死大權，好像自己不會死，卻也死了；多少城市，可以說整座死去了，赫利刻、龐貝、赫庫蘭尼姆，還有無數別的城市。\n再把你自己認識的人，一個接一個加進去：一個人埋了另一個人，自己被安放為死者，又有人來埋他；而這一切都在短短的時間裡發生。總之，要永遠看清人間的事多短暫、多不值錢：昨天還是一小團黏液的，明天就是木乃伊或灰燼。\n所以，就照本性過完這短短的一小段時間，滿足地結束你的旅程，像橄欖成熟時落下，祝福生出它的自然，感謝它生長其上的那棵樹。","要像那個海岬，海浪不停拍打，它卻屹立不動，把周圍水的狂怒都馴服了。\n「這事落在我身上，我真不幸。」不是這樣的；而是：「這事雖然落在我身上，我卻是幸福的，因為我仍不受痛苦，既不被現在壓垮，也不怕未來。」這樣的事可能發生在每個人身上，但不是每個人碰到都能不受痛苦。那為什麼只把這件事叫不幸，卻不把它叫幸運？\n你是不是把凡是不偏離人的本性的事，都稱為人的不幸？一件事若不違背人的本性的意願，你還會說它偏離人的本性嗎？好，你知道自然的意願。那麼，這件事會妨礙你公正、寬宏、節制、審慎，妨礙你不被輕率的意見和虛假所害嗎？會妨礙你擁有謙遜、自由，以及其他一切嗎？有了這些，人的本性才得到屬於它自己的全部。\n每當有什麼事讓你煩惱，也要記得用這條原則：不是這件事不幸，而是高貴地承受它，才是幸運。","要看輕死亡，有個粗淺卻有用的辦法：回頭看那些死命抓著生命不放的人。他們比早死的人多得到了什麼？終究還是躺在某處的墳墓裡，卡狄基阿努斯、法比烏斯、尤利阿努斯、雷必達，或任何跟他們相似的人，他們曾把許多人抬去埋葬，然後自己也被抬出去。\n總之，［生與死之間］的間隔很短；想想這段間隔是費了多少力氣、和什麼樣的人為伴、在多麼衰弱的身體裡辛苦度過的。所以別把生命看得有什麼價值。看看你身後無邊的時間，和你面前另一片無盡的空間。在這無限裡，活三天的人和活三代的人，有什麼差別？","永遠走捷徑；捷徑就是合乎本性的。所以一切言行都要合乎最健全的理性。這樣的目標讓人免於麻煩、紛爭，也免於一切矯飾與炫耀。"],["早上不想起床的時候，先想這一句：我起床，是要去做一個人該做的事。既然我是為了這件事才存在、才被帶到這世上，我還有什麼好不甘願的？難道我生來就是為了縮在被窩裡取暖？——可是這樣比較舒服。——那你是為了享樂才存在，完全不是為了行動、為了努力嗎？\n你沒看見小草小樹、小鳥、螞蟻、蜘蛛、蜜蜂，都在工作，各自把宇宙裡屬於它們的那一角整理好嗎？你卻不肯做一個人的工作，不趕快去做合乎你本性的事？——可是也得休息。——是得休息。但自然對這件事也定了限度，就像對吃喝定了限度。吃喝你會超過，吃到超過足夠的量；做事卻相反，你總是停在還做得到的地方之前。\n所以你並不愛自己，因為真愛的話，你會愛自己的本性，也愛她的意願。那些愛自己技藝的人，為了鑽研，累到不洗澡、不吃飯；你重視自己的本性，卻比不上車工重視車削、舞者重視舞蹈、愛財的人重視他的錢、愛虛名的人重視他那一點名聲。這樣的人一旦對什麼事有了強烈的熱情，寧可不吃不睡，也要把在乎的事做到完善。難道在你眼裡，為群體做的事反而比較低賤，比較不值得你花力氣？","要擊退、抹掉每一個讓人困擾或不合宜的印象，立刻回到全然的平靜，其實很容易。","凡是合乎本性的話和行為，都要認定適合你；別被隨之而來的任何人的責備或閒話帶偏。一件事該做、該說，就別覺得配不上你。那些人有他們自己的主宰之心，照他們自己的方式動；你別管這些，只管一直往前走，順著你自己的本性，也順著共同的本性；這兩條路其實是同一條。","我走過依本性發生的事，一直走到倒下安息：把氣息吐回我每天從中吸氣的那個元素，倒在那片土地上。我的父親從這片土地取得種子，母親取得血液，乳母取得乳汁；這麼多年，我的飲食都由它供給；我為了各種目的踩它、糟蹋它，它仍然承載著我。","你說，別人看不出你頭腦敏銳。——就算是吧。但還有許多事，你不能說「我天生就不是這塊料」。那就把完全在你能力內的品質拿出來：真誠、莊重、能吃苦、不貪享樂、對自己的一份和少量的東西知足、仁善、坦率、不愛多餘、不輕浮、寬宏。\n你沒看見嗎？有多少品質你馬上就能做到，那裡面沒有「天生不行、不適合」這種藉口，你卻還是自己甘願停在標準之下。還是說，你是因為天生條件不夠，才不得不抱怨、吝嗇、奉承、嫌棄自己那可憐的身體、想討好別人、大肆炫耀、心裡這樣躁動不安？不，憑眾神起誓，不是這樣；這些毛病，你早就可以甩掉了。\n只有一點：如果你真的算得上有些遲鈍、領悟慢，那就在這一點上下功夫，既不放著不管，也別對自己的遲鈍沾沾自喜。","有人幫了別人一個忙，就準備好把它記上帳，當作施過的恩惠。另一個人不這樣記帳，但心裡還是把對方當成欠他的人，而且清楚知道自己做了什麼。第三個人，可以說連自己做了什麼都不知道，他像一株結了葡萄的葡萄藤，結出該結的果實，就不再多求什麼。馬跑完了，狗追到了獵物，蜜蜂釀好了蜜，也都一樣；人做了好事，同樣不會大聲叫人來看，而是接著去做下一件，就像葡萄藤到了季節，又繼續結葡萄。\n——那麼，人就得屬於這一類，也就是在某種程度上做了好事卻沒有察覺的人嗎？——是的。——可是偏偏有一點是必要的：察覺自己在做什麼。有人會說，合群的動物有個特徵，就是感覺得到自己是以合群的方式在工作，而且希望夥伴也感覺得到。\n——你說的是真的，但你沒有正確理解我現在說的話：照你那樣想，你就會變成我先前說的那幾種人之一，因為他們也是被一種看似有理的說法誤導了。只要你肯去理解這些話的意思，就不必擔心因此漏掉任何合群的行為。","雅典人有一句祈禱：降雨吧，降雨吧，親愛的宙斯啊，降在雅典人耕過的田上，降在平原上。——說真的，我們要嘛根本不該祈禱，要嘛就該這樣單純而高貴地祈禱。","說「阿斯克勒庇俄斯給這個人開了處方：騎馬運動、洗冷水澡，或赤腳走路」，我們聽得懂；同樣，說「宇宙的本性給這個人開了處方：疾病、殘缺、損失，或其他類似的事」，也要這樣聽懂。因為前一句裡，「開處方」大致是說：他給這個人開了這樣東西，當作適合帶來健康的辦法。後一句的意思是：發生［或適合］在每個人身上的事，是依他的命運，恰當地為他定下的。\n我們說事物「適合」我們，就是這個意思，像工匠說牆或金字塔上方整的石頭「適合」，是指它們彼此以某種方式契合。總共只有一種契合［和諧］。宇宙是由所有物體組成，成為現在這樣的一個物體；必然［命運］也是由所有存在的成因組成，成為現在這樣的一個成因。就連完全無知的人也懂我的意思，因為他們會說：它［必然、命運］把這個帶給了某某人。——所以這是帶給他的，這是給他開的處方。\n那就讓我們接受這些，就像接受阿斯克勒庇俄斯開的處方。他的處方裡，有很多本來就令人不快，我們還是為了盼著健康而接受。要讓共同的自然判定為善的事，它的完成與實現，在你看來和你的健康是同一類的事。所以，對一切發生的事都要接受，即使看來令人不快，因為它通向這裡：宇宙的健康，以及宙斯［宇宙］的興盛與幸福。如果某件事對整體沒有用處，他就不會把它帶給任何人。任何事物的本性，不論是什麼，也不會引出不適合它所指引之物的事。\n所以，對落在你身上的事感到滿足，有兩個理由。第一，它是為你做的，為你開的處方，在某種意義上和你有關，從最古老的成因起，就和你的命運一起紡成。第二，即使是分別落在每個人身上的事，對治理宇宙的力量來說，也是幸福與完善的一個原因，甚至是它自身得以延續的原因。因為，從各部分或各成因的連結與連續中，不論切掉什麼，整體的完整都會受損。你不滿意的時候，想把什麼東西擺到一邊去，就是在盡你所能地切斷。","如果你沒能事事合乎正確的原則，別厭惡、別氣餒、別不滿；失敗了就再回來。只要你做的事大部分合乎人的本性，就知足，並愛你回到的這件事。也別把回到哲學當成回到主人那裡，而要像眼睛痛的人，敷一點海綿和蛋白，或像另一個人貼藥膏，或用水沖洗。這樣，你就不會不順從理性，還能在其中安息。\n要記得，哲學所要求的，只是你的本性所要求的；是你自己想要別的、不合乎本性的東西。——也許有人反對說：那還有什麼比［我正在做的］這件事更令人愉快？但快樂不正是這樣欺騙我們的嗎？再想想：寬宏、自由、單純、平靜、虔敬，是不是更令人愉快？想到一切靠理解與知識這種能力而得的安穩與順遂，還有什麼比智慧本身更令人愉快？","事物被層層包裹，包得連哲學家都覺得完全無法理解——不是少數幾個，也不是普通的哲學家；就連斯多亞學派自己，也覺得難懂。而我們所有的同意都會變，因為哪有從不改變的人？\n那就把思想帶到事物本身，想想它們多短暫、多沒價值，它們可能落在骯髒的可憐蟲、娼妓或強盜手裡。然後轉頭看和你同住的人的品行，即使其中最可親的，也幾乎讓人受不了，更別說人連忍受自己都幾乎辦不到。\n在這樣的黑暗與污穢裡，在實體與時間、運動與被推動之物這樣不停地流變中，我想不出有什麼值得高度珍視，甚至值得認真追求。相反地，人的本分是安慰自己，等著自然的消解，不為拖延煩惱，只在這兩條原則裡安息：第一，不合乎宇宙本性的事，不會落在我身上；第二，我永遠可以不做違背我的神與內在神靈的事，這是我做得到的，因為沒有人能強迫我違背它們。","我現在把自己的靈魂用在什麼上？每一次我都該這樣問自己，並且查看：我身上那個他們稱為主宰之心的部分，現在裡面是什麼？我現在有的是誰的靈魂：孩子的、年輕人的、軟弱婦人的、暴君的、家畜的，還是野獸的？","多數人眼中的善是什麼樣子，從這件事就能看出來。如果有人把審慎、節制、公正、堅毅當作真正的善，他先這樣想了，就聽不進任何與真正的善不和諧的話。但如果一個人先把多數人眼中的善當成善，他就聽得進去，還會欣然接受喜劇作家說的那句話，覺得非常貼切。連多數人也看得出這個差別。不然，這句話在［第一種情形下］就不會冒犯人、不會被拒絕，而一提到財富，和助長奢華與名聲的東西，我們卻接受它，覺得說得恰當又機智。\n那就繼續問下去：那些東西，我們該不該看重，認為它們是善？心裡這樣想過之後，喜劇作家的話就可以恰當地用在它們身上：擁有它們的人，因為富足過了頭，竟找不到一個地方可以解手。","我是由形式和質料組成的；兩者都不會化為不存在，正如兩者都不是從不存在而來。所以我的每一部分，都會經過變化，變成宇宙的某一部分，那一部分又會變成宇宙的另一部分，如此永遠下去。靠著這樣的變化，我存在，生下我的人也存在，往另一個方向也永遠如此。即使宇宙是照確定的週期［循環］治理的，也沒有什麼妨礙我們這樣說。","理性和推理的技藝［哲學］，是對它們自己和它們自己的作為都足夠的能力。它們從屬於自己的第一原理出發，朝著被給定的目標前進；所以這類行為叫做「卡托爾托塞斯」，也就是正確的行為，這個詞的意思是它們走的是正確的路。","凡不屬於人（作為人）的東西，都不該稱為人的。它們不是對人的要求，人的本性也沒有應許它們，也不是人的本性達成目的的手段。所以，人的目的不在這些東西裡，幫助達成這個目的的也不在其中，而幫助達成這個目的的，就是善。\n再說，如果這些東西有任何一樣屬於人，那人輕視它們、和它們對抗就不對了；表明自己不想要這些東西的人，也不值得稱讚；如果它們真是善，那在其中任何一樣上對自己有所節制的人，也不會是善的。可事實是：一個人越是剝奪自己這些東西，或其他類似的東西，甚至被剝奪了其中一樣時越能耐心忍受損失，他就越是個更好的人。","你習慣怎麼想，心靈的性格就會是什麼樣，因為靈魂是被思想染色的。那就用一連串這樣的思想來染它：比方，人在哪裡能活，在哪裡就能活得好。但他必須住在宮殿裡；那麼，他在宮殿裡也能活得好。\n再想想，每樣東西是為了什麼目的而構成，就是為此而構成，也朝這個方向被帶動；它的目的就在被帶往之處；目的所在之處，也就是每樣東西的利益與善所在之處。而對理性的動物來說，善就是群體；我們是為群體而生的，前面已經說明過了。難道不明顯嗎：低等的為高等的而存在？有生命的高於沒有生命的，有生命的之中，有理性的更高。","追求不可能的事，是瘋狂；而壞人不做這類事，是不可能的。","凡落在任何人身上的事，都是他天生承受得了的。同樣的事落在另一個人身上，他要嘛沒看出事情已經發生，要嘛想表現出偉大的氣魄，於是穩穩站著，毫髮無傷。無知和自負竟然比智慧更強，實在可恥。","事物本身完全碰不到靈魂，一點也碰不到；它們進不了靈魂，不能轉動、也不能推動靈魂。只有靈魂自己轉動、推動自己，它認為該作什麼判斷，就替自己把眼前的事物作成那個樣子。","有一方面，人是離我最近的，因為我必須對人行善，也必須忍受他們。但如果有些人阻礙了我該做的事，人對我就成了無關緊要的事物之一，和太陽、風、野獸沒有兩樣。這些的確可能妨礙我的行動，但妨礙不了我的意向和心境，因為意向和心境有能力隨情況應變、改變。心智會把每一個阻礙它活動的東西，轉成幫助；於是阻礙成了行動的助力，路上的障礙成了幫我們前進的東西。","要敬重宇宙裡最好的東西；它就是運用並指引萬物的那一個。同樣地，也要敬重你自己身上最好的東西；它和那一個是同一類。因為在你身上，運用其他一切的也是它，你的生命也由它指引。","不傷害國家的，也不會傷害公民。每次出現任何傷害的樣子，就用這條規則：國家沒有因此受傷，我也沒有受傷。如果國家受了傷害，你也不可以對傷害國家的人發怒。要告訴他錯在哪裡。","要常常想到事物消逝得多快，不論是已經存在的，還是正在生成的。實體像一條不停流動的河，事物的活動不斷變化，成因以無窮的樣式運作，幾乎沒有一樣東西是靜止的。再想想近在你身邊的，過去與未來那片無邊的深淵，萬物都消失在裡面。\n這樣看來，為這些事自負，或為它們受苦、讓自己悲慘的人，豈不是愚蠢？它們困擾他，也只是一時，而且是很短的一時。","想想宇宙的實體，你分到的只是極小的一份；想想宇宙的時間，分給你的只是短短一段不可再分的間隔；想想命運所定的一切，你只是其中多麼小的一部分。","別人對我不義嗎？讓他自己去看著辦。他有他自己的心境，他自己的行為。我現在有的，是普遍的自然現在要我有的；我現在做的，是我的本性現在要我做的。","讓你靈魂裡那個領導、治理的部分，不被肉身裡的運動擾動，不論是快樂還是痛苦；不要和它們混在一起，而要把自己圈起來，把那些感受限制在它們各自的部位。\n但當這些感受，藉著那種天生存在於渾然一體的身體裡的另一種同感，上升到心智時，你不可以努力抵抗這個感覺，因為那是自然的。只是別讓主宰的部分，自己在感覺之上再加一個「它是好的」或「它是壞的」的意見。","與眾神一起生活。一個人若時時向眾神表明：他的靈魂滿足於分派給他的，並且做著內在神靈要它做的一切，他就是與眾神一起生活。這位神靈是宙斯給每個人的守護者和引導者，是他自己的一部分。而這就是每個人的理解與理性。","你對腋下發臭的人生氣嗎？對口臭的人生氣嗎？這種怒氣對你有什麼好處？他的嘴就是這樣，腋下就是這樣：這樣的東西，必然發出這樣的氣味。可是有人會說，這個人有理性，只要肯費心，就能發現自己哪裡冒犯人。我祝你發現得順利。好吧，那你也有理性：用你的理性去喚起他的理性，指出他的錯，勸告他。他若肯聽，你就能治好他，不需要發怒。〔不要像悲劇演員，也不要像娼妓。〕","如同你打算在離開之後生活的那樣……你在這裡也有能力那樣生活。但如果人們不容許你，那就離開生命，只是要當作自己沒有受到任何傷害。屋裡有煙，我就出去。你為什麼覺得這有什麼麻煩？只要沒有這類東西把我趕出去，我就留下，我是自由的，沒有人能阻止我做我選擇做的事；而我選擇做的，是合乎理性而合群的動物的本性所要求的事。","宇宙的智性是合群的。所以它為了高等的事物而造出低等的事物，並讓高等的彼此契合。你看它如何讓事物各有從屬、各有並列，給每樣東西分派它應得的份，並讓最好的事物彼此結為和諧。","到現在為止，你對眾神、對父母、對兄弟、對子女、對老師、對照顧你幼年的人、對朋友、對親戚、對奴僕，是怎麼對待的？想想你是否對所有人都做到了，讓人可以這樣說你——\n「從未在行為或言語上冤枉過任何人。」\n也要回想：你經歷過多少事，承受過多少事；你生命的故事如今已經完整，你的服務已經結束；你看過多少美好的事物；你輕視過多少快樂與痛苦；你拒絕過多少所謂榮耀的事物；你對多少心懷惡意的人表現過善意。","為什麼沒有技藝、沒有知識的靈魂，要來擾亂有技藝、有知識的人？那什麼樣的靈魂有技藝、有知識？就是知道起點與終點、知道貫穿一切實體的理性，也知道這理性透過全部時間、依固定的週期［循環］治理宇宙的靈魂。","很快，非常快，你就會變成灰燼，或一副骸骨，只剩一個名字，或連名字也沒有；而名字只是聲音和回響。生命中被高度重視的東西，都是空洞、腐朽、瑣碎的，［像］小狗彼此撕咬，像小孩吵架，笑，然後馬上就哭。而忠實、謙遜、公正和真理，已經逃走了：\n離開廣闊的大地，上了奧林帕斯。\n　　　　　　——赫西奧德《工作與時日》第197行\n那麼，還有什麼把你留在這裡？感官的對象容易改變、從不靜止，感知的器官遲鈍、容易接受錯誤的印象，可憐的靈魂本身不過是血的一種蒸氣；在這樣的世界裡享有好名聲，是空洞的事。那你為什麼不平靜地等著你的終點，不論那是熄滅，還是遷往另一種狀態？\n在那一刻到來之前，什麼就夠了？不就是敬拜眾神、為他們祝福，對人行善，實行忍耐和克制；至於在這可憐的肉身和氣息的界限之外的一切，要記得它既不是你的，也不在你的能力之內。","你可以讓一生在平穩流動的幸福中度過，只要你能走在正確的路上，用正確的方式思想、行動。有兩件事，是上帝的靈魂、人的靈魂、以及每個理性存在者的靈魂所共有的：不被別人阻礙；以及把善放在公正的心境和實踐公正上，並讓你的欲望在這裡找到終點。","如果這不是我自己的壞，也不是我自己的壞造成的結果，共同的福祉也沒有受損，我為什麼要為它煩惱？對共同的福祉又有什麼傷害？","別輕率地被事物的外觀帶著走，而要依你的能力和他們適不適合，給予［所有人］幫助。如果他們在無關緊要的事上受到損失，別把這想成傷害，因為那是壞習慣。要像那位老人離開時，向養子討回陀螺，記著那只是一個陀螺；你在這件事上也要這樣做。\n你在講台上叫喊的時候，人啊，你忘了這些東西是什麼了嗎？——是的；但它們對這些人來說是非常重要的事——那你也要因為這些事被弄成傻瓜嗎？我曾經是個幸運的人，但我失去了，不知道怎麼失去的。——但幸運的意思是，一個人替自己分派了一個好運；而好運就是靈魂良好的心境、良好的情感、良好的行為。"],["宇宙的實體是順服而柔順的。統治它的理性，自己沒有任何作惡的理由：它沒有惡意，不對任何事物作惡，也沒有任何事物被它傷害。萬物都依這個理性造成、完成。","只要你在盡本分，是冷是暖、是睏還是睡飽、被人說壞話還是被稱讚、正在死去還是在做別的事，都不要有差別。因為我們死去這個行為，也是生命的行為之一；所以在這件事上，只要把手上的事做好，就夠了（見第六卷第二十二、二十八則）。","向內看。別讓任何事物的獨特性質，或它的價值，從你這裡溜走。","一切存在之物，很快就會改變：要嘛化為蒸氣（如果一切實體確實為一），要嘛被分散。","統治的理性知道自己的心境是什麼，知道自己在做什麼，也知道自己在什麼材料上工作。","最好的報復，就是不要變得像［那個作惡的人］一樣。","只在一件事上享受快樂，並在其中安息：從一個合群的行為，走到下一個合群的行為，心裡同時想著上帝。","主宰之心是喚起自己、轉動自己的東西；它把自己造成它所是、也是它願意成為的樣子，同時也讓一切發生的事，在它看來都成了它願意的樣子。","每一件事，都是依宇宙的本性完成的；因為它當然不是依別的本性完成的，不論是從外面包住它的本性，還是被它包在裡面的本性，或是在它之外、又獨立於它的本性（見第十一卷第一則；第六卷第四十則；第八卷第五十則）。","宇宙要嘛是一團混亂，事物彼此糾纏、四散分離；要嘛是統一、秩序和天意。\n如果是前者，我為什麼還想留在這偶然的聚合、這種無序裡？我為什麼要在意別的，而不是自己終將變成泥土？我為什麼要煩惱？不論我怎麼做，我的元素都會分散。但如果是另一種假設，我就敬畏，我就堅定，我就信靠那位統治者（見第四卷第二十七則）。","環境逼得你多少被擾亂時，要很快回到自己，別比被逼的時間更久地失去調和。因為你一次次回到那份和諧，就會越來越能掌握它。","如果你同時有繼母和母親，你會孝順繼母，但還是會一再回到母親身邊。現在就讓宮廷和哲學，對你來說是繼母和母親：要常常回到哲學那裡，在她身上安息。有了她，你在宮廷裡碰到的事才顯得你能忍受，你在宮廷裡也才顯得讓人能忍受。","面前擺著肉和這類食物時，我們會得到這樣的印象：這是一條魚的屍體，這是一隻鳥或一頭豬的屍體；再比方，這杯法勒努斯酒只是一點葡萄汁，這件紫袍只是用貝類的血染過的一些羊毛。這類印象直達事物本身，穿透進去，於是我們看出它們是什麼東西。\n一生都該這樣做：在有些東西看起來最值得讚許的地方，就把它們剝開來，看它們沒有價值的樣子，剝掉用來抬高它們的所有詞語。因為外在的炫耀，是理性神奇的敗壞者；在你最確定自己忙的是值得費心的事時，它騙你騙得最厲害。想想克拉特斯是怎麼說色諾克拉底本人的。","大多數人讚嘆的東西，屬於最一般的那一類事物，也就是靠凝聚力或自然組織維繫在一起的，像石頭、木頭、無花果樹、葡萄藤、橄欖樹。稍微更有理性的人讚嘆的，屬於由生命原理維繫的事物，像羊群、牛群。更有教養的人讚嘆的，是由理性的靈魂維繫的事物，但不是宇宙的靈魂，只是就它是擅長某種技藝、或在某方面是行家的靈魂而言有理性，或只是就它擁有許多奴隸而言有理性。\n但是看重理性的靈魂、看重那普遍而適合政治生活的靈魂的人，除了這個，不看重別的。他最要緊的，是讓自己的靈魂處在合乎理性和群體生活的狀態與活動中，並且為此與和他同類的人合作。","有些事物正匆匆進入存在，有些正匆匆離開；而正在進入存在的，有一部分已經熄滅。運動和變化不停更新世界，就像時間不斷流動，更新無盡的年代。在這條流動、沒有一處能停留的河裡，匆匆而過的事物，有什麼是人可以看得很貴重的？這就像有人愛上一隻飛過的麻雀，可是牠已經消失在視線之外。\n每個人的生命就是這樣的東西，像血的蒸發、空氣的呼吸。吸進一口氣，又吐出去（我們每一刻都在這樣做），和把你出生時接受的整個呼吸的能力，在昨天、前天，還給你最初從中吸取它的那個元素，是同一回事。","像植物那樣蒸散，不值得看重；像家畜和野獸那樣呼吸，不值得看重；被事物的外觀留下印象，不值得看重；像木偶被線牽動那樣被欲望推著走，不值得看重；成群聚在一起，不值得看重；靠食物養活，也不值得看重，因為這就像把食物中沒用的部分分離、排出去一樣。\n那什麼值得看重？受到掌聲歡迎嗎？不。我們也不該看重舌頭的拍掌，因為多數人的稱讚，就是舌頭的拍掌。那麼，假設你已經放棄了這個叫作名聲的沒價值的東西，還剩下什麼值得看重？依我之見是這個：照你自己適當的構造去推動自己、約束自己，一切職業和技藝都通向這個目的。\n每一門技藝都以此為目標：讓造出來的東西，適合它被造出來要做的工作。種葡萄的人照料葡萄樹，馴馬的人、訓狗的人，都追求這個目的。教育和教導青年，也是朝著某個目標的；教育和教導的價值就在這裡。如果這做好了，你就不會再追求別的東西。\n難道你不會也不再看重許多別的東西嗎？不然你既不自由，也不足以靠自己得到幸福，也免不了激情。因為你必然會嫉妒、猜疑那些能奪走這些東西的人，也會對擁有你所看重之物的人設下陰謀。需要這些東西中任何一樣的人，必然完全處在擾動之中；而且他還常常要責怪眾神。\n但是敬重、尊崇你自己的心智，會讓你對自己滿足，與群體和諧，與眾神一致，也就是稱讚他們所給予和所安排的一切。","上面、下面、四周，都是元素的運動。但德性的運動不在這些之中：它是更神聖的東西，沿著一條幾乎不被察覺的路前進，快樂地走在自己的路上。","人的行為真奇怪！和自己同時代、同住的人，他們不肯稱讚，卻很看重後代的稱讚，被從沒見過、也永遠不會見到的人稱讚。這幾乎就像你因為在你之前活過的人沒有稱讚你，而難過一樣。","如果有件事你自己做起來很難，別就認定它對人是不可能的；但只要任何事對人是可能的、合乎人的本性，就要認為你自己也做得到。","在體育訓練裡，假設有人用指甲抓傷了你，用頭撞你，弄出了傷口。我們不會露出任何煩惱，不覺得被冒犯，事後也不會懷疑他是個奸詐的傢伙；但我們仍然提防他，不是把他當敵人，也不是帶著猜疑，而是平靜地避開他。生活的其他方面，也讓你的行為像這樣；對那些像運動場上的對手一樣的人，多寬容一點。因為就像我說過的，避開、不猜疑、不憎恨，是我們做得到的。","如果有人能說服我、向我證明我的想法或行為不對，我會欣然改變；因為我追求的是真理，從來沒有人因為真理受過傷害。受傷害的，是堅持自己的錯誤與無知的人。","我做我的本分，其他事不讓我煩惱；因為它們要嘛是沒有生命的東西，要嘛是沒有理性的東西，要嘛是迷了路、不認得路的東西。","對沒有理性的動物，以及一般的事物和對象，既然你有理性而它們沒有，就用寬厚大方的態度去運用它們。對人類，因為他們有理性，就用合群的態度相待。不論什麼場合，都向眾神呼求，也別為了自己要這樣做多久而困擾；因為即使這樣過了三個小時，也就夠了。","馬其頓的亞歷山大和他的馬夫，死後落到了同樣的狀態：他們要嘛被接納進宇宙同樣的種子般的原理裡，要嘛同樣被分散成原子。","想想在同一段不可再分的時間裡，我們每個人身上發生了多少事——身體的事和靈魂的事。這樣，你就不會驚訝，在那個又是一又是全、我們稱為宇宙的東西裡，有更多的事，或者說一切生成的事，同時存在於其中。","如果有人問你，安東尼努斯這個名字怎麼寫，你會繃緊嗓子把每個字母喊出來嗎？如果他們發怒，你也要跟著發怒嗎？你不會鎮靜地繼續，把每個字母一個個數出來嗎？\n同樣地，在這一生裡也要記得，每一項責任都是由一些部分構成的。你的責任是留意這些部分，不被擾亂，也不對向你發怒的人表現怒氣，繼續走你的路，把擺在面前的事完成。","不讓人去追求那些在他們看來適合自己本性、對自己有益的東西，多麼殘忍！可是你因為他們做錯事而煩惱時，在某種意義上，就是不讓他們這樣做。因為他們被推向那些事物，確實是因為他們認為那些適合自己的本性、對自己有益。但事實並非如此。那就教導他們，指給他們看，不要發怒。","死亡，是透過感官而來的印象的停止，是牽動欲望的線的停止，是思想推演運動的停止，也是服侍肉身的停止（見第二卷第十二則）。","在這一生裡，身體還沒有屈服，靈魂卻先屈服，是可恥的。","小心，別被造成一個凱撒，別被這種顏色染上，因為這類事是會發生的。所以要保持單純、善良、純潔、嚴肅、不矯飾，做正義的朋友、眾神的崇拜者，仁慈、親愛，在一切適當的行為上堅毅。努力一直做哲學希望你成為的那個樣子。敬畏眾神，幫助人們。生命短暫。這塵世的生活只有一種果實：虔敬的心境和合群的行為。\n一切事都要像安東尼努斯的門生那樣去做。記得他在每一件合乎理性的行為上的堅定，他在一切事上的平穩，他的虔敬，他面容的寧靜，他的溫厚，他對虛名的不在意，他努力理解事物；也記得他如何從不讓任何事，在沒有最仔細檢視、沒有清楚理解之前就放過；他如何容忍那些不公正地責備他的人，而不回頭責備他們；他如何做事從不倉促；他如何不聽信誹謗；他檢驗品行和行為是多麼精確；他不愛責備人，不膽怯，不多疑，不詭辯；他對很少的東西就滿足，例如住處、床、衣服、食物、僕人；他多麼勤勞、多麼有耐性；他如何因為飲食節制，能撐到傍晚，除了平常的時間之外，連排泄都不需要；他在友誼上的堅定與始終如一；他如何容忍那些反對他意見者的直言；有人指出更好的見解時，他感到多愉快；以及他如何虔誠而不迷信。\n要效法這一切，好讓你最後一刻來臨時，能像他一樣良心清白（見第一卷第十六則）。","回到你清醒的神智，把自己叫回來。你從睡夢裡醒來，發現困擾你的只是夢，現在醒著，就用看那些［夢］的方式去看這些［你周圍的事物］。","我由一個小小的身體和一個靈魂組成。對這小小的身體來說，一切事物都無關緊要，因為它感覺不出差別。對理解力來說，只有那些不是它自己活動所做出來的事物，才無關緊要。凡是它自己活動所做出來的，一切都在它的能力之內。不過其中，只有和現在相關而做的才是如此；至於心智過去和將來的活動，就連這些，對現在來說也無關緊要。","只要腳做腳的工作、手做手的工作，手或腳的勞動就都不違反自然。同樣，只要人做的是人的事，人作為人的勞動也不違反自然。勞動既然不違反他的本性，對他也就不是惡。","強盜、弒父的人、暴君，享受過多少快樂。","你沒看見手藝人在某個程度上遷就不懂他們手藝的人嗎？可是他們仍緊守自己技藝的道理［原則］，不容許偏離。如果建築師和醫生尊重自己技藝的道理［原則］，反倒勝過人尊重自己的理性（那是人與眾神共有的），豈不是很奇怪嗎？","亞洲、歐洲，是宇宙的角落；整個大海是宇宙的一滴水；阿陀斯山是宇宙的一小塊土；整個現在的時間，是永恆中的一個點。萬物都是渺小的、易變的、會消逝的。\n萬物都從那裡來，從那普遍的統治力量來，或是直接出自它，或是依序隨之而來。所以獅子張開的大口、有毒的東西，以及一切有害的東西，像荊棘、像泥濘，都是宏大而美好之物的後續產物。所以別以為它們和你所敬畏的是不同種類，而要對萬物的源頭形成公正的意見（見第七卷第七十五則）。","看過現在事物的人，就看過了一切：從全部永恆以來發生的一切，以及在無盡的時間裡將會有的一切；因為萬物同族，也同一形式。","要常常想：宇宙中萬物是怎麼連結的，彼此又是什麼關係。因為在某種程度上，萬物都彼此纏繞，所有事物也都這樣彼此友善；一物依序跟在另一物之後，是憑藉主動的運動、彼此的共鳴，以及實體的統一（見第九卷第一則）。","要適應你的命運安置你的那些事物；命運把你放在哪些人之中，就愛他們，但要真誠地［誠摯地］愛。","每一件器具、工具、容器，只要做著它被造出來要做的事，就是好的，雖然造它的人並不在場。但由自然維繫在一起的事物，造它們的力量就在裡面，並且留在裡面；所以更該敬畏這個力量，並且想到：如果你依它的意志生活、行動，你身上的一切就都合乎智性。同樣，在宇宙裡，屬於宇宙的事物也都合乎智性。","凡是不在你能力之內的事物，只要你認為它對你是善或惡，那麼必然地，這樣的壞事一臨到你，或失去這樣的好東西，你就會責怪眾神，也恨人，恨那些造成不幸或損失的人，或被懷疑可能造成的人。我們確實做了許多不義的事，就是因為我們在這些事物之間分出好壞［因為我們不把這些事物看作無關緊要］。但如果我們只把在我們能力之內的事物判斷為善或惡，就沒有任何理由去責怪上帝，或對人採取敵對的態度。","我們都在為同一個目的一起工作，有些人有知識、有計劃，另一些人不知道自己在做什麼；就像睡著的人也是如此，我想是赫拉克利特說過，他們是宇宙中發生之事的工人和合作者。但人們合作的方式各不相同：就連那些對所發生的事挑剔的人，和那些想反對它、阻礙它的人，也在大量地合作，因為宇宙連這樣的人也需要。\n所以剩下的就是你要明白，你把自己放在哪一類工人之中。統治萬物的那一位，一定會好好運用你，會把你接納到合作者的某一部分，也就是那些勞作都通向同一目的的人之中。但別成為克律西波斯說過的、戲劇裡那種卑下可笑的詩句那樣的一部分。","太陽會去做雨的工作嗎？阿斯克勒庇俄斯會去做結果實者［大地］的工作嗎？那每一顆星呢？它們不是各不相同，卻為同一個目的一起工作嗎？","如果眾神對我、對必定發生在我身上的事有所決定，那他們決定得很好，因為連想像一位沒有先見的神都不容易；至於要傷害我，他們為什麼會有這個欲望？這對他們、或對整體（那是他們天意特別關注的對象），會有什麼好處？\n但如果他們沒有就我個人作決定，他們至少對整體作過決定，而在這個總體安排中依序發生的事，我應該欣然接受，並感到滿足。\n但如果他們對任何事都不作決定——相信這一點是邪惡的，如果我們真的相信，那就讓我們既不獻祭，也不祈禱，也不指著他們起誓，也不做其他任何我們做的、彷彿眾神在場並與我們同住的事——如果眾神對與我們有關的事都不作決定，我仍能對自己作決定，我能探究什麼是有益的；而對每個人有益的，是合乎他自己的構造與本性的。\n我的本性是理性的、合群的；而我的城邦和祖國，就我是安東尼努斯而言，是羅馬；就我是一個人而言，是世界。所以，對這兩個城邦有益的事，才是對我有益的。","凡發生在每個人身上的事，都是為了整體的利益：光這一點就可能夠了。但再進一步，如果你留意，也會看到這個普遍的真理：凡對任何一個人有益的，對別的人也有益。不過這裡的「有益」一詞，要照一般的意思來理解，用於中間類［既非善也非惡］的事物。","就像你在圓形競技場和類似的地方碰到的：不斷看到同樣的東西、千篇一律，景象就令人厭倦；整個生活也是如此，因為上面和下面的一切都一樣，也出於同一個來源。那麼，要到什麼時候呢？","要不斷地想：各種各類的人、各種各類的追求、各個民族的人，都已經死了，連你的思緒也一路下探到菲利斯提翁、福玻斯、奧里加尼翁。現在再把思緒轉到其他類型［的人］。我們必須遷往那個地方，那裡有這麼多偉大的演說家，這麼多高貴的哲學家：赫拉克利特、畢達哥拉斯、蘇格拉底；這麼多往昔的英雄，和他們之後這麼多將領和暴君；除了這些，還有歐多克索斯、喜帕恰斯、阿基米德，以及其他天賦敏銳、心智偉大、愛好勞作、多才多藝、自信的人，連人類短暫易逝的生命也被他們嘲笑，像梅尼普斯和與他相似的人。\n對這一切人要想到：他們早已化為塵土。這對他們有什麼傷害？對那些名字完全無人知曉的人，又有什麼傷害？這裡有一件事非常值得：在真理與公正中度過你的生命，即使對說謊的人和不義的人，也懷著仁善的心意。","想讓自己快樂的時候，就想想和你同住的人的德性：例如一個人的勤奮，另一個人的謙遜，第三個人的慷慨，第四個人的某種別的美好品質。因為沒有什麼比德性的榜樣更令人快樂，尤其是它們展現在與我們同住的人的品行裡，又盡可能豐富地呈現在我們面前的時候。所以我們必須把它們擺在眼前。","我想，你不會因為自己只有那麼多磅重、而不是三百磅，就感到不滿。那麼也別因為只能活那麼多年、而不是更多，就感到不滿；既然你對分給你的實體的量感到滿足，也就要對時間感到滿足。","讓我們試著說服他們［人們］。但當公正的原則指向那條路時，即使違背他們的意願，也要去做。不過，如果有人用武力擋在你的路上，就轉向知足與平靜，同時把這個阻礙，用在實踐另一種德性上；並記得你的嘗試是帶有保留的［有條件的］，你並不想做不可能的事。那你想要什麼呢？——就是某種這樣的努力。——但如果你被推動去做的事得以完成，你就達到了你的目的。","愛名聲的人，把別人的活動當作自己的善；愛快樂的人，把自己的感覺當作自己的善；但有理解力的人，把自己的行為當作自己的善。","對一件事不抱任何意見、不在靈魂裡被擾動，是在我們能力之內的；因為事物本身並沒有天生的力量，去形成我們的判斷。","要養成習慣，仔細留意別人說的話，並且盡可能走進說話者的心裡。","對蜂群不好的，對蜜蜂也不好。","如果水手辱罵舵手，或病人辱罵醫生，他們還會聽別人的嗎？舵手又怎麼能確保船上人的安全，醫生又怎麼能確保他所診治的人的健康？","和我一同來到世上的人，已經有多少離開了世界。","對黃疸病人來說，蜂蜜是苦的；被瘋狗咬傷的人，見水就怕；對小孩子來說，皮球是個好東西。那我為什麼生氣？你認為錯誤的意見，力量會比黃疸病人的膽汁、或被瘋狗咬傷者身上的毒更小嗎？","沒有人能阻止你依自己本性的道理生活；也不會有任何違背宇宙本性之道理的事，發生在你身上。","人們想討好的是什麼樣的人，為了什麼目的，又靠什麼樣的行為？時間多快就會把一切蓋住，而它已經蓋住了多少。"],["什麼是惡？就是你常常看到的那些東西。每次碰到什麼事，都提醒自己：這是我常常看到的。上上下下看一遍，你會發現都是同樣的事：古時候的史書、中間幾個世代的史書、我們這一代的史書，寫的都是這些；現在的城市、一家一戶，演的也是這些。沒有什麼是新的，一切都熟悉，也都短暫。","我們信的道理怎麼會死掉？除非與它們相應的那些想法熄滅了。可是要把這些想法一次又一次搧旺，是你做得到的。對任何事，我都能抱著我該有的意見。既然做得到，我何必心煩？心以外的事，跟我的心一點關係也沒有。讓你的情緒保持在這個位置，你就站穩了。要讓生活重新活起來，也是你做得到的：像從前那樣，再看一次事物，因為生活活起來，靠的就是這一點。","虛華的熱鬧、舞台上的戲、羊群、牛群、長矛操練、丟給小狗的一根骨頭、丟進魚池的一塊麵包、螞蟻辛苦搬運、受驚的小老鼠四處亂竄、被線牽著動的木偶——全都一樣。那麼，身在這些事當中，你該做的是保持好脾氣，不要擺出驕傲的樣子；也要明白，一個人值多少，就看他忙的那些事值多少。","別人說話，你要專心聽；每個行動，你要看清楚在做什麼。行動的部分，要馬上看出它指向什麼目的；說話的部分，要仔細留意它指的是什麼。","我的理解力夠不夠做這件事？夠，我就把它當成宇宙的自然給我的工具，拿來做這件事。不夠，我就退出，讓給做得更好的人——除非有什麼理由讓我不該退；不然就盡力去做，再找一個人來幫忙，讓他靠著我主宰之心的協助，做出眼前對大家合適又有益的事。因為不管我自己做，還是跟別人一起做，目標都只能有一個：對社會有益、也跟社會相合的事。","有多少人名聲響亮，後來還是被遺忘；又有多少替別人傳名的人，早就死了。","接受別人幫忙，不必不好意思；你的本分，是像攻城的士兵那樣，盡你該盡的力。要是你腿瘸了，自己爬不上城垛，有人幫忙就上得去，那該怎麼辦？","別讓以後的事擾亂你；真要走到那裡，你用的還是現在處理眼前事的同一種理性。","萬物彼此交織，這份連結是神聖的；幾乎沒有一樣東西跟其他事物無關。萬物都已排好位置，一起構成同一個宇宙〔秩序〕。宇宙只有一個，由萬物組成；神只有一位，遍布萬物；實體只有一個，法則只有一個，所有有理智的生物共有同一個理性，真理也只有一個；如果同類、共享理性的生物，真的只有一種完善的話。","物質的東西，很快就消失在整體的實體裡；形式的〔成因的〕東西，也很快被收回宇宙的理性裡；所有事物的記憶，更是很快就被時間淹沒。","對有理性的生物來說，同一個行為，既合乎自然，也合乎理性。","要自己站直，不然就讓人扶直。","就像合成一體的身體裡，各個肢體各有位置；分開存在的理性生物也一樣，因為他們生來就是要一起合作。你常對自己說「我是理性生物這個整體的一個肢體〔希臘文 melos〕」，就更容易體會這一點。但如果你〔改用字母 r〕說自己只是一個部分〔希臘文 meros〕，那你還沒有真心愛人；做好事還不能讓你因為做好事本身而高興；你做這件事，還只是出於禮數，不是把它當成對自己也有益的事。","外在的事要落下來，就讓它落在能感覺到打擊的部分。感覺到的部分，願意的話，就讓它們去抱怨。我只要不認為發生的事是壞事，就沒有受傷；而不這樣想，是我做得到的。","不管別人做什麼、說什麼，我都得做個好人；就像黃金、翡翠、紫袍，一直在說：不管別人做什麼、說什麼，我都得是翡翠，保住我的本色。","主宰之心不會自己擾亂自己；意思是，它不會讓自己害怕，也不會讓自己痛苦。要是別人有辦法讓它害怕或痛苦，就讓他們去做吧。因為它不會憑自己的意見，把自己帶上那條路。身體要自己小心，可以的話別讓它受苦；真的受苦了，就讓它說出來。\n但靈魂本身，那個會害怕、會痛苦、完全有能力對這些事形成意見的部分，是不會受苦的，因為它永遠不會滑到那樣的判斷上去。主宰之心本身什麼都不缺，除非它自己造出一種缺；所以只要它不擾亂自己、不妨礙自己，就不受干擾，也不受阻礙。","幸福（eudaimonia）是一位好的神靈（daimon），或者說，是一樣好東西。那麼，想像啊，你在這裡做什麼？我憑眾神求你，照你來的樣子離開吧，我不需要你。你是照著老習慣來的。我不生你的氣，只請你走開。","有人怕改變嗎？可是沒有改變，什麼事能發生？對宇宙的自然來說，還有什麼比改變更可喜、更合適？木柴不經過變化，你能洗上熱水澡嗎？食物不經過變化，你能得到養分嗎？還有哪件有益的事，不經改變就能完成？那你還看不出來嗎？你自己要改變，也是一樣的道理，對宇宙的自然同樣必要。","萬物都被宇宙的實體像急流一樣帶著走，依著本性與整體結合、一起運作，就像我們身體的各部分彼此配合。克律西波斯有多少個，蘇格拉底有多少個，愛比克泰德有多少個，都已經被時間吞沒了！對每一個人、每一件事，你都要這樣想。","只有一件事讓我擔心：怕我做出人的構造不允許的事，或用人的構造不允許的方式去做，或在現在不允許的時候去做。","很快你就會忘掉一切；很快一切也會忘掉你。","連對做錯事的人也懷著愛，是人才有的。想到這些，你就做得到：他們是你的同類；他們做錯事是出於無知，不是故意；不久你們兩個都會死；還有最重要的一點：做錯事的人並沒有傷到你，因為他沒有讓你的主宰之心比原來更壞。","宇宙的自然從宇宙的實體取料，像取蠟一樣，這會兒捏成一匹馬；拆掉之後，又用同樣的材料做一棵樹，接著做一個人，再做別的東西；每一樣都只存在很短的時間。可是容器被拆開，並不是什麼苦事，就像它當初被拼合起來，也不是什麼苦事。","怒容完全違反自然；常常擺出這種臉色，端莊的神情就會一點一點消失，最後徹底熄滅，再也點不亮。就從這一點去推想，它是違反理性的。因為如果連意識到自己做錯的感覺都沒了，還有什麼理由活下去？","統治整體的自然，很快就會改變你看到的一切，用它們的實體造出別的東西，再用那些東西的實體造出另外的東西，讓世界永遠常新。","有人對你做了錯事，立刻想一想：他是依著什麼對善惡的意見，才做出錯事的。看清這一點，你就會可憐他，既不驚訝，也不生氣。因為你自己，要麼也和他一樣，把同一樣東西當成善；要麼把另一樣類似的東西當成善。既然這樣，你就該原諒他。但如果你不把這些東西看成善或惡，就更容易對犯錯的人懷著善意。","別老想你沒有的，多想你已有的；在已有的東西裡，挑出最好的，再想一想：如果沒有它們，你會多急著去找。不過也要當心，別因為太喜歡它們，養成高估它們的習慣，結果一旦失去就心神不寧。","退回你自己裡面。掌管一切的理性原則，本性就是這樣：做正義的事時，它就滿足於自己，因此得到安寧。","抹掉想像。別再讓線牽著走。把自己限在當下。把發生在你或別人身上的事看清楚。把每個對象拆成成因〔形式〕和質料。想一想你的最後一刻。別人犯的錯，就留在錯發生的地方。","注意力放在別人說的話上。讓你的理解力走進正在發生的事，也走進造成這些事的力量。","用純樸和謙遜裝飾自己，對德性與惡行之間那些無關緊要的事，保持平常心。愛人類。跟隨神。詩人說，法則統御一切——我們只要記得，法則統御一切，這就夠了。","說到死亡：不管它是離散、分解成原子，還是歸於虛無，不是消滅，就是轉變。","說到痛苦：受不了的痛苦會把我們帶走；拖得很久的痛苦，就受得了；心退回自己裡面，就保住自己的安寧，主宰之心也不會變壞。至於那些被痛苦傷到的部分，要是它們能，就讓它們自己說說對痛苦的看法吧。","說到名聲：看看〔那些追求名聲的人〕的心，看他們是什麼樣的人，躲什麼，追什麼。再想想，沙子一堆一堆疊上去，把先前的沙蓋住；人生也是這樣，先前發生的事，很快就被後來的事蓋過。","出自柏拉圖：一個心胸高遠、能縱觀所有時間與所有實體的人，你覺得他可能把人生看成什麼了不起的事嗎？——他說，不可能。——那這樣的人也不會把死亡當成壞事。——當然不會。","出自安提斯泰尼：做了好事卻被人毀謗，這是王者的命。","臉能順從，依著心的指令調整、安定自己；心卻不能自己調整、安定自己，這是可恥的。","我們不該為事物煩惱，\n因為它們根本不在乎。","願不朽的眾神，與我們一同歡喜。","生命必須像熟了的穗子一樣收割；\n一個人出生，另一個人死去。","如果眾神不關心我和我的孩子，\n那也必定有它的道理。","因為善與我同在，公義也與我同在。","不跟著別人一起哀號，\n不起激烈的情緒。","出自柏拉圖：我對這個人的回答大致如下，這樣就夠了：如果你以為，一個稍微有點用處的人，該去盤算生死的風險，而不是在所做的一切事上，只看這一點——他做的是正義還是不義的事，是好人還是壞人的作為——那你就說錯了。","雅典的人們啊，事實就是這樣：一個人不論把自己安置在某處，認為那是對他最好的位置，或是被長官安置在那裡，照我看，他就該留在那裡，承擔危險；不拿死亡或任何別的事，放在〔拋棄崗位的〕恥辱之前去計較。","但是，我的好朋友，你要想一想：高貴與善，會不會跟保全性命、被人保全是不同的兩回事。至於一個人活多久——至少對真正的人來說——要想想這是不是該從心裡放下的事；他也不該貪戀生命。這些事要交給神，並且相信女人們常說的：沒有人逃得過自己的命運；接下來要探究的，是他怎麼把剩下的時間過得最好。","環顧群星的運行，好像你和它們一起走；也常想想元素怎樣彼此轉化，因為這樣的想法能洗掉塵世生活的汙垢。","柏拉圖有一句很好的話：談論人類的人，也該像從更高的地方往下看那樣，去看地上的事物；看他們的集會、軍隊、農事、婚姻、締約、出生、死亡，法庭的喧鬧、荒涼的地方、各種蠻族、宴會、哀悼、市集，這一切混雜在一起，又讓對立的事物井然有序地結合。","想想過去——政權一次次的大變動；你也就能預見將來會發生什麼。因為將來一定是同樣的形式，不可能偏離現在這些事的次序；所以，看人生四十年，和看一萬年是一樣的。你還能看到更多什麼呢？","從大地生出的，歸於大地；\n從天上的種子生出的，\n回到天上的領域。\n這或者是原子彼此糾纏的解散，或者是沒有知覺的元素同樣散開。","用飲食與巧妙的魔法，\n改變水道的流向，想逃過死亡。\n天上送來的風，\n我們必須忍受，不抱怨地勞作。","另一個人也許更會把對手摔倒；但他不比你更合群，不比你更謙遜，不比你更能對一切發生的事做好準備，也不比你更體諒鄰人的過失。","凡是能依著諸神與人類共有的理性來完成的工作，在那裡我們沒有什麼好怕的；因為只要我們靠著順利、合乎本性的活動得到益處，就不必懷疑那裡會有什麼傷害。","無論何處、何時，你都做得到：虔敬地安於眼前的處境，公正地對待身邊的人，並在當下的想法上下功夫，讓任何念頭沒經過仔細檢查，就不能溜進來。","別四處張望，去探查別人的主宰之心，要直接看向這一點：自然帶你往哪裡去——宇宙的自然，透過發生在你身上的事；你自己的本性，透過你該做的事。每個存在者都該做合乎自己構造的事；其他一切事物，都是為了理性的存在者而造，就像在沒有理性的事物之間，低的為高的而造，而理性的存在者則是彼此為對方而造。\n所以人的構造裡，第一原則是合群。第二是不向身體的誘惑低頭——因為理性與智性的運動，特有的職責就是約束自己，不被感官或欲望的運動壓倒，這兩者都屬於動物性；智性的運動要求居上，不讓自己被其他運動壓倒。這有道理，因為它天生就是要使用它們全部的。理性構造的第三件事，是不犯錯、不受騙。讓主宰之心牢牢守住這些，一直往前走，它就擁有屬於它自己的東西。","把自己當成已經死了，已經活完了直到此刻的生命；然後照著本性，過你被允許的剩下的日子。","只愛發生在你身上的事，和你命運之線紡出來的事。因為還有什麼比這更合適？","每件事發生時，把那些碰過同樣事情的人放在眼前：他們怎樣煩惱，怎樣把這些事當成怪事，怎樣挑剔；而現在他們在哪裡？哪裡都找不到。那你為什麼也要這樣做？為什麼不把這些違反自然的騷動，留給製造它們的人，和被它們推動的人，自己全心想著怎樣正確運用發生在你身上的事？這樣你就能好好運用，它們也會成為你〔施展〕的材料。只要留意你自己，決心在你做的每個行為裡做個好人；還要記住……","向內看。裡面有善的泉源，只要你肯不斷往下挖，它就不斷湧出來。","身體要端整，動作和姿態不顯得雜亂。因為心靈保持智慧與得體，會表現在臉上；對整個身體，也該要求同樣的樣子。但這一切都不要裝腔作勢。","生活的藝術比較像摔角手的功夫，不像舞者的：它要隨時站穩，準備迎接突然、意料之外的攻擊。","時常看看那些你想得到他們讚許的人是誰，他們有什麼樣的主宰之心。因為只要看看他們的意見與欲望從哪裡來，你就不會責怪那些無心冒犯你的人，也不會再渴望他們的讚許。","那位哲學家說，每個靈魂都是不由自主地失去真理；同樣地，也不由自主地失去正義、節制、仁慈，以及一切這類的東西。時常記住這一點最要緊，因為這樣你對所有人都會更溫和。","每一種痛苦來時，都讓這個想法在心裡：痛苦中沒有恥辱，也不會讓主宰之心變壞，因為它既不損害理性的那一面，也不損害合群的那一面。至於大多數的痛苦，不妨讓伊比鳩魯這句話幫你：痛苦並非不能忍受，也不會沒完沒了，只要你記住它有限度，也不在想像裡替它加料。\n還要記住：我們沒有察覺，很多讓我們不舒服的事，其實跟痛苦是同一回事，像是睡意太重、被熱氣烤著、沒有胃口。所以當你對其中任何一樣不滿時，就對自己說：你是在向痛苦低頭。","小心，別對那些不講人性的人，懷著他們對待人的那種心態。","我們怎麼知道泰勞格斯的品格不比蘇格拉底高尚？光說蘇格拉底死得更高貴、跟詭辯家辯論得更巧妙、在寒夜裡站一整夜更能忍耐、被命令去逮捕薩拉米斯的勒翁時認為拒絕更高貴，還有他在街上昂首闊步——不過最後這一點，大可懷疑是不是真的——這些都還不夠。\n我們該探究的是：蘇格拉底有的是怎樣一個靈魂；他是不是能滿足於對人公正、對神虔敬；既不為人們的惡行白白煩惱，也不讓自己成為任何人的無知的奴隸；不把宇宙分給他的任何事當成怪事接受，也不當成受不了的事硬撐；也不讓他的理解力去附和可憐血肉的情感。","自然並沒有把〔智性〕與身體的組成混得那麼深，深到不容許你約束自己，不讓你把屬於你的一切握在自己手裡；因為一個人完全可以是神聖的人，卻沒有任何人認得出來。永遠記住這一點；還有另一點：要過幸福的生活，需要的其實很少。而且，既然你已不指望成為辯證家、精通自然知識，也別因此放棄成為自由而謙遜、合群而順服於神的人的希望。","你有能力在最大的心靈安寧中生活，不受任何強迫，就算全世界隨意對你大聲叫罵，就算野獸撕裂這團繞著你長成的捏塑之物的肢體。因為在這一切當中，有什麼能阻止心靈保持安寧、對周圍的一切作出公正的判斷、並立刻運用眼前的對象？\n判斷可以對映入眼簾的事物說：你的實質〔實相〕就是這樣，即使在人們的意見裡，你看起來像另一種東西；運用則可以對落到手上的事物說：你正是我在找的。因為對我來說，眼前出現的一切，總是施展理性與社會德性的材料，總之，是施展屬於人或神的技藝的材料。因為發生的每件事，都跟神或人有關，既不新奇，也不難處理，而是平常、合用的材料。","品格的完善，就在於把每一天都當成最後一天來過，不激動亢奮，不麻木遲鈍，也不裝模作樣。","不朽的眾神並不因為這麼長的時間裡，必須一直容忍人類這個樣子、而且其中有那麼多壞人，就覺得煩；不只這樣，祂們還用各種方式照顧他們。而你，注定很快就要結束，卻已經厭倦忍受壞人，何況你自己也是其中之一？","一個人不逃離自己的惡——那是做得到的——卻去逃離別人的惡——那是做不到的，這很可笑。","凡是理性的、政治的〔合群的〕能力發現既無智性、也不合群的東西，它就正確地判斷那東西比自己低。","你做了一件好事，另一個人接受了，你為什麼還像傻子一樣，在這兩樣之外再找第三樣——不是想得到做了好事的名聲，就是想得到回報？","沒有人會厭倦接受有益的東西。而依照本性行事是有益的。所以，別厭倦接受有益的東西——把它施予別人，就是接受它。","整體的自然動了起來，造出宇宙。但現在，要麼所發生的一切，都是依著後果或〔連續〕而來；要麼，連宇宙的主宰力量把自己的運動所指向的那些最主要的事物，也不受任何理性原則支配。記住這一點，你在許多事情上就會更安寧。"],["這樣想，也有助於去掉對虛名的渴望：你已經沒辦法把整個一生，至少是從年輕以來的一生，過得像個哲學家；對許多別人，也對你自己，都很明顯，你離哲學還很遠。你已經陷在混亂裡，要贏得哲學家的名聲不容易了；你的生活方式也和這個相違。\n那麼，如果你真的看清問題在哪裡，就把「別人會怎麼看我」的念頭丟開，只要滿足於照著你的本性要求，過完剩下的人生。所以去看看本性要什麼，別讓其他事讓你分心；因為你已經繞了那麼多路，卻在哪裡都沒找到幸福——不在三段論裡，不在財富裡，不在名聲裡，不在享樂裡，哪裡都沒有。那它在哪裡？在於做人的本性所要求的事。一個人要怎麼做到？只要他有原則，他的情感和行為就從原則而來。是什麼原則？關於好與壞的原則：相信對人來說，凡是不能讓他正義、節制、勇敢、自由的，就不是好的；凡是不會帶來相反結果的，就不是壞的。","每做一件事，都問問自己：這件事對我來說是什麼？我會後悔嗎？再過一會兒我就死了，一切都沒了。如果我現在做的，是一個有理智的生物、一個合群的生物、一個與神服從同一條法則的生物該做的事，我還要求什麼？","亞歷山大、凱撒、龐培，跟第歐根尼、赫拉克利特、蘇格拉底比起來，算什麼？後面這幾位認識事物，認識它們的成因〔形式〕與質料，而且他們的主宰之心是一致的〔或與他們所追求的相合〕。至於前面那幾位，要操心多少事，又是多少事的奴隸！","〔想想〕就算你氣到爆開，人們還是照樣做同樣的事。","最要緊的是：不要慌，因為一切都合乎宇宙的自然；不久你就會成為無名無處的人，就像哈德良和奧古斯都一樣。其次，眼睛穩穩盯住你的事務，把它看清楚，同時記住你的本分是做個好人，也記住人的本性要求什麼，就照著做，不要偏開；說話則照你覺得最公正的方式，只是要帶著善意、謙遜，不虛偽。","宇宙的自然有這樣一項工作：把這裡的東西搬到那裡，改變它們，從這裡取走，帶到那裡去。一切都是變化，不過我們不必怕任何新鮮事。一切對〔我們〕都熟悉；它們的分配方式也依然如故。","每一種本性只要走得順，就滿足於自己；理性的本性走得順，是指：思想上，它不認同任何虛假或不確定的事；它只把自己的活動導向合群的行為；它把欲求和厭惡限制在自己能力所及的事上；對共同的自然分配給它的一切，都感到滿足。因為每一個個別的本性，都是這共同自然的一部分，就像葉子的本性是植物本性的一部分；只不過植物裡葉子的本性，屬於一個沒有知覺、沒有理性、又會受阻礙的本性；而人的本性，屬於一個不受阻礙、有智性又公正的本性，因為它對每一件事物，都依其價值、時機、實體、成因〔形式〕、活動與遭遇，給予相稱的份。\n不過要檢查的，不是任何一件東西跟另一件單獨的東西在各方面是否相等，而是把一件事物的所有部分合起來，跟另一件事物的所有部分合起來比較。","你沒有閒暇〔或能力〕讀書。但你有閒暇〔或能力〕遏止傲慢；有閒暇超越快樂與痛苦；有閒暇超越對名聲的愛好，不因愚蠢又忘恩的人生氣，甚至還去關心他們。","別再讓任何人聽到你抱怨宮廷生活，或抱怨你自己的生活。","後悔是一種自責，因為忽略了某件有益的事；但善必定是某種有益的東西，完美的好人也該去追求它。然而，這樣的人沒有一個會因為拒絕了某種感官的快樂而後悔。所以，快樂既不是善，也不是有益的。","這件東西，就它自身、就它自己的構造來說，是什麼？它的實體與質料是什麼？它的成因本性〔或形式〕是什麼？它在世界上做什麼？它存在多久？","當你不情願地從睡眠中起床時，要記住：做合群的事，符合你的構造、符合人的本性；而睡覺，連沒有理性的動物也有。凡是合乎每個個體本性的事，也更是它自己特有的、更適合它的本性，而且確實也更讓人愉快。","常常——可以的話，每當心裡出現一個印象——就把物理學、倫理學和辯證學的原則，用在它上面。","不管遇到什麼人，立刻對自己說：這個人對好與壞抱著什麼意見？因為如果他對快樂與痛苦及其成因，對名聲與恥辱、死亡與生命，有這樣那樣的意見，那他做這樣那樣的事，對我來說就不會奇怪、不會不可思議；我也會記得，他是不得不這樣。","要記住：無花果樹結出無花果，若為此驚訝，是可恥的；同樣，世界生出它能生出的這些那些事物，若為此驚訝，也是可恥的；醫生看到有人發燒、舵手遇到逆風而驚訝，一樣可恥。","要記住：改變你的意見、聽從糾正你錯誤的人，和堅持自己的錯誤一樣，都跟自由相合。因為這是你自己的，是依你自己的衝動與判斷、也就是你自己的理解所做的事。","如果一件事在你自己的能力之內，你為什麼還要做？而如果它在別人的能力之內，你要怪誰——原子〔偶然〕，還是眾神？兩個都是愚蠢。你不該怪任何人。因為你若能，就去糾正〔造成它的原因〕；若不能，至少糾正事情本身；若連這也不能，你挑剔有什麼用？因為任何事都不該沒有目的地去做。","已死的東西不會掉出宇宙之外。它留在這裡，也在這裡改變，分解成它自己的各部分，那些是宇宙的元素，也是你的元素。而這些也在改變，卻不抱怨。","每一件事物的存在都有某種目的——一匹馬，一株葡萄藤。你為什麼驚訝？連太陽也會說：我存在是為了某種目的；其他的神也會這麼說。那你是為了什麼目的而存在？為了享受快樂嗎？看看常識答不答應這樣說。","自然在一切事物裡，對終點的關注，不亞於對開端和延續的關注，就像把球拋向空中的人。那麼，球被拋起來有什麼好處，落下來有什麼壞處，甚至已經落地又有什麼壞處？水泡聚在一起時有什麼好處，破掉時又有什麼壞處？燈火也可以這樣說。","把它〔身體〕翻過來，看看它是什麼樣的東西；老了，會變成什麼樣；生病時，又是什麼樣。\n稱讚的人與被稱讚的人都活不久，記得的人與被記得的人也是；這一切又發生在世界這一部分的一個角落裡；就連在這裡，大家也不一致，沒有一個人跟自己一致；整個大地也不過是一個點。","留意擺在你面前的事，不論是一個意見、一個行為，還是一句話。\n你受這個苦也是應該的，因為你寧可明天才變好，也不願今天就是好的。","我正在做什麼事嗎？那是為了人類的益處。有什麼事發生在我身上嗎？我接受它，把它歸給眾神，歸給萬物的源頭，一切發生的事都從那裡來。","就像洗澡在你看來的樣子——油、汗、污垢、髒水，一切令人作嘔的東西——生活的每一部分、每一件事物也是這樣。","露西拉看著維魯斯死去，然後露西拉也死了。塞昆達看著馬克西穆斯死去，然後塞昆達也死了。埃皮廷卡努斯看著狄奧蒂穆斯死去，然後埃皮廷卡努斯也死了。安東尼努斯看著福絲蒂娜死去，然後安東尼努斯也死了。一切都是這樣。凱勒看著哈德良死去，然後凱勒也死了。\n那些機敏的人，不論是先知，還是自視甚高的人，現在在哪裡？比如那些機敏的人：卡拉克斯、柏拉圖主義者德米特里烏斯、歐代蒙，還有任何像他們的人？全都朝生暮死，早已死去。有些人連短短的時間都沒被人記得，有些人成了傳說裡的英雄，還有些人連傳說裡也消失了。\n所以要記住：你這個小小的組合體，要麼會分解，要麼你可憐的氣息會熄滅，或被移走、安置到別處。","做人該做的事，對人是一種滿足。而人該做的事，就是對自己的同類懷著善意，輕視感官的衝動，對似是而非的表象作出公正的判斷，並縱觀宇宙的自然，以及其中發生的事。","〔你與其他事物之間〕有三種關係：第一是和包圍著你的身體的關係；第二是和神聖的成因的關係，一切事物都由它而來、臨到一切；第三是和與你一起生活的人的關係。","痛苦要麼是對身體的惡——那就讓身體去說它怎麼想——要麼是對靈魂的惡；但靈魂有能力保持自己的平靜與安寧，不認為痛苦是惡。因為一切判斷、衝動、欲求與厭惡都在裡面，沒有任何惡能升到那麼高的地方。","常常對自己說：此刻我有能力，不讓這個靈魂裡有任何邪惡、任何欲望、任何紛擾；我看著萬事萬物，看出它們的本性，並依它們的價值運用各個事物。——用這個抹掉你的想像。要記住你從自然得到的這份能力。","在元老院裡，對每一個人也一樣，不論他是誰，都要說得恰當，不矯揉造作：用平實的話。","奧古斯都的宮廷、妻子、女兒、後代、祖先、姊妹、阿格里帕、親屬、親信、朋友；阿里烏斯、邁克納斯、醫生、獻祭的祭司——整個宮廷都死了。\n再把目光轉向別的人，不要只看一個人的死〔要看整個家族的死〕，比如龐培家；還有刻在墓碑上的話——「他是他家族的最後一人」。再想想，他們之前的人花了多少心思，想留下繼承人；而必定有某一個人要成為最後一個。再一次，在這裡看看整個家族的死。","你的本分，是把你的生活安排好，一個行為接一個行為；如果每個行為都盡可能盡了本分，就該滿足；沒有人能阻止你，讓某個行為不盡本分。\n——可是外在的東西會擋在前面。——沒有什麼能擋住你公正、節制、深思地行事。——但也許別的某種行動的力量會被阻礙。是的，可是只要接受這個阻礙，滿足於把你的努力轉到被允許的事上，另一個行動的機會立刻就會取代被阻礙的那一個，擺在你面前，而且它會與我們所說的這種安排相合。","接受〔財富或順境〕時不要傲慢；也隨時準備放手。","如果你曾看過被砍下的一隻手，或一隻腳，或一顆頭，跟身體其餘部分分開，躺在某處，那麼，一個人若對發生的事不滿足、讓自己和別人分離、或做出任何不合群的事，就是在盡他所能，把自己弄成這個樣子。\n假如你已讓自己脫離了自然的整體——你本來是自然造成的一部分，現在卻把自己切斷了——不過這裡有一個美好的安排：你有能力再次使自己結合。神沒有允許任何其他部分，在分離、被切斷之後，再重新合在一起。但想想神用什麼樣的恩惠，讓人與眾不同：祂讓人完全不必離開整體；而當他離開之後，又允許他回來、結合，重新取回作為一部分的位置。","正如宇宙的自然，把它所有的其他能力都賜給每個理性的存在者，我們也從它那裡得到了這一種能力。因為宇宙的自然，會把一切擋在路上、跟它對抗的東西，轉變並固定在它預定的位置，讓這些東西成為它自己的一部分；理性的生物也同樣能把每個阻礙變成自己的材料，用在自己設計的目的上。","別因為想到整個一生而使自己不安。別讓你的思想一下子把預期會遇到的各種麻煩全包進來；每遇到一個場合，就問自己：這件事裡有什麼是無法忍受、承受不了的？你會羞於承認。\n其次要記住，讓你痛苦的，不是未來，也不是過去，只是現在。但如果你把它限定住，並責備自己的心，竟連這一點也撐不住，它就縮得很小了。","潘提亞或佩加穆斯現在還坐在維魯斯的墓旁嗎？考里阿斯或狄奧蒂穆斯還坐在哈德良的墓旁嗎？那會很可笑。好吧，假設他們真的坐在那裡，死者會知道嗎？如果死者知道，他們會高興嗎？如果他們高興，那會讓他們不朽嗎？這些人不也是依命運的安排，先變成老婦和老人，然後死去嗎？那麼等這些人死了，那些人又能做什麼？這一切不過是一袋臭味與血。","哲學家說：如果你能看得敏銳，就去看，並明智地判斷。","在理性動物的構造裡，我看不到有什麼德性與正義相對立；但我看到有一種德性與貪愛快樂相對立，那就是節制。","如果你拿掉你對那看似使你痛苦的事物的意見，你自己就站在完全安全的地方。——這個自己是誰？——是理性。——可是我不是理性。——就算這樣吧。那就讓理性自己別擾亂自己。但如果你的其他某個部分受苦，就讓它對自己抱著它自己的意見。","感官知覺受阻礙，對動物的本性是一種惡。衝動〔欲求〕受阻礙，對動物的本性同樣是一種惡。還有別的某種東西，對植物的構造同樣是阻礙與惡。那麼，凡是阻礙智性的，就是對智性本性的惡。\n把這一切用在你自己身上。痛苦或感官的快樂影響到你嗎？感官自己會去處理。你朝向某個目標努力時，有什麼障礙擋住你嗎？如果你是絕對地〔無條件地、毫無保留地〕在做這個努力，那麼這個障礙，對身為理性動物的你，確實是一種惡。但如果你把事物的通常進程〔考慮進去〕，你就還沒有受傷，甚至也沒有受阻。至於屬於理解力的東西，沒有人慣於去阻礙它，因為不論火、鐵、暴君、辱罵，都完全碰不到它。它一旦被造成球體，就始終是球體。","我不該讓自己痛苦，因為我從沒故意讓別人痛苦過。","不同的事讓不同的人歡喜；而我的歡喜，是保持主宰之心健全，不對任何人、也不對發生在人身上的任何事轉過臉去，而是用歡迎的眼光看待、接受一切，並依每一件事物的價值去運用它。","要確保你擁有當下這段時間：那些寧可追求身後名聲的人，沒有想到，後世的人，就跟他們現在受不了的這些人一模一樣，而且兩者都會死。後世的人發出這樣那樣的聲音、對你抱著這樣那樣的意見，這跟你到底有什麼相干？","把我拿去，丟到你想丟的地方吧；因為在那裡，我仍會保持我神聖的部分平靜，也就是說，只要它能依自己的構造去感受、去行動，它就滿足。〔換個地方〕難道足以成為理由，讓我的靈魂不快樂、變得比以前更糟、沮喪、膨脹、退縮、驚惶嗎？你又能找到什麼，足以構成這個理由？","任何人身上都不會發生不屬於人的遭遇；牛身上不會發生不合牛的本性的事；葡萄藤上不會發生不合葡萄藤本性的事；石頭上不會發生不屬於石頭的事。那麼，如果每一樣事物遭遇的都是平常而自然的事，你為什麼要抱怨？因為共同的自然帶來的，沒有一樣是你承受不了的。","如果你因為某件外在的事而痛苦，擾亂你的不是這件事本身，而是你對它的判斷。而此刻把這個判斷抹掉，是你做得到的。但如果是你自己性情裡的什麼東西讓你痛苦，誰攔著你糾正你的意見？就算你痛苦，是因為沒去做某件你認為正確的事，你為什麼不去做，卻在抱怨？\n——可是有某種無法克服的障礙擋在路上？——那就別難過，因為這件事做不成的原因，不在於你。——可是這件事做不成，活著就不值得了。——那就滿足地離開人生吧，就像一個人全力投入、對那些阻礙也感到滿意時死去。","要記住：主宰之心是不可戰勝的，只要它自我收攏、滿足於自己，只要它不做它不願做的事，即使它的抵抗只是出於單純的固執。那麼，當它借助理性、經過深思，對任何事物作出判斷時，又會是什麼樣子？\n所以，沒有情欲的心靈是一座堡壘，因為人沒有比這更安全、可以逃進去避難、從此堅不可摧的地方。因此，沒有看見這一點的人是無知的；看見了卻不逃到這個避難所的人是不幸的。","除了最初的表象所報告的，不要再對自己多說什麼。假設有人告訴你，某個人說你壞話。這是被報告的；你受到傷害，卻沒有被報告。我看見我的孩子病了。我確實看見了；但他有危險，我沒有看見。所以永遠停在最初的表象，不要自己從裡面添加什麼，這樣就什麼事也不會發生在你身上。或者，不如像一個知道世上一切發生的事的人那樣，去添加一些東西。","黃瓜是苦的——把它扔掉。——路上有荊棘——繞開。——這就夠了。不要再補一句：世界上為什麼要造出這些東西？因為熟悉自然的人會笑你，就像木匠和鞋匠會笑你一樣——如果你看到他們的工作坊裡有做東西剩下的刨花和碎料，就去挑剔。\n可是他們有地方丟這些刨花碎料，而宇宙的自然沒有外面的空間；她技藝的奇妙之處在於：雖然她把自己限定在裡面，她裡面一切看似腐朽、衰老、無用的東西，她都轉化成自己，又用這些同樣的東西造出別的新東西，所以她既不需要從外面取得實體，也不需要一個地方來丟棄腐朽的東西。她滿足於她自己的空間、她自己的物質、她自己的技藝。","行動上不要遲緩，談話上不要沒條理，思想上不要游移，靈魂裡不要有內在的爭鬥，也不要向外傾瀉，生活裡也不要忙到沒有閒暇。\n假設人們殺你、把你切成碎塊、咒罵你。這些事又怎能阻止你的心保持純潔、明智、清醒、公正？比如，有人站在一眼清澈的泉水旁咒罵它，泉水並不會停止湧出可以喝的水；就算他往裡面丟泥土或汙物，它也很快就把它們沖散、洗掉，一點也不被汙染。那你要怎樣才擁有一個永不乾涸的泉源〔而不是一口死井〕？就是每個小時都把自己養成自由，並結合滿足、純樸與謙遜。","不知道世界是什麼的人，不知道自己在哪裡。不知道世界為何而存在的人，不知道自己是誰，也不知道世界是什麼。這些事裡只要有一件做不到的人，連自己為何而存在，也說不出來。那麼，對那些〔躲避或〕追求鼓掌者讚美的人，也就是既不知道自己在哪裡、也不知道自己是誰的人，你怎麼看？","你想被一個每小時咒罵自己三次的人稱讚嗎？你想取悅一個讓自己都不滿意的人嗎？一個對自己做的幾乎每件事都後悔的人，會讓自己滿意嗎？","不要再只讓你的呼吸與包圍你的空氣一起活動，也要讓你的智性，此刻就與包含萬物的智性和諧一致。因為對願意把智性的力量吸引到自己身上的人來說，這智性的力量散布在各處、貫穿萬物，不亞於空氣的力量對能呼吸它的人。","一般說來，邪惡對宇宙毫無損害；具體說來，〔一個人的〕邪惡也不會損害另一個人。它只損害那個一旦願意、就能擺脫它的人。","對我自己的自由意志來說，鄰人的自由意志，就和他可憐的氣息與血肉一樣，是無關緊要的。因為雖然我們尤其是為了彼此而造的，然而我們每個人的主宰之心，仍各有自己的職分，否則鄰人的邪惡就成了我的傷害，而這不是神所願意的，神是要讓我的不幸不取決於別人。","太陽看起來像是傾瀉下來的，它確實向四面八方擴散，卻不是傾倒出去。因為這種擴散是伸展：所以它的光線被稱為「延伸」，因為它們是伸展出去的。\n但你可以判斷光線是什麼樣的東西，只要看看陽光穿過狹窄的縫隙射入暗室：它沿著一條直線延伸，遇到擋在路上、截斷前方空氣的固體時，彷彿被分開；可是光就停在那裡，不滑開，也不掉落。理解力的傾注與擴散也該是這樣，絕不該是傾瀉，而是延伸；它不該猛烈而衝動地撞向擋在路上的障礙，也不該掉落，而是穩穩停住，照亮接受它的東西。因為一個物體若不接納光，就是自己剝奪了光照。","怕死的人，要麼是怕失去感覺，要麼是怕另一種感覺。但如果你將不再有感覺，你就不會感到任何傷害；而如果你將得到另一種感覺，你就會成為另一種生物，並且不會停止生存。","人是為了彼此而存在的。所以，要麼教導他們，要麼容忍他們。","箭的運動是一種方式，心的運動是另一種方式。心即使在謹慎行事、或忙於探究時，也同樣筆直向前，朝著它的目標。","進入每個人的主宰之心；也讓每個別人進入你的。"],["行不義的人就是行不敬的人。因為宇宙的自然造出理性的生物，是要他們彼此為對方而存在，依各人該得的互相幫助，絕不互相傷害；所以違背她旨意的人，顯然是對最高的神明犯了不敬之罪。\n說謊的人，也是對同一位神明不敬；因為宇宙的自然就是存在之物的本性，而存在之物與一切生成之物都有關聯。再者，這宇宙的自然被稱為真理，是一切真實之事的首要成因。所以故意說謊的人是不敬的，因為他靠欺騙行不義；無意說謊的人也是不敬的，因為他與宇宙的自然相違，與世界的本性作對，擾亂了秩序。因為一個人若自己被推動，走上與真理相反的路，就是在與自然作對；他本來從自然得到各種能力，卻疏忽了它們，現在竟分不出虛假與真實。\n同樣，把快樂當成善來追求、把痛苦當成惡來躲避的人，也是不敬的。因為這樣的人必定常常指責宇宙的自然，說它把事物分給惡人與善人時，違反他們所應得的，因為惡人常常享受快樂、擁有帶來快樂的東西，善人卻分到痛苦以及造成痛苦的東西。再者，怕痛苦的人，有時也會怕世界上將要發生的某些事，這本身就是不敬。追求快樂的人，也不會不犯不義，這顯然是不敬。\n至於宇宙的自然對之一視同仁的那些事物——因為若不是對兩者一視同仁，它就不會造出兩者——想追隨自然的人，對它們就該與自然同心，同樣看待。所以，對痛苦與快樂，死亡與生命，榮譽與恥辱，宇宙的自然是同等運用的；凡不同樣看待的人，顯然是行為不敬。\n我說宇宙的自然同等運用它們，意思是：它們同樣發生在依連續順序生出的人身上，也同樣發生在後來的人身上，這是憑著天意的某種原初運動。依照這運動，天意從某個開端出發，走向現在這種事物的秩序；它構想了將要存在的事物的某些原則，並決定了產生各種存在、各種變化以及類似的接續的力量。","一個人最幸福的命運，是離開人世時，從沒嘗過謊言、虛偽、奢侈與驕傲的滋味。不過，當一個人對這些已經受夠了，才嚥下最後一口氣，也就是俗話說的次好的航程。你是決定要與惡共處了嗎？經驗還沒讓你逃離這場瘟疫嗎？因為理解力的敗壞是一場瘟疫，比圍繞我們的這片空氣的任何腐壞與變化都嚴重得多。那種腐壞是動物之為動物的瘟疫；這一種，則是人之為人的瘟疫。","不要輕視死亡，要欣然接受它，因為這也是自然所意願的事之一。就像年輕、衰老、成長、成熟、長牙齒、長鬍鬚與白髮、生育、懷孕、分娩，以及你生命各個季節帶來的其他自然作用，解體也是同樣的事。所以，一個善於思考的人，對死亡既不輕忽，也不急躁，也不輕蔑，而是把它當成自然的作用之一，等它到來。就像你現在等著孩子從妻子的子宮出來，也這樣準備好你的靈魂從這層外殼脫落的時刻。\n但如果你還需要一種通俗、能碰到你心的安慰，那麼看看你將要離開的那些對象，看看你的靈魂將不再與之混雜的那些人的品行，你最能與死亡和解。因為對人發怒完全不對，你的本分是關心他們、溫和地容忍他們；不過也要記住，你離開的，不是與你有相同原則的人。如果有什麼能把我們往相反的方向拉、把我們繫在生命上，那就只有這一點：能和與我們有相同原則的人一起生活。但現在你看到，同住的人彼此不協調，帶來多大的麻煩，以至於你可以說：死亡啊，快來吧，免得我也忘了自己。","做錯事的人是對自己做錯。行不義的人是對自己行不義，因為他讓自己變壞。","不做某件事的人，也常常是在行不義；不只是做了某件事的人才是。","你現在建立在理解之上的意見，你現在指向社會公益的行為，你現在對一切發生的事都滿足的性情——這就夠了。","抹掉想像；遏制欲望；熄滅貪欲；讓主宰之心掌握在自己手裡。","沒有理性的動物，分到的是一種生命；有理性的動物，分到的是一個有智性的靈魂：就像一切屬土的東西共有一片大地，我們靠同一道光看東西，呼吸同一種空氣，所有有視力的、所有有生命的，都是如此。","凡是共同分有某種共有之物的事物，都會朝同類的方向移動。屬土的轉向大地，液體的匯流在一起，氣也是這樣，所以要把它們分開，需要某種東西，還要施加力量。火確實因為元素之火而向上，但它非常容易與這裡所有的火一起被點燃，以致只要稍微乾燥的物質，都很容易著火，因為裡面混雜的、阻礙點燃的東西比較少。\n所以，凡分有共同的智性本性的事物，也同樣朝向與自己同類的東西運動，甚至更強烈。因為它比其他一切事物越優越，就越容易與同類混合、融為一體。因此，在沒有理性的動物之中，我們看到蜂群、牛群、雛鳥的哺育，以及某種程度的愛；因為動物之中也有靈魂，而使它們聚合起來的那種力量，顯示出更高程度的作用，在植物、石頭、樹木裡從沒觀察到。但在有理性的動物之中，有政治共同體與友誼，有家庭與集會，在戰爭、條約與休戰之中也是如此。而在更高一等的事物裡，即使彼此分隔，也在某種意義上存在著統一，像諸星那樣。所以，往更高的層級上升，能夠在分隔的事物之間產生共感。\n那麼，看看現在發生的事吧：只有有智性的動物，現在忘了這種彼此的渴望與傾向，只有在它們身上，看不到匯流在一起的特性。然而，雖然人們努力避開〔這種結合〕，還是被它抓住、被它拘留，因為他們的本性太強大了；只要你肯觀察，就會看見我說的是真的。所以，一個不與任何屬土之物接觸的屬土東西，比一個完全與其他人隔絕的人，更容易找到。","人、神與宇宙都結出果實；各自在適當的季節結出。即使習慣用法把這個詞專用在葡萄藤和類似的東西上，這也不算什麼。理性為所有人、也為自己結出果實，並且從它那裡，又生出與理性本身同類的其他東西。","如果你能，就用教導來糾正做錯事的人；如果不能，就記住，寬容是為了這個目的才給你的。眾神對這樣的人也寬容；在某些事上，祂們甚至幫助他們得到健康、財富、名聲；祂們就是這樣仁慈。這在你也是做得到的；不然，請說，誰阻止你？","勞作時不要像個可憐的人，也不要像個想被憐憫或被讚賞的人；只要把你的意志導向一件事：照著合群的理性所要求的，發動自己，也約束自己。","今天我擺脫了一切煩惱，或者說，我把一切煩惱都拋了出去，因為它不在外面，而在裡面，在我的意見裡。","一切事物都一樣：經驗上熟悉，時間上短暫，質料上沒有價值。現在的一切，就跟我們埋葬的那些人的時代一樣。","事物站在我們之外，各自獨立，它們既不知道自己的任何事，也不表達任何判斷。那麼，是什麼在對它們作出判斷？是主宰之心。","理性而合群的動物，他的善與惡，不在於被動，而在於主動，就像他的德性與惡行，也不在於被動，而在於主動。","對被拋向空中的石頭來說，落下來不是惡，被帶上去也不是什麼善。","向內深入人們的主宰之心，你就會看到，你怕的是些什麼樣的評判者，以及他們對自己又是什麼樣的評判者。","一切都在變化：你自己也在不斷變動，在某種意義上也在不斷毀壞，整個宇宙也是如此。","你的本分是把別人的不義行為留在它所在的地方。","活動停止，運動與意見停止，在某種意義上是它們的死亡，這並不是惡。現在把你的思想轉向你的生命：你作為孩童的生命、作為青年的生命、壯年的生命、老年的生命，因為在這些階段裡，每一次轉變也都是一次死亡。這有什麼可怕的嗎？\n現在把你的思想轉向你在祖父身邊的生活，然後是在母親身邊的生活，再是在父親身邊的生活；當你發現許多其他的差異、變化與終結時，問問自己：這有什麼可怕的嗎？同樣地，你整個生命的終結、停止與轉變，也不是什麼值得害怕的事。","趕快去〔審視〕你自己的主宰之心、宇宙的主宰之心，還有你鄰人的主宰之心：你自己的，是為了讓它公正；宇宙的，是為了記得你是什麼的一部分；你鄰人的，是為了知道他是出於無知還是明知而做，也為了想到他的主宰之心與你的同類。","就像你自己是一個合群體系的組成部分，也讓你的每個行為成為合群生活的組成部分。你的任何行為，如果不論直接或間接，都與社會的目的無關，就會撕裂你的生命，讓它不能成為一體，這帶有叛亂的性質，就像在民眾大會上，一個人自行其是，與大家的共識分開站著。","小孩子的爭吵與遊戲，可憐的小靈魂扛著屍體〔一切都是如此〕；所以冥界場景的演出所展示的，更清楚地映入我們眼簾。","考察一個對象的形式的性質，把它完全跟物質部分分開，然後去沉思它；接著判定，具有這種特殊形式的東西，依本性所能存續的最長時間是多久。","你因為不滿足於你的主宰之心去做它依本性被造來做的事，就忍受了無窮的煩惱。不過〔這件事〕說夠了。","當別人責備你、恨你，或人們說了任何傷害你的話，就走近他們可憐的靈魂，深入裡面，看看他們是什麼樣的人。你會發現，根本沒有理由為了這些人對你抱著這樣或那樣的意見而費心。不過，你對他們必須懷著善意，因為他們依本性是朋友。眾神也用各種方式幫助他們，藉著夢、藉著徵兆，幫他們得到他們看重的東西。","宇宙週期性的運動是相同的，世世代代起伏往復。要麼宇宙的智性為每一個個別的結果都發動自己，若是這樣，就滿足於它的活動所產生的結果；要麼它只發動一次，其餘的一切以某種方式依序接續而來；要麼不可分的元素是萬物的起源。——總之，如果有神，一切都好；如果是偶然在統治，你也不要被它支配。\n不久大地就要覆蓋我們所有人：然後大地也會改變，由改變產生的事物也將永遠不斷地改變，這些又永遠改變下去。因為如果一個人思索那些如浪接著浪一般相繼而來的變化與轉化，以及它們的迅速，他就會輕視一切會毀壞的東西。","宇宙的成因就像冬天的洪流：它把一切都捲走。可是那些投身政治、還自以為是在扮演哲學家的可憐人，是多麼沒有價值啊！全是胡言亂語的人。好吧，朋友：去做自然此刻要求的事。如果你有能力，就發動自己，不要四下張望，看有沒有人注意到；也不要指望柏拉圖的《理想國》：只要最小的事進行得順利，就感到滿足，並把這樣的事看成不是小事。因為誰能改變人們的意見？而沒有意見的改變，除了那些一邊呻吟一邊假裝服從的人的奴役，還有什麼？\n來吧，告訴我亞歷山大、腓力和法勒倫的德米特里烏斯的事。他們自己去判斷，是否找到了共同的自然所要求的，並依此訓練了自己。但如果他們像悲劇中的英雄那樣行事，沒有人判我必須模仿他們。哲學的工作是純樸而謙遜的。不要把我拉去傲慢與驕矜。","從高處往下看那無數的人群與他們無數的儀式，在風暴與平靜中千變萬化的航行，以及那些出生、共同生活與死去的人之間的差異。再想想古時別人過的生活，在你之後將要生活的人的生活，如今蠻族之中過的生活，有多少人連你的名字都不知道，有多少人很快就會忘記它，還有那些也許現在稱讚你的人，很快就會責備你；想想身後的名聲沒有任何價值，名望也沒有，別的也沒有。","對來自外在原因的事，要不受擾亂；對憑著內在原因所做的事，要有公正，也就是說，要讓衝動與行動以此為終點：合群的行為，因為這合乎你的本性。","在擾亂你的事物中，你可以把許多無用的東西從路上移開，因為它們完全存在於你的意見裡；然後你就能為自己贏得廣闊的空間，只要在心中把握整個宇宙，沉思時間的永恆，觀察每一件事物的迅速變化，從誕生到解體的時間多麼短暫，而誕生之前的時間無限，解體之後的時間也同樣無邊！","你看見的一切都將很快消逝，而那些目睹它消逝的人也將很快消逝。在極高齡時死去的人，和夭折的人，將被帶入同樣的境地。","這些人的主宰之心是什麼，他們忙於什麼樣的事，他們出於什麼樣的理由去愛、去尊敬？想像你看到他們可憐的靈魂赤裸裸地攤開。當他們以為自己的責備能造成傷害、自己的稱讚能帶來好處時，那是多麼可笑的想法！","失去不過是改變。而宇宙的自然喜愛改變，順服她的時候，一切現在都做得很好，從永恆以來就是同樣的形式，直到無盡的時間也將如此。那你怎麼說——說一切過去都是壞的，將來也永遠是壞的，在這麼多的神之中，從來沒找到任何力量來矯正這些事，而世界卻被判定要被束縛在永不停止的惡裡嗎？","作為一切根基的物質是多麼腐朽！水、塵土、骨頭、汙物；或者說，大理石是大地的硬繭；金與銀是沉澱物；衣服不過是毛髮；紫色染料是血；其餘一切也都是同類。而屬於氣息本性的東西，也是同樣的另一種東西，由此變為彼。","這悲慘的生活、這怨言、這猴子般的把戲，夠了。你為什麼煩惱？這有什麼新鮮的？是什麼讓你不安？是事物的形式嗎？看著它。還是質料？看著它。除此之外沒有別的了。那就朝向眾神吧，現在終於變得更純樸、更好了。我們把這些事物審視一百年或三年，結果是一樣的。","如果一個人做了錯事，傷害是他自己的。但也許他並沒有做錯。","要麼萬物都出自一個有智性的源頭，像在一個身體裡那樣聚合在一起，那麼部分就不該對為整體利益所做的事挑剔；要麼只有原子，除了混合與離散之外沒有別的。那你為什麼煩惱？對主宰之心說：你死了嗎？你敗壞了嗎？你在裝模作樣嗎？你變成野獸了嗎？你是不是跟其餘的牲畜一起聚居、一起吃草？","要麼眾神沒有力量，要麼有力量。如果祂們沒有力量，你為什麼向祂們祈禱？但如果祂們有力量，你為什麼不祈求祂們賜給你這樣的能力：不怕你所怕的任何事，不貪你所貪的任何事，不為任何事痛苦，而要去祈求這些事不要發生、或要發生？因為如果祂們能與人合作，當然也能為了這些目的合作。但也許你會說，眾神已把這些放在你的能力之內了。那麼，像自由人那樣運用在你能力之內的東西，不是比以奴隸般卑賤的方式去貪求不在你能力之內的東西更好嗎？又是誰告訴你，眾神不幫助我們，即使在我們能力之內的事上也不幫助？那就開始為這樣的事祈禱，你就會看到。\n有人這樣祈禱：我怎樣才能與那個女人同寢？你要這樣祈禱：我怎樣才能不貪求與她同寢？另一個人這樣祈禱：我怎樣才能擺脫這件事？你要祈禱：我怎樣才能不渴望擺脫它？另一個人這樣：我怎樣才不會失去我的小兒子？你要這樣：我怎樣才能不害怕失去他？總之，把你的祈禱轉向這個方向，看看會有什麼結果。","伊比鳩魯說：我生病的時候，談話並不是關於身體的痛苦，他說，我也沒有對來探望我的人談這類話題；我仍然像從前一樣談論事物的本性，抓住這個要點：心靈雖然參與著可憐血肉中發生的那些運動，如何仍能不受擾亂，保持它自己的善。他說，我也沒有給醫生機會擺出莊嚴的神情，好像他們在做什麼大事，我的生活依然平順而幸福。\n那麼，你也做他所做的，如果你生病了，生病時這樣做，在任何其他情況下也這樣做；因為不論遇到什麼事都不背離哲學，不與無知的人或不懂自然的人閒談瑣事，是所有哲學學派共有的原則；而是只專注於你此刻所做的事，以及你用來做這件事的工具。","當你為任何人無恥的行為而生氣時，立刻問自己：那麼，世界上會沒有無恥的人，這可能嗎？不可能。那就不要要求不可能的事。因為這個人也是必然存在於世界上的無恥之人之一。對於狡詐之人、背信之人，以及任何以任何方式做錯事的人，也讓同樣的想法出現在你心裡。因為當你提醒自己，這類人不可能不存在，你對每一個個別的人就會更和善。\n在事情發生的當下，就立刻領會這一點也有益：自然給了人什麼德性，來對抗每一種不義的行為。因為她給了人溫和，用來對治愚蠢的人，而對另一類人，則給了別的某種力量。而且在所有情況下，你都能用教導來糾正走入歧途的人；因為每一個犯錯的人都錯過了他的目標，走入了歧途。再者，你在哪裡受到了傷害？你會發現，在那些讓你惱怒的人之中，沒有一個做了任何會讓你的心變壞的事；而對你是惡、是有害的，只是以心為根基。如果一個沒受過教導的人，做了沒受過教導的人會做的事，又有什麼傷害，有什麼奇怪？\n想想你是不是更該責備你自己，因為你沒料到這個人會以這種方式犯錯。你的理性給了你方法，讓你推想他很可能犯這個錯誤，而你卻忘了，還對他犯了錯感到驚訝。但最重要的是，當你責備一個人背信或忘恩時，要轉向你自己。因為錯顯然在你自己，不論是你相信一個有這種性情的人會守信，還是你施予恩惠時，不是毫無保留地施予，也沒有用那樣的方式施予，使你從行為本身就得到全部的益處。因為你為人做了一件事之後，還想要什麼？你做了合乎你本性的事，難道還不滿足，還要為此索取報酬嗎？就像眼睛為了看而要求補償，腳為了走路而要求補償一樣。這些肢體是為了特定的目的而造的，依它們各自的構造運作，就得到屬於它們的東西；同樣地，人天生是為仁愛的行為而造的，當他做了任何仁愛的事，或以任何其他方式有助於共同利益的事時，他就是依其構造行事，也得到了屬於他的東西。"],["我的靈魂啊，你什麼時候才能變得良善、單純、完整、坦然，比包著你的身體更看得清楚？什麼時候才能嘗到親愛、知足的心境？什麼時候才能不缺什麼，不再渴望任何東西，也不再為了享樂去貪求有生命或沒生命的東西？不再貪求更多時間來享受，不再貪求哪個地方、哪種好氣候，或是跟你合得來的人？\n你能不能滿足於眼前的處境，對身邊的一切感到歡喜？能不能告訴自己：你什麼都有了，這一切都來自眾神，對你都好；凡是眾神喜歡的，凡是他們為了保全那完美的生命體而賜下的，往後也都會對你好。那生命體良善、公正、美好，萬物由它生成、由它連結，它包含一切、擁抱一切；消散的東西，也是為了生出別的相似的東西。\n你什麼時候才能跟眾神和世人同處一個共同體，既不抱怨他們，也不被他們指責？","留意你的本性要的是什麼，只要你單單受本性支配，就照著去做，接受它，只要身為生物的你不會因此變差。接著，留意身為生物的你，本性要的是什麼；這一切你都可以給自己，只要身為理性動物的你不會因此變差。理性動物，也就一定是合群的動物。照這些規則走，不必再為別的事煩心。","發生在你身上的事，不是你的本性承受得了，就是承受不了。如果承受得了，就別抱怨，照你的本性所能，承受下來。如果承受不了，也別抱怨，因為它耗盡你之後，自己也就消失了。\n不過要記得：凡是能不能忍，取決於你自己的意見，只要你認為忍下來對你有益、是你的本分，你的本性就承受得了。","有人犯了錯，就和氣地指點他，告訴他錯在哪裡。如果你做不到，就怪自己，或者連自己也別怪。","無論什麼事落在你身上，都是從永恆以前就為你備好的；層層因果交織，從很久以前就在為你的存在，和隨之而來的一切紡線。","不論宇宙是原子聚成的，還是自然是個有秩序的體系，首先要確定：我是受自然支配的整體的一部分；其次，我跟同類的其他部分有某種親密的關係。記住這兩點，我既然是部分，就不會對整體分給我的任何事不滿；因為對整體有益的事，不會傷到部分。整體包含的，沒有一樣對自己有害。各種自然都有這個共同的原則，宇宙的本性還多一條：就算有外在的原因，也沒辦法逼它生出對自己有害的東西。\n所以，記得我是這樣一個整體的一部分，我就會滿足於發生的一切。記得我跟同類的部分親近，我就不會做任何不合群的事，反而會朝同類靠近，把全部心力用在共同的利益上，不去做相反的事。\n這些都做到了，生活必定順順地流過去，就像你看到的：一個公民過得幸福，因為他不斷做對同胞有益的事，也樂意接受城邦分派給他的安排。","整體的各個部分，凡是自然包含在宇宙裡的，都免不了消亡；不過要這樣理解：它們是要經歷變化。如果這對部分來說，既是一種惡，又是不可避免，那整體就不可能運作良好，因為它的部分都在變化，而且生來就要以各種方式消亡。難道自然自己打算傷害屬於自己的部分，讓它們落入惡、又必然陷在惡裡？還是這些結果發生時，她根本不知道？兩種說法都難以置信。\n就算有人把「自然」這個詞擱在一邊（當作一種有作為的力量），只說這些事本來就是這樣，一面說整體的部分本性上就會變化，一面又對此驚訝、惱怒，好像發生了違反自然的事，還是很可笑。尤其事物的消解，本來就是回到構成它們的東西：不是組成萬物的元素四散，就是固體變成土、氣體變成空氣，於是這些部分被收回宇宙的理性裡，不論這理性是某個時期被火吞掉，還是靠永恆的變化不斷更新。\n也別以為你身上的固體和氣體，是從出生就有的。這一切不過是昨天、前天，才從食物和吸進的空氣添上去的。會變化的，是這後來添上的部分，不是你母親生下的那個。就算（你母親生下的）那個，跟另一部分緊緊連在一起，而那部分的特性就是會變，這對上面說的也構不成什麼反駁。","你既然領受了這些名稱：良善、謙遜、真實、理性、心境平和、心胸寬大，就小心別換掉它們；萬一丟了，趕快回來。\n要記得：「理性」是指，對每件事都留心分辨，不馬虎；「心境平和」是自願接受共同的本性分派給你的一切；「心胸寬大」是讓心智高過肉體的快樂和痛苦，高過名聲這種可憐的東西，高過死亡，和一切類似的事。你若守住這些名稱，又不指望別人這樣稱呼你，你就成了另一個人，過上另一種生活。\n因為繼續像你到現在這樣，在這種生活裡被撕扯、被玷污，是愚蠢又過分貪戀生命的人才會有的樣子，就像那些被野獸咬得半死的格鬥士：滿身傷口、血跡斑斑，還求著留到明天，明天他們還是要用同樣的狀態面對同樣的爪牙。\n所以，把自己安放在這少數幾個名稱裡；若能安住，就像被送到幸福島。若發覺自己跌下來、守不住，就勇敢退到某個角落，在那裡守住；要不乾脆離開人生，不帶怒氣，帶著單純、自由和謙遜，至少一生中做了這件值得稱許的事：這樣離開。\n要記得這些名稱，想著眾神會很有幫助：他們不要人奉承，而是希望所有有理性的存在都變得像他們；也要記得：做無花果樹工作的是無花果樹，做狗的工作的是狗，做蜜蜂的工作的是蜜蜂，做人的工作的是人。","啞劇、戰爭、驚嚇、麻木、奴役，會一天天抹掉你那些神聖的原則。你沒研究自然，就想像了多少事，又忽略了多少事？\n你的本分是這樣看、這樣處理每件事：一面把應付環境的能力練到完善，一面鍛鍊沉思的能力，並且保有因認識每件事而來的自信，不炫耀，也不隱藏。\n你什麼時候才能享有單純、莊重，什麼時候才能認識每件事物：它本質上是什麼，在宇宙中占什麼位置，生來能存在多久，由什麼組成，能屬於誰，誰能給它、又能奪走它？","蜘蛛捉到蒼蠅就得意，有人捉到野兔得意，有人網到小魚得意，有人捕到野豬得意，有人捕到熊得意，有人俘虜了薩爾瑪提亞人也得意。你檢視他們的意見，他們不都是強盜嗎？","養成一種沉思的看法，看萬物怎樣互相轉化，並且不斷留意，在這一門（哲學）上多下功夫。因為沒有什麼比這更能培養心胸寬大。\n這樣的人已經卸下身體；他看到自己遲早要離開人群、放下這裡的一切，只是不知道什麼時候。於是他把自己全交給正義，其餘發生的一切，則順服宇宙的本性。至於別人怎麼說他、怎麼想他、怎麼對付他，他連想都不想，因為他自己滿足於兩件事：此刻做的事合乎正義，此刻分派給他的一切他都滿意。他放下所有讓人分心、忙亂的追逐，除了走完法則所指的那條筆直的路，並藉著走完這條路來跟隨神，別的都不求。","何必猜疑、恐懼？你本來就有能力去探問該做什麼。看得清楚，就安心走這條路，不要回頭；看不清楚，就停下來，找最好的人商量。如果有別的事擋住你，就盡你的能力，謹慎地往前走，堅持看起來公正的那件事。因為達到這個目標最好，就算失敗，也是失敗在追求這個目標的路上。\n凡事依著理性走的人，安寧又積極，愉快又沉著。","一從睡夢中醒來，就問問自己：別人做了公正正當的事，對你有沒有什麼不同？沒有不同。\n你大概沒忘記，那些在稱讚或指責別人時擺出傲慢姿態的人，在床上、在飯桌上是什麼樣子；沒忘記他們做什麼、躲什麼、追什麼，怎麼偷、怎麼搶，不是用手腳，而是用他們最寶貴的那個部分；人只要願意，靠這個部分就能生出忠誠、謙遜、真實、法則、美好的神靈（幸福）。","對那位給了一切、又收回一切的自然，受過教導又謙遜的人會說：你想給什麼就給，想收回什麼就收回。他這樣說不是逞強，而是順服，心裡也滿意。","你剩下的日子很短。像在山上那樣過吧。因為住在這裡或那裡沒有差別，只要無論在世上哪裡，都像生活在一個城邦（政治共同體）裡。讓人看看、認識一個真正照著自然生活的人。如果他們容不下他，就讓他們殺了他吧，因為那比像（他們那樣）活著更好。","別再談好人該是什麼樣子，去做那樣的人。","不斷默想整個時間和整個實體，並且想：就實體來說，每一件個別的事物不過是一粒無花果籽；就時間來說，不過是鑽子轉一圈。","看著一切存在的事物，看它們已經在消解、在變化，可以說正在腐壞、消散；或者說，一切事物依自然的構成，都是要死的。","想想人在吃飯、睡覺、交合、排泄時是什麼樣子。再想想他們發號施令、傲慢自大，或從高位上發怒斥責時是什麼樣子。\n不久之前，他們為了多少事、對多少人當過奴隸；再過一會兒，想想他們會落到什麼地步。","宇宙的本性帶給每件事物的，就是對那件事物有益的；而且在自然帶給它的那個時刻，對它就是有益的。","「大地愛雨水」，「莊嚴的以太也愛」；宇宙愛創造一切將要成為的事物。所以我對宇宙說：我愛，如你所愛。不是也有人這樣說：「這個或那個喜歡（慣於）生成」嗎？","你不是住在這裡，而且已經習慣了；就是要離開，而這是你自己的意願；不然就是你快死了，本分已經盡了。除此之外沒有別的。所以，放心吧。","這一點要始終對你清楚：這一小塊地跟任何其他地方一樣；這裡的一切，跟山頂上、海邊，或任何你想待的地方的一切都一樣。你會發現，正如柏拉圖所說：住在城牆裡，就像住在山上牧人的圍欄裡。","我的主宰之心，現在對我來說是什麼？我現在把它造成什麼樣子？我現在把它用在什麼目的上？它有沒有失去理解力？有沒有脫離、割裂社群生活？有沒有跟可憐的肉體融成一團、混在一起，以致隨著肉體一起動？","逃離主人的是逃奴；而法則就是主人，違背法則的就是逃奴。\n同樣，感到悲傷、憤怒或恐懼的人，是因為對某件事不滿：那件事已經發生、正在發生，或將要發生，而那是統治萬物的那一位安排的，他就是法則，把合適的分給每個人。所以，恐懼、悲傷或憤怒的人，就是逃奴。","一個人把種子放進子宮就走了，然後另一個原因接手，在上面工作，造出一個孩子。從這樣的材料，造出這樣的東西！之後孩子把食物吞下喉嚨，又有另一個原因接手，造出知覺和運動，總之是生命、力量和其他種種；這些多麼多，多麼奇妙！\n所以，要觀察這些在隱密中產生的事物，看見其中的力量，就像我們看見讓東西往下、往上動的力量，不是用眼睛，卻同樣清楚。","不斷地想：現在這樣的事，過去也是這樣；並且想：將來還會一樣。把同一類型的整齣戲、整個舞臺，擺在你眼前，不管是你自己的經驗，還是更古老的歷史上學到的；例如哈德良的整個宮廷，安東尼努斯的整個宮廷，腓力、亞歷山大、克羅伊索斯的整個宮廷；因為那些都跟我們現在看到的是同樣的戲，只是演員不同。","把每個因為任何事而悲傷或不滿的人，想成一頭被獻祭的豬，又踢又叫。\n那個在床上默默為我們被束縛的處境嘆息的人，也像這頭豬。要想到，只有理性的動物才被賦予自願順從所發生之事的能力；而單純的順從，則是加在所有存在者身上的必然。","你做的每一件事，都各自停下來問自己：死亡會奪走我做這件事，這是否讓它可怕？","有人的過錯讓你生氣時，立刻轉向自己，想想自己用類似的方式犯過什麼錯，比如把金錢當成好東西，或是快樂，或是一點名聲，諸如此類。留意到這一點，你很快就忘了怒氣，如果再加上這個想法：那人是被迫的，他還能怎麼做？或者，你有能力的話，就替他除去那個逼迫。","見到蘇格拉底學派的薩提隆，就想想尤提克斯或海門；見到歐弗拉特斯，就想想尤提奇翁或西爾瓦努斯；見到阿爾基夫隆，就想想特洛帕伊奧福洛斯；見到色諾芬，就想想克里托或塞維魯斯；看著你自己，就想想任何一位其他的凱撒；對每個人都這樣做。\n然後讓這個念頭留在心裡：那些人現在在哪裡？哪裡也沒有，或是沒人知道在哪裡。這樣你就會不斷把人間的事看成煙，什麼也不是；尤其當你同時想到，一旦變了的東西，在無限的時間裡就再也不會存在。\n而你呢，你存在的時間有多短？為什麼不甘心好好地過完這短短的日子？你在逃避什麼題材和機會（讓你去施展）？這一切除了是理性的練習，還能是什麼？理性已經仔細考察，看清了生活中所發生之事的本性。所以要堅持下去，直到你把這些事化為己有，就像強健的胃消化一切，就像旺盛的火把投進去的東西都燒成火焰和光亮。","別讓任何人有機會真實地說你不單純、不善良；誰對你有這類想法，就讓他成為說謊的人；而這完全在你能力之內。誰能阻止你成為良善單純的人？你只要決定：除非能成為這樣的人，就不再活下去。因為你要是不這樣，理性也不允許（你活下去）。","就我們這生活的素材來說，怎麼做、怎麼說才最合乎理性？不管是什麼，你都有能力去做、去說，別藉口說受到阻礙。你會一直嘆氣，直到你的心境變成這樣：享樂的人對奢華是什麼感受，你面對眼前這份素材，做合乎人的構造的事，就有一樣的感受；因為凡是他能力所及、依本性做得到的事，人都該視為一種享受。而這在任何地方他都做得到。\n圓柱不能憑自己的運動到處移動，水、火，或任何其他受自然或無理性靈魂支配的東西也不能，因為擋住它們、擋在路上的東西太多。但智性和理性卻能穿過一切反對它們的事物，照著自己被自然造成的樣子，照著自己選擇的方式。把理性穿越一切的這種輕易擺在眼前，就像火往上、石頭往下、圓柱滾下斜面，此外不必再求別的。\n因為其他一切障礙，不是只影響身體（那是死的東西），就是除非透過意見和理性自己的屈服，根本壓不垮人，也傷不了人；因為若會傷人，感受到的人就立刻變壞。而對一切有某種構造的事物，不管有什麼傷害落在其中任何一個，受影響的那個就變得更糟；但在同樣的情況下，人卻因為正確運用這些遭遇而變得更好，也更值得稱讚。\n最後要記得：不傷害城邦的，就不傷害真正的公民；不傷害法則（秩序）的，就不傷害城邦；而這些被稱為不幸的事，沒有一件傷害法則。所以，不傷害法則的，就既不傷害城邦，也不傷害公民。","對浸透了真實原則的人，就算最簡短、最尋常的箴言，也足以提醒他免於悲傷和恐懼。例如：\n「樹葉，有的被風吹散在地上，人類的世代也是如此。」\n你的孩子也是樹葉；那些大聲喊叫、彷彿值得人相信的人，不管他們稱讚，或是反過來咒罵，或是暗地裡責備、嘲笑，也都是樹葉；同樣，那些將接受並把一個人的名聲傳給後世的人，也是樹葉。因為這一切，正如詩人所說，都是「在春天的季節生出」；然後風把它們吹落；然後森林又在原來的位置長出別的葉子。\n短暫的存在是萬物共有的，你卻像它們會永恆存在似的，逃避這個、追逐那個。再過不久，你就要閉上眼睛；而那位陪你走到墳前的人，不久也會有別人為他哀悼。","健康的眼睛應當看見一切可見的東西，不說：我要綠色的；那是有病的眼睛。健康的聽覺和嗅覺，也應當準備好感知一切可聽、可聞的事物。健康的胃對一切食物，應當像磨對它被造來磨的東西一樣。\n同樣，健康的理解力應當準備好面對發生的一切；那個說「讓我親愛的孩子們活著，讓所有人都稱讚我做的一切」的，就是在找綠色東西的眼睛，或是在找軟食的牙齒。","沒有人幸運到臨終時身邊沒人為將要發生的事高興。就算他是個善良有智慧的人，最後難道不會至少有人心想：我們終於可以鬆一口氣了，不用再受這位老師管束了？的確，他對我們沒有一個人嚴厲，但我感覺到他暗地裡在責備我們。這是人們對一個好人說的話。至於我們自己，還有多少別的原因，會讓很多人希望擺脫我們？\n所以，臨終時你要想到這一點，這樣想著，你就會更滿足地離去：我要離開這樣的生活了，在這生活裡，連我的夥伴，我為他們這麼辛苦、祈禱、操心的人，也都希望我離開，或許是希望由此得到一點好處。那麼，一個人又何必貪戀在這裡多留一會兒？\n不過，別因此帶著比較少的善意離開他們，要保持你自己的品格，友善、仁慈、溫和；另一方面也別像是被硬扯走；就像一個人安然死去時，可憐的靈魂輕易從身體分離，你離開人群也該如此，因為是自然把你與他們結合、使你與他們為伴的。現在她要解除這個結合了嗎？好吧，我就像離開親族一樣離開，不被拖著、不抗拒，而是不勉強；因為這也是合乎自然的事之一。","盡可能養成習慣：每當有人做任何事，就自問：這個人做這件事是為了什麼目的？但要從你自己開始，先檢查自己。","要記得，牽動這些線的，是藏在裡面的東西：它是說服的力量，它是生命，可以說，它就是人。默想自己的時候，絕不要把包著你的容器，和附在它周圍的這些器具算進去。它們就像一把斧頭，只不過這些是長在身體上的。\n事實上，這些部分若沒有推動它們、制約它們的那個原因，就沒有更大的用處，就像沒人使用的織布梭、書寫者的筆和趕車人的鞭子一樣。"],["理性的靈魂有這些特性：它能看見自己，分析自己，把自己造成想要的樣子；它結的果實由自己享用（植物的果實，和動物身上相當於果實的東西，是別人享用的）；不論生命的終點定在哪裡，它都能達成自己的目的。\n它不像舞蹈、戲劇之類，中途一被打斷，整個演出就不完整；它不論在哪個部分、在哪裡被停住，都能讓擺在面前的事完整圓滿，所以可以說：我已擁有屬於我的東西。\n此外，它走遍整個宇宙和周圍的虛空，審視宇宙的形態；它伸向無窮的時間，擁抱並領會萬物週期性的更新；它明白後來的人不會看到什麼新東西，先前的人也不曾看到更多；一個四十歲的人，只要稍有理解力，憑著事物的齊一，就已經看過所有過去和未來的事。\n愛鄰人、真實、謙遜，不把任何東西看得比自己更重，也是理性靈魂的特性，同樣也是法則的特性。所以，正確的理性跟正義的理性，毫無差別。","把歌聲的旋律拆成一個一個單獨的音，每個音都問自己：我是被這個擺佈的嗎？你就會很少看重悅耳的歌唱，因為你會羞於承認自己被它支配。舞蹈也是，對每個動作、每個姿態這樣做；搏擊競技也一樣。\n所以，除了德性和德性的行為，對一切事物，都要記得把心思放在它們各個部分上，靠這樣拆開，漸漸不那麼看重它們；並且把這個規則也用在你整個生命上。","那是多出色的靈魂：隨時準備好，一旦必須離開身體，不論是熄滅、四散，還是繼續存在，都已經準備妥當；這份準備出於自己的判斷，不是像基督徒那樣只是固執，而是經過考慮、帶著尊嚴，也能說服別人，不做悲劇式的表演。","我為公共利益做了什麼嗎？那我就已經得到回報了。讓這一點始終放在心裡，永遠不要停止（做這樣的好事）。","你的技藝是什麼？是成為良善的人。要把這件事做好，除了靠一般的原則，還能靠什麼？有些原則關於宇宙的本性，有些關於人的適當構造。","起初，悲劇搬上舞臺，是要提醒人：這些事會發生在他們身上，而且事情這樣發生是合乎自然的；如果你喜歡看舞臺上演的事，就不該被更大的舞臺上發生的事困擾。因為你看到，這些事必然這樣完成，連那些高喊「啊，喀泰戎山」的人也要承受。劇作家有些話說得很好，下面這幾句尤其好：\n「如果眾神忽略了我和我的孩子們，這也有它的道理。」\n又如：\n「對發生的事，我們不該煩躁惱怒。」\n還有：\n「收取生命的收成，就像收取結實的麥穗。」\n還有其他類似的話。\n悲劇之後，引進了古喜劇，它有一種近乎官方權威的言論自由，因為說話直白，對提醒人提防傲慢很有用；第歐根尼也為了這個目的，從這些作家那裡取材。\n至於接下來的中喜劇，要看看它是什麼；還有新喜劇，是為了什麼目的引進的，它逐漸沉淪成單純的模仿技巧。這些作家也說過一些好話，這是人人都知道的；但這整套詩作和戲劇的設計，究竟指向什麼目的？","很明顯：沒有哪種生活處境，比你現在碰巧所處的這一種，更適合做哲學思考。","一根樹枝從旁邊的樹枝上被切斷，必然也就從整棵樹上被切斷了。同樣，一個人跟另一個人分離，也就從整個社群裡掉了出來。只是樹枝是別人切斷的；人卻是自己動手，在恨鄰人、轉身避開鄰人的時候，使自己跟鄰人分開，卻不知道自己同時也把自己從整個社會體系切斷了。\n不過，他確實從創建社會的宙斯那裡得到一項特權：我們有能力重新跟靠近我們的人長合，再次成為幫助構成整體的一部分。只是這種分離如果常常發生，脫離的那一方就難以重新合一、恢復原狀。\n最後，那從一開始就跟樹一起生長、一直共有一個生命的樹枝，並不像被切斷後又接上去的；園丁大致是這麼說的：它雖與樹的其餘部分一起生長，卻與它不同心。","你照著正確的理性往前走時，若有人試圖擋你的路，他們既不能讓你偏離該做的事，你也不要讓他們使你失去對他們的善意；兩方面要同樣小心：既要在判斷和行動上堅定，也要對那些想阻礙你、或用別的方式困擾你的人保持溫和。\n因為對他們發怒是軟弱，從行動路線上被轉開、因為害怕而讓步，也是軟弱；兩者都是擅離崗位的逃兵：一個是因為害怕，另一個是跟本性上就是親人、朋友的人疏遠了。","沒有任何自然低於技藝，因為各種技藝模仿的就是事物的自然。既然如此，最完善、最包羅萬象的自然，不可能比不上技藝的巧思。一切技藝都是為了較高的事物去做較低的事物；宇宙的本性也是這樣。\n正義就是由此而來，其他的德性都建立在正義之上：因為如果我們在意中間的事物（無關緊要的事物），或是容易受騙、粗心、善變，正義就守不住。","那些讓你因追求或躲避而困擾的事物，如果並沒有來找你，那麼可以說是你自己走向了它們。所以，讓你對它們的判斷平靜下來，它們就會保持安靜，而你也不會被看到在追求或躲避。","靈魂的球形要保持形狀，就要它既不向任何對象伸出去，也不向內縮，既不四散，也不下沉，而是被光照亮，藉著這光，看見真理，就是萬物的真理，也是自己內在的真理。","有人輕視我，那是他的事。我要留意的，是不被發現做了或說了任何該被輕視的事。有人恨我，那是他的事。我要對每個人溫和友善，甚至準備好向他指出他的錯誤，不是帶著責備，也不是炫耀自己的忍耐，而是高貴誠懇，像偉大的福基翁那樣，除非他只是裝出來的。因為內在應當是這樣，人應當讓眾神看到：對任何事都不心懷不滿，也不抱怨。\n如果你此刻正在做合乎你自己本性的事，並且滿足於此時此刻合乎宇宙本性的事，你有什麼損失？你是被安置在崗位上的人，為的是讓有益於共同利益的事，能以某種方式完成。","人彼此輕視，又彼此奉承；人想要高過彼此，又在彼此面前卑躬屈膝。","有人說「我已經決定要公平地對你」，這多麼不健全、不真誠！老兄，你這是做什麼？沒必要事先通知。這很快就會在行動中顯出來。話應該清清楚楚寫在額頭上。一個人的品格是什麼樣，立刻從眼睛裡露出來，就像被愛的人，立刻從戀人的眼睛裡讀出一切。\n誠實善良的人，應該像身上氣味濃烈的人，旁邊的人一走近，不管願不願意，就聞得出來。但假裝單純，就像一根彎的棍子。沒有什麼比豺狼式的友誼（虛假的友誼）更可恥，要盡力避開它。善良、單純、仁慈的人，這些都會從眼睛裡露出來，不會看錯。","要用最好的方式生活，這個能力就在靈魂裡，只要它對無關緊要的事物不放在心上。而它做得到，只要把這些事物拆開、整體地看，並且記得：它們沒有一樣在我們心裡產生對它自身的意見，也不曾走向我們；這些事物是不動的，是我們自己對它們產生判斷，可以說把這些判斷寫在自己心裡，而我們有能力不去寫；如果這些判斷碰巧不知不覺進了我們的心，我們也有能力把它們擦掉。也要記得，這樣留心只需要很短的時間，然後生命就結束了。\n再說，做這件事有什麼麻煩？如果這些事合乎自然，就為它們歡喜，它們對你就容易；如果違反自然，就去找合乎你自己本性的東西，朝它努力，即使它不帶來名聲；因為每個人都被允許追求自己的善。","想想每一件事物是從哪裡來的，由什麼組成，將變成什麼，變了之後會是什麼樣子，而且它不會受到任何傷害。","（如果有人冒犯了你，先想想：）我跟人是什麼關係，我們是為了彼此而被造的；從另一方面說，我被造是要在他們之上，就像公羊領導羊群，公牛領導牛群。但要從第一原則來檢查這件事，從這一點出發：如果萬物不單是原子，那就是自然安排著萬物；如果是這樣，
