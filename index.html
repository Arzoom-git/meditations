能這樣猜。","這是他抄下的短句，可能出自荷馬的史詩，但不能確定。他為什麼抄它，譯文沒說，可能是想說內心的自在可以不外露。","今天有什麼事，讓你在心裡笑了一下？"],"11.32":["他們會咒罵德性，說出尖刻的話。做好事的人，要預先知道會有這種反應。原文沒有上下文。","這也是他抄下的短句，出處不確定。放在這裡，像是呼應前面幾則：好人遭到嘲諷是常態，不必意外，也不必因此動搖。","你曾因為做對的事被人笑過嗎？現在回頭看呢？"],"11.33":["冬天去找無花果，是瘋子的行為；孩子已經不再被允許擁有時，還去找孩子的人也一樣。要接受事物有它的時節，失去了就別硬要。","這是他抄的短句，語氣像愛比克泰德，出處不確定。「孩子」指失去的孩子，古代常有孩子早夭。話說得冷，但重點是不去要求事物違反它的時令。","你還在找一個已經過了季的東西嗎？"],"11.34":["愛比克泰德說，親吻孩子時，要對自己低聲說：「明天你或許就會死。」有人說這是不吉利的話，他回答：凡是說自然運作的話都不吉利的話，那說麥穗被收割也不吉利了。","愛比克泰德是當過奴隸的斯多噶老師，奧理略很敬重他。這則是他的摘抄。意思是：想到失去不是詛咒，反而讓你好好珍惜現在在身邊的人。","今天你對身邊最親近的人，有沒有一句一直沒說的話？"],"11.35":["未熟的葡萄、成熟的葡萄、葡萄乾，都是變化，不是變成沒有，而是變成還不存在的東西。","這是他抄下的短句，可能出自愛比克泰德，但不確定。借葡萄講死亡：只是從一個階段換到下一個，不是歸零。和上一則的麥穗收割是同一個角度。","你現在在哪個階段？它正在變成什麼？"],"11.36":["沒有人能奪走我們的自由意志。意思是：外面的事可以逼你，但同意或不同意，只有你自己能決定。","這是他抄的短句，出處譯文沒標，不確定。這是斯多噶的基本信念：別人可以拿走財物、身體，卻拿不走你同意或不同意的決定，這也是他整本書的底。","今天哪件事別人逼不了你，只有你自己能決定？"],"11.37":["愛比克泰德還說：給予同意要有一門技藝；行動要配合處境、合乎社會利益、顧及對象的價值；感官欲望要完全遠離；迴避，不要用在不在我們能力之內的事物上。","這是愛比克泰德教學的三個練習領域：判斷（同意）、行動、欲望與迴避。最後一句是說，不要對自己控制不了的事感到厭惡。這是他的摘抄。","判斷、行動、欲望，你這個禮拜最想先練哪一塊？"],"11.38":["他說，所以，爭論的不是一件尋常的事，而是關乎是否瘋狂。意思是：對與錯的判斷不是小事，關係到你是健全還是失常。","這則承接上一則，「他」大概還是指愛比克泰德，前後文沒有了，意思只能推測。他在談的是：判斷對錯不能馬虎，因為走偏的人等於不正常。","你最近一次為了什麼事爭論？它真的值得嗎？"],"11.39":["蘇格拉底問：你們要有理性的靈魂，還是沒理性的？要健全的，還是不健全的？答：健全的。那為什麼不去找？因為已經有了。那你們為什麼還要爭鬥吵鬧？","這是蘇格拉底式的問答，一步步逼出矛盾：人人說自己已經有健全的理性，卻照樣吵個不停。這是這一卷的結尾，也是他的摘抄，出處譯文沒標。","你最近一次吵架，吵的是事情，還是面子？"],"12.1":["你繞一大圈才想到達的，現在就能擁有，只要不拒絕給自己：過去別理會，未來交給天意，只讓當下照著虔敬與公正來安排。怕的不該是停止生活，而是從未開始照著本性生活。","他把虔敬說成滿足於分派給你的命運，把公正說成不掩飾地說真話、做合乎法則的事。這兩樣都不必等外在條件，所以「現在就能」。「不再是故鄉裡的陌生人」是對世界不再驚訝的意思。","你拖著沒做的事裡，哪一件其實今天就能開始？"],"12.2":["神看人的心，是看它脫去物質的外衣、外殼與雜質，只看智性。你若也習慣這樣看，就不會再為衣服、住處、名聲這些外在排場自找麻煩。","他把用神的眼光看人當成練習：只看心，不看包裝。對一個天天被排場圍繞的皇帝，這是很實用的視角。這一則有些句子難讀，我只抓了大意。","你最近對一個人的印象，有多少來自他的外表與排場？"],"12.3":["你由身體、氣息、智性三樣組成，只有智性真正屬於你。把別人的言行、對未來的擔心、身體的牽扯都分開，只活當下，做公正的事、說真話，就能平靜地度過剩下的日子。","恩培多克勒是古希臘哲學家，他描述過一個圓球般安歇的狀態，這裡借來形容心，呼應卷十一那個保持形狀的球。身體和氣息要照顧，但不要把它們當成自己。","此刻有什麼是你放不下、卻已經不屬於當下的東西？"],"12.4":["每個人愛自己勝過愛別人，卻把自己對自己的看法，看得比別人對他的看法還輕。要是被規定想的事都必須立刻說出口，沒有人撐得過一天。","他用一個思想實驗戳破：我們心裡有不少不好意思公開的念頭，這說明我們其實知道那些念頭不太好。他是在提醒自己，最該在意的評價者，是自己。","你心裡有哪個念頭，是你不敢說出口的？它說明了什麼？"],"12.5":["他想不通：眾神把一切安排得這麼好，怎會讓虔誠的好人死後徹底消失？他的推論是，若事情本不該如此，神就不會讓它如此，既然如此，就有它的道理。","他在掙扎死後有沒有延續的問題，答案不是證明，而是信任：神既然最優秀公正，就不會容許不合理的安排。譯文繞了一圈，這一則只能抓大意。","有哪個答不出的問題，讓你一直不安？它非答不可嗎？"],"12.6":["即使對自己覺得做不成的事，也要練習。左手在別的事上都不行，握韁繩卻比右手有力，因為它在這件事上練過。","「韁繩」是騎馬的比喻。他的重點是能力來自練習，不是天生。他拿這個鼓勵自己，連看似做不到的德性，例如不發怒，也一樣能練。","你一直說自己做不到的事，有沒有真的練過？"],"12.7":["想想一個人被死亡追上時，身體和靈魂會是什麼狀態；想想生命多短，過去與未來的時間多無邊，物質又多脆弱。","這是他的死亡默想清單，用來調整比例。原文只列了幾個項目，沒有結論，他要的是看完之後，你重新衡量什麼才值得在乎。","今天的事裡，哪一件你若知道生命很短，就不會再做了？"],"12.8":["默想事物的形成原則，讓它們脫去外衣；想行為的目的；想痛苦、快樂、死亡、名聲各是什麼；不安是自己造成的，沒有人被別人阻礙，一切都是意見。","這像他整本書功課的濃縮清單。「脫去外衣」是把表面剝掉看本質。最後三條指向同一件事：不安與阻礙，都出在自己的判斷。","今天讓你不安的事，真正的原因是誰？"],"12.9":["運用原則時，要像搏擊手，不要像角鬥士。角鬥士掉了劍就會被殺；搏擊手始終有他的手，只要用它，不需要別的。","劍是外來的工具，手是自己的。他的意思是：原則要長在身上，隨時用得上，而不是需要特定條件才派得上用場。把哲學當成身體的一部分，不是備用武器。","你有哪個原則，要在特定條件下才派得上用場？"],"12.10":["要看事物本身是什麼，把它們分成質料、形式和目的。也就是問：它由什麼構成，是什麼結構，又是為了什麼。","這是他常用的三分法。拆開之後，一件讓人激動的事會變得冷靜。原文只有一句，我補上了三個詞各是什麼意思。","拿一件讓你煩的事，試著說出它的材料、樣子和目的。"],"12.11":["人的能力有多大：不做任何神不認可的事，並且接受神可能給他的一切。意思是，人能做到的其實很多，而這兩件都在自己手上。","「神」在這裡可以理解為宇宙的理性與安排。他把人的能力縮成兩件：不做不該做的事，接受該來的事。一件管行為，一件管心態。","這兩件事裡，你今天哪一件比較沒做到？"],"12.12":["依著自然發生的事，不該責怪眾神，因為他們不做錯事；也不該責怪人，因為人做錯都是不自願的。所以不該責怪任何人。","斯多噶認為人做錯是因為不明白，沒人真心想作惡，因此不必責怪。這個前提很強，不一定人人同意，但他至少拿它來降低自己的怒氣。","最近你責怪過誰？如果他是不明白而不是故意，你會怎麼想？"],"12.13":["對生活中發生的任何事感到驚訝，多麼可笑，多麼像個陌生人。意思是：世界本來就會變，會意外，是因為沒把它當成自己的家。","這呼應第一則的不再是故鄉裡的陌生人。會驚訝，是因為把世界當成別人的地方；其實萬物一直在變，沒什麼好意外。","最近哪件事讓你很驚訝？回頭看，有沒有早就有跡象？"],"12.14":["只有三種可能：必然的秩序、仁慈的天意，或沒有主宰的混亂。若是必然，抗拒沒用；若是天意，就配得上幫助；若是混亂，你至少還有自己的智性，風暴帶不走它。","這是他最愛用的二選一（這裡是三選一）論證：不必先證明哪種為真，三種的結論都一樣，就是向內守住智性。所以他不需要等哲學爭論有答案。","你面對的處境，不管是哪一種可能，做法會有不同嗎？"],"12.15":["燈在熄滅之前，不是一直發光嗎？那麼你身上的真理、公正和節制，要在你死之前就先熄滅嗎？","燈到最後一刻還亮著。品格也該這樣，不該因為累了、快到終點、沒人看了就先放棄。他寫這句時年紀不小，也許是在對自己說。","你有沒有因為累了或沒人看，讓哪個原則先熄了？"],"12.16":["有人露出做了錯事的樣子，先問：我怎麼知道這是錯的？就算是錯，他也許已經自己定了自己的罪，生氣就像抓傷自己的臉。希望壞人不做壞事，像希望無花果沒有汁。","他先懷疑自己的判斷，再看對方的本性。最後說易怒就去醫治自己的性情，把怒氣當成自己要處理的毛病。開頭括弧裡的「說」是譯者補的。","最近你認定別人做錯，確定自己看到全貌了嗎？"],"12.17":["不正當的事就不要做，不真實的話就不要說。行動只問正當，言語只問真實，其餘的都不必多想。","這是他給自己最簡短的兩條規則：行動只問正當，言語只問真實，別人怎麼想都不在條件裡。因為短，所以可以隨身帶著用。","今天有沒有一句話，你說之前就知道不太真實？"],"12.18":["每件事都要觀察：讓你產生這個印象的東西是什麼，把它拆成形式、質料、目的，以及它必須結束的時限。","和第十則是同一套拆法，這次多了一項「時限」：每件事都會結束。「表象」是事物給你的第一印象，先拆開看，再決定要不要相信。","讓你不舒服的那個畫面，拆成這四項後還剩什麼？"],"12.19":["終於要明白：你身上有某種東西，比那些像拉線一樣牽著你的情緒，更好、更神聖。然後問自己：我心裡現在有什麼？是恐懼、猜疑、欲望，還是別的？","牽著人的是情緒，他要做的是看見那些線，並承認自己不等於線。問「現在有什麼」是一個命名練習：說出名字，情緒就不再那麼大聲。","此刻你心裡最大聲的，是恐懼、猜疑還是欲望？"],"12.20":["第一，不要不加考慮、沒有目的地做事。第二，讓行為只指向合群的目的。這是一天裡最簡單的兩道檢查。","他把一天的行動篩成兩道關卡：想過沒有？對人有沒有益？兩條都不難記，難的是真的每件事都問。","你今天排的事裡，有哪一件根本沒想過為什麼要做？"],"12.21":["想想不久之後你什麼也不是、哪裡也不在，你現在看到的一切、現在活著的人，也都不在了。萬物生來就要消亡，好讓別的事物能接續存在。","這是常見的死亡默想，但這次多了後半句：消失是為了讓別的事物接續，是接力，不只是失去。這讓這個想法比較不那麼灰暗。","你正在做的哪件事，是在你離開後仍會留下來的？"],"12.22":["一切都是意見，而意見在你的能力之內。只要你願意，就拿掉意見，像繞過岬角的水手，會發現一片平靜、沒有波浪的海灣。","意見是他的核心觀念：困擾多半是自己加上去的判斷。岬角後面風浪小，是說拿掉判斷，事情就平靜了。他寫「只要你願意」，強調選擇權在你。","今天哪個意見，是你拿掉就能平靜下來的？"],"12.23":["任何活動在適當的時候停止，並不因為停止而受害；由所有行動組成的整個生命，在適當的時候結束，也一樣。凡是對整體有益的，始終是好的，也是合時的。","他先用一場演出、一次談話這類小活動打底，再把結論推到整個生命：到了時候結束，本身不是惡。關鍵字是「合時」，時機由自然決定。","你有哪件事早該收尾，卻因為捨不得一直拖著？"],"12.24":["三條原則隨時備好：做事不草率、不做不公正的事，外來的事不是偶然就是天意，都不可責怪；想想每個存在從開始到分解；若被抬高俯視人間，看到的都是同樣的事物。","這是他隨身準備的三個視角：行動的標準、事物的生滅、從高處往下看。最後一個他在別卷也用過，答案隱含在問句裡：這些事值得驕傲嗎？","從很高的地方看你今天的煩惱，它有多大？"],"12.25":["拋開意見，你就得救了。那麼，誰阻止你拋開它？答案是沒有人，只有你自己的習慣在抓著它。","同樣是意見的主題，這次用反問收尾：沒有人阻止，除了你自己。這裡的「得救」是脫離困擾的意思，不是宗教上的得救。","你現在抓著哪個意見不放？是誰逼你的？"],"12.26":["你煩惱時，是忘了這幾件事：一切依本性發生、別人的錯與你無關、人以智性相連、沒有什麼真是你自己的、一切是意見，以及人只活當下，也只失去當下。","這是一份遺忘清單，把全書反覆講的重點一次列出。孩子、身體、靈魂「都來自神性」，所以都不是私有物。這幾件事彼此相扣，缺一件就會忘了其他的。","清單裡哪一件，是你此刻最容易忘的？"],"12.27":["常回想那些因名聲、不幸、仇恨而顯赫、愛抱怨的人，他們現在在哪裡？煙、灰燼和一個故事，或連故事都不是。比起拚命爭取，單純地在眼前做公正的事，更合乎哲學。","提比略是羅馬皇帝，晚年住在卡布里島；其他人名多半是早期的羅馬人，生平今天不清楚，這裡只是舉例。最後一句挖苦得很準：為自己沒有傲氣而驕傲，也是傲氣。","你有沒有因為自己做得好，而在心裡有點得意？"],"12.28":["有人問你怎麼知道眾神存在才敬拜他們，他的回答是：他連自己的靈魂也沒見過，卻敬重它；同樣，從不斷經驗到眾神的力量，他領悟他們存在。","他說的「甚至可以用眼睛看見」，意思不確定，可能指天上的事物。重點是類比：看不見的靈魂他也相信，因為他看見它的作用。","你相信哪個看不見的東西，是因為它的作用，而不是它的樣子？"],"12.29":["生活的安穩就在這裡：徹底看清每件事的質料與形式，用全部的靈魂行公正、說真話，然後享受生活，把一件好事接在另一件好事後面，連最小的間隔也不留。","他在書裡常批評享樂，這裡的享受指的是做好事一件接一件的連續。前面的拆解和公正，都是為了這個結果：日子過得安穩，不是為了更辛苦。","今天哪件好事，可以接在上一件好事後面做？"],"12.30":["太陽光只有一道，雖然被牆和山隔開；共同的物質只有一個，靈魂只有一個，有智性的靈魂也只有一個，雖然看起來被分割。智性使一切相連，共同體的感覺不中斷。","他用光被遮擋做比喻，說看似分開，其實是一個。這是斯多噶的整體想法：人與人的智性同出一源。這一則文字很難，括弧是譯者補的，我保守看待。","你覺得和誰斷了聯繫？那更像被一堵牆擋住，還是真的分開了？"],"12.31":["你想要什麼：繼續存在嗎？那就是要有感覺、運動、成長，使用言語和思考。這些哪一樣值得渴望？若不太看重，就轉向跟隨理性和神；因死亡奪走別的而困擾，就和敬重理性不一致。","他把想活下去這個念頭拆成一項一項，逐項問值不值得。拆開後，執著常常就小了。最後一句是說：若還是困擾，就和自己敬重理性的立場矛盾。","你想繼續擁有或不想失去的，具體是哪一樣？"],"12.32":["在無邊的時間裡，分給每個人的部分多麼小；在整個物質和宇宙的靈魂裡占的更小；你在大地上，只是爬行在多麼小的一塊土上。所以除了照本性行動、承受該承受的，別把任何事看成偉大。","他拉遠三次：時間、物質、土地。「宇宙的靈魂」是斯多噶把宇宙看成有靈魂的整體。結論是縮小一切的份量，只留下一件值得認真的事：照本性行動。","讓你覺得天大的那件事，放到十年後算多大？"],"12.33":["主宰之心怎麼運用它自己，一切都在這裡。其他的一切，不論在不在你能力之內，都像沒有生命的灰燼和煙。","這句把全書的精神濃縮成一句。注意他說「不論是否在你意志的能力之內」：連你能掌握的外在事物，價值也排在主宰之心之後。","今天你的主宰之心，把力氣花在哪裡？"],"12.34":["想要輕視死亡，最有力的想法是：就連認為快樂是善、痛苦是惡的人，也輕視過它。他們都能不怕，你更該能。","他指的大概是主張快樂為善的學派，例如伊壁鳩魯學派，這是我的推測。他是斯多噶，兩派在許多事上看法不同，所以這個論證是：連你不認同的人都能做到。","你不認同的人當中，有誰在某件事上比你勇敢？"],"12.35":["對一個認為只有合時而來的才是善的人，做合乎理性的行為多一點或少一點、沉思世界的時間長一點或短一點，都沒有差別，死亡對這樣的人也不可怕。","重點是：人生是否完整，不靠長度，靠每一刻是否合乎正確理性。這和第二十三則的結論相通，都是把「合時」放在長短之前。","如果人生好壞不看長短，今天你想讓它在哪方面更完整？"],"12.36":["你是世界這座大城邦的公民，在其中是五年還是三年沒有分別。你說戲只演了三幕，但在生命裡，三幕就是整部戲。把你帶進來的自然現在送你離開，滿意地離去吧。","這是全書最後一則，像他寫給自己的告別。法務官是羅馬的官員，演員由他僱用，也由他打發。整部戲何時完整，不是演員能決定的，所以不必計較演了幾幕。","如果今晚就是謝幕，你今天剩下的時間想怎麼過？"]};

function render(dir){
  const{b,n}=pos,total=B[b-1].length,txt=B[b-1][n-1];
  const isToday=b===T.b&&n===T.n,d=new Date();
  $("today").hidden=!isToday;
  if(isToday)$("today").textContent="今日一則　"+(d.getMonth()+1)+" 月 "+d.getDate()+" 日";
  $("cite").innerHTML=roman(b)+" · "+roman(n)+"<small>卷"+CN[b]+"　第"+cn(n)+"則</small>";
  $("cite").setAttribute("aria-label","卷"+CN[b]+"第"+cn(n)+"則，打開這一卷的目錄");
  const used=new Set();
  $("text").innerHTML=txt.split("\n").map(p=>"<p>"+esc(p).replace(TERM,m=>{if(used.has(m))return m;used.add(m);return'<button type="button" class="term" data-term="'+m+'">'+m+"</button>"})+"</p>").join("");
  $("after").innerHTML=NOTES[key(pos)]?'<button class="btn" id="explain" type="button">讀懂這一則</button>':"";
  $("save").setAttribute("aria-pressed",saved.includes(key(pos)));
  $("save").textContent=saved.includes(key(pos))?"已收藏":"收藏";
  $("count").textContent="卷"+CN[b]+"　"+n+" / "+total;
  const tk=$("ticks");tk.classList.toggle("solid",total>40);tk.style.setProperty("--n",total);tk.style.setProperty("--k",n);
  $("bar").style.width=(n/total*100)+"%";
  $("prev").disabled=b===1&&n===1;
  $("next").disabled=b===B.length&&n===total;
  seen[key(pos)]=1;store.set("seen",seen);store.set("pos",pos);
  $("v-read").scrollTop=0;
  if(dir){const p=$("page");p.classList.remove("in","back");void p.offsetWidth;p.classList.add("in");if(dir<0)p.classList.add("back")}
}
function go(b,n,dir){pos={b,n};render(dir||1)}
function step(d){
  let{b,n}=pos;n+=d;
  if(n<1){if(b===1)return;b--;n=B[b-1].length}
  else if(n>B[b-1].length){if(b===B.length)return;b++;n=1}
  go(b,n,d);
}

function renderToc(){
  $("books").innerHTML=B.map((s,i)=>{
    const b=i+1,done=s.filter((_,j)=>seen[b+"."+(j+1)]).length,open=openBook===b;
    return'<section class="book gut"><button type="button" data-book="'+b+'" aria-expanded="'+open+'"><span class="r">'+roman(b)+'</span><span class="n">卷'+CN[b]+'<small>'+esc(s[0].replace(/\n/g,"").slice(0,22))+'……</small></span><span class="c">'+(done?"讀過 "+done+" / ":"")+s.length+" 則</span></button>"+
    (open?'<div class="nums">'+s.map((_,j)=>'<button type="button" data-go="'+b+"."+(j+1)+'" class="'+(seen[b+"."+(j+1)]?"seen":"")+(pos.b===b&&pos.n===j+1?" here":"")+'" aria-label="第'+cn(j+1)+'則">'+(j+1)+"</button>").join("")+"</div>":"")+"</section>";
  }).join("");
}
function renderSaved(){
  $("saved-list").innerHTML=saved.length?'<div class="saved">'+saved.map(k=>{const[b,n]=k.split(".").map(Number);return'<button type="button" class="gut" data-go="'+k+'"><span class="r">'+roman(b)+" · "+roman(n)+'</span><span class="x">'+esc(B[b-1][n-1].slice(0,80))+"</span></button>"}).join("")+"</div>":'<p class="empty gut">還沒有收藏。讀到想留下來的一則時，按右上角的「收藏」，它就會出現在這裡。</p>';
}
function tab(name){
  for(const v of["cover","read","toc","saved"])$("v-"+v).hidden=v!==name;
  $("app").classList.toggle("on-cover",name==="cover");
  document.querySelectorAll(".tabs button").forEach(t=>t.dataset.tab===name?t.setAttribute("aria-current","page"):t.removeAttribute("aria-current"));
  $("step").hidden=name!=="read";
  if(name==="toc"){renderToc();const o=document.querySelector('[data-book="'+openBook+'"]');if(o)o.scrollIntoView({block:"start"})}
  if(name==="saved")renderSaved();
}

let lastFocus=null;
function sheet(title,html){
  lastFocus=document.activeElement;
  $("plate").textContent=title;$("sheet-body").innerHTML=html;
  $("veil").hidden=false;$("sheet").hidden=false;$("close").focus();
}
function closeSheet(){$("veil").hidden=true;$("sheet").hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.term)return sheet(t.dataset.term,"<p>"+esc(GLOSS[t.dataset.term])+"</p>");
  if(t.dataset.tab)return tab(t.dataset.tab);
  if(t.dataset.book){openBook=openBook===+t.dataset.book?0:+t.dataset.book;return renderToc()}
  if(t.dataset.go){const[b,n]=t.dataset.go.split(".").map(Number);go(b,n,1);return tab("read")}
  switch(t.id){
    case"prev":return step(-1);
    case"next":return step(1);
    case"close":return closeSheet();
    case"cite":openBook=pos.b;return tab("toc");
    case"go-today":case"c-today":go(T.b,T.n,1);return tab("read");
    case"c-start":go(1,1,1);return tab("read");
    case"c-toc":return tab("toc");
    case"go-cover":return tab("cover");
    case"size":size=(size+1)%3;store.set("size",size);return applySize();
    case"save":{const k=key(pos);saved=saved.includes(k)?saved.filter(x=>x!==k):[k,...saved];store.set("saved",saved);return render()}
    case"explain":{const n=NOTES[key(pos)];return sheet("讀懂這一則","<h3>他在說什麼</h3><p>"+esc(n[0])+"</p><h3>為什麼這樣說</h3><p>"+esc(n[1])+"</p><h3>問自己</h3><p>"+esc(n[2])+"</p>")}
  }
});
$("veil").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("sheet").hidden)return closeSheet();
  if(!$("sheet").hidden||$("v-read").hidden)return;
  if(e.key==="ArrowRight")step(1);
  if(e.key==="ArrowLeft")step(-1);
});
let sx=0,sy=0;
$("v-read").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("v-read").addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>64&&Math.abs(dy)<40&&!window.getSelection().toString())step(dx<0?1:-1);
},{passive:true});

applySize();render();if(first)tab("cover");
</script>

<script>
// Shown on the cover only while the page runs in a browser tab, not once it is on the home screen.
(function(){
  var standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
  if(!standalone){
    var ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
    var p=document.createElement("p");p.className="install";
    p.textContent=ios?"在 Safari 按下方的分享鈕，選「加入主畫面」，之後就能從桌面打開，沒有網路也能讀。":"從瀏覽器選單選「安裝」或「加到主畫面」，之後就能從桌面打開，沒有網路也能讀。";
    var c=document.querySelector(".colophon");if(c)c.appendChild(p);
  }
  if("serviceWorker" in navigator&&!/^(localhost|127\.|\[::1\])/.test(location.hostname)){
    window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
  }
})();
</script>
